<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRP SHOPPING | Home</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
--blue:#004aad;
--bg:#f2f4f8;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins';}

body{
background:var(--bg);
padding-top:90px;
}

/* HEADER */
.header{
position:fixed;
top:0;
width:100%;
background:white;
padding:15px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
z-index:1000;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-weight:800;
color:var(--blue);
}

.user{
font-size:13px;
color:#666;
}

.logout{
background:red;
color:white;
border:none;
padding:6px 10px;
border-radius:8px;
cursor:pointer;
}

/* SEARCH */
.search{
margin-top:10px;
}

.search input{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
}

/* BANNER */
.banner{
margin:15px;
background:linear-gradient(135deg,#004aad,#00d4ff);
padding:20px;
border-radius:15px;
color:white;
}

/* CATEGORIES */
.cats{
display:flex;
overflow-x:auto;
padding:10px;
gap:10px;
}

.cat{
background:white;
padding:10px;
border-radius:10px;
cursor:pointer;
white-space:nowrap;
}

.cat.active{
background:var(--blue);
color:white;
}

/* PRODUCTS */
.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
padding:10px;
}

.card{
background:white;
border-radius:12px;
padding:10px;
cursor:pointer;
transition:0.3s;
}

.card:hover{
transform:scale(1.03);
}

.card img{
width:100%;
height:120px;
object-fit:contain;
}

.price{
color:var(--blue);
font-weight:700;
}

/* OVERLAY */
#overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:white;
display:none;
z-index:2000;
padding:20px;
overflow:auto;
}

/* TOAST */
.toast{
position:fixed;
bottom:80px;
left:50%;
transform:translateX(-50%);
background:black;
color:white;
padding:10px 20px;
border-radius:20px;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<div class="top">
<div class="logo">SRP SHOPPING</div>
<div>
<span class="user" id="user-name"></span>
<button class="logout" onclick="logout()">Logout</button>
</div>
</div>

<div class="search">
<input type="text" id="search" placeholder="Search products...">
</div>
</div>

<!-- BANNER -->
<div class="banner">
<h2>🔥 Mega Sale</h2>
<p>Up to 70% OFF</p>
</div>

<!-- CATEGORIES -->
<div class="cats" id="cats"></div>

<!-- PRODUCTS -->
<div class="grid" id="grid"></div>

<!-- PRODUCT DETAIL -->
<div id="overlay"></div>

<script>

/* ======================
SUPABASE
====================== */
const supabase = window.supabase.createClient(
"https://cmxlfxqtrguuzpqdgcxv.supabase.co",
"YOUR_PUBLIC_ANON_KEY"
);

/* ======================
AUTH GUARD
====================== */
async function checkAuth(){
const {data} = await supabase.auth.getSession();

if(!data.session){
window.location.href="index.html";
}else{
document.getElementById('user-name').innerText =
data.session.user.user_metadata.full_name || data.session.user.email;
}
}

checkAuth();

/* ======================
LOGOUT
====================== */
async function logout(){
await supabase.auth.signOut();
window.location.href="index.html";
}

/* ======================
PRODUCT DATABASE
====================== */
const DB=[
{id:1,name:"Headphones",price:2499,mrp:4999,img:"https://m.media-amazon.com/images/I/61f496A7LcL._SL1500_.jpg",cat:"elec"},
{id:2,name:"Smart TV",price:22500,mrp:35000,img:"https://m.media-amazon.com/images/I/71fV9H2u8FL._SL1500_.jpg",cat:"elec"},
{id:3,name:"Keyboard",price:3800,mrp:7500,img:"https://m.media-amazon.com/images/I/71Miv62KdtL._SL1500_.jpg",cat:"gadg"},
{id:4,name:"Hoodie",price:1299,mrp:2999,img:"https://m.media-amazon.com/images/I/71YyP9fDqAL._UX679_.jpg",cat:"fash"},
{id:5,name:"Watch",price:2999,mrp:5999,img:"https://m.media-amazon.com/images/I/61ZjlBOp+rL._SL1500_.jpg",cat:"gadg"}
];

/* ======================
CATEGORIES
====================== */
const categories=[
{id:"all",name:"All"},
{id:"elec",name:"Electronics"},
{id:"gadg",name:"Gadgets"},
{id:"fash",name:"Fashion"}
];

function renderCats(){
const el=document.getElementById('cats');
el.innerHTML=categories.map(c=>
`<div class="cat" onclick="setCat('${c.id}',this)">${c.name}</div>`
).join('');
}

let currentCat="all";

/* ======================
RENDER PRODUCTS
====================== */
function render(){
const search=document.getElementById('search').value.toLowerCase();

const data=DB.filter(p=>{
return (currentCat==="all"||p.cat===currentCat)
&& p.name.toLowerCase().includes(search);
});

document.getElementById('grid').innerHTML=data.map(p=>
`<div class="card" onclick="openDetail(${p.id})">
<img src="${p.img}">
<div>${p.name}</div>
<div class="price">₹${p.price}</div>
</div>`
).join('');
}

/* ======================
CATEGORY CLICK
====================== */
function setCat(id,el){
currentCat=id;
document.querySelectorAll('.cat').forEach(c=>c.classList.remove('active'));
el.classList.add('active');
render();
}

/* ======================
SEARCH
====================== */
document.getElementById('search').addEventListener('input',render);

/* ======================
DETAIL VIEW
====================== */
function openDetail(id){
const p=DB.find(x=>x.id===id);

document.getElementById('overlay').style.display="block";
document.getElementById('overlay').innerHTML=`
<button onclick="closeDetail()">⬅ Back</button>
<h2>${p.name}</h2>
<img src="${p.img}" style="width:100%;height:200px;object-fit:contain;">
<p>₹${p.price}</p>
<button onclick="addCart(${p.id})">Add to Cart</button>
`;
}

function closeDetail(){
document.getElementById('overlay').style.display="none";
}

/* ======================
CART
====================== */
function addCart(id){
let cart=JSON.parse(localStorage.getItem("cart"))||[];

const item=cart.find(x=>x.id===id);

if(item){
item.qty++;
}else{
cart.push({id,qty:1});
}

localStorage.setItem("cart",JSON.stringify(cart));
toast("Added to cart");
}

/* ======================
TOAST
====================== */
function toast(msg){
const t=document.createElement("div");
t.className="toast";
t.innerText=msg;
document.body.appendChild(t);

setTimeout(()=>t.remove(),2000);
}

/* INIT */
renderCats();
render();

</script>

</body>
</html>
