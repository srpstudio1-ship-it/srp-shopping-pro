    <style>
        :root {
            --primary-gold: #D4AF37;
            --dark-gold: #AA7C11;
            --premium-black: #08080A;
            --surface-black: #0E0E12;
            --panel-black: #14141A;
            --glass-bg: rgba(14, 14, 18, 0.95);
            --glass-border: rgba(212, 175, 55, 0.18);
            --slate-blue: #1E293B;
            --emerald-accent: #10B981;
            --crimson-accent: #EF4444;
            --indigo-accent: #6366F1;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--premium-black);
            color: #E2E8F0;
            overflow-x: hidden;
        }

        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }

        /* High-Fidelity Glassmorphism Panel Suite */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px 0 rgba(0, 0, 0, 0.7);
        }

        .glass-card {
            background: rgba(20, 20, 26, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: var(--primary-gold);
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(212, 175, 55, 0.08);
        }

        .active-admin-tab {
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.12) 0%, transparent 100%);
            border-left: 4px solid var(--primary-gold);
            color: #FFF !important;
            font-weight: 600;
        }

        /* Custom Webkit Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--premium-black);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--dark-gold);
            border-radius: 3px;
        }

        .text-gold-gradient {
            background: linear-gradient(135deg, #FFFFFF 30%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bg-gold-gradient {
            background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%);
        }

        .premium-input {
            background: rgba(6, 6, 8, 0.98);
            border: 1px solid rgba(212, 175, 55, 0.15);
            color: #FFF;
            transition: all 0.2s ease;
        }
        .premium-input:focus {
            border-color: var(--primary-gold);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
            outline: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
    </style>
</head>

            /* =========================================================================
             * PREMIUM FLOATING VISUAL TOAST COMPONENT ENGINE
             * ========================================================================= */
            triggerToast(titleHeading, paragraphText, colorVariant = "info") {
                const containerElementNode = document.getElementById('admin-toast-container');
                if (!containerElementNode) return;

                const wrapperFrameElement = document.createElement('div');
                wrapperFrameElement.className = "w-full p-4 glass-panel rounded-lg border-l-4 pointer-events-auto flex gap-3 animate-fade-in shadow-2xl transition-all duration-300";
                
                let markupIconString = '<i class="fa-solid fa-circle-info text-indigo-400"></i>';
                if (colorVariant === "success") {
                    wrapperFrameElement.style.borderColor = "var(--emerald-accent)";
                    markupIconString = '<i class="fa-solid fa-circle-check text-emerald-400"></i>';
                } else if (colorVariant === "error") {
                    wrapperFrameElement.style.borderColor = "var(--crimson-accent)";
                    markupIconString = '<i class="fa-solid fa-triangle-exclamation text-red-400"></i>';
                } else {
                    wrapperFrameElement.style.borderColor = "var(--primary-gold)";
                    markupIconString = '<i class="fa-solid fa-circle-info text-yellow-500"></i>';
                }

                wrapperFrameElement.innerHTML = `
                    <div class="text-base mt-0.5">${markupIconString}</div>
                    <div class="flex-1">
                        <h4 class="font-bold text-xs text-white uppercase tracking-wider font-mono">${titleHeading}</h4>
                        <p class="text-[11px] text-zinc-400 mt-0.5 leading-normal font-sans">${paragraphText}</p>
                    </div>
                `;
                
                containerElementNode.appendChild(wrapperFrameElement);
                setTimeout(() => {
                    wrapperFrameElement.style.opacity = "0";
                    wrapperFrameElement.style.transform = "translateX(35px)";
                    setTimeout(() => wrapperFrameElement.remove(), 300);
                }, 4000);
            }
        }

        // Initialize and Mount standalone Single-Portal Runtime system console
        let AdminApp;
        document.addEventListener("DOMContentLoaded", () => {
            AdminApp = new SRPAdminTerminalApp();
            AdminApp.boot();
        });
    </script>
</body>
</html>
