<!DOCTYPE html>
<html>
<head>
<title>Checkout - SRP Shopping</title>

<style>
body{font-family:Arial;background:#f5faff}

.container{
padding:15px;
}

input{
width:100%;
padding:10px;
margin:10px 0;
}

button{
padding:12px;
background:#00aaff;
color:white;
border:none;
width:100%;
}
</style>

</head>

<body>

<div class="container">

<h2>Checkout</h2>

<h3>Delivery Address</h3>

<input type="text" id="address" placeholder="Enter address">

<button onclick="saveAddress()">Save Address</button>

<h3>Saved Addresses</h3>
<div id="saved"></div>

<h3>Payment</h3>
<button onclick="placeOrder()">Place Order</button>

</div>

<script>

function saveAddress(){

let address = document.getElementById("address").value;

let list = JSON.parse(localStorage.getItem("address")) || [];

list.push(address);

localStorage.setItem("address", JSON.stringify(list));

loadAddress();

}

function loadAddress(){

let list = JSON.parse(localStorage.getItem("address")) || [];
let div = document.getElementById("saved");

div.innerHTML = "";

list.forEach(a=>{
div.innerHTML += `<p>${a}</p>`;
});

}

function placeOrder(){

localStorage.removeItem("cart");

alert("Order placed successfully!");

window.location.href="index.html";

}

loadAddress();

</script>

</body>
</html>
