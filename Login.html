<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRP SHOPPING | Pro Marketplace v3.0</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --secondary: #f8fafc;
            --glass: rgba(255, 255, 255, 0.9);
        }

        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--secondary); overflow-x: hidden; }

        /* Unified Transitions */
        .page { display: none; min-height: 100vh; animation: pageFade 0.4s ease-out; }
        .page.active { display: block; }
        @keyframes pageFade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* UI Components */
        .blue-gradient { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); }
        .bottom-nav { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 600px; height: 75px; border-radius: 30px; z-index: 2000; display: flex; justify-content: space-around; align-items: center; background: var(--glass); backdrop-filter: blur(20px); box-shadow: 0 25px 50px -12px rgba(37, 99, 235, 0.25); border: 1px solid rgba(0,0,0,0.05); }
        .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: #94a3b8; transition: 0.3s; }
        .nav-btn.active { color: var(--primary); transform: translateY(-5px); }
        .product-card { background: white; border-radius: 28px; overflow: hidden; border: 1px solid #f1f5f9; transition: 0.3s; }
        .product-card:hover { transform: translateY(-10px); box-shadow: 0 30px 60px -12px rgba(0,0,0,0.1); }
        .skeleton { background: linear-gradient(90deg, #f0f4f8 25%, #e2e8f0 50%, #f0f4f8 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>

    <section id="page-auth" class="page active flex items-center justify-center p-6 bg-white">
        <div class="max-w-md w-full mx-auto">
            <div class="text-center mb-10">
                <div class="w-20 h-20 blue-gradient rounded-[28px] flex items-center justify-center mx-auto mb-6 shadow-xl shadow-blue-500/30 rotate-12">
                    <i class="fas fa-shopping-bag text-white text-3xl"></i>
                </div>
                <h1 class="text-3xl font-black text-slate-900 tracking-tighter">SRP SHOPPING</h1>
                <p class="text-slate-400 font-bold text-sm">Sign in to continue</p>
            </div>

            <div class="flex bg-slate-100 p-1.5 rounded-2xl mb-8">
                <button onclick="switchAuth('login')" id="tab-login" class="flex-1 py-3 rounded-xl text-xs font-black uppercase bg-white text-blue-600 shadow-sm transition-all">Login</button>
                <button onclick="switchAuth('signup')" id="tab-signup" class="flex-1 py-3 rounded-xl text-xs font-black uppercase text-slate-400 transition-all">Register</button>
            </div>

            <form id="auth-form" class="space-y-4">
                <input type="email" id="auth-email" placeholder="Email" required class="w-full px-6 py-4 rounded-2xl bg-slate-50 border border-slate-100 outline-none focus:border-blue-500 font-bold transition-all">
                <input type="password" id="auth-password" placeholder="Password" required class="w-full px-6 py-4 rounded-2xl bg-slate-50 border border-slate-100 outline-none focus:border-blue-500 font-bold transition-all">
                <button type="submit" id="auth-submit" class="w-full blue-gradient text-white py-5 rounded-2xl font-black uppercase tracking-widest text-xs shadow-lg shadow-blue-500/30">Enter Marketplace</button>
            </form>

            <button onclick="loginWithGoogle()" class="w-full mt-6 py-4 rounded-2xl border border-slate-200 flex items-center justify-center gap-3 font-bold text-slate-600">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5">
                Google Sync
            </button>
        </div>
    </section>

    <div id="main-app" class="hidden">
        <header class="sticky top-0 z-[1000] bg-white/80 backdrop-blur-xl border-b border-slate-100 px-6 py-4">
            <div class="max-w-7xl mx-auto flex items-center justify-between">
                <button onclick="location.reload()" class="text-xl font-black text-blue-600">SRP SHOPPING</button>
                <div id="admin-trigger" onclick="openAdmin()" class="hidden bg-red-500 text-white text-[10px] px-3 py-1 rounded-lg font-black cursor-pointer">ADMIN</div>
                <div class="flex items-center gap-4">
                    <div class="text-right">
                        <p class="text-[9px] font-black text-slate-400 uppercase">Balance</p>
                        <p class="text-sm font-black text-blue-600">₹<span id="top-wallet">0.00</span></p>
                    </div>
                </div>
            </div>
        </header>

        <main id="page-home" class="page active p-6 max-w-7xl mx-auto">
            <div class="h-48 blue-gradient rounded-[35px] p-8 mb-8 text-white relative overflow-hidden shadow-xl shadow-blue-500/20">
                <h2 class="text-3xl font-black">SRP MEGA SALE</h2>
                <p class="text-blue-100 mt-2 font-bold">Exclusive 80% Discounts</p>
                <i class="fas fa-bolt absolute right-[-20px] bottom-[-20px] text-9xl opacity-20"></i>
            </div>

            <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4">
                </div>
        </main>

        <main id="page-detail" class="page p-6 max-w-7xl mx-auto">
            <button onclick="showPage('home')" class="mb-6 font-bold text-slate-400"><i class="fas fa-arrow-left"></i> Back</button>
            <div class="bg-white rounded-[40px] p-6 shadow-sm border border-slate-100">
                <div id="detail-img-slider" class="w-full aspect-square bg-slate-50 rounded-3xl mb-6 overflow-hidden"></div>
                <h2 id="detail-name" class="text-2xl font-black mb-2"></h2>
                <div class="flex items-center gap-4 mb-6">
                    <span id="detail-price" class="text-3xl font-black text-blue-600"></span>
                    <span id="detail-mrp" class="text-lg line-through text-slate-300"></span>
                </div>
                <button onclick="triggerBuyNow()" class="w-full blue-gradient text-white py-5 rounded-2xl font-black uppercase mb-4">Buy Now</button>
                <p id="detail-desc" class="text-slate-500 leading-relaxed"></p>
            </div>
        </main>

        <nav class="bottom-nav">
            <div onclick="showPage('home')" id="btn-home" class="nav-btn active">
                <i class="fas fa-home text-lg"></i><span class="text-[8px] font-black uppercase">Home</span>
            </div>
            <div onclick="showPage('wallet')" id="btn-wallet" class="nav-btn">
                <i class="fas fa-wallet text-lg"></i><span class="text-[8px] font-black uppercase">Wallet</span>
            </div>
            <div onclick="signOut()" class="nav-btn">
                <i class="fas fa-sign-out-alt text-lg text-red-400"></i><span class="text-[8px] font-black uppercase">Exit</span>
            </div>
        </nav>
    </div>

    <script>
        // CONFIG - Replace with your key!
        const SUPABASE_URL = "https://cmxlfxqtrguuzpqdgcxv.supabase.co";
        const SUPABASE_KEY = "YOUR_ACTUAL_SUPABASE_ANON_KEY"; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let allProducts = [];
        let authMode = 'login';
        const adminEmails = ['Srpstudio1@gmail.com', 'subhashrajpurohit10@gmail.com'];

        // AUTH SYSTEM
        async function initAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) handleSession(session.user);

            supabase.auth.onAuthStateChange((_event, session) => {
                if (session) handleSession(session.user);
                else handleLogout();
            });
        }

        function handleSession(user) {
            document.getElementById('page-auth').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            if (adminEmails.includes(user.email)) {
                document.getElementById('admin-trigger').classList.remove('hidden');
            }
            loadProducts();
        }

        function handleLogout() {
            document.getElementById('main-app').classList.add('hidden');
            document.getElementById('page-auth').classList.remove('hidden');
        }

        function switchAuth(mode) {
            authMode = mode;
            document.getElementById('tab-login').className = mode === 'login' ? 'flex-1 py-3 rounded-xl text-xs font-black uppercase bg-white text-blue-600 shadow-sm' : 'flex-1 py-3 rounded-xl text-xs font-black uppercase text-slate-400';
            document.getElementById('tab-signup').className = mode === 'signup' ? 'flex-1 py-3 rounded-xl text-xs font-black uppercase bg-white text-blue-600 shadow-sm' : 'flex-1 py-3 rounded-xl text-xs font-black uppercase text-slate-400';
        }

        document.getElementById('auth-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            let res;
            if(authMode === 'login') res = await supabase.auth.signInWithPassword({ email, password });
            else res = await supabase.auth.signUp({ email, password });
            
            if(res.error) alert(res.error.message);
        };

        async function signOut() { await supabase.auth.signOut(); }

        // PRODUCT SYSTEM
        async function loadProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '<div class="skeleton h-40 rounded-3xl"></div>'.repeat(4);
            const { data } = await supabase.from('products').select('*');
            allProducts = data || [];
            renderProducts(allProducts);
        }

        function renderProducts(list) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = list.map(p => `
                <div class="product-card" onclick="openProduct('${p.id}')">
                    <img src="${p.image_url}" class="h-40 w-full object-cover">
                    <div class="p-4">
                        <h3 class="font-bold truncate text-sm">${p.name}</h3>
                        <p class="text-blue-600 font-black">₹${p.sale_price}</p>
                    </div>
                </div>
            `).join('');
        }

        function openProduct(id) {
            const p = allProducts.find(x => x.id === id);
            document.getElementById('detail-name').innerText = p.name;
            document.getElementById('detail-price').innerText = `₹${p.sale_price}`;
            document.getElementById('detail-mrp').innerText = `₹${p.mrp}`;
            document.getElementById('detail-desc').innerText = p.description;
            document.getElementById('detail-img-slider').innerHTML = `<img src="${p.image_url}" class="w-full h-full object-cover">`;
            showPage('detail');
        }

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + id).classList.add('active');
        }

        function triggerBuyNow() {
            confetti();
            alert("Order Placed (Simulated)");
        }

        window.onload = initAuth;
    </script>
</body>
</html>
