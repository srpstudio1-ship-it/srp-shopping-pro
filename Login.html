<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRP SHOPPING | Secure Access</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --srp-blue: #2563eb;
            --srp-white: #ffffff;
            --srp-glass: rgba(255, 255, 255, 0.85);
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: radial-gradient(circle at top left, #eff6ff, #ffffff);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .glass-card {
            background: var(--srp-glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 25px 50px -12px rgba(37, 99, 235, 0.15);
            border-radius: 40px;
        }

        .input-field {
            transition: all 0.3s ease;
            border: 1px solid #e2e8f0;
        }

        .input-field:focus {
            border-color: var(--srp-blue);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }

        .blue-btn {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .blue-btn:active { transform: scale(0.96); }

        /* Floating Animation for Brand Icon */
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(12deg); }
            50% { transform: translateY(-10px) rotate(15deg); }
        }
        .brand-icon { animation: float 4s ease-in-out infinite; }
    </style>
</head>
<body>

    <div class="w-full max-w-md px-6">
        <div class="glass-card p-10 relative overflow-hidden">
            
            <div class="text-center mb-10">
                <div class="brand-icon w-20 h-20 bg-blue-600 rounded-[28px] flex items-center justify-center mx-auto mb-6 shadow-xl shadow-blue-500/30">
                    <i class="fas fa-shopping-bag text-white text-3xl"></i>
                </div>
                <h1 class="text-3xl font-black text-slate-900 tracking-tighter">SRP SHOPPING</h1>
                <p class="text-slate-400 font-bold text-sm mt-1">Premium Global Marketplace</p>
            </div>

            <div class="flex bg-slate-100/50 p-1.5 rounded-2xl mb-8 border border-slate-100">
                <button id="loginTab" onclick="switchMode('login')" class="flex-1 py-3 rounded-xl text-xs font-black uppercase tracking-widest bg-white text-blue-600 shadow-sm transition-all">Login</button>
                <button id="signupTab" onclick="switchMode('signup')" class="flex-1 py-3 rounded-xl text-xs font-black uppercase tracking-widest text-slate-400 transition-all">Register</button>
            </div>

            <form id="authForm" class="space-y-5">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-2 block">Email Address</label>
                    <div class="relative">
                        <i class="fas fa-envelope absolute left-5 top-1/2 -translate-y-1/2 text-slate-300"></i>
                        <input type="email" id="email" required class="input-field w-full pl-12 pr-6 py-4 rounded-2xl bg-white outline-none font-bold text-slate-700" placeholder="name@company.com">
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest ml-1 mb-2 block">Security Password</label>
                    <div class="relative">
                        <i class="fas fa-lock absolute left-5 top-1/2 -translate-y-1/2 text-slate-300"></i>
                        <input type="password" id="password" required class="input-field w-full pl-12 pr-6 py-4 rounded-2xl bg-white outline-none font-bold text-slate-700" placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="blue-btn w-full py-5 rounded-2xl text-white font-black uppercase tracking-widest text-xs shadow-lg shadow-blue-500/30 mt-4">
                    Access Account
                </button>
            </form>

            <div class="relative my-8">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-100"></div></div>
                <div class="relative flex justify-center text-[10px] uppercase font-black text-slate-300"><span class="bg-white px-4">Social Connect</span></div>
            </div>

            <button onclick="loginGoogle()" class="w-full py-4 rounded-2xl border border-slate-200 bg-white flex items-center justify-center gap-3 font-bold text-slate-600 hover:bg-slate-50 transition-all">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" class="w-5">
                Continue with Google
            </button>
        </div>
        
        <p class="text-center mt-8 text-slate-400 text-xs font-medium">
            Protected by SRP Security Systems &copy; 2026
        </p>
    </div>

    <script>
        // REPLACE WITH YOUR ACTUAL SUPABASE CREDENTIALS
        const SUPABASE_URL = "https://cmxlfxqtrguuzpqdgcxv.supabase.co";
        const SUPABASE_KEY = "YOUR_SUPABASE_ANON_KEY"; 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentMode = 'login';
        const adminEmails = ['Srpstudio1@gmail.com', 'subhashrajpurohit10@gmail.com'];

        function switchMode(mode) {
            currentMode = mode;
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const submitBtn = document.getElementById('submitBtn');

            if (mode === 'login') {
                loginTab.className = "flex-1 py-3 rounded-xl text-xs font-black uppercase tracking-widest bg-white text-blue-600 shadow-sm transition-all";
                signupTab.className = "flex-1 py-3 rounded-xl text-xs font-black uppercase tracking-widest text-slate-400 transition-all";
                submitBtn.innerText = "Access Account";
            } else {
                signupTab.className = "flex-1 py-3 rounded-xl text-xs font-black uppercase tracking-widest bg-white text-blue-600 shadow-sm transition-all";
                loginTab.className = "flex-1 py-3 rounded-xl text-xs font-black uppercase tracking-widest text-slate-400 transition-all";
                submitBtn.innerText = "Create New Account";
            }
        }

        document.getElementById('authForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying...';

            let result;
            if (currentMode === 'login') {
                result = await supabase.auth.signInWithPassword({ email, password });
            } else {
                result = await supabase.auth.signUp({ email, password });
                if (!result.error) alert("Account created! Check your email for confirmation.");
            }

            if (result.error) {
                alert(result.error.message);
                btn.disabled = false;
                btn.innerText = currentMode === 'login' ? "Access Account" : "Create New Account";
            } else {
                // Successful Login! Check for admin
                if (adminEmails.includes(email)) {
                    localStorage.setItem('srp_role', 'admin');
                } else {
                    localStorage.setItem('srp_role', 'user');
                }
                window.location.href = 'index.html'; // Redirect to your main page
            }
        };

        async function loginGoogle() {
            const { error } = await supabase.auth.signInWithOAuth({
                provider: 'google',
                options: { redirectTo: window.location.origin + '/index.html' }
            });
            if (error) alert(error.message);
        }
    </script>
</body>
</html>
