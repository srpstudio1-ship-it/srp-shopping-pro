<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRP SHOPPING | Secure Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins';}

body{
height:100vh;
background:linear-gradient(135deg,#004aad,#00d4ff);
display:flex;
align-items:center;
justify-content:center;
color:white;
}

/* Glass Box */
.container{
width:90%;
max-width:420px;
background:rgba(255,255,255,0.1);
backdrop-filter:blur(15px);
border-radius:20px;
padding:30px;
text-align:center;
box-shadow:0 20px 40px rgba(0,0,0,0.2);
animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;}
}

/* Logo */
.logo{
font-size:2rem;
font-weight:800;
margin-bottom:10px;
}

.status{
margin-top:15px;
font-size:14px;
opacity:0.9;
}

/* Loader */
.loader{
width:50px;
height:50px;
border:5px solid rgba(255,255,255,0.3);
border-top:5px solid white;
border-radius:50%;
margin:20px auto;
animation:spin 1s linear infinite;
}

@keyframes spin{
to{transform:rotate(360deg);}
}

/* Button */
.btn{
margin-top:20px;
padding:12px 20px;
background:white;
color:#004aad;
border:none;
border-radius:10px;
font-weight:700;
cursor:pointer;
}

/* Hidden */
.hidden{display:none;}

</style>
</head>

<body>

<div class="container">

<div class="logo">SRP SHOPPING</div>
<p>Secure Access Gateway</p>

<div class="loader" id="loader"></div>

<div class="status" id="status">
Checking your session...
</div>

<button class="btn hidden" id="loginBtn" onclick="goLogin()">
Go to Login
</button>

</div>

<script>

/* ======================
SUPABASE CONFIG
====================== */
const supabase = window.supabase.createClient(
"https://cmxlfxqtrguuzpqdgcxv.supabase.co",
"YOUR_PUBLIC_ANON_KEY"
);

/* ======================
STATE
====================== */
let isProcessing = true;

/* ======================
CHECK SESSION
====================== */
async function checkSession(){

document.getElementById('status').innerText="Validating session...";

const { data, error } = await supabase.auth.getSession();

if(data.session){
document.getElementById('status').innerText="Welcome back!";
setTimeout(()=>{
window.location.href="home.html";
},1000);
}else{
document.getElementById('status').innerText="No active session found.";
showLogin();
}

}

/* ======================
SHOW LOGIN BUTTON
====================== */
function showLogin(){
document.getElementById('loader').classList.add('hidden');
document.getElementById('loginBtn').classList.remove('hidden');
}

/* ======================
GO TO LOGIN
====================== */
function goLogin(){
window.location.href="index.html";
}

/* ======================
LISTEN AUTH CHANGES
====================== */
supabase.auth.onAuthStateChange((event, session)=>{
if(session){
window.location.href="home.html";
}
});

/* ======================
INIT
====================== */
checkSession();

</script>

</body>
</html>
