        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : 'bg-blue-600';
            toast.className = `${bgColor} text-white px-5 py-3 rounded-lg shadow-xl flex items-center gap-3 transform translate-y-5 opacity-0 transition-all duration-300`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check' : 'fa-triangle-exclamation'} text-lg"></i><span class="font-medium">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-5', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-5', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

            db.currentView = view;

            renderApp();
        }

            db.currentUser.role = role;

            else db.currentView = 'home';
            renderApp();
            showToast(`Switched mode to ${role.toUpperCase()}`, 'info');
        }

        function filterByCategory(cat) {
            db.selectedCategory = cat;
            db.currentView = 'home';
            renderApp();

            if (e.key === 'Enter') executeSearch();

            else main.innerHTML = renderHomeView();

            const newOrder = {
                id: 'ORD-' + Math.floor(100000 + Math.random() * 900000),
                date: new Date().toISOString().replace('T', ' ').substring(0, 16),
                items: db.cart.map(i => {
                    const p = db.products.find(prod => prod.id === i.productId);
                    return { productId: i.productId, name: p ? p.name : 'Product', price: p ? p.price : 0, qty: i.quantity, image: p ? p.image : '' };
                }),
                total: db.cart.reduce((sum, i) => {
                    const p = db.products.find(prod => prod.id === i.productId);
                    return sum + (p ? p.price * i.quantity : 0);
                }, 0) - 299,
                status: 'Processing',
                courier: 'Shiprocket Express',
                trackingId: 'SRX-' + Math.floor(10000000 + Math.random() * 90000000),
                shippingSteps: [

                shippingAddress: `${db.currentUser.addresses[0].address}, ${db.currentUser.addresses[0].city} - ${db.currentUser.addresses[0].pin}`

                    <h3 class="text-xl font-bold">Add New Multi-Vendor Product</h3>
                    <div>
                        <label class="block text-xs font-semibold text-gray-700 mb-1">Product Title</label>
                        <input type="text" id="newProdName" placeholder="e.g. Ultra 5G Tablet" class="w-full border rounded-xl px-4 py-2.5 text-sm outline-none">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Price (₹)</label>
                            <input type="number" id="newProdPrice" value="14999" class="w-full border rounded-xl px-4 py-2.5 text-sm outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-gray-700 mb-1">Stock Qty</label>
                            <input type="number" id="newProdStock" value="50" class="w-full border rounded-xl px-4 py-2.5 text-sm outline-none">
                        </div>
                    </div>
                    <button onclick="saveNewVendorProduct()" class="w-full bg-flipkartBlue text-white font-bold py-3 rounded-xl shadow">Publish Product</button>
                </div>
            `);
        }

        function saveNewVendorProduct() {
            const name = document.getElementById('newProdName').value || 'New Vendor Item';
            const price = parseFloat(document.getElementById('newProdPrice').value) || 9999;
            const stock = parseInt(document.getElementById('newProdStock').value) || 50;

            db.sellerProducts.unshift({ id: 'SP-' + Math.floor(100 + Math.random() * 900), name, price, stock, status: 'Active', orders: 0 });
            db.products.unshift({
                id: 'P-' + Math.floor(100 + Math.random() * 900),
                name, category: 'Electronics', price, mrp: price * 1.5, discount: '33% off', rating: 4.5, reviewsCount: 1,
                image: 'https://placehold.co/400x400/2874f0/ffffff?text=' + encodeURIComponent(name),
                seller: 'ElectroWorld India', stock, featured: true, description: 'Newly listed multi-vendor product with verified warranty.', variants: ['Standard'], specs: {}
            });
            saveDB();
            closeModal();
            renderApp();
            showToast('New product published successfully!');
        }

        function renderAdminView() {
            const stats = db.adminStats;
            return `
                <div class="space-y-8">
                    <div class="bg-gradient-to-r from-blue-900 to-indigo-900 text-white p-8 rounded-2xl shadow-xl flex flex-col sm:flex-row items-center justify-between gap-6">
                        <div>
                            <span class="bg-yellow-400 text-gray-900 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider">Super Admin Master Panel</span>
                            <h1 class="text-3xl font-extrabold mt-2">SRP Marketplace Governance</h1>
                            <p class="text-sm text-blue-100 mt-1">Complete control over vendors, commission tiers, Razorpay settlement, and platform analytics.</p>
                        </div>
                        <button onclick="showToast('Platform settings saved successfully!')" class="bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-bold px-6 py-3 rounded-xl shadow transition">Save Global Config</button>
                    </div>

                    <!-- Stats Grid -->
                    <div class="grid grid-cols-1 sm:grid-cols-4 gap-6">
                        <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100">
                            <div class="text-xs uppercase text-gray-400 font-semibold mb-1">Total Gross Revenue</div>
                            <div class="text-2xl font-black text-gray-900">₹${(stats.totalRevenue).toLocaleString()}</div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100">
                            <div class="text-xs uppercase text-gray-400 font-semibold mb-1">Platform Commission</div>
                            <div class="text-2xl font-black text-emerald-600">₹${(stats.commissionEarned).toLocaleString()}</div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100">
                            <div class="text-xs uppercase text-gray-400 font-semibold mb-1">Registered Vendors</div>
                            <div class="text-2xl font-black text-flipkartBlue">${stats.totalVendors}</div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-100">
                            <div class="text-xs uppercase text-gray-400 font-semibold mb-1">Total Users</div>
                            <div class="text-2xl font-black text-orange-600">${stats.totalUsers.toLocaleString()}</div>
                        </div>
                    </div>

                    <!-- Vendor Management Table -->
                    <div class="bg-white rounded-2xl shadow-xl p-6 border border-gray-100">
                        <h3 class="font-bold text-lg mb-4">Multi-Vendor Approval & Commission Management</h3>
                        <div class="overflow-x-auto">
                            <table class="w-full text-left text-sm">
                                <thead class="bg-gray-50 text-gray-500 uppercase text-xs">
                                    <tr>
                                        <th class="p-3">Vendor Name</th>
                                        <th class="p-3">Owner</th>
                                        <th class="p-3">Email</th>
                                        <th class="p-3">Commission Rate</th>
                                        <th class="p-3">Status</th>
                                        <th class="p-3">Action</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y">
                                    ${db.adminVendors.map(v => `
                                        <tr>
                                            <td class="p-3 font-bold text-gray-800">${v.name}</td>
                                            <td class="p-3">${v.owner}</td>
                                            <td class="p-3 text-gray-500">${v.email}</td>
                                            <td class="p-3 font-bold text-flipkartBlue">${v.commission}</td>
                                            <td class="p-3"><span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-2.5 py-1 rounded">${v.status}</span></td>
                                            <td class="p-3"><button onclick="showToast('Vendor status updated!')" class="text-flipkartBlue font-bold hover:underline">Manage</button></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
        }

        function showInfoModal(title) {
            openModal(`
                <div class="space-y-4">
                    <h3 class="text-2xl font-bold">${title}</h3>
                    <p class="text-sm text-gray-600 leading-relaxed">SRP Shopping is the premier multi-vendor marketplace built with Flipkart and Amazon inspired architecture, integrated Razorpay production checkout (<a href="https://rzp.io/rzp/juTBnc4Q" target="_blank" class="text-blue-600 underline">rzp.io/rzp/juTBnc4Q</a>), UPI ID payments (<code class="bg-blue-50 text-flipkartBlue px-1 font-mono">8233615852@ptaxis</code>), and live Shiprocket shipping tracking.</p>
                    <button onclick="closeModal()" class="w-full bg-flipkartBlue text-white font-bold py-3 rounded-xl shadow">Got it</button>
                </div>
            `);
        }

        function resetFilters() {
            db.selectedCategory = 'All';
            db.searchQuery = '';
            renderApp();
        }

        function sortProducts(val) {
            if (val === 'lowHigh') db.products.sort((a,b) => a.price - b.price);
            else if (val === 'highLow') db.products.sort((a,b) => b.price - a.price);
            else db.products.sort((a,b) => b.rating - a.rating);
            renderApp();
        }

        // Initialize App on Window Load
        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
