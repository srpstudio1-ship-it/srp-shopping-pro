<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2874f0">
    <meta name="description" content="SRP Shopping original multi-vendor marketplace storefront">
    <title>SRP Shopping — Ultimate Marketplace</title><meta name="description" content="SRP Shopping professional multi-vendor marketplace">
<title>SRP Shopping — Ultimate Marketplace UI</title>
    <style>
:root {
    --blue: #2874f0;
    --blue-2: #1458c9;
    --yellow: #ffd814;
    --yellow-2: #f5bd00;
    --orange: #ff8f00;
    --green: #07895a;
    --red: #d92d20;
    --ink: #172033;
    --muted: #667085;
    --surface: #f5f7fb;
    --paper: #ffffff;
    --line: #e3e7ef;
    --soft-blue: #eef4ff;
    --soft-yellow: #fff8df;
    --soft-green: #eaf8f2;
    --soft-red: #feeceb;
    --shadow: 0 14px 36px rgba(15, 23, 42, .09);
    --radius: 14px;
    --container: 1440px;
    --header: 128px;
}
* {
    box-sizing: border-box;
}
html {
    scroll-behavior: smooth;
}
body {
    margin: 0;
    min-width: 320px;
    background: var(--surface);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.45;
}
body.dark {
    --ink: #edf2f7;
    --muted: #9da8ba;
    --surface: #0d1420;
    --paper: #182131;
    --line: #2c3546;
    --soft-blue: #1b2b46;
    --soft-yellow: #302915;
    --soft-green: #173329;
    --soft-red: #372321;
}
body.no-scroll {
    overflow: hidden;
}
a {
    color: inherit;
    text-decoration: none;
}
button,
input,
select,
textarea {
    font: inherit;
}
button {
    cursor: pointer;
}
img {
    max-width: 100%;
}
.hidden {
    display: none !important;
}
.container {
    width: min(var(--container), calc(100% - 40px));
    margin-inline: auto;
}
.topline {
    min-height: 33px;
    padding: 6px 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(90deg, #174ea6, #2874f0, #3c83f5);
    color: #fff;
    font-size: 11px;
    font-weight: 800;
}
.header {
    position: sticky;
    top: 0;
    z-index: 80;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 5px 22px rgba(15, 23, 42, .07);
}
.header-main {
    min-height: 74px;
    display: grid;
    grid-template-columns: auto minmax(300px, 1fr) auto;
    align-items: center;
    gap: 16px;
}
.brand {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    white-space: nowrap;
}
.brand-mark {
    color: var(--blue);
    font-size: 30px;
    line-height: 1;
    font-style: italic;
    font-weight: 950;
    letter-spacing: -2px;
}
.brand-sub {
    color: var(--muted);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 2px;
}
.search {
    position: relative;
    min-width: 0;
}
.search-box {
    width: 100%;
    height: 45px;
    padding: 0 48px 0 43px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
    outline: 0;
}
.search-box:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(40, 116, 240, .1);
}
.search-icon {
    position: absolute;
    left: 14px;
    top: 11px;
    color: var(--muted);
    font-size: 20px;
    pointer-events: none;
}
.search-button {
    position: absolute;
    right: 5px;
    top: 5px;
    width: 35px;
    height: 35px;
    border: 0;
    border-radius: 8px;
    background: var(--blue);
    color: #fff;
}
.suggestions {
    position: absolute;
    top: 51px;
    left: 0;
    right: 0;
    z-index: 120;
    overflow: hidden;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
}
.suggestion {
    width: 100%;
    display: grid;
    grid-template-columns: 32px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 11px 13px;
    border: 0;
    border-bottom: 1px solid #edf0f5;
    background: var(--paper);
    color: var(--ink);
    text-align: left;
}
.suggestion:hover {
    background: var(--soft-blue);
}
.suggestion-icon {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: var(--soft-blue);
}
.suggestion-name {
    font-size: 12px;
    font-weight: 850;
}
.suggestion-meta {
    color: var(--muted);
    font-size: 10px;
}
.header-actions {
    display: flex;
    align-items: center;
    gap: 5px;
}
.header-action {
    position: relative;
    min-width: 42px;
    height: 42px;
    padding: 0 9px;
    border: 1px solid transparent;
    border-radius: 9px;
    display: grid;
    place-items: center;
    background: transparent;
    color: var(--ink);
}
.header-action:hover {
    background: var(--surface);
    border-color: var(--line);
}
.badge {
    position: absolute;
    top: 0;
    right: 0;
    min-width: 18px;
    height: 18px;
    padding: 0 4px;
    display: grid;
    place-items: center;
    border-radius: 999px;
    background: var(--yellow);
    color: #111;
    font-size: 9px;
    font-weight: 950;
}
.account-button {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink);
    border-radius: 9px;
}
.account-button:hover {
    border-color: var(--line);
    background: var(--surface);
}
.account-title {
    display: block;
    max-width: 110px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
    font-weight: 900;
    text-align: left;
}
.account-subtitle {
    display: block;
    margin-top: 1px;
    color: var(--muted);
    font-size: 9px;
    text-align: left;
}
.category-strip {
    min-height: 48px;
    display: flex;
    align-items: center;
    gap: 5px;
    overflow-x: auto;
    border-top: 1px solid #f0f1f5;
}
.category-strip::-webkit-scrollbar {
    display: none;
}
.category-button {
    min-width: max-content;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 13px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--ink);
    font-size: 11px;
    font-weight: 850;
}
.category-button:hover,
.category-button.active {
    background: var(--soft-blue);
    color: var(--blue);
}
.page {
    min-height: 60vh;
}
.page-shell {
    padding-block: 20px 44px;
}
.hero {
    position: relative;
    min-height: 435px;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1.1fr .9fr;
    align-items: center;
    border-radius: 20px;
    background: linear-gradient(130deg, #eef5ff 0%, #fff 55%, #fff7d8 100%);
    border: 1px solid var(--line);
}
.hero::after {
    content: "";
    position: absolute;
    width: 450px;
    height: 450px;
    right: -170px;
    bottom: -180px;
    border-radius: 50%;
    background: rgba(40, 116, 240, .08);
}
.hero-copy {
    position: relative;
    z-index: 2;
    padding: 52px 54px;
}
.eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--blue);
    font-size: 10px;
    font-weight: 950;
    letter-spacing: 1.7px;
    text-transform: uppercase;
}
.hero h1 {
    margin: 12px 0 15px;
    max-width: 700px;
    font-size: clamp(40px, 5vw, 68px);
    line-height: 1.02;
    letter-spacing: -3px;
}
.hero h1 strong {
    color: var(--blue);
}
.hero p {
    max-width: 600px;
    margin: 0;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.7;
}
.hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 24px;
}
.hero-visual {
    position: relative;
    min-height: 435px;
    background:
        radial-gradient(circle at 35% 32%, #fff 0 11%, transparent 11.5%),
        radial-gradient(circle at 65% 66%, rgba(40,116,240,.22), transparent 30%),
        radial-gradient(circle at 75% 28%, rgba(255,216,20,.55), transparent 24%),
        linear-gradient(145deg, #dce9ff, #fff2b7);
}
.hero-card {
    position: absolute;
    width: 300px;
    min-height: 320px;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%) rotate(3deg);
    padding: 22px;
    border-radius: 23px;
    background: rgba(255,255,255,.93);
    box-shadow: 0 27px 60px rgba(15,23,42,.17);
    border: 1px solid rgba(255,255,255,.9);
}
.hero-card-product {
    height: 185px;
    display: grid;
    place-items: center;
    overflow: hidden;
    border-radius: 16px;
    background: #f2f5fa;
}
.hero-card-product img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
.hero-card-label {
    margin-top: 14px;
    color: var(--orange);
    font-size: 9px;
    font-weight: 950;
    letter-spacing: 1.2px;
}
.hero-card h3 {
    margin: 6px 0 4px;
    font-size: 19px;
}
.hero-card small {
    color: var(--muted);
    font-size: 10px;
}
.btn {
    min-height: 40px;
    padding: 0 15px;
    border: 0;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 900;
}
.btn-primary {
    background: var(--blue);
    color: #fff;
}
.btn-primary:hover {
    background: var(--blue-2);
}
.btn-accent {
    background: var(--yellow);
    color: #111;
}
.btn-accent:hover {
    background: #f5ca18;
}
.btn-outline {
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--line);
}
.btn-outline:hover {
    border-color: #bbcbe7;
    background: var(--soft-blue);
}
.btn-ghost {
    background: var(--soft-blue);
    color: var(--blue);
}
.btn-success {
    background: var(--soft-green);
    color: var(--green);
}
.btn-danger {
    background: var(--soft-red);
    color: var(--red);
}
.btn:disabled {
    cursor: not-allowed;
    opacity: .45;
}
.service-row {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    margin-top: 18px;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: var(--paper);
    box-shadow: var(--shadow);
}
.service {
    display: flex;
    gap: 10px;
    padding: 18px;
    border-right: 1px solid var(--line);
}
.service:last-child {
    border-right: 0;
}
.service-icon {
    width: 38px;
    height: 38px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: var(--soft-blue);
}
.service-title {
    font-size: 11px;
    font-weight: 950;
}
.service-copy {
    margin-top: 2px;
    color: var(--muted);
    font-size: 9px;
}
.section {
    margin-top: 34px;
}
.section-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 15px;
}
.section-title {
    margin: 3px 0 0;
    font-size: 26px;
    letter-spacing: -.7px;
}
.section-copy {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 11px;
}
.category-grid {
    display: grid;
    grid-template-columns: repeat(8,1fr);
    gap: 10px;
}
.category-card {
    min-height: 118px;
    display: grid;
    place-items: center;
    align-content: center;
    gap: 8px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
    color: var(--ink);
    transition: .18s ease;
}
.category-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
}
.category-icon {
    width: 50px;
    height: 50px;
    display: grid;
    place-items: center;
    border-radius: 14px;
    background: var(--soft-blue);
    font-size: 25px;
}
.category-name {
    font-size: 10px;
    font-weight: 900;
}
.deal-grid {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 12px;
}
.deal-card {
    position: relative;
    overflow: hidden;
    min-height: 170px;
    padding: 20px;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: var(--paper);
}
.deal-card::after {
    content: "";
    position: absolute;
    width: 100px;
    height: 100px;
    right: -35px;
    bottom: -35px;
    border-radius: 50%;
    background: var(--soft-blue);
}
.deal-label {
    color: var(--orange);
    font-size: 9px;
    font-weight: 950;
    letter-spacing: 1.2px;
}
.deal-card h3 {
    margin: 8px 0 5px;
    font-size: 18px;
}
.deal-card p {
    margin: 0;
    max-width: 250px;
    color: var(--muted);
    font-size: 10px;
    line-height: 1.6;
}
.deal-card .btn {
    margin-top: 15px;
    position: relative;
    z-index: 2;
}
.products-bar {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
}
.product-count {
    color: var(--muted);
    font-size: 11px;
}
.toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: flex-end;
}
.select {
    height: 39px;
    padding: 0 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    outline: 0;
    background: var(--paper);
    color: var(--ink);
    font-size: 11px;
}
.filters-layout {
    display: grid;
    grid-template-columns: 235px 1fr;
    gap: 15px;
}
.filter-panel {
    align-self: start;
    position: sticky;
    top: 143px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
}
.filter-block {
    padding: 13px 0;
    border-bottom: 1px solid var(--line);
}
.filter-block:last-child {
    border-bottom: 0;
}
.filter-label {
    font-size: 11px;
    font-weight: 950;
}
.filter-options {
    display: grid;
    gap: 8px;
    margin-top: 9px;
}
.filter-row {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    font-size: 10px;
}
.price-inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 9px;
}
.input {
    width: 100%;
    min-height: 40px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    outline: 0;
    background: var(--paper);
    color: var(--ink);
    font-size: 11px;
}
textarea.input {
    min-height: 100px;
    padding-block: 10px;
    resize: vertical;
}
.input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(40,116,240,.09);
}
.product-grid {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 13px;
}
.product-grid.list {
    grid-template-columns: 1fr;
}
.product-card {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
    transition: .18s ease;
}
.product-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
}
.product-grid.list .product-card {
    display: grid;
    grid-template-columns: 190px 1fr;
}
.product-media {
    position: relative;
    height: 230px;
    padding: 16px;
    display: grid;
    place-items: center;
    background: #f6f8fc;
}
.product-media img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
.product-wish,
.product-compare {
    position: absolute;
    top: 9px;
    z-index: 5;
    width: 33px;
    height: 33px;
    display: grid;
    place-items: center;
    border: 1px solid #e1e5ed;
    border-radius: 50%;
    background: #fff;
    color: #667085;
}
.product-wish {
    right: 9px;
}
.product-compare {
    left: 9px;
}
.product-wish.active {
    color: #e11d48;
}
.product-compare.active {
    color: var(--blue);
}
.product-body {
    padding: 13px;
}
.product-brand {
    color: var(--blue);
    font-size: 9px;
    font-weight: 950;
    letter-spacing: 1px;
    text-transform: uppercase;
}
.product-name {
    min-height: 43px;
    margin-top: 5px;
    font-size: 13px;
    font-weight: 850;
    line-height: 1.45;
}
.rating-pill {
    display: inline-flex;
    padding: 3px 6px;
    border-radius: 4px;
    background: var(--green);
    color: #fff;
    font-size: 9px;
    font-weight: 950;
}
.price {
    margin-top: 8px;
    font-size: 19px;
    font-weight: 950;
}
.mrp {
    margin-left: 5px;
    color: #939cad;
    font-size: 10px;
    text-decoration: line-through;
    font-weight: 500;
}
.discount {
    margin-left: 5px;
    color: var(--green);
    font-size: 10px;
    font-weight: 950;
}
.product-seller {
    min-height: 15px;
    margin-top: 5px;
    color: var(--muted);
    font-size: 9px;
}
.product-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 10px;
}
.product-buttons .btn {
    min-height: 36px;
    padding-inline: 8px;
    font-size: 10px;
}
.pagination {
    display: flex;
    justify-content: center;
    gap: 5px;
    margin-top: 18px;
}
.page-btn {
    width: 36px;
    height: 36px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
    font-size: 10px;
    font-weight: 900;
}
.page-btn.active {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
}
.seller-grid {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 12px;
}
.seller-card {
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: var(--paper);
}
.seller-avatar {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: var(--soft-blue);
    color: var(--blue);
    font-size: 18px;
    font-weight: 950;
}
.seller-name {
    margin-top: 11px;
    font-size: 13px;
    font-weight: 950;
}
.seller-meta {
    margin-top: 4px;
    color: var(--muted);
    font-size: 10px;
}
.seller-buttons {
    display: flex;
    gap: 6px;
    margin-top: 13px;
}
.seller-buttons .btn {
    flex: 1;
    padding-inline: 7px;
    font-size: 9px;
}
.recent-card {
    display: grid;
    grid-template-columns: repeat(6,1fr);
    gap: 10px;
}
.panel {
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
}
.empty {
    display: grid;
    place-items: center;
    min-height: 250px;
    text-align: center;
}
.empty-icon {
    width: 64px;
    height: 64px;
    display: grid;
    place-items: center;
    border-radius: 18px;
    background: var(--soft-blue);
    font-size: 28px;
}
.empty-title {
    margin-top: 13px;
    font-size: 16px;
    font-weight: 950;
}
.empty-copy {
    max-width: 500px;
    margin: 5px auto 0;
    color: var(--muted);
    font-size: 10px;
}
.footer {
    margin-top: 45px;
    background: #111827;
    color: #dbe4f1;
}
.footer-main {
    padding: 48px 0;
}
.footer-grid {
    display: grid;
    grid-template-columns: 1.7fr repeat(4,1fr);
    gap: 28px;
}
.footer-col {
    display: grid;
    gap: 9px;
    align-content: start;
}
.footer-col h3 {
    margin: 0 0 2px;
    color: #fff;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
}
.footer-col a {
    color: #aeb8c8;
    font-size: 10px;
}
.footer-col a:hover {
    color: #fff;
}
.footer-bottom {
    padding: 17px 0;
    border-top: 1px solid rgba(255,255,255,.1);
    color: #8f9caf;
    font-size: 9px;
}
.drawer-wrap,
.modal-wrap {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(2,6,23,.61);
    backdrop-filter: blur(5px);
}
.drawer {
    position: absolute;
    top: 0;
    right: 0;
    width: min(520px,100%);
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    background: var(--paper);
    box-shadow: -18px 0 45px rgba(0,0,0,.2);
}
.drawer-head,
.modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 17px 19px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
}
.drawer-title,
.modal-title {
    margin: 0;
    font-size: 17px;
}
.close {
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
}
.drawer-body {
    overflow: auto;
    padding: 17px 19px;
}
.drawer-foot {
    padding: 16px 19px;
    border-top: 1px solid var(--line);
    background: var(--paper);
}
.cart-line {
    display: grid;
    grid-template-columns: 68px 1fr auto;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
}
.cart-line img {
    width: 68px;
    height: 68px;
    padding: 5px;
    border-radius: 9px;
    object-fit: contain;
    background: #f4f6fa;
}
.cart-name {
    font-size: 11px;
    font-weight: 900;
}
.cart-meta {
    margin-top: 4px;
    color: var(--muted);
    font-size: 9px;
}
.qty {
    display: inline-flex;
    align-items: center;
    margin-top: 8px;
    border: 1px solid var(--line);
    border-radius: 7px;
    overflow: hidden;
}
.qty button {
    width: 27px;
    height: 27px;
    border: 0;
    background: var(--surface);
    color: var(--ink);
}
.qty span {
    min-width: 30px;
    text-align: center;
    font-size: 10px;
    font-weight: 900;
}
.cart-totals {
    display: grid;
    gap: 5px;
}
.total-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 11px;
}
.total-row.grand {
    margin-top: 5px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    font-size: 17px;
    font-weight: 950;
}
.modal-wrap {
    display: grid;
    place-items: center;
    padding: 18px;
}
.modal {
    width: min(780px,100%);
    max-height: 94vh;
    overflow: auto;
    border-radius: 15px;
    background: var(--paper);
    box-shadow: 0 30px 80px rgba(0,0,0,.3);
}
.modal.wide {
    width: min(1160px,100%);
}
.modal-body {
    padding: 20px;
}
.product-detail {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
}
.gallery {
    display: grid;
    grid-template-columns: 72px 1fr;
    gap: 10px;
}
.thumb-list {
    display: grid;
    align-content: start;
    gap: 7px;
}
.thumb {
    width: 72px;
    height: 72px;
    padding: 5px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #f7f9fc;
}
.thumb.active {
    border-color: var(--blue);
    box-shadow: 0 0 0 2px rgba(40,116,240,.1);
}
.thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
.main-image {
    min-height: 450px;
    padding: 22px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: #f6f8fc;
}
.main-image img {
    width: 100%;
    height: 100%;
    max-height: 420px;
    object-fit: contain;
}
.detail-brand {
    color: var(--blue);
    font-size: 9px;
    font-weight: 950;
    letter-spacing: 1.3px;
    text-transform: uppercase;
}
.detail-title {
    margin: 7px 0 9px;
    font-size: 29px;
    line-height: 1.1;
}
.detail-copy {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
}
.detail-price {
    margin-top: 17px;
    font-size: 30px;
    font-weight: 950;
}
.detail-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-top: 16px;
}
.source-box {
    margin-top: 16px;
    padding: 12px;
    border-radius: 9px;
    background: var(--soft-yellow);
    color: #6a591c;
    font-size: 9px;
}
body.dark .source-box {
    color: #eadb96;
}
.info-tabs {
    display: flex;
    gap: 4px;
    margin-top: 25px;
    border-bottom: 1px solid var(--line);
}
.tab {
    padding: 10px 12px;
    border: 0;
    border-bottom: 2px solid transparent;
    background: transparent;
    color: var(--muted);
    font-size: 10px;
    font-weight: 900;
}
.tab.active {
    border-color: var(--blue);
    color: var(--blue);
}
.info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 14px;
}
.info-box {
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 9px;
}
.info-box span {
    display: block;
    color: var(--muted);
    font-size: 9px;
}
.info-box strong {
    display: block;
    margin-top: 4px;
    font-size: 11px;
}
.review-list {
    margin-top: 13px;
}
.review {
    padding: 13px 0;
    border-bottom: 1px solid var(--line);
}
.review:last-child {
    border-bottom: 0;
}
.review-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 11px;
}
.review-stars {
    color: #f59e0b;
}
.review-title {
    margin-top: 4px;
    font-size: 11px;
    font-weight: 900;
}
.review-text {
    margin-top: 4px;
    color: var(--muted);
    font-size: 10px;
}
.checkout-grid {
    display: grid;
    grid-template-columns: 1.2fr .8fr;
    gap: 17px;
}
.checkout-summary {
    align-self: start;
    position: sticky;
    top: 88px;
    padding: 15px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--surface);
}
.address-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}
.form {
    display: grid;
    gap: 11px;
}
.form label {
    display: grid;
    gap: 5px;
    font-size: 10px;
    font-weight: 900;
}
.stepper {
    display: flex;
    gap: 5px;
    margin-bottom: 17px;
}
.step {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    color: #9ba4b4;
    font-size: 10px;
    font-weight: 900;
}
.step-dot {
    width: 27px;
    height: 27px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #eef1f5;
}
.step.active {
    color: var(--blue);
}
.step.active .step-dot {
    background: var(--blue);
    color: #fff;
}
.payment-card {
    display: grid;
    gap: 7px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
}
.payment-card label {
    display: grid;
    grid-template-columns: 20px 1fr;
    grid-template-areas: "radio title" "radio copy";
    column-gap: 8px;
    padding: 11px;
    border: 1px solid var(--line);
    border-radius: 9px;
}
.payment-card input {
    grid-area: radio;
    margin-top: 2px;
}
.payment-title {
    grid-area: title;
    font-size: 11px;
    font-weight: 950;
}
.payment-copy {
    grid-area: copy;
    color: var(--muted);
    font-size: 9px;
}
.account-layout {
    display: grid;
    grid-template-columns: 230px 1fr;
    gap: 15px;
}
.account-nav {
    align-self: start;
    position: sticky;
    top: 142px;
    padding: 10px;
    display: grid;
    gap: 3px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--paper);
}
.account-nav button {
    padding: 11px 12px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--ink);
    text-align: left;
    font-size: 10px;
    font-weight: 850;
}
.account-nav button:hover,
.account-nav button.active {
    background: var(--soft-blue);
    color: var(--blue);
}
.account-content {
    min-width: 0;
}
.account-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
}
.kpi-grid {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 10px;
}
.kpi {
    padding: 15px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--paper);
}
.kpi span {
    color: var(--muted);
    font-size: 9px;
}
.kpi strong {
    display: block;
    margin-top: 5px;
    font-size: 23px;
}
.table-wrap {
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 10px;
}
.table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}
.table th,
.table td {
    padding: 11px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
    font-size: 10px;
}
.table th {
    color: var(--muted);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: .6px;
}
.table tr:last-child td {
    border-bottom: 0;
}
.tag {
    display: inline-flex;
    align-items: center;
    padding: 4px 7px;
    border-radius: 999px;
    background: var(--soft-blue);
    color: var(--blue);
    font-size: 9px;
    font-weight: 950;
}
.tag.green {
    background: var(--soft-green);
    color: var(--green);
}
.tag.red {
    background: var(--soft-red);
    color: var(--red);
}
.tag.yellow {
    background: var(--soft-yellow);
    color: #785f00;
}
.data-list {
    display: grid;
    gap: 8px;
}
.data-item {
    padding: 11px;
    border: 1px solid var(--line);
    border-radius: 9px;
}
.data-item strong {
    display: block;
    font-size: 11px;
}
.data-item small {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-size: 9px;
}
.admin-shell {
    display: grid;
    grid-template-columns: 245px 1fr;
    min-height: 70vh;
}
.admin-side {
    position: sticky;
    top: var(--header);
    height: calc(100vh - var(--header));
    padding: 16px 12px;
    overflow: auto;
    background: #101827;
    color: #c7d2e1;
}
.admin-side-head {
    padding: 10px 10px 16px;
    color: #fff;
}
.admin-side-head b {
    font-size: 22px;
    font-style: italic;
}
.admin-side-head small {
    display: block;
    margin-top: 2px;
    color: #8492a8;
    font-size: 8px;
}
.admin-nav {
    display: grid;
    gap: 3px;
}
.admin-nav button {
    width: 100%;
    padding: 9px 10px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: #aebbd0;
    text-align: left;
    font-size: 9px;
    font-weight: 800;
}
.admin-nav button:hover,
.admin-nav button.active {
    background: #1d2b41;
    color: #fff;
}
.admin-main {
    min-width: 0;
    padding: 20px;
}
.admin-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
}
.admin-title {
    margin: 0;
    font-size: 26px;
}
.admin-copy {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 10px;
}
.chart {
    height: 220px;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 16px 8px 24px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
}
.chart-bar {
    flex: 1;
    min-width: 16px;
    border-radius: 5px 5px 0 0;
    background: var(--blue);
    position: relative;
}
.chart-bar span {
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--muted);
    font-size: 7px;
}
.editor-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 11px;
}
.editor-grid .full {
    grid-column: 1 / -1;
}
.feature-manifest {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 7px;
}
.feature-item {
    display: flex;
    gap: 7px;
    align-items: flex-start;
    padding: 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
}
.feature-number {
    width: 21px;
    height: 21px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 6px;
    background: var(--soft-blue);
    color: var(--blue);
    font-size: 8px;
    font-weight: 950;
}
.feature-text {
    color: var(--ink);
    font-size: 8px;
    font-weight: 750;
}
.notification {
    padding: 12px;
    margin-bottom: 8px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--paper);
}
.notification.unread {
    border-left: 3px solid var(--blue);
}
.notification strong {
    font-size: 11px;
}
.notification p {
    margin: 4px 0;
    color: var(--muted);
    font-size: 9px;
}
.notification small {
    color: var(--muted);
    font-size: 8px;
}
.toasts {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 500;
    display: grid;
    gap: 8px;
}
.toast {
    min-width: 240px;
    max-width: 360px;
    padding: 11px 13px;
    border-radius: 8px;
    background: #172033;
    color: #fff;
    box-shadow: var(--shadow);
    font-size: 10px;
}
.toast.success {
    background: #087f5b;
}
.toast.error {
    background: #c72c20;
}
.toast.warning {
    background: #7b6205;
}
.mobile-bottom {
    display: none;
}
.mobile-only {
    display: none;
}
@media (max-width: 1180px) {
    .product-grid {
        grid-template-columns: repeat(3,1fr);
    }
    .category-grid {
        grid-template-columns: repeat(4,1fr);
    }
    .seller-grid {
        grid-template-columns: repeat(2,1fr);
    }
    .deal-grid {
        grid-template-columns: repeat(2,1fr);
    }
    .footer-grid {
        grid-template-columns: 1.4fr repeat(2,1fr);
    }
}
@media (max-width: 920px) {
    .header-main {
        grid-template-columns: auto 1fr auto;
    }
    .account-subtitle {
        display: none;
    }
    .hero {
        grid-template-columns: 1fr;
    }
    .hero-visual {
        min-height: 260px;
    }
    .filters-layout {
        grid-template-columns: 1fr;
    }
    .filter-panel {
        display: none;
    }
    .mobile-only {
        display: inline-flex;
    }
    .checkout-grid {
        grid-template-columns: 1fr;
    }
    .checkout-summary {
        position: static;
    }
    .account-layout {
        grid-template-columns: 1fr;
    }
    .account-nav {
        position: static;
        display: flex;
        overflow: auto;
    }
    .account-nav button {
        min-width: max-content;
    }
    .admin-shell {
        grid-template-columns: 1fr;
    }
    .admin-side {
        position: static;
        height: auto;
    }
    .admin-nav {
        display: flex;
        overflow: auto;
    }
    .admin-nav button {
        min-width: max-content;
    }
}
@media (max-width: 680px) {
    .container {
        width: min(var(--container), calc(100% - 24px));
    }
    .header-main {
        grid-template-columns: auto 1fr auto;
        gap: 5px;
        padding-block: 8px;
    }
    .brand-sub {
        display: none;
    }
    .header-main .search {
        grid-column: 1 / -1;
        grid-row: 2;
    }
    .header-actions {
        justify-content: flex-end;
    }
    .header-action {
        min-width: 36px;
        padding-inline: 5px;
    }
    .account-button {
        padding-inline: 3px;
    }
    .account-title {
        display: none;
    }
    .hero-copy {
        padding: 34px 22px;
    }
    .hero h1 {
        letter-spacing: -2px;
    }
    .hero-visual {
        min-height: 235px;
    }
    .hero-card {
        width: 250px;
        min-height: 250px;
    }
    .hero-card-product {
        height: 130px;
    }
    .service-row {
        grid-template-columns: 1fr 1fr;
    }
    .service {
        border-bottom: 1px solid var(--line);
    }
    .service:nth-child(2) {
        border-right: 0;
    }
    .service:nth-child(3) {
        border-bottom: 0;
    }
    .service:nth-child(4) {
        border-right: 0;
        border-bottom: 0;
    }
    .category-grid {
        grid-template-columns: repeat(4,1fr);
    }
    .category-card {
        min-height: 100px;
    }
    .products-bar {
        grid-template-columns: 1fr auto;
    }
    .toolbar {
        grid-column: 1 / -1;
        justify-content: stretch;
    }
    .toolbar .select {
        flex: 1;
    }
    .product-grid {
        grid-template-columns: repeat(2,1fr);
        gap: 9px;
    }
    .product-grid.list .product-card {
        grid-template-columns: 112px 1fr;
    }
    .product-media {
        height: 165px;
    }
    .product-grid.list .product-media {
        height: 180px;
    }
    .product-buttons {
        grid-template-columns: 1fr;
    }
    .seller-grid {
        grid-template-columns: 1fr;
    }
    .deal-grid {
        grid-template-columns: 1fr 1fr;
    }
    .product-detail {
        grid-template-columns: 1fr;
    }
    .main-image {
        min-height: 310px;
    }
    .gallery {
        grid-template-columns: 1fr;
    }
    .thumb-list {
        grid-template-columns: repeat(5,72px);
        overflow: auto;
    }
    .detail-title {
        font-size: 24px;
    }
    .address-grid,
    .editor-grid,
    .info-grid {
        grid-template-columns: 1fr;
    }
    .editor-grid .full {
        grid-column: auto;
    }
    .kpi-grid {
        grid-template-columns: 1fr 1fr;
    }
    .feature-manifest {
        grid-template-columns: 1fr 1fr;
    }
    .footer-grid {
        grid-template-columns: 1fr 1fr;
    }
    .mobile-bottom {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 90;
        min-height: 59px;
        display: grid;
        grid-template-columns: repeat(5,1fr);
        background: var(--paper);
        border-top: 1px solid var(--line);
        box-shadow: 0 -6px 18px rgba(15,23,42,.08);
    }
    .mobile-bottom button {
        border: 0;
        background: var(--paper);
        color: var(--muted);
        font-size: 9px;
        font-weight: 900;
    }
    .mobile-bottom button:hover,
    .mobile-bottom button.active {
        color: var(--blue);
    }
    body {
        padding-bottom: 59px;
    }
}
@media (max-width: 430px) {
    .category-grid {
        grid-template-columns: 1fr 1fr;
    }
    .deal-grid {
        grid-template-columns: 1fr;
    }
    .service-row {
        grid-template-columns: 1fr;
    }
    .service {
        border-right: 0 !important;
        border-bottom: 1px solid var(--line) !important;
    }
    .service:last-child {
        border-bottom: 0 !important;
    }
    .product-grid {
        grid-template-columns: repeat(2,1fr);
    }
    .product-media {
        height: 145px;
    }
    .feature-manifest {
        grid-template-columns: 1fr;
    }
}

.seller-dashboard {
    display: grid;
    grid-template-columns: 230px 1fr;
    min-height: 70vh;
}
.seller-side {
    position: sticky;
    top: var(--header);
    height: calc(100vh - var(--header));
    padding: 15px 12px;
    overflow: auto;
    background: #15223a;
    color: #d5e1f2;
}
.seller-side-head {
    padding: 10px 10px 16px;
    color: #fff;
}
.seller-side-head b {
    font-size: 21px;
}
.seller-side-head small {
    display: block;
    color: #90a1bb;
    font-size: 8px;
    margin-top: 2px;
}
.seller-nav {
    display: grid;
    gap: 3px;
}
.seller-nav button {
    padding: 9px 10px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: #aebbd0;
    text-align: left;
    font-size: 9px;
    font-weight: 800;
}
.seller-nav button:hover,
.seller-nav button.active {
    background: #243754;
    color: #fff;
}
.seller-main {
    min-width: 0;
    padding: 20px;
}
.seller-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
}
.seller-page-title {
    margin: 0;
    font-size: 25px;
}
.seller-status {
    color: var(--muted);
    font-size: 9px;
}
.store-preview {
    display: grid;
    grid-template-columns: 90px 1fr;

            const categoryOk = !state.category || product.category === state.category || product.category.toLowerCase() === state.category.toLowerCase();

        const compact = [];
        buttons.forEach((page,index) => {

        });
        host.innerHTML = compact.map((page) => page === "…"
            ? `<span class="page-btn" style="display:grid;place-items:center">…</span>`
            : `<button class="page-btn ${page === state.page ? "active" : ""}" onclick="store.page(${page})">${page}</button>`

    if (!user) return [];
    return state.db.carts[user.id] || (state.db.carts[user.id] = []);

    if (!user) return;

function cartTotalData(items = getCart(), couponCode = "") {
    const lines = items.map((item) => {
        const p = productById(item.productId);
        if (!p) return null;
        return {product:p,quantity:item.quantity,lineTotal:Number(p.price)*Number(item.quantity)};
    }).filter(Boolean);
    const subtotal = lines.reduce((sum,line) => sum + line.lineTotal, 0);
    let discount = 0;
    let coupon = null;
    if (couponCode) {
        coupon = state.db.coupons.find((entry) => entry.code.toUpperCase() === couponCode.toUpperCase() && entry.active);
        if (coupon && subtotal >= Number(coupon.minimum)) {
            discount = coupon.type === "percent" ? Math.min(subtotal * Number(coupon.value) / 100, Number(coupon.maximum || Infinity)) : Math.min(Number(coupon.value),subtotal);
        }
    }
    const taxable = Math.max(0, subtotal - discount);
    const shipping = taxable >= Number(state.db.settings.freeShippingThreshold) ? 0 : Number(state.db.settings.flatShipping);
    const tax = taxable * Number(state.db.settings.taxRate) / 100;
    const total = taxable + shipping + tax;
    return {lines,subtotal,discount,shipping,tax,total,coupon};
}

    updateQty(id,quantity) {
        const items = getCart();
        const item = items.find((entry) => entry.productId === id);
        const product = productById(id);
        if (!item || !product) return;
        if (Number(quantity) <= 0) {
            cart.remove(id);
            return;
        }
        if (Number(quantity) > Number(product.stock)) {
            toast(`Only ${product.stock} units are available.`, "error");
            return;
        }
        item.quantity = Number(quantity);
        setCart(items);
        updateHeader();
        cart.renderPage();
    },
    remove(id) {
        setCart(getCart().filter((item) => item.productId !== id));
        updateHeader();
        cart.renderPage();
        toast("Item removed.", "success");
    },
    saveLater(id) {
        if (!user) return;
        const item = getCart().find((entry) => entry.productId === id);
        const saved = state.db.savedForLater[user.id] || (state.db.savedForLater[user.id] = []);
        if (item && !saved.includes(id)) saved.push(id);
        setCart(getCart().filter((entry) => entry.productId !== id));
        persist();
        cart.renderPage();
        updateHeader();
        toast("Moved to saved-for-later.", "success");
    },
    toWishlist(id) {
        if (!user) return account.login();
        const list = state.db.wishlists[user.id] || (state.db.wishlists[user.id] = []);
        if (!list.includes(id)) list.push(id);
        state.db.carts[user.id] = getCart().filter((entry) => entry.productId !== id);
        persist();
        cart.renderPage();
        updateHeader();
        toast("Moved to wishlist.", "success");
    },
    clear() {
        if (!user) return;
        state.db.carts[user.id] = [];
        persist();
        updateHeader();
        cart.renderPage();
    }
};

        state.checkoutAddress = address;
        const addresses = state.db.addresses[user.id] || (state.db.addresses[user.id] = []);
        if (address.default) addresses.forEach((item) => item.default = false);
        const existing = addresses.findIndex((item) => item.id === address.id);
        if (existing >= 0) addresses[existing] = address;
        else addresses.push(address);
        localStorage.setItem(PIN_KEY,address.pincode);
        persist();
        state.checkoutStep = 2;
        checkout.render();

    paymentStep() {
        const cod = Boolean(state.db.settings.codEnabled);
        return `

                    <label><input type="radio" name="pay" value="Card" ${state.checkoutPayment === "Card" ? "checked" : ""}><span class="payment-title">Card</span><span class="payment-copy">Use a configured card gateway in production.</span></label>
                    <label><input type="radio" name="pay" value="Net Banking" ${state.checkoutPayment === "Net Banking" ? "checked" : ""}><span class="payment-title">Net Banking</span><span class="payment-copy">Bank redirect integration is provider-dependent.</span></label>
                    <label><input type="radio" name="pay" value="Wallet" ${state.checkoutPayment === "Wallet" ? "checked" : ""}><span class="payment-title">Wallet</span><span class="payment-copy">Wallet support depends on the payment provider.</span></label>
                    ${cod ? `<label><input type="radio" name="pay" value="COD" ${state.checkoutPayment === "COD" ? "checked" : ""}><span class="payment-title">Cash on Delivery</span><span class="payment-copy">COD is enabled by admin settings.</span></label>` : ""}

                <div style="display:flex;gap:8px"><button class="btn btn-outline" onclick="state.checkoutStep=1;checkout.render()">Back</button><button class="btn btn-primary" onclick="checkout.nextPayment()">Review order</button></div>

    applyCoupon() {
        const code = el("couponInput").value.trim();
        const quote = cartTotalData(getCart(),code);
        if (!quote.coupon) {
            toast("Coupon is invalid or its minimum order is not met.", "error");
            return;
        }
        state.checkoutCoupon = code.toUpperCase();
        toast(`Coupon ${state.checkoutCoupon} applied.`, "success");
        checkout.render();
    },
    nextPayment() {
        const selected = document.querySelector('input[name="pay"]:checked');
        state.checkoutPayment = selected?.value || "UPI";
        state.checkoutStep = 3;
        checkout.render();
    },
    reviewStep() {
        const a = state.checkoutAddress;
        return `
            <div class="form">
                <div><span class="eyebrow">FINAL REVIEW</span><h2 style="margin:3px 0 0;font-size:18px">Confirm your order</h2></div>
                <div class="notice-box">Payment processing note: this standalone index records a pending provider transaction; it does not fake a successful bank/card charge. Connect a server-side gateway to actually capture funds.</div>
                <div class="data-item"><strong>Delivery</strong><small>${escapeHtml(a.name)} · ${escapeHtml(a.phone)}<br>${escapeHtml(a.line1)}${a.line2 ? `<br>${escapeHtml(a.line2)}` : ""}<br>${escapeHtml(a.city)}, ${escapeHtml(a.state)} — ${escapeHtml(a.pincode)}</small></div>
                <div class="data-item"><strong>Payment</strong><small>${escapeHtml(state.checkoutPayment)}</small></div>
                <div class="data-item"><strong>Coupon</strong><small>${escapeHtml(state.checkoutCoupon || "None")}</small></div>
                <div style="display:flex;gap:8px"><button class="btn btn-outline" onclick="state.checkoutStep=2;checkout.render()">Back</button><button class="btn btn-accent" onclick="checkout.placeOrder()">Place order</button></div>
            </div>
        `;
    },
    placeOrder() {
        const items = getCart();
        if (!items.length) {
            toast("Your cart is empty.", "error");
            return;
        }
        for (const item of items) {
            const product = productById(item.productId);
            if (!product || product.stock < item.quantity || product.status !== "active") {
                toast(`Stock changed for ${product?.name || "a product"}.`, "error");
                return;
            }
        }
        const t = checkout.totals();
        const order = {
            id:uid("order"),
            orderNumber:"SRP" + Date.now().toString().slice(-9),
            userId:user.id,
            items:t.lines.map((line) => ({
                productId:line.product.id,
                sellerId:line.product.sellerId,
                name:line.product.name,
                image:line.product.images[0],
                quantity:line.quantity,
                price:line.product.price
            })),
            address:clone(state.checkoutAddress),
            paymentMethod:state.checkoutPayment,
            paymentStatus:"pending-provider",
            paymentReference:uid("pay"),
            shippingStatus:"confirmed",
            status:"confirmed",
            totals:{subtotal:t.subtotal,discount:t.discount,shipping:t.shipping,tax:t.tax,total:t.total,coupon:t.coupon?.code || null},
            createdAt:now(),
            updatedAt:now(),
            trackingNumber:""
        };
        t.lines.forEach((line) => {
            line.product.stock -= line.quantity;
        });
        state.db.orders.unshift(order);
        state.db.payments.unshift({id:order.paymentReference,orderId:order.id,userId:user.id,method:order.paymentMethod,status:order.paymentStatus,amount:order.totals.total,createdAt:now()});
        state.db.carts[user.id] = [];
        state.db.notifications.unshift({id:uid("note"),userId:user.id,title:"Order placed",message:`${order.orderNumber} was created and is pending payment-provider confirmation.`,read:false,createdAt:now()});
        audit("order.created",{orderId:order.id,orderNumber:order.orderNumber,total:order.totals.total});
        persist();
        updateHeader();
        openOrderSuccess(order);
    }
};

    submitLogin() {

        if (!found || simpleHash(password) !== found.passwordHash) {

    },
    register() {
        openModal(`

            <div class="modal-body">
                <div class="form">

        const name = el("registerName").value.trim();

            preferences:{theme:"light"}

        state.db.wishlists[newUser.id] = [];
        state.db.savedForLater[newUser.id] = [];

    showOrder(id) {

        openModal(`
            <div class="modal-head"><h2 class="modal-title">Track ${escapeHtml(order.orderNumber)}</h2><button class="close" onclick="closeModal()">×</button></div>
            <div class="modal-body">

function downloadFile(name, content, mime) {
    const blob = new Blob([content],{type:mime});
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = name;
    anchor.click();
    URL.revokeObjectURL(url);
}

            return;
        }
        const categoryOptions = state.db.categories.map((category) => `<option value="${escapeHtml(category.id)}" ${(product?.category || "") === category.id ? "selected" : ""}>${escapeHtml(category.name)}</option>`).join("");
        const imageValue = product?.images?.join("\n") || "";
        const highlightValue = product?.highlights?.join("\n") || "";
        const specValue = product ? Object.entries(product.specs || {}).map(([key,value]) => `${key}: ${value}`).join("\n") : "";
        openModal(`
            <div class="modal-head"><h2 class="modal-title">${product ? "Edit product" : "Create product"}</h2><button class="close" onclick="closeModal()">×</button></div>
            <div class="modal-body">
                <div class="editor-grid">
                    <label>Name<input id="sellerProductName" class="input" value="${escapeHtml(product?.name || "")}"></label>
                    <label>Brand<input id="sellerProductBrand" class="input" value="${escapeHtml(product?.brand || record.store)}"></label>
                    <label>Category<select id="sellerProductCategory" class="select"><option value="">Choose category</option>${categoryOptions}</select></label>
                    <label>SKU<input id="sellerProductSku" class="input" value="${escapeHtml(product?.sku || "")}"></label>
                    <label>Price<input id="sellerProductPrice" class="input" type="number" value="${escapeHtml(product?.price || "")}"></label>
                    <label>MRP<input id="sellerProductMrp" class="input" type="number" value="${escapeHtml(product?.mrp || "")}"></label>
                    <label>Stock<input id="sellerProductStock" class="input" type="number" value="${escapeHtml(product?.stock ?? "")}"></label>
                    <label>Status<select id="sellerProductStatus" class="select"><option value="active" ${product?.status === "active" ? "selected" : ""}>Active</option><option value="inactive" ${product?.status === "inactive" ? "selected" : ""}>Inactive</option></select></label>
                    <label class="full">Image URLs — one URL per line<input id="sellerProductImages" class="input" value="${escapeHtml(imageValue)}"></label>
                    <label class="full">Description<textarea id="sellerProductDescription" class="input">${escapeHtml(product?.description || "")}</textarea></label>
                    <label class="full">Highlights — one per line<textarea id="sellerProductHighlights" class="input">${escapeHtml(highlightValue)}</textarea></label>
                    <label class="full">Specifications — one key: value per line<textarea id="sellerProductSpecs" class="input">${escapeHtml(specValue)}</textarea></label>
                    <div class="full"><button class="btn btn-primary" onclick="seller.saveProduct('${escapeHtml(id)}')">Save product</button></div>
                </div>
            </div>
        `,true);
    },
    saveProduct(id) {
        const record = seller.requireApproved();
        if (!record) return;
        const name = el("sellerProductName").value.trim();
        const brand = el("sellerProductBrand").value.trim();
        const categoryId = el("sellerProductCategory").value;
        const sku = el("sellerProductSku").value.trim();
        const price = Number(el("sellerProductPrice").value);
        const mrp = Number(el("sellerProductMrp").value);
        const stock = Number(el("sellerProductStock").value);
        const status = el("sellerProductStatus").value;
        const images = el("sellerProductImages").value.split(/\n+/).map((value) => value.trim()).filter(Boolean);
        const description = el("sellerProductDescription").value.trim();
        const highlights = el("sellerProductHighlights").value.split(/\n+/).map((value) => value.trim()).filter(Boolean);
        const specs = {};
        el("sellerProductSpecs").value.split(/\n+/).map((value) => value.trim()).filter(Boolean).forEach((line) => {
            const separator = line.indexOf(":");
            if (separator > 0) specs[line.slice(0,separator).trim()] = line.slice(separator + 1).trim();
        });
        if (!name || !categoryId || !sku || !price || !mrp || price > mrp || stock < 0 || images.length === 0) {
            toast("Name, category, SKU, price, MRP, stock and at least one image URL are required.","error");
            return;
        }
        if (id) {
            const product = productById(id);
            if (!product || product.sellerId !== record.id) return;
            Object.assign(product,{name,brand,category:state.db.categories.find((category) => category.id === categoryId)?.name || categoryId,categoryId,sku,price,mrp,stock,status,images,description,highlights,specs,updatedAt:now()});
            audit("seller.product.updated",{productId:id});
        } else {
            const product = {id:uid("product"),sellerId:record.id,brand,name,category:state.db.categories.find((category) => category.id === categoryId)?.name || categoryId,categoryId,sku,price,mrp,stock,status,images,description,highlights,specs,rating:0,reviews:[],createdAt:now()};
            state.db.products.push(product);
            audit("seller.product.created",{productId:product.id,sellerId:record.id});
        }
        persist();
        closeModal();
        router.renderSellerPage();
        toast("Product saved.","success");
    },
    toggleProduct(id) {
        const record = seller.requireApproved();
        if (!record) return;
        const product = productById(id);
        if (!product || product.sellerId !== record.id) return;
        product.status = product.status === "active" ? "inactive" : "active";
        audit("seller.product.status",{productId:id,status:product.status});
        persist();
        router.renderSellerPage();
    },
    inventory(record) {
        const products = state.db.products.filter((product) => product.sellerId === record.id);
        return `<div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>SKU</th><th>Stock</th><th>Low stock</th><th>Adjust</th></tr></thead><tbody>${products.map((product) => `<tr><td>${escapeHtml(product.name)}</td><td>${escapeHtml(product.sku)}</td><td>${product.stock}</td><td>${product.stock <= 5 ? `<span class="tag red">Low</span>` : `<span class="tag green">OK</span>`}</td><td><input class="input" style="max-width:110px" type="number" value="${product.stock}" onchange="seller.setStock('${escapeHtml(product.id)}',this.value)"></td></tr>`).join("")}</tbody></table></div>`;
    },
    setStock(id,value) {
        const record = seller.requireApproved();
        if (!record) return;
        const product = productById(id);
        if (!product || product.sellerId !== record.id) return;
        const stock = Math.max(0,Math.floor(Number(value)));
        product.stock = stock;
        audit("seller.inventory.updated",{productId:id,stock});
        persist();
        toast("Inventory updated.","success");
    },
    orders(record) {
        const orders = state.db.orders.filter((order) => order.items.some((item) => item.sellerId === record.id));
        return `<div class="table-wrap"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Seller total</th><th>Status</th><th>Update</th></tr></thead><tbody>${orders.map((order) => {const lines=order.items.filter((item)=>item.sellerId===record.id);const total=lines.reduce((sum,item)=>sum+item.price*item.quantity,0);return `<tr><td>${escapeHtml(order.orderNumber)}<small style="display:block;color:var(--muted);font-size:8px">${new Date(order.createdAt).toLocaleString("en-IN")}</small></td><td>${escapeHtml(state.db.users.find((u)=>u.id===order.userId)?.name || "Customer")}</td><td>${lines.map((line)=>`${escapeHtml(line.name)} × ${line.quantity}`).join("<br>")}</td><td>${money(total)}</td><td><span class="tag green">${escapeHtml(order.status)}</span></td><td><select class="select" onchange="seller.updateOrder('${escapeHtml(order.id)}',this.value)"><option value="">Choose</option><option value="packed">Packed</option><option value="shipped">Shipped</option><option value="out_for_delivery">Out for delivery</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select></td></tr>`}).join("")}</tbody></table></div>`;
    },
    updateOrder(id,status) {
        const record = seller.requireApproved();
        if (!record || !status) return;
        const order = state.db.orders.find((candidate)=>candidate.id===id && candidate.items.some((item)=>item.sellerId===record.id));
        if (!order) return;
        order.status = status;
        order.updatedAt = now();
        if (status === "shipped" && !order.trackingNumber) order.trackingNumber = "SRP-TRK-" + Math.floor(100000 + Math.random()*900000);
        audit("seller.order.status",{orderId:id,status});
        persist();
        router.renderSellerPage();
        toast("Order status updated.","success");
    },
    shipping(record) {
        return `<div class="form"><label>Free shipping threshold<input id="sellerFreeShip" class="input" type="number" value="${record.settings?.freeShippingThreshold ?? 999}"></label><label>Flat shipping fee<input id="sellerFlatShip" class="input" type="number" value="${record.settings?.flatShipping ?? 49}"></label><button class="btn btn-primary" onclick="seller.saveShipping()">Save shipping settings</button></div>`;
    },
    saveShipping() {
        const record = seller.requireApproved();
        if (!record) return;
        record.settings = {freeShippingThreshold:Math.max(0,Number(el("sellerFreeShip").value)),flatShipping:Math.max(0,Number(el("sellerFlatShip").value))};
        persist();
        toast("Seller shipping settings saved.","success");
    },
    coupon(record) {
        const existing = record.coupons || [];
        return `<div class="form"><div class="editor-grid"><label>Code<input id="sellerCouponCode" class="input"></label><label>Discount %<input id="sellerCouponValue" class="input" type="number" min="1" max="100"></label><label>Minimum order<input id="sellerCouponMin" class="input" type="number"></label></div><button class="btn btn-primary" onclick="seller.addCoupon()">Create seller coupon</button><div class="data-list">${existing.map((coupon)=>`<div class="data-item"><strong>${escapeHtml(coupon.code)}</strong><small>${coupon.value}% off · minimum ${money(coupon.minimum)} · ${coupon.active ? "Active" : "Inactive"}</small></div>`).join("") || `<div class="empty"><div class="empty-icon">🎟️</div><div class="empty-title">No seller coupons</div></div>`}</div></div>`;
    },
    addCoupon() {
        const record = seller.requireApproved();
        if (!record) return;
        const code = el("sellerCouponCode").value.trim().toUpperCase();
        const value = Number(el("sellerCouponValue").value);
        const minimum = Number(el("sellerCouponMin").value || 0);
        if (!code || value <= 0 || value > 100) {
            toast("Enter a valid coupon and percentage.","error");
            return;
        }
        record.coupons = record.coupons || [];
        record.coupons.push({id:uid("coupon"),code,value,minimum,active:true,createdAt:now()});
        persist();
        router.renderSellerPage();
        toast("Seller coupon created.","success");
    },
    earnings(record) {
        const orders = state.db.orders.filter((order) => order.items.some((item)=>item.sellerId===record.id));
        const gross = orders.reduce((sum,order)=>sum+order.items.filter((item)=>item.sellerId===record.id).reduce((s,item)=>s+item.price*item.quantity,0),0);
        const commission = gross*record.commission/100;
        return `<div class="kpi-grid"><div class="kpi"><span>Gross sales</span><strong>${money(gross)}</strong></div><div class="kpi"><span>Commission</span><strong>${money(commission)}</strong></div><div class="kpi"><span>Seller net before other adjustments</span><strong>${money(gross-commission)}</strong></div><div class="kpi"><span>Orders</span><strong>${orders.length}</strong></div></div>`;
    },
    notifications(record) {
        const list = state.db.notifications.filter((note)=>note.sellerId===record.id || note.userId===user.id);
        return `<div>${list.map((note)=>`<div class="notification"><strong>${escapeHtml(note.title)}</strong><p>${escapeHtml(note.message)}</p><small>${new Date(note.createdAt).toLocaleString("en-IN")}</small></div>`).join("") || `<div class="empty"><div class="empty-icon">🔔</div><div class="empty-title">No seller notifications</div></div>`}</div>`;
    },
    reviews(record) {
        const reviews = state.db.reviews.filter((review)=>review.sellerId===record.id);
        return `<div class="data-list">${reviews.map((review)=>`<div class="data-item"><strong>${escapeHtml(review.productName || "Product")} · ${review.rating} ★</strong><small>${escapeHtml(review.text)}</small></div>`).join("") || `<div class="empty"><div class="empty-icon">★</div><div class="empty-title">No seller-specific reviews yet</div></div>`}</div>`;
    },
    export(record) {
        const payload = {seller:clone(record),products:clone(state.db.products.filter((product)=>product.sellerId===record.id)),orders:clone(state.db.orders.filter((order)=>order.items.some((item)=>item.sellerId===record.id))),exportedAt:now()};
        downloadFile(`srp-seller-${record.id}.json`,JSON.stringify(payload,null,2),"application/json");
        toast("Seller data exported.","success");
    },
    preview(record) {
        const products = state.db.products.filter((product)=>product.sellerId===record.id && product.status === "active");
        openModal(`<div class="modal-head"><h2 class="modal-title">Store preview</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="store-preview"><div class="store-logo">${escapeHtml(record.store.slice(0,1).toUpperCase())}</div><div><h3 style="margin:0">${escapeHtml(record.store)}</h3><p class="section-copy">${products.length} active products</p></div></div><div class="product-grid" style="margin-top:13px">${products.map(renderProductCard).join("")}</div></div>`,true);
    }
};

        ["profile","Seller profile"],
        ["products","Products"],
        ["inventory","Inventory"],
        ["orders","Orders"],
        ["shipping","Shipping"],
        ["coupons","Seller coupons"],
        ["earnings","Earnings"],
        ["reviews","Reviews"],
        ["notifications","Notifications"],
        ["preview","Store preview"],

    ];

        coupons:`<div class="panel"><span class="eyebrow">PROMOTIONS</span><h2 class="section-title">Seller coupons</h2><div style="margin-top:13px">${seller.coupon(record)}</div></div>`,
        earnings:`<div class="panel"><span class="eyebrow">FINANCE</span><h2 class="section-title">Earnings</h2><div style="margin-top:13px">${seller.earnings(record)}</div></div>`,

        preview:`<div class="panel"><span class="eyebrow">STORE PREVIEW</span><h2 class="section-title">Public seller page</h2><button class="btn btn-primary" style="margin-top:11px" onclick="seller.preview(seller.current())">Open preview</button></div>`,
        export:`<div class="panel"><span class="eyebrow">DATA EXPORT</span><h2 class="section-title">Seller data export</h2><p class="section-copy">Downloads current seller catalog and orders.</p><button class="btn btn-primary" style="margin-top:11px" onclick="seller.export(seller.current())">Export seller JSON</button></div>`
    }[state.sellerSection] || seller.dashboard(record);
    el("app").innerHTML = `
        <section class="page-shell"><div class="container">
            <div class="seller-dashboard">
                <aside class="seller-side"><div class="seller-side-head"><b>SRP</b><small>SELLER CENTER</small></div><nav class="seller-nav">${nav.map(([key,label])=>`<button class="${key===state.sellerSection?"active":""}" onclick="state.sellerSection='${key}';router.renderSellerPage()">${escapeHtml(label)}</button>`).join("")}</nav><button class="btn btn-outline" style="width:100%;margin-top:10px" onclick="router.go('home')">← Marketplace</button></aside>
                <main class="seller-main"><div class="seller-topbar"><div><span class="eyebrow">SELLER CENTER</span><h1 class="seller-page-title">${escapeHtml(record.store)}</h1><div class="seller-status">Approved seller · ${escapeHtml(record.email)}</div></div><button class="btn btn-accent" onclick="seller.preview(seller.current())">Preview store</button></div>${content}</main>

function sellerProfilePanel(record) {

}

const admin = {
    ensurePassword() {
        if (!state.db.adminPasswordHash) {
            openModal(`
                <div class="modal-head"><h2 class="modal-title">Create admin password</h2></div>
                <div class="modal-body"><div class="form"><p class="section-copy">First-run setup. The password is stored only in this browser's local marketplace state for this standalone index.</p><label>Admin email<input class="input" value="${ADMIN_EMAIL}" disabled></label><label>Password<input id="adminSetupPassword" class="input" type="password"></label><label>Confirm password<input id="adminSetupConfirm" class="input" type="password"></label><button class="btn btn-primary" onclick="admin.setupPassword()">Create admin password</button></div></div>
            `);
            return false;
        }
        return true;
    },
    setupPassword() {
        const first = el("adminSetupPassword").value;
        const second = el("adminSetupConfirm").value;
        if (first.length < 10 || first !== second) {
            toast("Admin password must be at least 10 characters and match confirmation.","error");
            return;
        }
        state.db.adminPasswordHash = simpleHash(first);
        persist();
        closeModal();
        admin.login();
        toast("Admin password created.","success");
    },
    login() {
        if (!admin.ensurePassword()) return;
        openModal(`
            <div class="modal-head"><h2 class="modal-title">Admin login</h2><button class="close" onclick="closeModal()">×</button></div>
            <div class="modal-body"><div class="form"><label>Admin email<input id="adminEmail" class="input" type="email" value="${ADMIN_EMAIL}"></label><label>Password<input id="adminPassword" class="input" type="password" autocomplete="current-password"></label><button class="btn btn-primary" onclick="admin.submitLogin()">Unlock admin dashboard</button></div></div>
        `);
    },
    submitLogin() {
        const email = el("adminEmail").value.trim().toLowerCase();
        const password = el("adminPassword").value;
        if (email !== ADMIN_EMAIL || simpleHash(password) !== state.db.adminPasswordHash) {
            toast("Admin credentials are not valid.","error");
            return;
        }
        state.adminLoggedIn = true;
        sessionStorage.setItem("srp-admin-unlocked","1");
        audit("admin.login",{email});
        closeModal();
        router.go("admin");
        toast("Admin dashboard unlocked.","success");
    },
    logout() {
        state.adminLoggedIn = false;
        sessionStorage.removeItem("srp-admin-unlocked");
        router.go("home");
        toast("Admin dashboard locked.","success");
    },
    allowed() {
        return state.adminLoggedIn && sessionStorage.getItem("srp-admin-unlocked") === "1";
    },
    ensure() {
        if (!admin.allowed()) {
            admin.login();
            return false;
        }
        return true;
    },
    dashboard() {
        const customers = state.db.users.filter((candidate)=>candidate.role === "customer").length;
        const sellers = state.db.sellers.length;
        const pending = state.db.sellers.filter((seller)=>seller.status === "pending").length;
        const products = state.db.products.filter((product)=>product.status === "active").length;
        const orders = state.db.orders.length;
        const revenue = state.db.orders.reduce((sum,order)=>sum+Number(order.totals.total),0);
        const lowStock = state.db.products.filter((product)=>product.status === "active" && Number(product.stock) <= 5).length;
        return `<div class="kpi-grid"><div class="kpi"><span>Customers</span><strong>${customers}</strong></div><div class="kpi"><span>Sellers</span><strong>${sellers}</strong></div><div class="kpi"><span>Products</span><strong>${products}</strong></div><div class="kpi"><span>Orders</span><strong>${orders}</strong></div><div class="kpi"><span>Revenue</span><strong>${money(revenue)}</strong></div><div class="kpi"><span>Pending sellers</span><strong>${pending}</strong></div><div class="kpi"><span>Low stock</span><strong>${lowStock}</strong></div><div class="kpi"><span>Refund ledger</span><strong>${state.db.refunds.length}</strong></div></div><div class="two-col" style="margin-top:12px"><div class="panel"><span class="eyebrow">FEATURE COVERAGE</span><h2 class="section-title">135 requested feature slots</h2><p class="section-copy">Home ${HOME_FEATURES.length} · Cart ${CART_FEATURES.length} · Payment ${PAYMENT_FEATURES.length} · Account ${ACCOUNT_FEATURES.length} · Seller ${SELLER_FEATURES.length} · Admin ${ADMIN_FEATURES.length}</p><button class="btn btn-outline" style="margin-top:10px" onclick="admin.showFeatures()">Open feature manifest</button></div><div class="panel"><span class="eyebrow">MAINTENANCE</span><h2 class="section-title">${state.db.settings.maintenance ? "Maintenance ON" : "Store live"}</h2><p class="section-copy">Use Store settings to toggle maintenance mode.</p></div></div>`;
    },
    showFeatures() {
        const groups = [["Home",HOME_FEATURES],["Cart",CART_FEATURES],["Payment",PAYMENT_FEATURES],["Account",ACCOUNT_FEATURES],["Seller",SELLER_FEATURES],["Admin",ADMIN_FEATURES]];
        openModal(`<div class="modal-head"><h2 class="modal-title">Feature manifest</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${groups.map(([name,list])=>`<section style="margin-bottom:18px"><span class="eyebrow">${name}</span><div class="feature-manifest" style="margin-top:8px">${list.map((item,index)=>`<div class="feature-item"><span class="feature-number">${index+1}</span><span class="feature-text">${escapeHtml(item)}</span></div>`).join("")}</div></section>`).join("")}</div>`,true);
    },
    customers() {
        const customers = state.db.users.filter((candidate)=>candidate.role === "customer");
        return `<div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody>${customers.map((customer)=>`<tr><td>${escapeHtml(customer.name)}</td><td>${escapeHtml(customer.email)}</td><td><span class="tag ${customer.status === "blocked" ? "red" : "green"}">${escapeHtml(customer.status)}</span></td><td>${new Date(customer.createdAt).toLocaleString("en-IN")}</td><td><button class="btn ${customer.status === "blocked" ? "btn-success" : "btn-danger"}" onclick="admin.toggleCustomer('${escapeHtml(customer.id)}')">${customer.status === "blocked" ? "Unblock" : "Block"}</button></td></tr>`).join("") || `<tr><td colspan="5">No customer accounts yet.</td></tr>`}</tbody></table></div>`;
    },
    toggleCustomer(id) {
        const customer = state.db.users.find((candidate)=>candidate.id===id && candidate.role === "customer");
        if (!customer) return;
        customer.status = customer.status === "blocked" ? "active" : "blocked";
        audit("admin.customer.status",{userId:id,status:customer.status});
        persist();
        router.renderAdminPage();
    },
    sellers() {
        return `<div class="table-wrap"><table class="table"><thead><tr><th>Store</th><th>Owner</th><th>Status</th><th>Commission</th><th>Products</th><th>Action</th></tr></thead><tbody>${state.db.sellers.map((sellerRecord)=>`<tr><td>${escapeHtml(sellerRecord.store)}</td><td>${escapeHtml(sellerRecord.owner)}<small style="display:block;color:var(--muted);font-size:8px">${escapeHtml(sellerRecord.email)}</small></td><td><span class="tag ${sellerRecord.status === "approved" ? "green" : sellerRecord.status === "rejected" ? "red" : "yellow"}">${escapeHtml(sellerRecord.status)}</span></td><td>${sellerRecord.commission}%</td><td>${sellerProductCount(sellerRecord)}</td><td style="display:flex;gap:5px;flex-wrap:wrap">${sellerRecord.status !== "approved" ? `<button class="btn btn-success" onclick="admin.sellerStatus('${escapeHtml(sellerRecord.id)}','approved')">Approve</button>` : ""}${sellerRecord.status !== "rejected" ? `<button class="btn btn-danger" onclick="admin.sellerStatus('${escapeHtml(sellerRecord.id)}','rejected')">Reject</button>` : ""}<button class="btn btn-outline" onclick="admin.editSeller('${escapeHtml(sellerRecord.id)}')">Edit</button></td></tr>`).join("")}</tbody></table></div>`;
    },
    sellerStatus(id,status) {
        const sellerRecord = sellerById(id);
        if (!sellerRecord) return;
        sellerRecord.status = status;
        const owner = state.db.users.find((candidate)=>candidate.id===sellerRecord.ownerUserId);
        if (owner && status === "approved") {
            owner.role = "seller";
            owner.sellerId = sellerRecord.id;
            state.db.notifications.unshift({id:uid("note"),userId:owner.id,title:"Seller approved",message:`${sellerRecord.store} is approved. Seller Center is now available.`,read:false,createdAt:now()});
        }
        if (owner && status === "rejected") {
            state.db.notifications.unshift({id:uid("note"),userId:owner.id,title:"Seller application update",message:`${sellerRecord.store} is currently rejected. Contact marketplace administration for next steps.`,read:false,createdAt:now()});
        }
        audit("admin.seller.status",{sellerId:id,status});
        persist();
        router.renderAdminPage();
        toast(`Seller ${status}.`,status === "approved" ? "success" : "warning");
    },
    editSeller(id) {
        const sellerRecord = sellerById(id);
        if (!sellerRecord) return;
        openModal(`<div class="modal-head"><h2 class="modal-title">Seller settings</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form"><label>Store name<input id="adminSellerStore" class="input" value="${escapeHtml(sellerRecord.store)}"></label><label>Commission %<input id="adminSellerCommission" class="input" type="number" min="0" max="100" value="${sellerRecord.commission}"></label><button class="btn btn-primary" onclick="admin.saveSeller('${escapeHtml(id)}')">Save seller settings</button></div></div>`);

    saveSeller(id) {
        const sellerRecord = sellerById(id);

        sellerRecord.store = el("adminSellerStore").value.trim();
        sellerRecord.commission = Math.max(0,Math.min(100,Number(el("adminSellerCommission").value)));
