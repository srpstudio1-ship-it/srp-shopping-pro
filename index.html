const admin = {
    ensurePassword() {
        if (!state.db.adminPasswordHash) {
            openModal(`
                <div class="modal-head"><h2 class="modal-title">Create admin password</h2></div>
                <div class="modal-body"><div class="form"><p class="section-copy">First-run setup. The password is stored only in this browser's local marketplace state for this standalone index.</p><label>Admin email<input class="input" value="${ADMIN_EMAIL}" disabled></label><label>Password<input id="adminSetupPassword" class="input" type="password"></label><label>Confirm password<input id="adminSetupConfirm" class="input" type="password"></label><button class="btn btn-primary" onclick="admin.setupPassword()">Create admin password</button></div></div>
            `);
            return false;
        }
        return true;
    },
    setupPassword() {
        const first = el("adminSetupPassword").value;
        const second = el("adminSetupConfirm").value;
        if (first.length < 10 || first !== second) {
            toast("Admin password must be at least 10 characters and match confirmation.","error");
            return;
        }
        state.db.adminPasswordHash = simpleHash(first);
        persist();
        closeModal();
        admin.login();
        toast("Admin password created.","success");
    },
    login() {
        if (!admin.ensurePassword()) return;
        openModal(`
            <div class="modal-head"><h2 class="modal-title">Admin login</h2><button class="close" onclick="closeModal()">×</button></div>
            <div class="modal-body"><div class="form"><label>Admin email<input id="adminEmail" class="input" type="email" value="${ADMIN_EMAIL}"></label><label>Password<input id="adminPassword" class="input" type="password" autocomplete="current-password"></label><button class="btn btn-primary" onclick="admin.submitLogin()">Unlock admin dashboard</button></div></div>
        `);
    },
    submitLogin() {
        const email = el("adminEmail").value.trim().toLowerCase();
        const password = el("adminPassword").value;
        if (email !== ADMIN_EMAIL || simpleHash(password) !== state.db.adminPasswordHash) {
            toast("Admin credentials are not valid.","error");
            return;
        }
        state.adminLoggedIn = true;
        sessionStorage.setItem("srp-admin-unlocked","1");
        audit("admin.login",{email});
        closeModal();
        router.go("admin");
        toast("Admin dashboard unlocked.","success");
    },
    logout() {
        state.adminLoggedIn = false;
        sessionStorage.removeItem("srp-admin-unlocked");
        router.go("home");
        toast("Admin dashboard locked.","success");
    },
    allowed() {
        return state.adminLoggedIn && sessionStorage.getItem("srp-admin-unlocked") === "1";
    },
    ensure() {
        if (!admin.allowed()) {
            admin.login();
            return false;
        }
        return true;
    },
    dashboard() {
        const customers = state.db.users.filter((candidate)=>candidate.role === "customer").length;
        const sellers = state.db.sellers.length;
        const pending = state.db.sellers.filter((seller)=>seller.status === "pending").length;
        const products = state.db.products.filter((product)=>product.status === "active").length;
        const orders = state.db.orders.length;
        const revenue = state.db.orders.reduce((sum,order)=>sum+Number(order.totals.total),0);
        const lowStock = state.db.products.filter((product)=>product.status === "active" && Number(product.stock) <= 5).length;
        return `<div class="kpi-grid"><div class="kpi"><span>Customers</span><strong>${customers}</strong></div><div class="kpi"><span>Sellers</span><strong>${sellers}</strong></div><div class="kpi"><span>Products</span><strong>${products}</strong></div><div class="kpi"><span>Orders</span><strong>${orders}</strong></div><div class="kpi"><span>Revenue</span><strong>${money(revenue)}</strong></div><div class="kpi"><span>Pending sellers</span><strong>${pending}</strong></div><div class="kpi"><span>Low stock</span><strong>${lowStock}</strong></div><div class="kpi"><span>Refund ledger</span><strong>${state.db.refunds.length}</strong></div></div><div class="two-col" style="margin-top:12px"><div class="panel"><span class="eyebrow">FEATURE COVERAGE</span><h2 class="section-title">135 requested feature slots</h2><p class="section-copy">Home ${HOME_FEATURES.length} · Cart ${CART_FEATURES.length} · Payment ${PAYMENT_FEATURES.length} · Account ${ACCOUNT_FEATURES.length} · Seller ${SELLER_FEATURES.length} · Admin ${ADMIN_FEATURES.length}</p><button class="btn btn-outline" style="margin-top:10px" onclick="admin.showFeatures()">Open feature manifest</button></div><div class="panel"><span class="eyebrow">MAINTENANCE</span><h2 class="section-title">${state.db.settings.maintenance ? "Maintenance ON" : "Store live"}</h2><p class="section-copy">Use Store settings to toggle maintenance mode.</p></div></div>`;
    },
    showFeatures() {
        const groups = [["Home",HOME_FEATURES],["Cart",CART_FEATURES],["Payment",PAYMENT_FEATURES],["Account",ACCOUNT_FEATURES],["Seller",SELLER_FEATURES],["Admin",ADMIN_FEATURES]];
        openModal(`<div class="modal-head"><h2 class="modal-title">Feature manifest</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${groups.map(([name,list])=>`<section style="margin-bottom:18px"><span class="eyebrow">${name}</span><div class="feature-manifest" style="margin-top:8px">${list.map((item,index)=>`<div class="feature-item"><span class="feature-number">${index+1}</span><span class="feature-text">${escapeHtml(item)}</span></div>`).join("")}</div></section>`).join("")}</div>`,true);
    },
    customers() {
        const customers = state.db.users.filter((candidate)=>candidate.role === "customer");
        return `<div class="table-wrap"><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Created</th><th>Action</th></tr></thead><tbody>${customers.map((customer)=>`<tr><td>${escapeHtml(customer.name)}</td><td>${escapeHtml(customer.email)}</td><td><span class="tag ${customer.status === "blocked" ? "red" : "green"}">${escapeHtml(customer.status)}</span></td><td>${new Date(customer.createdAt).toLocaleString("en-IN")}</td><td><button class="btn ${customer.status === "blocked" ? "btn-success" : "btn-danger"}" onclick="admin.toggleCustomer('${escapeHtml(customer.id)}')">${customer.status === "blocked" ? "Unblock" : "Block"}</button></td></tr>`).join("") || `<tr><td colspan="5">No customer accounts yet.</td></tr>`}</tbody></table></div>`;
    },
    toggleCustomer(id) {
        const customer = state.db.users.find((candidate)=>candidate.id===id && candidate.role === "customer");
        if (!customer) return;
        customer.status = customer.status === "blocked" ? "active" : "blocked";
        audit("admin.customer.status",{userId:id,status:customer.status});
        persist();
        router.renderAdminPage();
    },
    sellers() {
        return `<div class="table-wrap"><table class="table"><thead><tr><th>Store</th><th>Owner</th><th>Status</th><th>Commission</th><th>Products</th><th>Action</th></tr></thead><tbody>${state.db.sellers.map((sellerRecord)=>`<tr><td>${escapeHtml(sellerRecord.store)}</td><td>${escapeHtml(sellerRecord.owner)}<small style="display:block;color:var(--muted);font-size:8px">${escapeHtml(sellerRecord.email)}</small></td><td><span class="tag ${sellerRecord.status === "approved" ? "green" : sellerRecord.status === "rejected" ? "red" : "yellow"}">${escapeHtml(sellerRecord.status)}</span></td><td>${sellerRecord.commission}%</td><td>${sellerProductCount(sellerRecord)}</td><td style="display:flex;gap:5px;flex-wrap:wrap">${sellerRecord.status !== "approved" ? `<button class="btn btn-success" onclick="admin.sellerStatus('${escapeHtml(sellerRecord.id)}','approved')">Approve</button>` : ""}${sellerRecord.status !== "rejected" ? `<button class="btn btn-danger" onclick="admin.sellerStatus('${escapeHtml(sellerRecord.id)}','rejected')">Reject</button>` : ""}<button class="btn btn-outline" onclick="admin.editSeller('${escapeHtml(sellerRecord.id)}')">Edit</button></td></tr>`).join("")}</tbody></table></div>`;
    },
    sellerStatus(id,status) {
        const sellerRecord = sellerById(id);
        if (!sellerRecord) return;
        sellerRecord.status = status;
        const owner = state.db.users.find((candidate)=>candidate.id===sellerRecord.ownerUserId);
        if (owner && status === "approved") {
            owner.role = "seller";
            owner.sellerId = sellerRecord.id;
            state.db.notifications.unshift({id:uid("note"),userId:owner.id,title:"Seller approved",message:`${sellerRecord.store} is approved. Seller Center is now available.`,read:false,createdAt:now()});
        }
        if (owner && status === "rejected") {
            state.db.notifications.unshift({id:uid("note"),userId:owner.id,title:"Seller application update",message:`${sellerRecord.store} is currently rejected. Contact marketplace administration for next steps.`,read:false,createdAt:now()});
        }
        audit("admin.seller.status",{sellerId:id,status});
        persist();
        router.renderAdminPage();
        toast(`Seller ${status}.`,status === "approved" ? "success" : "warning");
    },
    editSeller(id) {
        const sellerRecord = sellerById(id);
        if (!sellerRecord) return;
        openModal(`<div class="modal-head"><h2 class="modal-title">Seller settings</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form"><label>Store name<input id="adminSellerStore" class="input" value="${escapeHtml(sellerRecord.store)}"></label><label>Commission %<input id="adminSellerCommission" class="input" type="number" min="0" max="100" value="${sellerRecord.commission}"></label><button class="btn btn-primary" onclick="admin.saveSeller('${escapeHtml(id)}')">Save seller settings</button></div></div>`);
    },
    saveSeller(id) {
        const sellerRecord = sellerById(id);
        if (!sellerRecord) return;
        sellerRecord.store = el("adminSellerStore").value.trim();
        sellerRecord.commission = Math.max(0,Math.min(100,Number(el("adminSellerCommission").value)));
        audit("admin.seller.updated",{sellerId:id});
        persist();
        closeModal();
        router.renderAdminPage();
    },
    productRows() {
        return `<div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>Seller</th><th>Price/MRP</th><th>Stock</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.db.products.map((product)=>`<tr><td>${escapeHtml(product.name)}<small style="display:block;color:var(--muted);font-size:8px">${escapeHtml(product.sku)}</small></td><td>${escapeHtml(sellerById(product.sellerId)?.store || "—")}</td><td>${money(product.price)} / ${money(product.mrp)}</td><td>${product.stock}</td><td><span class="tag ${product.status === "active" ? "green" : "red"}">${escapeHtml(product.status)}</span></td><td><button class="btn btn-outline" onclick="admin.productForm('${escapeHtml(product.id)}')">Edit</button></td></tr>`).join("")}</tbody></table></div>`;
    },
    productForm(id = "") {
        const product = id ? productById(id) : null;
        const sellers = state.db.sellers.filter((sellerRecord)=>sellerRecord.status === "approved");
        const categories = state.db.categories;
        openModal(`<div class="modal-head"><h2 class="modal-title">${product ? "Edit" : "Add"} marketplace product</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="editor-grid"><label>Name<input id="adminProductName" class="input" value="${escapeHtml(product?.name || "")}"></label><label>Brand<input id="adminProductBrand" class="input" value="${escapeHtml(product?.brand || "")}"></label><label>Seller<select id="adminProductSeller" class="select">${sellers.map((sellerRecord)=>`<option value="${escapeHtml(sellerRecord.id)}" ${(product?.sellerId || "") === sellerRecord.id ? "selected" : ""}>${escapeHtml(sellerRecord.store)}</option>`).join("")}</select></label><label>Category<select id="adminProductCategory" class="select">${categories.map((category)=>`<option value="${escapeHtml(category.name)}" ${(product?.category || "") === category.name ? "selected" : ""}>${escapeHtml(category.name)}</option>`).join("")}</select></label><label>SKU<input id="adminProductSku" class="input" value="${escapeHtml(product?.sku || "")}"></label><label>Stock<input id="adminProductStock" class="input" type="number" value="${escapeHtml(product?.stock ?? 0)}"></label><label>Price<input id="adminProductPrice" class="input" type="number" value="${escapeHtml(product?.price || 0)}"></label><label>MRP<input id="adminProductMrp" class="input" type="number" value="${escapeHtml(product?.mrp || 0)}"></label><label>Status<select id="adminProductStatus" class="select"><option value="active" ${product?.status === "active" ? "selected" : ""}>Active</option><option value="inactive" ${product?.status === "inactive" ? "selected" : ""}>Inactive</option></select></label><label class="full">Image URLs<textarea id="adminProductImages" class="input">${escapeHtml(product?.images?.join("\n") || "")}</textarea></label><label class="full">Description<textarea id="adminProductDescription" class="input">${escapeHtml(product?.description || "")}</textarea></label><label class="full">Highlights<textarea id="adminProductHighlights" class="input">${escapeHtml(product?.highlights?.join("\n") || "")}</textarea></label><label class="full">Specifications<textarea id="adminProductSpecs" class="input">${escapeHtml(product ? Object.entries(product.specs || {}).map(([key,value])=>`${key}: ${value}`).join("\n") : "")}</textarea></label><div class="full"><button class="btn btn-primary" onclick="admin.saveProduct('${escapeHtml(id)}')">Save product</button></div></div></div>`,true);
    },
    saveProduct(id) {
        const required = ["adminProductName","adminProductBrand","adminProductSeller","adminProductCategory","adminProductSku","adminProductStock","adminProductPrice","adminProductMrp"];
        if (required.some((field)=>!el(field))) return;
        const name = el("adminProductName").value.trim();
        const brand = el("adminProductBrand").value.trim();
        const sellerId = el("adminProductSeller").value;
        const category = el("adminProductCategory").value;
        const sku = el("adminProductSku").value.trim();
        const stock = Math.max(0,Math.floor(Number(el("adminProductStock").value)));
        const price = Number(el("adminProductPrice").value);
        const mrp = Number(el("adminProductMrp").value);
        const status = el("adminProductStatus").value;
        const images = el("adminProductImages").value.split(/\n+/).map((value)=>value.trim()).filter(Boolean);
        const description = el("adminProductDescription").value.trim();
        const highlights = el("adminProductHighlights").value.split(/\n+/).map((value)=>value.trim()).filter(Boolean);
        const specs = {};
        el("adminProductSpecs").value.split(/\n+/).map((value)=>value.trim()).filter(Boolean).forEach((line)=>{const separator=line.indexOf(":");if(separator>0)specs[line.slice(0,separator).trim()]=line.slice(separator+1).trim();});
        if (!name || !brand || !sellerId || !category || !sku || !images.length || price <= 0 || mrp < price) {
            toast("Complete all product fields and provide at least one image URL.","error");
            return;
        }
        if (id) {
            const product = productById(id);
            if (!product) return;
            Object.assign(product,{name,brand,sellerId,category,sku,stock,price,mrp,status,images,description,highlights,specs,updatedAt:now()});
            audit("admin.product.updated",{productId:id});
        } else {
            const product = {id:uid("product"),name,brand,sellerId,category,categoryId:"",sku,stock,price,mrp,status,images,description,highlights,specs,rating:0,reviews:[],createdAt:now()};
            state.db.products.push(product);
            audit("admin.product.created",{productId:product.id});
        }
        persist();
        closeModal();
        router.renderAdminPage();
        toast("Product saved.","success");
    },
    categories() {
        return `<div class="toolbar" style="justify-content:flex-start"><button class="btn btn-primary" onclick="admin.addCategory()">Add category</button></div><div class="table-wrap" style="margin-top:10px"><table class="table"><thead><tr><th>Name</th><th>Icon</th><th>Products</th><th>Action</th></tr></thead><tbody>${state.db.categories.map((category)=>`<tr><td>${escapeHtml(category.name)}</td><td>${escapeHtml(category.icon)}</td><td>${state.db.products.filter((product)=>product.category===category.name).length}</td><td><button class="btn btn-outline" onclick="admin.renameCategory('${escapeHtml(category.id)}')">Rename</button></td></tr>`).join("")}</tbody></table></div>`;
    },
    addCategory() {
        openModal(`<div class="modal-head"><h2 class="modal-title">Add category</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form"><label>Name<input id="newCategoryName" class="input"></label><label>Icon<input id="newCategoryIcon" class="input" placeholder="🛍️"></label><button class="btn btn-primary" onclick="admin.saveCategory()">Add category</button></div></div>`);
    },
    saveCategory() {
        const name = el("newCategoryName").value.trim();
        const icon = el("newCategoryIcon").value.trim() || "🛍️";
        if (!name || state.db.categories.some((category)=>category.name.toLowerCase()===name.toLowerCase())) {
            toast("Category name is missing or already exists.","error");
            return;
        }
        state.db.categories.push({id:uid("category"),name,icon});
        audit("admin.category.created",{name});
        persist();
        closeModal();
        router.renderAdminPage();
    },
    renameCategory(id) {
        const category = state.db.categories.find((item)=>item.id===id);
        if (!category) return;
        const next = prompt("New category name",category.name);
        if (!next?.trim()) return;
        const old = category.name;
        category.name = next.trim();
        state.db.products.forEach((product)=>{if(product.category===old)product.category=category.name;});
        audit("admin.category.renamed",{id,oldName:old,newName:category.name});
        persist();
        router.renderAdminPage();
    },
    orders() {
        return `<div class="table-wrap"><table class="table"><thead><tr><th>Order</th><th>Customer</th><th>Total</th><th>Status</th><th>Payment</th><th>Action</th></tr></thead><tbody>${state.db.orders.map((order)=>`<tr><td>${escapeHtml(order.orderNumber)}</td><td>${escapeHtml(state.db.users.find((candidate)=>candidate.id===order.userId)?.name || "Customer")}</td><td>${money(order.totals.total)}</td><td><span class="tag">${escapeHtml(order.status)}</span></td><td>${escapeHtml(order.paymentStatus)}</td><td><select class="select" onchange="admin.updateOrder('${escapeHtml(order.id)}',this.value)"><option value="">Status</option><option value="packed">Packed</option><option value="shipped">Shipped</option><option value="out_for_delivery">Out for delivery</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select></td></tr>`).join("") || `<tr><td colspan="6">No orders.</td></tr>`}</tbody></table></div>`;
    },
    updateOrder(id,status) {
        if (!status) return;
        const order = state.db.orders.find((candidate)=>candidate.id===id);
        if (!order) return;
        order.status = status;
        order.updatedAt = now();
        if (status === "shipped" && !order.trackingNumber) order.trackingNumber = "SRP-TRK-" + Math.floor(100000+Math.random()*900000);
        const message = `Order ${order.orderNumber} status changed to ${status}.`;
        state.db.notifications.unshift({id:uid("note"),userId:order.userId,title:"Order update",message,read:false,createdAt:now()});
        audit("admin.order.status",{orderId:id,status});
        persist();
        router.renderAdminPage();
        toast("Order updated.","success");
    },
    inventory() {
        return `<div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>Seller</th><th>Stock</th><th>Low stock</th><th>Adjust</th></tr></thead><tbody>${state.db.products.map((product)=>`<tr><td>${escapeHtml(product.name)}</td><td>${escapeHtml(sellerById(product.sellerId)?.store || "—")}</td><td>${product.stock}</td><td>${product.stock<=5 ? `<span class="tag red">Low</span>` : `<span class="tag green">OK</span>`}</td><td><input class="input" type="number" style="max-width:110px" value="${product.stock}" onchange="admin.setStock('${escapeHtml(product.id)}',this.value)"></td></tr>`).join("")}</tbody></table></div>`;
    },
    setStock(id,value) {
        const product = productById(id);
        if (!product) return;
        product.stock = Math.max(0,Math.floor(Number(value)));
        audit("admin.inventory.updated",{productId:id,stock:product.stock});
        persist();
        toast("Stock updated.","success");
    },
    lowStock() {
        const list = state.db.products.filter((product)=>product.status === "active" && Number(product.stock) <= 5);
        return `<div class="data-list">${list.map((product)=>`<div class="data-item"><strong>${escapeHtml(product.name)}</strong><small>${product.stock} remaining · ${escapeHtml(sellerById(product.sellerId)?.store || "—")}</small></div>`).join("") || `<div class="empty"><div class="empty-icon">✓</div><div class="empty-title">No low-stock products</div></div>`}</div>`;
    },
    refundLedger() {
        const rows = state.db.refunds;
        return `<div class="toolbar" style="justify-content:flex-start"><button class="btn btn-primary" onclick="admin.addRefund()">Record refund</button></div><div class="table-wrap" style="margin-top:10px"><table class="table"><thead><tr><th>Refund</th><th>Order</th><th>Amount</th><th>Reason</th><th>Date</th></tr></thead><tbody>${rows.map((refund)=>`<tr><td>${escapeHtml(refund.id)}</td><td>${escapeHtml(refund.orderNumber)}</td><td>${money(refund.amount)}</td><td>${escapeHtml(refund.reason)}</td><td>${new Date(refund.createdAt).toLocaleString("en-IN")}</td></tr>`).join("") || `<tr><td colspan="5">No refunds recorded.</td></tr>`}</tbody></table></div>`;
    },
    addRefund() {
        const orderNumber = prompt("Order number");
        if (!orderNumber) return;
        const order = state.db.orders.find((candidate)=>candidate.orderNumber===orderNumber);
        if (!order) {toast("Order not found.","error");return;}
        const amount = Number(prompt("Refund amount",order.totals.total));
        if (!(amount > 0) || amount > order.totals.total) {toast("Invalid refund amount.","error");return;}
        const reason = prompt("Refund reason","Customer service");
        state.db.refunds.unshift({id:uid("refund"),orderId:order.id,orderNumber,amount,reason:reason || "Unspecified",createdAt:now()});
        state.db.notifications.unshift({id:uid("note"),userId:order.userId,title:"Refund recorded",message:`Refund of ${money(amount)} was recorded for ${orderNumber}.`,read:false,createdAt:now()});
        audit("admin.refund.created",{orderId:order.id,amount});
        persist();
        router.renderAdminPage();
    },
    paymentLedger() {
        return `<div class="table-wrap"><table class="table"><thead><tr><th>Reference</th><th>Order</th><th>Method</th><th>Status</th><th>Amount</th><th>Created</th></tr></thead><tbody>${state.db.payments.map((payment)=>`<tr><td>${escapeHtml(payment.id)}</td><td>${escapeHtml(state.db.orders.find((order)=>order.id===payment.orderId)?.orderNumber || "—")}</td><td>${escapeHtml(payment.method)}</td><td>${escapeHtml(payment.status)}</td><td>${money(payment.amount)}</td><td>${new Date(payment.createdAt).toLocaleString("en-IN")}</td></tr>`).join("") || `<tr><td colspan="6">No payment records.</td></tr>`}</tbody></table></div>`;
    },
    settings() {
        const s = state.db.settings;
        return `<div class="form"><div class="editor-grid"><label class="full">Hero title<input id="setHeroTitle" class="input" value="${escapeHtml(s.heroTitle)}"></label><label class="full">Hero subtitle<textarea id="setHeroSubtitle" class="input">${escapeHtml(s.heroSubtitle)}</textarea></label><label>Free shipping threshold<input id="setFreeShipping" class="input" type="number" value="${s.freeShippingThreshold}"></label><label>Flat shipping<input id="setFlatShipping" class="input" type="number" value="${s.flatShipping}"></label><label>Tax rate %<input id="setTaxRate" class="input" type="number" value="${s.taxRate}"></label><label>COD <select id="setCod" class="select"><option value="false" ${!s.codEnabled ? "selected" : ""}>Disabled</option><option value="true" ${s.codEnabled ? "selected" : ""}>Enabled</option></select></label><label>Maintenance mode <select id="setMaintenance" class="select"><option value="false" ${!s.maintenance ? "selected" : ""}>Off</option><option value="true" ${s.maintenance ? "selected" : ""}>On</option></select></label></div><button class="btn btn-primary" onclick="admin.saveSettings()">Save store settings</button></div>`;
    },
    saveSettings() {
        state.db.settings.heroTitle = el("setHeroTitle").value.trim();
        state.db.settings.heroSubtitle = el("setHeroSubtitle").value.trim();
        state.db.settings.freeShippingThreshold = Math.max(0,Number(el("setFreeShipping").value));
        state.db.settings.flatShipping = Math.max(0,Number(el("setFlatShipping").value));
        state.db.settings.taxRate = Math.max(0,Number(el("setTaxRate").value));
        state.db.settings.codEnabled = el("setCod").value === "true";
        state.db.settings.maintenance = el("setMaintenance").value === "true";
        audit("admin.settings.updated",{maintenance:state.db.settings.maintenance});
        persist();
        toast("Store settings saved.","success");
    },
    coupons() {
        return `<div class="toolbar" style="justify-content:flex-start"><button class="btn btn-primary" onclick="admin.addCoupon()">Create coupon</button></div><div class="table-wrap" style="margin-top:10px"><table class="table"><thead><tr><th>Code</th><th>Type</th><th>Value</th><th>Minimum</th><th>Active</th><th>Action</th></tr></thead><tbody>${state.db.coupons.map((coupon)=>`<tr><td>${escapeHtml(coupon.code)}</td><td>${escapeHtml(coupon.type)}</td><td>${coupon.value}${coupon.type === "percent" ? "%" : ""}</td><td>${money(coupon.minimum)}</td><td>${coupon.active ? "Yes" : "No"}</td><td><button class="btn btn-outline" onclick="admin.toggleCoupon('${escapeHtml(coupon.id)}')">${coupon.active ? "Disable" : "Enable"}</button></td></tr>`).join("")}</tbody></table></div>`;
    },
    addCoupon() {
        openModal(`<div class="modal-head"><h2 class="modal-title">Create coupon</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form"><label>Code<input id="couponCode" class="input"></label><label>Type<select id="couponType" class="select"><option value="percent">Percentage</option><option value="flat">Flat</option></select></label><label>Value<input id="couponValue" class="input" type="number"></label><label>Minimum order<input id="couponMinimum" class="input" type="number"></label><label>Maximum discount<input id="couponMaximum" class="input" type="number"></label><button class="btn btn-primary" onclick="admin.saveCoupon()">Create coupon</button></div></div>`);
    },
    saveCoupon() {
        const code = el("couponCode").value.trim().toUpperCase();
        const type = el("couponType").value;
        const value = Number(el("couponValue").value);
        const minimum = Number(el("couponMinimum").value || 0);
        const maximum = Number(el("couponMaximum").value || 0);
        if (!code || value <= 0 || state.db.coupons.some((coupon)=>coupon.code===code)) {toast("Coupon is invalid or already exists.","error");return;}
        state.db.coupons.push({id:uid("coupon"),code,type,value,minimum,maximum,active:true,createdAt:now()});
        audit("admin.coupon.created",{code});
        persist();
        closeModal();
        router.renderAdminPage();
    },
    toggleCoupon(id) {
        const coupon = state.db.coupons.find((entry)=>entry.id===id);
        if (!coupon) return;
        coupon.active = !coupon.active;
        persist();
        router.renderAdminPage();
    },
    banners() {
        return `<div class="toolbar" style="justify-content:flex-start"><button class="btn btn-primary" onclick="admin.addBanner()">Add banner</button></div><div class="data-list" style="margin-top:10px">${state.db.banners.map((banner)=>`<div class="data-item"><strong>${escapeHtml(banner.title)}</strong><small>${escapeHtml(banner.text)} · ${banner.active ? "Active" : "Inactive"}</small><button class="btn btn-outline" style="margin-top:7px" onclick="admin.toggleBanner('${escapeHtml(banner.id)}')">Toggle</button></div>`).join("")}</div>`;
    },
    addBanner() {
        const title = prompt("Banner title");
        if (!title) return;
        const text = prompt("Banner text");
        if (!text) return;
        state.db.banners.unshift({id:uid("banner"),title,text,active:true,createdAt:now()});
        persist();
        router.renderAdminPage();
    },
    toggleBanner(id) {
        const banner = state.db.banners.find((entry)=>entry.id===id);
        if (!banner) return;
        banner.active = !banner.active;
        persist();
        router.renderAdminPage();
    },
    featured() {
        return `<div class="data-list">${state.db.products.map((product)=>`<div class="data-item"><strong>${escapeHtml(product.name)}</strong><small>${product.featured ? "Featured" : "Not featured"}</small><button class="btn btn-outline" style="margin-top:7px" onclick="admin.toggleFeatured('${escapeHtml(product.id)}')">${product.featured ? "Remove" : "Feature"}</button></div>`).join("")}</div>`;
    },
    toggleFeatured(id) {
        const product = productById(id);
        if (!product) return;
        product.featured = !product.featured;
        state.db.settings.featuredIds = state.db.products.filter((item)=>item.featured).map((item)=>item.id);
        persist();
        router.renderAdminPage();
    },
    reviews() {
        return `<div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>Customer</th><th>Rating</th><th>Review</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.db.reviews.map((review)=>`<tr><td>${escapeHtml(productById(review.productId)?.name || "—")}</td><td>${escapeHtml(review.userName)}</td><td>${review.rating} ★</td><td>${escapeHtml(review.text)}</td><td>${escapeHtml(review.status)}</td><td><button class="btn btn-outline" onclick="admin.moderateReview('${escapeHtml(review.id)}')">${review.status === "hidden" ? "Show" : "Hide"}</button></td></tr>`).join("") || `<tr><td colspan="6">No customer reviews yet.</td></tr>`}</tbody></table></div>`;
    },
    moderateReview(id) {
        const review = state.db.reviews.find((candidate)=>candidate.id===id);
        if (!review) return;
        review.status = review.status === "hidden" ? "visible" : "hidden";
        audit("admin.review.moderated",{reviewId:id,status:review.status});
        persist();
        router.renderAdminPage();
    },
    notifications() {
        return `<div class="toolbar" style="justify-content:flex-start"><button class="btn btn-primary" onclick="admin.sendNotification()">Send notification</button></div><div class="data-list" style="margin-top:10px">${state.db.notifications.slice(0,50).map((note)=>`<div class="notification"><strong>${escapeHtml(note.title)}</strong><p>${escapeHtml(note.message)}</p><small>User ${escapeHtml(note.userId)} · ${new Date(note.createdAt).toLocaleString("en-IN")}</small></div>`).join("") || `<div class="empty"><div class="empty-icon">🔔</div><div class="empty-title">No notifications</div></div>`}</div>`;
    },
    sendNotification() {
        const email = prompt("Customer email");
        if (!email) return;
        const customer = state.db.users.find((candidate)=>candidate.email.toLowerCase()===email.toLowerCase());
        if (!customer) {toast("Customer not found.","error");return;}
        const title = prompt("Notification title","SRP Shopping update");
        const message = prompt("Notification message","You have a new update.");
        state.db.notifications.unshift({id:uid("note"),userId:customer.id,title:title || "Update",message:message || "",read:false,createdAt:now()});
        audit("admin.notification.sent",{userId:customer.id});
        persist();
        router.renderAdminPage();
    },
    audit() {
        return `<div class="table-wrap"><table class="table"><thead><tr><th>Time</th><th>Action</th><th>Actor</th><th>Details</th></tr></thead><tbody>${state.db.audit.map((entry)=>`<tr><td>${new Date(entry.createdAt).toLocaleString("en-IN")}</td><td>${escapeHtml(entry.action)}</td><td>${escapeHtml(entry.actor)}</td><td>${escapeHtml(JSON.stringify(entry.details))}</td></tr>`).join("") || `<tr><td colspan="4">No audit entries.</td></tr>`}</tbody></table></div>`;
    },
    analytics() {
        const sales = state.db.orders.reduce((sum,order)=>sum+Number(order.totals.total),0);
        const units = state.db.orders.reduce((sum,order)=>sum+order.items.reduce((s,item)=>s+Number(item.quantity),0),0);
        const average = state.db.orders.length ? sales/state.db.orders.length : 0;
        const activeProducts = state.db.products.filter((product)=>product.status === "active").length;
        return `<div class="kpi-grid"><div class="kpi"><span>Gross sales</span><strong>${money(sales)}</strong></div><div class="kpi"><span>Units</span><strong>${units}</strong></div><div class="kpi"><span>Average order</span><strong>${money(average)}</strong></div><div class="kpi"><span>Active products</span><strong>${activeProducts}</strong></div></div><div class="panel" style="margin-top:12px"><span class="eyebrow">ORDER STATUS</span><div class="data-list" style="margin-top:10px">${["confirmed","packed","shipped","out_for_delivery","delivered","cancelled","cancellation_requested"].map((status)=>`<div class="data-item"><strong>${status.replace(/_/g," ")}</strong><small>${state.db.orders.filter((order)=>order.status===status).length} order(s)</small></div>`).join("")}</div></div>`;
    },
    salesReport() {
        const bySeller = {};
        state.db.orders.forEach((order)=>order.items.forEach((item)=>{bySeller[item.sellerId]=(bySeller[item.sellerId]||0)+item.price*item.quantity;}));
        return `<div class="table-wrap"><table class="table"><thead><tr><th>Seller</th><th>Gross sales</th><th>Commission</th><th>Seller net</th></tr></thead><tbody>${state.db.sellers.map((sellerRecord)=>{const gross=bySeller[sellerRecord.id]||0;const commission=gross*sellerRecord.commission/100;return `<tr><td>${escapeHtml(sellerRecord.store)}</td><td>${money(gross)}</td><td>${money(commission)}</td><td>${money(gross-commission)}</td></tr>`}).join("")}</tbody></table></div>`;
    },
    exportCSV() {
        const rows = [["Order","Customer","Total","Status","Payment","Created"]];
        state.db.orders.forEach((order)=>rows.push([order.orderNumber,state.db.users.find((candidate)=>candidate.id===order.userId)?.email || "",order.totals.total,order.status,order.paymentStatus,order.createdAt]));
        const csv = rows.map((row)=>row.map((value)=>`"${String(value).replace(/"/g,'""')}"`).join(",")).join("\n");
        downloadFile("srp-sales-report.csv",csv,"text/csv");
        toast("CSV exported.","success");
    },
    backup() {
        const backup = clone(state.db);
        backup.backupCreatedAt = now();
        downloadFile("srp-shopping-backup.json",JSON.stringify(backup,null,2),"application/json");
        toast("JSON backup exported.","success");
    },
    restore() {
        openModal(`<div class="modal-head"><h2 class="modal-title">Restore JSON backup</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form"><input id="restoreFile" class="input" type="file" accept="application/json,.json"><button class="btn btn-primary" onclick="admin.doRestore()">Restore backup</button><p class="section-copy">Restore replaces the local marketplace state in this browser. Keep a backup before restoring.</p></div></div>`);
    },
    doRestore() {
        const file = el("restoreFile").files[0];
        if (!file) {toast("Choose a backup file.","error");return;}
        const reader = new FileReader();
        reader.onload = () => {
            try {
                const parsed = JSON.parse(reader.result);
                if (!parsed || parsed.version !== 3 || !Array.isArray(parsed.products) || !Array.isArray(parsed.users)) throw new Error("Invalid SRP backup");
                state.db = parsed;
                persist();
                closeModal();
                router.renderAdminPage();
                toast("Backup restored.","success");
            } catch (error) {
                toast(error.message,"error");
            }
        };
        reader.readAsText(file);
    },
    password() {
        openModal(`<div class="modal-head"><h2 class="modal-title">Change admin password</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="form"><label>Current password<input id="adminOld" class="input" type="password"></label><label>New password<input id="adminNew" class="input" type="password"></label><label>Confirm new password<input id="adminNewConfirm" class="input" type="password"></label><button class="btn btn-primary" onclick="admin.savePassword()">Change admin password</button></div></div>`);
    },
    savePassword() {
        const oldPassword = el("adminOld").value;
        const first = el("adminNew").value;
        const second = el("adminNewConfirm").value;
        if (simpleHash(oldPassword) !== state.db.adminPasswordHash || first.length < 10 || first !== second) {toast("Current or new password is invalid.","error");return;}
        state.db.adminPasswordHash = simpleHash(first);
        persist();
        closeModal();
        toast("Admin password changed.","success");
    },
    appearance() {
        return `<div class="form"><p class="section-copy">Choose whether the storefront follows the user theme preference or the marketplace default.</p><button class="btn btn-primary" onclick="theme.toggle()">Toggle storefront theme</button><button class="btn btn-outline" onclick="admin.setDefaultTheme('light')">Set light default</button><button class="btn btn-outline" onclick="admin.setDefaultTheme('dark')">Set dark default</button></div>`;
    },
    setDefaultTheme(themeValue) {
        state.db.settings.darkMode = themeValue === "dark";
        persist();
        if (state.db.settings.darkMode) document.body.classList.add("dark");
        else document.body.classList.remove("dark");
        updateHeader();
        toast(`Default theme set to ${themeValue}.`,"success");
    },
    maintenance() {
        return `<div class="panel"><span class="eyebrow">MAINTENANCE</span><h2 class="section-title">${state.db.settings.maintenance ? "Maintenance mode is ON" : "Store is live"}</h2><p class="section-copy">Toggle maintenance mode in Store settings. Product browsing remains available to admin while this flag is on.</p><button class="btn ${state.db.settings.maintenance ? "btn-success" : "btn-danger"}" style="margin-top:10px" onclick="admin.toggleMaintenance()">${state.db.settings.maintenance ? "Turn maintenance off" : "Turn maintenance on"}</button></div>`;
    },
    toggleMaintenance() {
        state.db.settings.maintenance = !state.db.settings.maintenance;
        audit("admin.maintenance.changed",{enabled:state.db.settings.maintenance});
        persist();
        router.renderAdminPage();
    },
    hero() {
        const s = state.db.settings;
        return `<div class="form"><label>Homepage hero title<input id="heroAdminTitle" class="input" value="${escapeHtml(s.heroTitle)}"></label><label>Homepage hero subtitle<textarea id="heroAdminSubtitle" class="input">${escapeHtml(s.heroSubtitle)}</textarea></label><button class="btn btn-primary" onclick="admin.saveHero()">Save hero text</button></div>`;
    },
    saveHero() {
        state.db.settings.heroTitle = el("heroAdminTitle").value.trim();
        state.db.settings.heroSubtitle = el("heroAdminSubtitle").value.trim();
        persist();
        toast("Hero text saved.","success");
    },
    search() {
        const q = prompt("Search admin data");
        if (!q) return;
        const needle = q.toLowerCase();
        const products = state.db.products.filter((product)=>JSON.stringify(product).toLowerCase().includes(needle));
        const sellersFound = state.db.sellers.filter((sellerRecord)=>JSON.stringify(sellerRecord).toLowerCase().includes(needle));
        openModal(`<div class="modal-head"><h2 class="modal-title">Admin search: ${escapeHtml(q)}</h2><button class="close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="data-list"><div class="data-item"><strong>Products (${products.length})</strong><small>${products.map((product)=>escapeHtml(product.name)).join(" · ") || "None"}</small></div><div class="data-item"><strong>Sellers (${sellersFound.length})</strong><small>${sellersFound.map((sellerRecord)=>escapeHtml(sellerRecord.store)).join(" · ") || "None"}</small></div></div></div>`);
    }
};
admin.render = function() {
    if (!admin.allowed()) {
        admin.login();
        return;
    }
    router.renderAdminPage();
};

            <div class="admin-shell">
                <aside class="admin-side"><div class="admin-side-head"><b>SRP</b><small>ADMIN CONSOLE · PROTECTED</small></div><nav class="admin-nav">${sections.map(([key,label])=>`<button class="${key===state.adminSection?"active":""}" onclick="state.adminSection='${key}';router.renderAdminPage()">${escapeHtml(label)}</button>`).join("")}</nav><button class="btn btn-accent" style="width:100%;margin-top:10px" onclick="admin.logout()">Lock admin</button></aside>
                <main class="admin-main"><div class="admin-topbar"><div><span class="eyebrow">ADMIN CONSOLE</span><h1 class="admin-title">${escapeHtml(sections.find((item)=>item[0]===state.adminSection)?.[1] || "Dashboard")}</h1><p class="admin-copy">${ADMIN_EMAIL} · Local protected workspace</p></div><div class="toolbar"><button class="btn btn-outline" onclick="admin.backup()">Backup</button><button class="btn btn-outline" onclick="admin.search()">Search</button></div></div>${pageMap}</main>
            </div>
        </div></section>
    `;
};
const theme = {
    toggle() {
        const dark = document.body.classList.toggle("dark");
        localStorage.setItem(THEME_KEY,dark ? "dark" : "light");
        if (user) {
            user.preferences = user.preferences || {};
            user.preferences.theme = dark ? "dark" : "light";
            persist();
        }
        updateHeader();
    },
    apply() {
        const saved = localStorage.getItem(THEME_KEY);
        const preferred = user?.preferences?.theme || saved || (state.db.settings.darkMode ? "dark" : "light");
        document.body.classList.toggle("dark",preferred === "dark");
        updateHeader();
    }
};
function applyAccountThemeAfterSession() {
    theme.apply();
}
function mobileBottom() {
    if (document.querySelector(".mobile-bottom")) return;
    const nav = document.createElement("nav");
    nav.className = "mobile-bottom";
    nav.innerHTML = `<button onclick="router.go('home')">⌂<br>Home</button><button onclick="router.go('cart')">🛒<br>Cart</button><button onclick="account.wishlist()">♥<br>Wishlist</button><button onclick="account.orders()">📦<br>Orders</button><button onclick="account.render()">👤<br>Account</button>`;
    document.body.appendChild(nav);
}
function renderMaintenanceNotice() {
    if (!state.db.settings.maintenance || state.adminLoggedIn) return "";
    return `<div class="container" style="margin-top:10px"><div class="notice-box">SRP Shopping is in marketplace maintenance mode. Catalog browsing is available while administrative settings are being changed.</div></div>`;
}
// Application wiring.
document.addEventListener("DOMContentLoaded", () => {
    const savedSession = readJSON(SESSION_KEY,null);
    if (savedSession?.userId) {
        const candidate = state.db.users.find((item)=>item.id===savedSession.userId && item.status !== "blocked");
        if (candidate) user = candidate;
    }
    state.adminLoggedIn = sessionStorage.getItem("srp-admin-unlocked") === "1" && Boolean(state.db.adminPasswordHash);
    theme.apply();
    renderHeaderCategories();
    el("locationButton").addEventListener("click",account.location);
    el("notificationButton").addEventListener("click",()=>user ? account.notifications() : account.login());
    el("wishlistButton").addEventListener("click",()=>user ? account.wishlist() : account.login());
    el("compareButton").addEventListener("click",()=>account.openCompare());
    el("themeButton").addEventListener("click",theme.toggle);
    el("accountButton").addEventListener("click",()=>account.render());
    el("cartButton").addEventListener("click",()=>router.go("cart"));
    window.addEventListener("keydown",(event)=>{
        if (event.key === "Escape") closeModal();
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase()==="k") {
            event.preventDefault();
            el("globalSearch")?.focus();
        }
    });
    mobileBottom();
    state.route = location.hash.replace("#","") || "home";
    if (state.route === "admin") {
        if (state.adminLoggedIn) router.renderAdminPage();
        else admin.login();
    } else if (state.route === "seller") {
        if (user) seller.render();
        else account.login();
    } else if (state.route === "account") {
        account.render();
    } else if (state.route === "cart") {
        cart.renderPage();
    } else if (state.route === "payment") {
        checkout.open();
    } else {
        renderHome();
    }
});
</script>
</body>
</html>
