        ROOT THEME VARIABLES

        */
        :root {
            --srp-blue: #004aad;
            --srp-light-blue: #007bff;
            --srp-soft-blue: #e7f0ff;
            --srp-white: #ffffff;
            --srp-bg: #f0f2f5;
            --srp-text: #1c1e21;
            --srp-gray: #65676b;
            --srp-shadow: 0 4px 12px rgba(0,0,0,0.08);
            --nav-height: 65px;
            --top-height: 115px;
            --transition-speed: 0.3s;

        /* ========================================
        CORE RESET & MOBILE OPTIMIZATION
        ========================================
        */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--srp-bg);
            color: var(--srp-text);
            padding-top: var(--top-height);
            padding-bottom: calc(var(--nav-height) + 30px);
            overflow-x: hidden;
            transition: background var(--transition-speed);

        /* ========================================
        TOP NAVIGATION & SEARCH ARCHITECTURE
        ========================================
        */
        .top-nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: var(--srp-white);
            z-index: 1000;
            box-shadow: var(--srp-shadow);
            padding: 12px 18px;

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .brand-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--srp-blue);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .brand-btn:active { transform: scale(0.92); }

        .admin-badge {
            position: absolute;
            top: -6px;
            right: -10px;
            background: #ff4757;
            color: white;
            font-size: 9px;
            padding: 2px 7px;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            box-shadow: 0 2px 4px rgba(255, 71, 87, 0.3);

        .top-right-info {

            align-items: center;
            gap: 18px;
        }

            font-size: 0.9rem;
            font-weight: 600;

            align-items: center;
            gap: 6px;

        .privacy-btn {
            color: var(--srp-gray);
            font-size: 1.3rem;
            text-decoration: none;
            transition: color 0.2s;
        }

        .privacy-btn:hover { color: var(--srp-blue); }

        .search-container {
            position: relative;
            width: 100%;
        }

        .search-bar {
            width: 100%;
            padding: 12px 15px 12px 48px;
            border-radius: 12px;
            border: 1.5px solid #eee;
            background: #f8f9fa;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-bar:focus { 
            border-color: var(--srp-blue); 
            background: white;
            box-shadow: 0 0 0 4px rgba(0, 74, 173, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--srp-gray);
            font-size: 1rem;
        }

        MARKETING BANNER SYSTEM
        ========================================
        */

            width: 94%;
            margin: 18px auto;
            background: linear-gradient(135deg, var(--srp-blue), #00d4ff);
            border-radius: 18px;
            padding: 24px;
            color: white;

            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 20px rgba(0, 74, 173, 0.2);

            padding: 0 15px;

            border-radius: 15px;

            { id: 18, name: "SRP Air Purifier HEPA Filter", price: 8900, mrp: 15000, images: ["https://m.media-amazon.com/images/I/71S8S66AFL._SL1500_.jpg"], desc: "Removes 99.9% particles. Silent sleep mode.", category: "home" },
            { id: 19, name: "SRP Designer Polarized Sunglasses", price: 1299, mrp: 2500, images: ["https://m.media-amazon.com/images/I/61S8S66AFL._SL1500_.jpg"], desc: "UV400 protection. Durable metal frame.", category: "fash" },
            { id: 20, name: "SRP Fast Wall Charger 65W GaN", price: 2200, mrp: 4500, images: ["https://m.media-amazon.com/images/I/61S8S66AFL._SL1500_.jpg"], desc: "Compact Gallium Nitride technology. Fast charge laptops.", category: "elec" }
        ];

        // STARTUP LOGIC
        async function initApp() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'login.html'; return; }
            currentUser = session.user;
            
            renderCategories();
            renderProducts();
            checkAdminStatus();
            
            // Welcome Notification
            setTimeout(() => {
                showToast(`Signed in as ${currentUser.email}`);
            }, 1000);
        }

        function renderCategories() {
            const cats = [
                {id:'all',l:'All',i:'fa-border-all'},
                {id:'elec',l:'Electronics',i:'fa-laptop'},
                {id:'fash',l:'Fashion',i:'fa-shirt'},
                {id:'home',l:'Home',i:'fa-couch'},
                {id:'gadg',l:'Gadgets',i:'fa-mobile-screen'}
            ];
            document.getElementById('category-scroller').innerHTML = cats.map(c => `
                <div class="category-item ${c.id===activeCategory?'active':''}" onclick="setCategory('${c.id}')">
                    <div class="cat-circle"><i class="fas ${c.i}"></i></div>
                    <span class="cat-label">${c.l}</span>
                </div>
            `).join('');
        }

        function setCategory(id) {
            activeCategory = id;
            renderCategories();
            renderProducts();
        }

        function renderProducts() {
            const container = document.getElementById('main-product-container');
            const filtered = PRODUCT_DB.filter(p => {
                const catMatch = activeCategory === 'all' || p.category === activeCategory;
                const searchMatch = p.name.toLowerCase().includes(searchQuery);
                return catMatch && searchMatch;
            });

            container.innerHTML = filtered.map(p => `
                <div class="product-card" onclick="openProduct(${p.id})">
                    <div class="product-image-box"><img src="${p.images[0]}" loading="lazy"></div>
                    <div class="product-info">
                        <div class="p-name">${p.name}</div>
                        <div class="p-pricing">
                            <span class="p-price">₹${p.price.toLocaleString()}</span>
                            <span class="p-mrp">₹${p.mrp.toLocaleString()}</span>
                            <span class="p-discount">${Math.round((p.mrp-p.price)/p.mrp*100)}%</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // INTERACTION CORE
        function openProduct(id) {
            const p = PRODUCT_DB.find(x => x.id === id);
            document.getElementById('d-title').innerText = p.name;
            document.getElementById('d-price').innerText = p.price.toLocaleString();
            document.getElementById('d-mrp-val').innerText = p.mrp.toLocaleString();
            document.getElementById('d-pct').innerText = `-${Math.round((p.mrp-p.price)/p.mrp*100)}%`;
            document.getElementById('d-desc').innerText = p.desc;
            document.getElementById('detail-slider').innerHTML = `<img src="${p.images[0]}" class="slider-img">`;
            
            document.getElementById('product-detail-view').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeProduct() {
            document.getElementById('product-detail-view').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function showToast(msg) {
            const container = document.getElementById('srp-toast-container');
            const toast = document.createElement('div');
            toast.className = 'srp-toast';
            toast.innerHTML = `<i class="fas fa-circle-check"></i><span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 400); }, 3000);
        }

        async function addToCart() {
            showToast("Added to SRP Basket!");
            setTimeout(closeProduct, 600);
        }

        function checkAdminStatus() {
            if(currentUser && ADMIN_EMAILS.includes(currentUser.email)) {
                document.getElementById('srp-brand-trigger').innerHTML += '<span class="admin-badge">Admin</span>';
            }
        }

        document.getElementById('product-search').oninput = (e) => {
            searchQuery = e.target.value.toLowerCase();
            renderProducts();
        };

        initApp();
    </script>
</body>
</html>
