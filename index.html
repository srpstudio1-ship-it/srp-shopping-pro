<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>SRP SHOPPING | Home</title>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .product-slider { scroll-snap-type: x mandatory; }
        .product-slider img { scroll-snap-align: start; }
        #product-detail-view { display: none; }
    </style>
</head>
<body class="bg-gray-100 pb-20">

    <header class="sticky top-0 bg-[#0047AB] text-white p-3 z-50">
        <div class="flex justify-between items-center mb-2">
            <h1 class="text-xl font-bold" onclick="location.reload()">SRP SHOPPING</h1>
            <div class="flex gap-4 items-center">
                <i class="fas fa-search" onclick="toggleSearch()"></i>
                <i class="fas fa-filter" onclick="toggleFilters()"></i>
                <div class="bg-white/20 px-2 py-1 rounded text-xs">₹<span id="header-wallet">450</span></div>
            </div>
        </div>
        <div class="flex gap-4 overflow-x-auto no-scrollbar py-2 text-sm whitespace-nowrap border-t border-blue-400">
            <button onclick="filterCategory('all')" class="font-bold border-b-2 border-white">All</button>
            <button onclick="filterCategory('Electronics')">Electronics</button>
            <button onclick="filterCategory('Fashion')">Fashion</button>
            <button onclick="filterCategory('Mobiles')">Mobiles</button>
            <button onclick="filterCategory('Home')">Home</button>
        </div>
    </header>

    <main id="home-view" class="p-2">
        <div class="w-full h-32 bg-gradient-to-r from-blue-600 to-blue-400 rounded-lg mb-4 flex items-center justify-center text-white font-bold p-4">
            <div class="text-center">
                <p class="text-xs uppercase tracking-widest">SRP Exclusive</p>
                <h2 class="text-lg">MEGA SALE: UP TO 70% OFF</h2>
            </div>
        </div>

        <div id="product-grid" class="grid grid-cols-2 gap-2"></div>
    </main>

    <div id="product-detail-view" class="fixed inset-0 bg-white z-[60] overflow-y-auto">
        <nav class="p-4 flex items-center gap-4 border-b sticky top-0 bg-white">
            <button onclick="closeDetail()" class="fas fa-arrow-left text-xl"></button>
            <span class="font-bold truncate" id="detail-title-top">Product Details</span>
        </nav>

        <div class="flex overflow-x-auto product-slider no-scrollbar h-80 bg-gray-50">
            <img id="main-img-1" src="" class="w-full h-full object-contain flex-shrink-0">
            <img id="main-img-2" src="" class="w-full h-full object-contain flex-shrink-0">
        </div>

        <div class="p-4">
            <h2 id="detail-name" class="text-lg font-medium text-gray-800"></h2>
            <div class="flex items-center gap-2 my-2">
                <span id="detail-rating" class="bg-green-700 text-white text-[10px] px-2 py-0.5 rounded">4.5 ★</span>
                <span class="text-blue-600 text-xs">1,240 Ratings</span>
            </div>

            <hr class="my-4">

            <div class="mb-4">
                <div class="flex items-center gap-2">
                    <span id="detail-discount" class="text-red-600 text-2xl font-light">-50%</span>
                    <span class="text-2xl font-bold">₹<span id="detail-price"></span></span>
                </div>
                <p class="text-gray-500 text-sm">M.R.P.: <span class="line-through" id="detail-mrp"></span></p>
                <p class="text-green-700 font-bold text-sm">Inclusive of all taxes</p>
            </div>

            <div class="flex flex-col gap-4 mb-6">
                <div>
                    <p class="text-sm font-bold mb-2">Color</p>
                    <div class="flex gap-2">
                        <div class="w-8 h-8 rounded-full border-2 border-blue-600 bg-black"></div>
                        <div class="w-8 h-8 rounded-full border border-gray-300 bg-blue-500"></div>
                        <div class="w-8 h-8 rounded-full border border-gray-300 bg-gray-200"></div>
                    </div>
                </div>
                <div>
                    <p class="text-sm font-bold mb-2">Quantity</p>
                    <select class="w-full p-2 border rounded bg-gray-50">
                        <option>1</option><option>2</option><option>3</option>
                    </select>
                </div>
            </div>

            <p class="text-sm text-gray-600 mb-6"><i class="fas fa-truck mr-2"></i>Delivery will be in 7 to 15 days</p>

            <div class="flex flex-col gap-2 mb-8">
                <button onclick="addToCart()" class="w-full py-3 bg-yellow-400 rounded-full font-bold">Add to Cart</button>
                <button class="w-full py-3 bg-orange-500 text-white rounded-full font-bold">Buy Now</button>
            </div>

            <div>
                <h3 class="font-bold border-b pb-2 mb-2">Product Description</h3>
                <p id="detail-desc" class="text-sm text-gray-700 leading-relaxed"></p>
            </div>
        </div>
    </div>

    <nav class="fixed bottom-0 w-full h-16 bg-white border-t flex items-center justify-around z-50">
        <button class="flex flex-col items-center text-blue-700"><i class="fas fa-home"></i><span class="text-[10px]">Home</span></button>
        <button class="flex flex-col items-center text-gray-400"><i class="fas fa-wallet"></i><span class="text-[10px]">Wallet</span></button>
        <button class="flex flex-col items-center text-gray-400"><i class="fas fa-store"></i><span class="text-[10px]">Seller</span></button>
        <button class="flex flex-col items-center text-gray-400"><i class="fas fa-shopping-cart"></i><span class="text-[10px]">Cart</span></button>
        <button class="flex flex-col items-center text-blue-400"><i class="fas fa-robot"></i><span class="text-[10px]">AI</span></button>
    </nav>

    <script>
        // DATA: 20 Real-style Products
        const products = Array.from({ length: 20 }, (_, i) => ({
            id: i,
            name: `SRP Premium Product ${i + 1}`,
            category: i % 2 === 0 ? 'Electronics' : 'Fashion',
            price: 499 + (i * 100),
            mrp: 999 + (i * 100),
            discount: "50%",
            image: `https://picsum.photos/400/400?random=${i}`,
            desc: "This is a high-quality product curated by SRP SHOPPING. ".repeat(200) // Simulating long description
        }));

        function renderProducts(items) {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = items.map(p => `
                <div onclick="openDetail(${p.id})" class="bg-white p-2 rounded shadow-sm border border-gray-100">
                    <img src="${p.image}" class="w-full h-32 object-contain mb-2">
                    <h3 class="text-xs font-medium truncate">${p.name}</h3>
                    <div class="flex items-center gap-1 mt-1">
                        <span class="text-sm font-bold">₹${p.price}</span>
                        <span class="text-[8px] line-through text-gray-400">₹${p.mrp}</span>
                    </div>
                    <p class="text-[10px] text-green-600 font-bold">${p.discount} OFF</p>
                </div>
            `).join('');
        }

        function openDetail(id) {
            const p = products[id];
            document.getElementById('detail-name').innerText = p.name;
            document.getElementById('detail-price').innerText = p.price;
            document.getElementById('detail-mrp').innerText = p.mrp;
            document.getElementById('detail-discount').innerText = `-${p.discount}`;
            document.getElementById('detail-desc').innerText = p.desc;
            document.getElementById('main-img-1').src = p.image;
            document.getElementById('main-img-2').src = `https://picsum.photos/400/400?random=${id + 50}`;
            
            document.getElementById('product-detail-view').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closeDetail() {
            document.getElementById('product-detail-view').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function filterCategory(cat) {
            if(cat === 'all') renderProducts(products);
            else renderProducts(products.filter(p => p.category === cat));
        }

        function addToCart() {
            alert("Added to SRP Cart!");
        }

        // Initial Load
        renderProducts(products);
    </script>
</body>
</html>
