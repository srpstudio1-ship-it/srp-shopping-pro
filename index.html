function generateDescription(name){
let text = "";
for(let i=0;i<50;i++){

}

// ======================
// CART SYSTEM
// ======================
function addToCart(i){
let qty = document.getElementById("qty").value;
let item = productList[i];

cartItems.push({
    name:item.name,
    price:item.price,
    qty:parseInt(qty)
});

localStorage.setItem("cart", JSON.stringify(cartItems));
alert("Added to cart");

}

function cart(){
let html = "<h2>Your Cart</h2>";
let total = 0;

cartItems.forEach((item, index)=>{
    let sub = item.price * item.qty;
    total += sub;

    html += `
    <div>
        <h3>${item.name}</h3>
        <p>₹${item.price} x ${item.qty}</p>
        <p>Total: ₹${sub}</p>
        <button onclick="removeCart(${index})">Remove</button>
    </div>
    <hr>
    `;
});

html += `<h2>Total: ₹${total}</h2>`;
html += `<button onclick="checkout()">Checkout</button>`;
html += `<button onclick="reload()">Back</button>`;

document.getElementById("home").innerHTML = html;

}

function removeCart(i){
cartItems.splice(i,1);
localStorage.setItem("cart", JSON.stringify(cartItems));
cart();
}

// ==========================

function checkSellerApproval(){
sellerRequests.forEach((req)=>{

req.status = "approved"; // auto approve
sellers.push(req);
}
});

localStorage.setItem("sellers", JSON.stringify(sellers));

}

function uploadProduct(){
document.getElementById("home").innerHTML = `
<h2>Upload Product</h2>

<input id="pname" placeholder="Product Name"><br>
<input id="mrp" placeholder="MRP"><br>
<input id="price" placeholder="Discount Price"><br>
<input id="qty" placeholder="Quantity"><br>
<input id="cat" placeholder="Category"><br>
<textarea id="desc" placeholder="Description"></textarea><br>
<input type="file" id="img"><br>

<button onclick="saveProduct()">Submit</button>
<button onclick="openSellerPanel()">Back</button>
`;

}

function saveProduct(){
let file = document.getElementById("img").files[0];

let reader = new FileReader();
reader.onload = function(e){

    let product = {
        id:Date.now(),
        name:document.getElementById("pname").value,
        mrp:document.getElementById("mrp").value,
        price:document.getElementById("price").value,
        qty:document.getElementById("qty").value,
        cat:document.getElementById("cat").value,
        desc:document.getElementById("desc").value,
        img:e.target.result
    };

    sellerProducts.push(product);
    localStorage.setItem("sellerProducts", JSON.stringify(sellerProducts));

    alert("Product uploaded");
    openSellerPanel();
}

reader.readAsDataURL(file);

}
