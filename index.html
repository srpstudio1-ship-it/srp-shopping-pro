<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRP SHOPPING | Full System</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/js/all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root { --srp-blue: #0047AB; }
body { font-family: Arial; background: #f4f7f6; }
#auth-screen { background:black; display:flex; color:white }
.bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; }
#product-detail-view { display:none }
#cart-view,#profile-view,#orders-view{display:none;position:fixed;inset:0;background:#f4f7f6;z-index:100}
.dark{background:#111827;color:white}
</style>
</head>

<body class="pb-20">

<!-- ================= AUTH ================= -->
<section id="auth-screen" class="fixed inset-0 items-center justify-center">
<div class="bg-gray-900 p-8 rounded-xl w-80 text-white">

<h2 class="text-xl mb-4 text-center">SRP LOGIN</h2>

<input id="email" placeholder="Email" class="w-full p-2 mb-2 text-black">
<input id="password" type="password" placeholder="Password" class="w-full p-2 mb-2 text-black">

<button onclick="handleAuth()" class="w-full bg-blue-600 p-2 mb-2">Login / Signup</button>
<button onclick="googleLogin()" class="w-full bg-red-500 p-2">Google Login</button>

</div>
</section>

<!-- ================= MAIN ================= -->
<div id="main-storefront" style="display:none">

<header class="bg-blue-800 text-white p-3">
SRP SHOPPING
<button onclick="signOutUser()" class="float-right">Logout</button>
</header>

<div class="p-3">
<h2>Products</h2>
<div id="product-grid"></div>
</div>

</div>

<!-- ================= CART ================= -->
<div id="cart-view">
<h2>Cart</h2>
<div id="cart-items-container"></div>
<button onclick="processCheckout()">Checkout</button>
</div>

<!-- ================= PROFILE ================= -->
<div id="profile-view">
<h2>Profile</h2>
<button onclick="openOrders()">Orders</button>
</div>

<!-- ================= ORDERS ================= -->
<div id="orders-view">
<h2>Orders</h2>
<div id="orders-list"></div>
</div>

<script>

// ===== SUPABASE =====
const supabase = window.supabase.createClient(
"https://cmxlfxqtrguuzpqdgcxv.supabase.co",
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
);

// ===== AUTH =====
async function handleAuth(){
const email=emailEl().value;
const password=passEl().value;

let {error}=await supabase.auth.signInWithPassword({email,password});
if(error){
await supabase.auth.signUp({email,password});
}
}

async function googleLogin(){
await supabase.auth.signInWithOAuth({provider:"google"});
}

async function signOutUser(){
await supabase.auth.signOut();
}

function emailEl(){return document.getElementById("email")}
function passEl(){return document.getElementById("password")}

// ===== AUTH STATE =====
supabase.auth.onAuthStateChange((e,session)=>{
if(session){
authHide();
}else{
authShow();
}
});

function authHide(){
document.getElementById("auth-screen").style.display="none";
document.getElementById("main-storefront").style.display="block";
}

function authShow(){
document.getElementById("auth-screen").style.display="flex";
document.getElementById("main-storefront").style.display="none";
}

// ===== PRODUCTS =====
const products=Array.from({length:10},(_,i)=>({
id:i,name:"Product "+i,price:100+i*50
}));

function renderProducts(){
const grid=document.getElementById("product-grid");
grid.innerHTML=products.map(p=>`
<div onclick="addToCart(${p.id})" style="border:1px solid;padding:10px;margin:5px">
${p.name}<br>₹${p.price}
</div>
`).join("");
}

// ===== CART =====
let cart=[];

function addToCart(id){
const p=products[id];
cart.push(p);
alert("Added");
}

function processCheckout(){
alert("Order placed");
}

// ===== ORDERS =====
function openOrders(){
document.getElementById("orders-view").style.display="block";
}

// ===== INIT =====
renderProducts();

</script>

</body>
</html>
