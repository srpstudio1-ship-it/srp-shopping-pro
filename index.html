<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRP Shopping</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(to bottom,#e6f7ff,#ffffff);
color:#333;
overflow-x:hidden;
}

/* ================= HEADER ================= */
header{
position:sticky;
top:0;
background:white;
display:flex;
align-items:center;
justify-content:space-between;
padding:12px 20px;
box-shadow:0 4px 20px rgba(0,0,0,0.08);
z-index:999;
}

.logo{
font-size:24px;
font-weight:700;
color:#00aaff;
cursor:pointer;
transition:0.3s;
}

.logo:hover{
transform:scale(1.05);
}

.search{
flex:1;
margin:0 20px;
position:relative;
}

.search input{
width:100%;
padding:10px 40px 10px 15px;
border-radius:25px;
border:1px solid #ddd;
outline:none;
transition:0.3s;
}

.search input:focus{
border-color:#00aaff;
box-shadow:0 0 10px rgba(0,170,255,0.2);
}

.search-icon{
position:absolute;
right:15px;
top:50%;
transform:translateY(-50%);
color:#888;
}

.nav-links span{
margin-left:15px;
font-size:14px;
cursor:pointer;
transition:0.2s;
}

.nav-links span:hover{
color:#00aaff;
}

/* ================= BANNER ================= */
.banner{
display:flex;
overflow-x:auto;
scroll-behavior:smooth;
gap:15px;
padding:20px;
}

.banner::-webkit-scrollbar{
display:none;
}

.banner img{
height:180px;
width:320px;
border-radius:15px;
object-fit:cover;
box-shadow:0 6px 20px rgba(0,0,0,0.1);
transition:0.3s;
}

.banner img:hover{
transform:scale(1.05);
}

/* ================= CATEGORY ================= */
.categories{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
gap:15px;
padding:20px;
}

.category{
background:white;
border-radius:15px;
padding:15px;
text-align:center;
box-shadow:0 4px 10px rgba(0,0,0,0.05);
transition:0.3s;
cursor:pointer;
}

.category:hover{
transform:translateY(-5px);
box-shadow:0 8px 20px rgba(0,0,0,0.1);
}

.category img{
width:50px;
height:50px;
margin-bottom:8px;
}

/* ================= PRODUCTS ================= */
.products{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:20px;
padding:20px;
}

.product{
background:white;
border-radius:15px;
padding:15px;
box-shadow:0 6px 15px rgba(0,0,0,0.08);
transition:0.3s;
cursor:pointer;
position:relative;
overflow:hidden;
}

.product:hover{
transform:translateY(-8px);
}

.product img{
width:100%;
height:180px;
object-fit:cover;
border-radius:10px;
}

.product h4{
margin:10px 0 5px;
}

.price{
color:#00aaff;
font-weight:600;
}

.qty{
font-size:13px;
color:#777;
}

/* badge */
.badge{
position:absolute;
top:10px;
left:10px;
background:#00aaff;
color:white;
padding:3px 8px;
font-size:12px;
border-radius:10px;
}

/* ================= FOOTER NAV ================= */
.bottom-nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:white;
display:flex;
justify-content:space-around;
padding:10px 0;
box-shadow:0 -4px 20px rgba(0,0,0,0.1);
z-index:999;
}

.bottom-nav div{
text-align:center;
font-size:12px;
cursor:pointer;
transition:0.2s;
}

.bottom-nav div:hover{
color:#00aaff;
}

/* ================= ANIMATIONS ================= */
@keyframes fadeIn{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;transform:translateY(0);}
}

.product,.category{
animation:fadeIn 0.6s ease;
}

</style>
</head>

<body>

<header>
<div class="logo" onclick="openAdmin()">SRP Shopping</div>

<div class="search">
<input type="text" placeholder="Search products...">
<span class="search-icon">🔍</span>
</div>

<div class="nav-links">
<span>Privacy</span>
<span>About</span>
<span>Settings</span>
</div>
</header>

<!-- ================= BANNERS ================= -->
<div class="banner">
<img src="https://picsum.photos/600/300?1">
<img src="https://picsum.photos/600/300?2">
<img src="https://picsum.photos/600/300?3">
<img src="https://picsum.photos/600/300?4">
<img src="https://picsum.photos/600/300?5">
<img src="https://picsum.photos/600/300?6">
<img src="https://picsum.photos/600/300?7">
</div>

<!-- ================= CATEGORIES ================= -->
<div class="categories">

<script>
let catList=[
"Electronics","Fashion","Mobiles","Shoes","Home","Beauty",
"Toys","Books","Sports","Fitness","Grocery","Furniture",
"Watches","Gaming","Accessories"
];

catList.forEach(c=>{
document.write(`
<div class="category">
<img src="https://picsum.photos/50?random=${Math.random()}">
<p>${c}</p>
</div>
`);
});
</script>

</div>

<!-- ================= PRODUCTS ================= -->
<div class="products" id="products"></div>

<!-- ================= BOTTOM NAV ================= -->
<div class="bottom-nav">
<div onclick="location.href='index.html'">Home</div>
<div onclick="openLogin()">Account</div>
<div onclick="openCart()">Cart</div>
<div onclick="openAI()">Subh AI</div>
<div onclick="openSeller()">Seller</div>
</div>

<script>

/* ================= ADMIN ================= */
function openAdmin(){
let pass=prompt("Enter Admin Password:");
if(pass==="admin123"){
alert("Welcome Admin");
}else{
alert("Wrong Password");
}
}

/* ================= NAVIGATION ================= */
function openLogin(){ location.href="login.html"; }
function openCart(){ location.href="cart.html"; }
function openAI(){ location.href="ai.html"; }
function openSeller(){ location.href="dashboard.html"; }

/* ================= PRODUCTS ================= */
let productsDiv=document.getElementById("products");

let productData=[];

for(let i=1;i<=20;i++){
productData.push({
name:"Product "+i,
price:Math.floor(Math.random()*5000)+199,
qty:Math.floor(Math.random()*50)+1,
img:`https://picsum.photos/300?random=${i}`
});
}

productData.forEach(p=>{
productsDiv.innerHTML+=`
<div class="product" onclick="openProduct()">
<span class="badge">Hot</span>
<img src="${p.img}">
<h4>${p.name}</h4>
<p class="price">₹${p.price}</p>
<p class="qty">Qty: ${p.qty}</p>
</div>
`;
});

/* ================= PRODUCT NAV ================= */
function openProduct(){
window.location.href="product.html";
}

</script>

</body>
</html>
