<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRP SHOPPING | Pro Marketplace</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================================================
           SRP SHOPPING - GLOBAL DESIGN SYSTEM (PREMIUM BLUE & WHITE)
           ========================================================================== 
        */
        :root {
            /* Color Palette */
            --srp-blue-deep: #001C30;
            --srp-blue-primary: #176B87;
            --srp-blue-light: #64CCC5;
            --srp-blue-ultra: #DAFFFB;
            --srp-white: #FFFFFF;
            --srp-gray-50: #F8FAFC;
            --srp-gray-100: #F1F5F9;
            --srp-gray-400: #94A3B8;
            --srp-text-dark: #0F172A;
            --srp-text-muted: #475569;
            --srp-danger: #FF4D4D;
            --srp-success: #00D26A;

            /* Shadows */
            --shadow-soft: 0 4px 20px rgba(23, 107, 135, 0.08);
            --shadow-strong: 0 10px 30px rgba(0, 28, 48, 0.15);
            --shadow-neon: 0 0 15px rgba(100, 204, 197, 0.4);

            /* Layout */
            --top-nav-height: 75px;
            --bottom-nav-height: 70px;
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 28px;
            --container-max: 1200px;
            --transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--srp-gray-50);
            color: var(--srp-text-dark);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ==========================================================================
           AUTHENTICATION LAYER (LOGIN & SIGNUP)
           ========================================================================== 
        */
        #auth-gate {
            position: fixed;
            inset: 0;
            background: var(--srp-white);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 450px;
            background: var(--srp-white);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: var(--shadow-strong);
            border: 1px solid var(--srp-gray-100);
            animation: authFadeIn 0.8s ease-out;
        }

        @keyframes authFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            color: var(--srp-blue-deep);
            letter-spacing: -1px;
        }

        .auth-logo span {
            color: var(--srp-blue-primary);
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--srp-text-dark);
        }

        .form-group input {
            width: 100%;
            height: 55px;
            background: var(--srp-gray-100);
            border: 2px solid transparent;
            border-radius: var(--radius-md);
            padding: 0 20px;
            font-size: 1rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .form-group input:focus {
            background: var(--srp-white);
            border-color: var(--srp-blue-primary);
            box-shadow: var(--shadow-neon);
            outline: none;
        }

        .btn-auth-main {
            width: 100%;
            height: 55px;
            background: var(--srp-blue-deep);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 28, 48, 0.3);
        }

        .btn-auth-main:hover {
            transform: translateY(-2px);
            background: var(--srp-blue-primary);
        }

        .google-btn-wrapper {
            margin-top: 25px;
            display: flex;
            justify-content: center;
        }

        .auth-switch {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--srp-text-muted);
        }

        .auth-switch span {
            color: var(--srp-blue-primary);
            font-weight: 800;
            cursor: pointer;
        }

        /* ==========================================================================
           TOP NAVIGATION BAR (DESKTOP & MOBILE)
           ========================================================================== 
        */
        .header-main {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--top-nav-height);
            background: var(--srp-white);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            z-index: 999;
            box-shadow: var(--shadow-soft);
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .brand-btn {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 1.4rem;
            color: var(--srp-blue-deep);
            cursor: pointer;
            background: none;
            border: none;
            display: flex;
            align-items: center;
        }

        .search-wrapper {
            flex: 0 1 500px;
            margin: 0 20px;
            position: relative;
        }

        .search-wrapper input {
            width: 100%;
            height: 45px;
            background: var(--srp-gray-100);
            border-radius: var(--radius-sm);
            border: 1px solid var(--srp-gray-100);
            padding: 0 45px 0 20px;
            font-size: 0.9rem;
        }

        .search-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--srp-text-muted);
        }

        .top-right-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .policy-btn {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--srp-blue-primary);
            text-decoration: none;
            text-transform: uppercase;
        }

        .wallet-display {
            background: var(--srp-blue-ultra);
            padding: 8px 15px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            color: var(--srp-blue-deep);
        }

        /* ==========================================================================
           BOTTOM NAVIGATION BAR (6 WORKING BUTTONS)
           ========================================================================== 
        */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: var(--bottom-nav-height);
            background: var(--srp-white);
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            box-shadow: 0 -5px 25px rgba(0,0,0,0.05);
            z-index: 999;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            color: var(--srp-text-muted);
            cursor: pointer;
            transition: var(--transition);
            border: none;
            background: none;
        }

        .nav-item i {
            font-size: 1.3rem;
        }

        .nav-item span {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        .nav-item.active {
            color: var(--srp-blue-primary);
        }

        .nav-ai-btn {
            color: var(--srp-blue-primary);
            position: relative;
        }

        .nav-ai-btn i {
            font-size: 1.5rem;
            filter: drop-shadow(var(--shadow-neon));
        }

        /* ==========================================================================
           MODALS & OVERLAYS
           ========================================================================== 
        */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 28, 48, 0.8);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--srp-white);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            position: relative;
        }
    </style>
</head>
<body>

    <div id="auth-gate">
        <div class="auth-container" id="login-container">
            <div class="auth-logo">
                <h1>SRP<span>SHOPPING</span></h1>
                <p>Premium Marketplace Experience</p>
            </div>

            <form id="srp-login-form">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email" placeholder="example@srp.com" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-pass" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-auth-main">SIGN IN TO ACCOUNT</button>
            </form>

            <div class="google-btn-wrapper">
                <div id="google-login-btn"></div>
            </div>

            <div class="auth-switch">
                New to SRP? <span onclick="SRPAuth.toggleAuth('signup')">Create Pro Account</span>
            </div>
        </div>

        <div class="auth-container" id="signup-container" style="display: none;">
            <div class="auth-logo">
                <h1>SRP<span>SHOPPING</span></h1>
                <p>Join our Multi-vendor platform</p>
            </div>
            <form id="srp-signup-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-name" placeholder="Subhash Rajpurohit" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="reg-email" placeholder="srpstudio1@gmail.com" required>
                </div>
                <div class="form-group">
                    <label>Create Password</label>
                    <input type="password" id="reg-pass" placeholder="Minimum 8 characters" required>
                </div>
                <button type="submit" class="btn-auth-main">CREATE ACCOUNT</button>
            </form>
            <div class="auth-switch">
                Already have an account? <span onclick="SRPAuth.toggleAuth('login')">Log In</span>
            </div>
        </div>
    </div>

    <header class="header-main" id="main-header" style="display: none;">
        <div class="brand-container">
            <button class="brand-btn" id="srp-logo-trigger" onclick="location.reload()">
                SRP SHOPPING
            </button>
        </div>

        <div class="search-wrapper">
            <input type="text" placeholder="Search 50,000+ products..." id="srp-global-search">
            <span class="search-icon">🔍</span>
        </div>

        <div class="top-right-actions">
            <a href="#" class="policy-btn">Privacy Policy</a>
            <div class="wallet-display">
                <span>👛</span> ₹<span id="top-wallet-amount">0.00</span>
            </div>
        </div>
    </header>

    <div id="admin-lock" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom:20px; color:var(--srp-blue-deep)">Admin Access Required</h2>
            <div class="form-group">
                <input type="password" id="admin-key" placeholder="Enter Secure Admin Key">
            </div>
            <button class="btn-auth-main" onclick="SRPAdmin.verify()">UNLOCK PANEL</button>
            <button style="margin-top:10px; width:100%; padding:10px; border:none; background:none; font-weight:700; color:var(--srp-danger)" onclick="document.getElementById('admin-lock').style.display='none'">CANCEL</button>
        </div>
    </div>

    <main id="app-content" style="display: none; padding-top: 90px; padding-bottom: 100px;">
        </main>

    <nav class="bottom-nav" id="main-nav" style="display: none;">
        <button class="nav-item active" onclick="SRPRoute.go('home')">
            <i>🏠</i>
            <span>Home</span>
        </button>
        <button class="nav-item" onclick="SRPRoute.go('profile')">
            <i>👤</i>
            <span>Account</span>
        </button>
        <button class="nav-item" onclick="SRPRoute.go('wallet')">
            <i>👛</i>
            <span>Wallet</span>
        </button>
        <button class="nav-item" onclick="SRPRoute.go('seller')">
            <i>🏬</i>
            <span>Dashboard</span>
        </button>
        <button class="nav-item" onclick="SRPRoute.go('cart')">
            <i>🛒</i>
            <span>Cart</span>
        </button>
        <button class="nav-item nav-ai-btn" onclick="SRPRoute.go('ai')">
            <i>🤖</i>
            <span>AI Bot</span>
        </button>
    </nav>

    <script>
        /* ==========================================================================
           SRP SHOPPING ENGINE - PART 1 LOGIC
           ========================================================================== 
        */

        const SRPAuth = {
            currentUser: null,
            admins: ["Srpstudio1@gmail.com", "subhashrajpurohit10@gmail.com"],

            init() {
                // Initialize Google Login
                google.accounts.id.initialize({
                    client_id: "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com",
                    callback: this.handleGoogleResponse
                });
                google.accounts.id.renderButton(
                    document.getElementById("google-login-btn"),
                    { theme: "outline", size: "large", width: "350" }
                );

                this.bindForms();
            },

            toggleAuth(view) {
                const login = document.getElementById('login-container');
                const signup = document.getElementById('signup-container');
                if(view === 'signup') {
                    login.style.display = 'none';
                    signup.style.display = 'block';
                } else {
                    login.style.display = 'block';
                    signup.style.display = 'none';
                }
            },

            bindForms() {
                document.getElementById('srp-login-form').onsubmit = (e) => {
                    e.preventDefault();
                    this.loginSuccess({ email: document.getElementById('login-email').value });
                };

                document.getElementById('srp-signup-form').onsubmit = (e) => {
                    e.preventDefault();
                    alert('Account Created Successfully! Please Sign In.');
                    this.toggleAuth('login');
                };
            },

            handleGoogleResponse(response) {
                console.log("Encoded JWT ID token: " + response.credential);
                SRPAuth.loginSuccess({ email: "google-user@gmail.com" });
            },

            loginSuccess(user) {
                this.currentUser = user;
                document.getElementById('auth-gate').style.display = 'none';
                document.getElementById('main-header').style.display = 'flex';
                document.getElementById('main-nav').style.display = 'grid';
                document.getElementById('app-content').style.display = 'block';
                
                // Initialize Wallet for UI
                document.getElementById('top-wallet-amount').innerText = "15,450.00";
                
                alert(`Welcome, ${user.email}`);
            }
        };

        const SRPAdmin = {
            openPanel() {
                if(SRPAuth.admins.includes(SRPAuth.currentUser.email)) {
                    document.getElementById('admin-lock').style.display = 'flex';
                } else {
                    alert("Unauthorized Access. Admin credentials required.");
                    location.reload();
                }
            },

            verify() {
                const key = document.getElementById('admin-key').value;
                if(key === "SRP786") {
                    alert("Admin Panel Unlocked. Redirecting to Management Console...");
                    // Logic for admin panel view will be in Part 5
                } else {
                    alert("Invalid Admin Security Key.");
                }
            }
        };

        const SRPRoute = {
            go(page) {
                const items = document.querySelectorAll('.nav-item');
                items.forEach(i => i.classList.remove('active'));
                event.currentTarget.classList.add('active');
                console.log(`Navigating to ${page}`);
                // Dynamic page rendering logic will be in Part 2
            }
        };

        // Initialize App
        window.onload = () => {
            SRPAuth.init();
            
            // Special trigger for SRP SHOPPING button
            const logo = document.getElementById('srp-logo-trigger');
            logo.addEventListener('contextmenu', (e) => {
                e.preventDefault(); // Right-click or long press
                SRPAdmin.openPanel();
            });
        };
    </script>
</body>
</html>
