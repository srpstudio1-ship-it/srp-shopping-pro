<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRP SHOPPING</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>

/* ================= GLOBAL ================= */
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}
body{background:#f5f7fb}

/* ================= HEADER ================= */
.header{
position:fixed;top:0;width:100%;background:white;
display:flex;justify-content:space-between;align-items:center;
padding:10px 15px;box-shadow:0 4px 10px rgba(0,0,0,0.1);
z-index:1000;
}

.logo{font-weight:800;color:#004aad;cursor:pointer}

.search{flex:1;margin:0 10px}
.search input{
width:100%;padding:8px;border-radius:10px;border:1px solid #ccc;
}

.top-actions{display:flex;gap:10px;align-items:center}
.wallet{color:#004aad;font-weight:600}
.btn{cursor:pointer;font-size:13px}

/* ================= BOTTOM NAV ================= */
.nav{
position:fixed;bottom:0;width:100%;background:white;
display:flex;justify-content:space-around;
padding:10px;border-top:1px solid #ddd;
}

.nav div{cursor:pointer;font-size:12px}

/* ================= LOGIN ================= */
#loginPage{
height:100vh;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#004aad,#00d4ff);
color:white;
}

.login-box{
background:rgba(255,255,255,0.1);
padding:20px;border-radius:20px;width:300px;
backdrop-filter:blur(10px);
}

input{
width:100%;padding:10px;margin:5px 0;border-radius:10px;border:none;
}

button{
width:100%;padding:10px;margin-top:10px;
border:none;border-radius:10px;
background:#004aad;color:white;font-weight:600;
cursor:pointer;
}

/* ================= HOME ================= */
#homePage{display:none;padding-top:70px;padding-bottom:70px}

.banner{
margin:10px;background:#004aad;color:white;
padding:20px;border-radius:15px;
}

.grid{
display:grid;grid-template-columns:repeat(2,1fr);
gap:10px;padding:10px;
}

.card{
background:white;padding:10px;border-radius:10px;
cursor:pointer;
}

.card img{width:100%;height:120px;object-fit:contain}

.price{color:#004aad;font-weight:700}

/* ================= OVERLAY ================= */
#detail{
position:fixed;top:0;left:0;width:100%;height:100%;
background:white;display:none;overflow:auto;z-index:2000;
padding:15px;
}

/* ================= TOAST ================= */
.toast{
position:fixed;bottom:80px;left:50%;
transform:translateX(-50%);
background:black;color:white;padding:10px 20px;border-radius:20px;
}

</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage">
<div class="login-box">
<h2>SRP SHOPPING</h2>

<input id="name" placeholder="Full Name">
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">

<button onclick="signup()">Signup</button>
<button onclick="login()">Login</button>
<button onclick="googleLogin()">Login with Google</button>

</div>
</div>

<!-- HOME PAGE -->
<div id="homePage">

<div class="header">
<div class="logo" onclick="reload()">SRP SHOPPING</div>

<div class="search">
<input id="search" placeholder="Search">
</div>

<div class="top-actions">
<div class="wallet">₹<span id="wallet">0</span></div>
<div class="btn" onclick="logout()">Logout</div>
</div>
</div>

<div class="banner">🔥 Mega Sale</div>
<div class="banner">⚡ 50% OFF</div>
<div class="banner">🎯 Best Deals</div>

<div class="grid" id="grid"></div>

</div>

<!-- DETAIL -->
<div id="detail"></div>

<!-- NAV -->
<div class="nav">
<div onclick="showHome()">Home</div>
<div onclick="alert('Profile')">Profile</div>
<div onclick="alert('Wallet')">Wallet</div>
<div onclick="alert('Seller')">Seller</div>
<div onclick="alert('Cart')">Cart</div>
<div onclick="alert('AI')">AI</div>
</div>

<script>

/* ================= SUPABASE ================= */
const supabase = window.supabase.createClient(
"https://cmxlfxqtrguuzpqdgcxv.supabase.co",
"YOUR_SUPABASE_ANON_KEY"
);

/* ================= PRODUCTS ================= */
const products = [
{id:1,name:"iPhone 13",price:52000,img:"https://m.media-amazon.com/images/I/61-r9zOKBCL._SX679_.jpg"},
{id:2,name:"Laptop",price:65000,img:"https://m.media-amazon.com/images/I/71jG+e7roXL._SX679_.jpg"},
{id:3,name:"Headphones",price:1999,img:"https://m.media-amazon.com/images/I/61CGHv6kmWL._SX679_.jpg"},
{id:4,name:"Shoes",price:2499,img:"https://m.media-amazon.com/images/I/61utX8kBDlL._UX695_.jpg"},
{id:5,name:"Watch",price:2999,img:"https://m.media-amazon.com/images/I/61ZjlBOp+rL._SX679_.jpg"},
{id:6,name:"Keyboard",price:1200,img:"https://m.media-amazon.com/images/I/71Miv62KdtL._SX679_.jpg"},
{id:7,name:"Mouse",price:800,img:"https://m.media-amazon.com/images/I/61LtuGzXeaL._SX679_.jpg"},
{id:8,name:"TV",price:30000,img:"https://m.media-amazon.com/images/I/71fV9H2u8FL._SX679_.jpg"},
{id:9,name:"Bag",price:1500,img:"https://m.media-amazon.com/images/I/71QKQ9mwV7L._UY695_.jpg"},
{id:10,name:"Speaker",price:3500,img:"https://m.media-amazon.com/images/I/81W3rF4c3ML._SX679_.jpg"},
{id:11,name:"Tablet",price:18000,img:"https://m.media-amazon.com/images/I/61NGnpjoRDL._SX679_.jpg"},
{id:12,name:"Camera",price:45000,img:"https://m.media-amazon.com/images/I/71dEY4Neo3L._SX679_.jpg"},
{id:13,name:"Drone",price:25000,img:"https://m.media-amazon.com/images/I/71k6Z+K3XkL._SX679_.jpg"},
{id:14,name:"Gaming Chair",price:12000,img:"https://m.media-amazon.com/images/I/71qQ+Jb8GIL._SX679_.jpg"},
{id:15,name:"Monitor",price:15000,img:"https://m.media-amazon.com/images/I/71nP7QpY1VL._SX679_.jpg"},
{id:16,name:"SSD",price:5000,img:"https://m.media-amazon.com/images/I/71jG+e7roXL._SX679_.jpg"},
{id:17,name:"Powerbank",price:1500,img:"https://m.media-amazon.com/images/I/71lVwl3q-kL._SX679_.jpg"},
{id:18,name:"Charger",price:800,img:"https://m.media-amazon.com/images/I/61mIUCd-37L._SX679_.jpg"},
{id:19,name:"Mic",price:2000,img:"https://m.media-amazon.com/images/I/61UxfXTUyvL._SX679_.jpg"},
{id:20,name:"Tripod",price:1200,img:"https://m.media-amazon.com/images/I/71Uj9k5s3sL._SX679_.jpg"}
];

/* ================= AUTH ================= */
async function signup(){
let email=emailEl.value;
let pass=passEl.value;
let name=nameEl.value;

await supabase.auth.signUp({
email,password:pass,
options:{data:{full_name:name}}
});
toast("Signup success");
}

async function login(){
let email=emailEl.value;
let pass=passEl.value;

let {error}=await supabase.auth.signInWithPassword({email,password:pass});
if(error) toast(error.message);
}

async function googleLogin(){
await supabase.auth.signInWithOAuth({
provider:"google",
options:{redirectTo:location.href}
});
}

async function logout(){
await supabase.auth.signOut();
location.reload();
}

/* ================= SESSION ================= */
supabase.auth.onAuthStateChange((e,session)=>{
if(session){
showHome();
}
});

/* ================= UI ================= */
function showHome(){
loginPage.style.display="none";
homePage.style.display="block";
render();
}

function reload(){location.reload()}

/* ================= RENDER ================= */
function render(){
let html="";
products.forEach(p=>{
html+=`
<div class="card" onclick="openDetail(${p.id})">
<img src="${p.img}">
<div>${p.name}</div>
<div class="price">₹${p.price}</div>
</div>
`;
});
grid.innerHTML=html;
}

/* ================= DETAIL ================= */
function openDetail(id){
let p=products.find(x=>x.id==id);
detail.style.display="block";

detail.innerHTML=`
<button onclick="detail.style.display='none'">Back</button>
<h2>${p.name}</h2>
<img src="${p.img}" style="width:100%">
<p>₹${p.price}</p>

<select><option>Color</option><option>Black</option></select>
<input type="number" value="1">

<button onclick="addCart(${p.id})">Add to Cart</button>
<button onclick="toast('Buying...')">Buy Now</button>

<p>Delivery in 7-15 days</p>
<p>⭐⭐⭐⭐☆</p>
`;
}

/* ================= CART ================= */
function addCart(id){
let cart=JSON.parse(localStorage.getItem("cart"))||[];
cart.push(id);
localStorage.setItem("cart",JSON.stringify(cart));
toast("Added to cart");
}

/* ================= TOAST ================= */
function toast(msg){
let t=document.createElement("div");
t.className="toast";
t.innerText=msg;
document.body.appendChild(t);
setTimeout(()=>t.remove(),2000);
}

/* ================= ELEMENTS ================= */
const emailEl=document.getElementById("email");
const passEl=document.getElementById("pass");
const nameEl=document.getElementById("name");

</script>

</body>
</html>
