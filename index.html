    } else {
        location.reload();
    }
}

// 4. UI ENGINE (PRODUCT RENDERING)
function initApp() {
    renderProducts(products);
    document.getElementById('walletAmount').innerText = `₹${walletBalance}.00`;
}

function renderProducts(items) {
    const grid = document.getElementById('mainProductGrid');
    grid.innerHTML = items.map(p => `
        <div class="product-card bg-white p-3 rounded-[25px] shadow-sm border border-gray-50 flex flex-col group cursor-pointer" onclick="openProductDetail(${p.id})">
            <div class="relative overflow-hidden rounded-[20px] h-40 mb-3 bg-gray-50">
                <img src="${p.img}" class="w-full h-full object-cover group-hover:scale-110">
                <div class="absolute top-2 right-2 bg-white/90 backdrop-blur-md px-2 py-1 rounded-lg text-[9px] font-black text-blue-600">
                    -${Math.round((p.mrp-p.price)/p.mrp*100)}%
                </div>
            </div>
            <h3 class="text-xs font-bold truncate">${p.name}</h3>
            <div class="flex items-center gap-1 my-1">
                <span class="text-xs font-black text-blue-700">₹${p.price.toLocaleString()}</span>
                <span class="text-[9px] text-gray-400 line-through">₹${p.mrp.toLocaleString()}</span>
            </div>
            <div class="flex items-center gap-1 text-[9px] text-yellow-500 mb-3">
                <i class="fa fa-star"></i><span class="text-gray-500 font-bold">${p.rating} (${p.reviews})</span>
            </div>
            <button class="w-full bg-blue-50 text-blue-700 py-2 rounded-xl text-[10px] font-black hover:bg-blue-600 hover:text-white transition">ADD TO CART</button>
        </div>
    `).join('');
}

// 5. AMAZON-STYLE PRODUCT DETAIL VIEW

        <div class="sticky top-0 bg-white z-[2100] p-4 flex items-center justify-between border-b">
            <button onclick="closeProduct()" class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center"><i class="fa fa-arrow-left"></i></button>
            <h4 class="font-bold text-sm">Product Detail</h4>
            <div class="flex gap-4"><i class="fa fa-share-alt"></i><i class="fa fa-heart"></i></div>
        </div>
        
        <div class="image-slider no-scrollbar">
            <img src="${p.img}">
            <img src="https://images.unsplash.com/photo-1605170439002-90f450c99706?w=500">
            <img src="https://images.unsplash.com/photo-1546868871-7041f2a55e12?w=500">
        </div>

        <div class="p-6">
            <div class="flex justify-between items-start mb-2">
                <span class="text-blue-600 font-bold text-xs">Brand: SRP Exclusive</span>
                <div class="flex text-yellow-400 text-xs"><i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star"></i><i class="fa fa-star"></i></div>
            </div>
            <h1 class="text-2xl font-bold text-gray-800 mb-4">${p.name}</h1>
            
            <div class="flex items-baseline gap-2 mb-6">
                <span class="text-3xl font-black text-blue-700">₹${p.price.toLocaleString()}</span>
                <span class="text-gray-400 line-through">M.R.P: ₹${p.mrp.toLocaleString()}</span>
                <span class="text-green-600 font-bold">(${Math.round((p.mrp-p.price)/p.mrp*100)}% OFF)</span>
            </div>

            <div class="mb-6">
                <p class="text-xs font-bold mb-3">SELECT COLOR</p>
                <div class="flex gap-3">
                    ${p.colors.map(c => `<button class="px-4 py-2 border rounded-xl text-[10px] font-bold">${c}</button>`).join('')}
                </div>
            </div>

            <div class="mb-6">
                <p class="text-xs font-bold mb-3">QUANTITY</p>
                <select class="w-full p-4 bg-gray-50 border-none rounded-2xl outline-none font-bold">
                    <option>1</option><option>2</option><option>3</option><option>4</option>
                </select>
            </div>

            <div class="grid grid-cols-2 gap-4 mb-8">
                <button onclick="addToCart(${p.id})" class="bg-[#004aad] text-white py-4 rounded-2xl font-black shadow-lg shadow-blue-100 active:scale-95">ADD TO CART</button>
                <button class="bg-yellow-400 text-blue-900 py-4 rounded-2xl font-black shadow-lg shadow-yellow-100 active:scale-95">BUY NOW</button>
            </div>

            <div class="p-4 bg-blue-50 rounded-2xl mb-8 flex items-center gap-3">
                <i class="fa fa-truck text-blue-700"></i>
                <p class="text-xs font-bold text-blue-900">Delivery in 7 to 15 days at your location</p>
            </div>

            <div class="space-y-4">
                <h3 class="font-black text-lg underline decoration-blue-500">Product Description</h3>
                <p class="text-gray-500 text-xs leading-loose font-medium">
                    ${p.desc.repeat(20)} </p>
            </div>
        </div>
    `;
    document.getElementById('productOverlay').classList.remove('hidden');
    document.body.style.overflow = 'hidden';
}

function closeProduct() {
    document.getElementById('productOverlay').classList.add('hidden');
    document.body.style.overflow = 'auto';
}

// 6. UTILITY FUNCTIONS
function notify(type, msg) {
    Swal.fire({
        toast: true,
        position: 'top-end',
        icon: type,
        title: msg,
        showConfirmButton: false,
        timer: 2000
    });
}

function addToCart(id) {
    cart.push(id);
    document.getElementById('cartBadge').classList.remove('hidden');
    document.getElementById('cartBadge').innerText = cart.length;
    notify('success', 'Product added to your cart!');
    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
}

function filterProducts() {
    const q = document.getElementById('productSearch').value.toLowerCase();
    const filtered = products.filter(p => p.name.toLowerCase().includes(q));
    renderProducts(filtered);
}

function setCategory(cat) {
    // Reset buttons
    const btns = document.querySelectorAll('#categoryContainer button');
    btns.forEach(b => {
        b.classList.remove('bg-blue-600', 'text-white', 'shadow-lg');
        b.classList.add('bg-white', 'text-gray-500');
    });
    event.target.classList.add('bg-blue-600', 'text-white', 'shadow-lg');
    
    if(cat === 'All') renderProducts(products);
    else renderProducts(products.filter(p => p.cat === cat));
}

function closeAdmin() {
    document.getElementById('adminPanel').classList.add('hidden');
}

function showAuthMode(mode) {
    if(mode === 'login') {
        document.getElementById('loginForm').classList.remove('hidden');
        document.getElementById('signupForm').classList.add('hidden');
        document.getElementById('loginTabBtn').classList.add('bg-white', 'shadow-sm', 'text-blue-700');
        document.getElementById('signupTabBtn').classList.remove('bg-white', 'shadow-sm', 'text-blue-700');
    } else {
        document.getElementById('signupForm').classList.remove('hidden');
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('signupTabBtn').classList.add('bg-white', 'shadow-sm', 'text-blue-700');
        document.getElementById('loginTabBtn').classList.remove('bg-white', 'shadow-sm', 'text-blue-700');
    }
}
</script>
