<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Authentication | SRP Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-morphism {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(229, 231, 235, 1);
        }
        .loader {
            border-top-color: #3B82F6;
            animation: spinner 1.5s linear infinite;
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

<script>
    // --- PART 1: CONFIGURATION ---
    const SUPABASE_URL = "https://cmxlfxqtrguuzpqdgcxv.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNteGxmeHF0cmd1dXpwcWRnY3h2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MzE0NDYsImV4cCI6MjA5MDAwNzQ0Nn0.Hl0S5yJnJEqvrxXSFt_YMjrKUKerNjUHb2ZvI7LfOC0";
    
    // Initialize the Supabase Client
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Global State Management
    let isSignUpMode = false;

    /**
     * Helper to show notifications
     */
    function notify(message, type = 'error') {
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toast-message');
        toast.className = `fixed bottom-5 right-5 px-6 py-3 rounded-lg text-white transition-all duration-300 transform translate-y-0 ${type === 'error' ? 'bg-red-600' : 'bg-green-600'}`;
        toastMsg.innerText = message;
        
        setTimeout(() => {
            toast.className = 'fixed bottom-5 right-5 px-6 py-3 rounded-lg text-white transition-all duration-300 transform translate-y-20 opacity-0';
        }, 4000);
    }
</script>
<div class="max-w-md w-full glass-morphism rounded-2xl shadow-xl p-8 transition-all duration-500">
    <div class="text-center mb-8">
        <h1 id="auth-title" class="text-2xl font-bold text-gray-800">Welcome Back</h1>
        <p id="auth-subtitle" class="text-gray-500 mt-2 text-sm">Please enter your details to sign in</p>
    </div>

    <div class="space-y-4 mb-6">
        <button onclick="handleGoogleLogin()" class="w-full flex items-center justify-center gap-3 bg-white border border-gray-300 text-gray-700 py-2.5 rounded-lg font-medium hover:bg-gray-50 transition-colors shadow-sm">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#EA4335" d="M12 5c1.62 0 3.07.56 4.21 1.64l3.15-3.15C17.45 1.68 14.91 1 12 1 7.73 1 4.11 3.59 2.56 7.21l3.39 2.64C6.76 7.23 9.17 5 12 5z"/>
                <path fill="#4285F4" d="M23.49 12.27c0-.79-.07-1.54-.19-2.27H12v4.51h6.47c-.29 1.48-1.14 2.73-2.4 3.58l3.71 2.88c2.17-2 3.71-4.93 3.71-8.7z"/>
                <path fill="#34A853" d="M5.95 14.65c-.21-.64-.33-1.32-.33-2s.12-1.36.33-2l-3.39-2.64C1.03 9.43.5 10.66.5 12s.53 2.57 2.06 4l3.39-2.64z"/>
                <path fill="#FBBC05" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.71-2.88c-1.03.69-2.35 1.1-3.57 1.1-2.83 0-5.24-2.23-6.09-4.86l-3.39 2.64C4.11 20.41 7.73 23 12 23z"/>
            </svg>
            Continue with Google
        </button>
    </div>

    <div class="relative flex py-3 items-center">
        <div class="flex-grow border-t border-gray-200"></div>
        <span class="flex-shrink mx-4 text-gray-400 text-xs uppercase tracking-widest">Or with email</span>
        <div class="flex-grow border-t border-gray-200"></div>
    </div>

    <form id="auth-form" class="space-y-5">
        <div>
            <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
            <input type="email" id="email" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all" placeholder="name@company.com">
        </div>
        <div>
            <div class="flex justify-between mb-1">
                <label class="block text-sm font-semibold text-gray-700">Password</label>
                <a href="#" id="forgot-password" class="text-xs text-blue-600 hover:underline">Forgot?</a>
            </div>
            <input type="password" id="password" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all" placeholder="••••••••">
        </div>

        <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-lg shadow-blue-200 transition-all flex items-center justify-center">
            <span id="btn-text">Sign In</span>
            <div id="btn-loader" class="hidden loader ease-linear rounded-full border-2 border-t-2 border-gray-200 h-5 w-5 ml-3"></div>
        </button>
    </form>

    <div class="mt-8 text-center">
        <p class="text-sm text-gray-600">
            <span id="toggle-text">Don't have an account?</span>
            <button onclick="toggleAuthMode()" class="text-blue-600 font-bold hover:underline ml-1 focus:outline-none" id="toggle-link">Create Account</button>
        </p>
    </div>
</div>

<div id="toast" class="fixed bottom-5 right-5 px-6 py-3 rounded-lg text-white transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none">
    <span id="toast-message"></span>
</div>
<script>
    const authForm = document.getElementById('auth-form');
    const submitBtn = document.getElementById('submit-btn');
    const btnLoader = document.getElementById('btn-loader');
    const btnText = document.getElementById('btn-text');

    /**
     * Toggles between Login and Registration UI
     */
    function toggleAuthMode() {
        isSignUpMode = !isSignUpMode;
        document.getElementById('auth-title').innerText = isSignUpMode ? 'Create Account' : 'Welcome Back';
        document.getElementById('auth-subtitle').innerText = isSignUpMode ? 'Join our community today' : 'Please enter your details to sign in';
        document.getElementById('btn-text').innerText = isSignUpMode ? 'Sign Up' : 'Sign In';
        document.getElementById('toggle-text').innerText = isSignUpMode ? 'Already have an account?' : "Don't have an account?";
        document.getElementById('toggle-link').innerText = isSignUpMode ? 'Login' : 'Create Account';
        document.getElementById('forgot-password').style.display = isSignUpMode ? 'none' : 'block';
    }

    /**
     * Handles Google OAuth
     */
    async function handleGoogleLogin() {
        const { error } = await _supabase.auth.signInWithOAuth({
            provider: 'google',
            options: {
                redirectTo: window.location.origin
            }
        });
        if (error) notify(error.message);
    }

    /**
     * Handles Email/Password Auth
     */
    authForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        // Start Loading State
        submitBtn.disabled = true;
        btnLoader.classList.remove('hidden');
        btnText.innerText = isSignUpMode ? 'Creating...' : 'Signing In...';

        try {
            if (isSignUpMode) {
                // Handle Registration
                const { data, error } = await _supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        emailRedirectTo: window.location.origin,
                    }
                });
                
                if (error) throw error;
                
                if (data.user && data.session === null) {
                    notify("Success! Please check your email for a verification link.", "success");
                } else {
                    notify("Account created and logged in!", "success");
                    window.location.reload(); 
                }
            } else {
                // Handle Login
                const { data, error } = await _supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) throw error;
                
                notify("Login Successful!", "success");
                // Logic to redirect user after login:
                // window.location.href = '/dashboard';
            }
        } catch (error) {
            notify(error.message);
        } finally {
            // Reset Loading State
            submitBtn.disabled = false;
            btnLoader.classList.add('hidden');
            btnText.innerText = isSignUpMode ? 'Sign Up' : 'Sign In';
        }
    });

    // Initial session check
    async function checkUser() {
        const { data: { user } } = await _supabase.auth.getUser();
        if (user) {
            console.log("Logged in as:", user.email);
            // You can hide the login form and show a "Logout" button here
        }
    }
    checkUser();
</script>
</body>
</html>
