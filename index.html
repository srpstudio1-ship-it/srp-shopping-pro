<!-- =========================
SRP SHOPPING AUTH SYSTEM (PRO)
PART 1
========================= -->

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRP SHOPPING | Auth</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#004aad,#00d4ff);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

/* Container */
.auth-box{
width:100%;
max-width:420px;
background:white;
border-radius:20px;
padding:30px;
box-shadow:0 20px 50px rgba(0,0,0,0.2);
animation:fadeIn 0.6s ease;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(20px);}
to{opacity:1;}
}

/* Logo */
.logo{
text-align:center;
margin-bottom:20px;
}

.logo h1{
color:#004aad;
font-weight:800;
}

/* Tabs */
.tabs{
display:flex;
margin-bottom:20px;
background:#f1f3f5;
border-radius:10px;
overflow:hidden;
}

.tab{
flex:1;
text-align:center;
padding:12px;
cursor:pointer;
font-weight:600;
}

.tab.active{
background:#004aad;
color:white;
}

/* Inputs */
.input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
margin-bottom:12px;
outline:none;
transition:0.3s;
}

.input:focus{
border-color:#004aad;
}

/* Button */
.btn{
width:100%;
padding:14px;
background:#004aad;
color:white;
border:none;
border-radius:10px;
font-weight:700;
cursor:pointer;
margin-top:10px;
transition:0.3s;
}

.btn:hover{
transform:scale(1.02);
}

/* Google Button */
.google-btn{
background:white;
color:#444;
border:1px solid #ddd;
display:flex;
align-items:center;
justify-content:center;
gap:10px;
}

.google-btn img{
width:20px;
}

/* Divider */
.divider{
text-align:center;
margin:15px 0;
color:#999;
}

/* Hidden */
.hidden{
display:none;
}

</style>
</head>

<body>

<div class="auth-box">

<div class="logo">
<h1>SRP SHOPPING</h1>
<p style="color:#666;">Premium Experience</p>
</div>

<!-- Tabs -->
<div class="tabs">
<div class="tab active" onclick="switchTab('login')">Login</div>
<div class="tab" onclick="switchTab('signup')">Signup</div>
</div>

<!-- LOGIN -->
<div id="login-box">

<input type="email" id="login-email" class="input" placeholder="Email">
<input type="password" id="login-pass" class="input" placeholder="Password">

<button class="btn" onclick="loginUser()">Login</button>

<div class="divider">OR</div>

<button class="btn google-btn" onclick="googleLogin()">
<img src="https://cdn-icons-png.flaticon.com/512/281/281764.png">
Continue with Google
</button>

</div>

<!-- SIGNUP -->
<div id="signup-box" class="hidden">

<input type="text" id="signup-name" class="input" placeholder="Full Name">
<input type="email" id="signup-email" class="input" placeholder="Email">
<input type="password" id="signup-pass" class="input" placeholder="Password">

<button class="btn" onclick="signupUser()">Create Account</button>

</div>

</div>

<script>

/* =====================
SUPABASE CONFIG
===================== */
const SUPABASE_URL = "https://cmxlfxqtrguuzpqdgcxv.supabase.co";
const SUPABASE_KEY = "YOUR_PUBLIC_ANON_KEY"; // replace
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* =====================
TAB SWITCH
===================== */
function switchTab(type){
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));

if(type==='login'){
document.querySelectorAll('.tab')[0].classList.add('active');
document.getElementById('login-box').classList.remove('hidden');
document.getElementById('signup-box').classList.add('hidden');
}else{
document.querySelectorAll('.tab')[1].classList.add('active');
document.getElementById('login-box').classList.add('hidden');
document.getElementById('signup-box').classList.remove('hidden');
}
}

/* =====================
SIGNUP
===================== */
async function signupUser(){
const name = document.getElementById('signup-name').value;
const email = document.getElementById('signup-email').value;
const pass = document.getElementById('signup-pass').value;

if(!name || !email || !pass){
alert("Fill all fields");
return;
}

const {data,error} = await supabase.auth.signUp({
email:email,
password:pass,
options:{
data:{full_name:name}
}
});

if(error){
alert(error.message);
}else{
alert("Signup successful! Check your email.");
switchTab('login');
}
}

/* =====================
LOGIN
===================== */
async function loginUser(){
const email = document.getElementById('login-email').value;
const pass = document.getElementById('login-pass').value;

const {data,error} = await supabase.auth.signInWithPassword({
email:email,
password:pass
});

if(error){
alert(error.message);
}else{
localStorage.setItem("srp_user", JSON.stringify(data.user));
window.location.href="home.html"; // PART 2
}
}

/* =====================
GOOGLE LOGIN
===================== */
async function googleLogin(){
await supabase.auth.signInWithOAuth({
provider:'google',
options:{
redirectTo: window.location.origin + "/home.html"
}
});
}

/* =====================
SESSION CHECK
===================== */
async function checkSession(){
const {data} = await supabase.auth.getSession();

if(data.session){
window.location.href="home.html";
}
}

checkSession();

</script>

</body>
</html>
