<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SRP SHOPPING | Premium Multi-Vendor Platform</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <style>
        :root {
            --srp-primary: #004aad;
            --srp-secondary: #00d4ff;
            --srp-accent: #ff4757;
            --srp-success: #2ed573;
            --srp-bg: #f8faff;
            --srp-card: #ffffff;
            --srp-text-main: #1a1d23;
            --srp-text-muted: #747d8c;
            --srp-border: #edf2f7;
            --glass: rgba(255, 255, 255, 0.8);
            --shadow-sm: 0 2px 10px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 30px rgba(0, 74, 173, 0.15);
            --safe-top: env(safe-area-inset-top);
            --nav-bottom: 75px;
        }

        /* --- MODERN RESET & BASE --- */
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--srp-bg);
            color: var(--srp-text-main);
            overflow-x: hidden;
            min-height: 100vh;
            user-select: none;
        }

        /* --- AUTHENTICATION LAYER (HIGH FIDELITY) --- */
        #srp-auth-layer {
            position: fixed; inset: 0; background: white; z-index: 10000;
            display: flex; flex-direction: column; align-items: center; padding: 40px 25px;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .auth-brand { text-align: center; margin-bottom: 40px; }
        .auth-brand i { font-size: 3.5rem; color: var(--srp-primary); margin-bottom: 15px; }
        .auth-brand h1 { font-weight: 800; font-size: 1.8rem; color: var(--srp-primary); letter-spacing: -1px; }

        .auth-card { width: 100%; max-width: 400px; background: white; }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--srp-text-muted); transition: 0.3s; }
        .input-field { 
            width: 100%; padding: 16px 16px 16px 50px; border-radius: 16px; border: 2px solid var(--srp-border);
            font-size: 0.95rem; font-weight: 500; outline: none; transition: 0.3s;
        }
        .input-field:focus { border-color: var(--srp-primary); background: #f0f7ff; }
        .input-field:focus + i { color: var(--srp-primary); }

        .btn-primary {
            width: 100%; padding: 18px; border-radius: 16px; border: none;
            background: linear-gradient(135deg, var(--srp-primary), var(--srp-secondary));
            color: white; font-weight: 700; font-size: 1rem; cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 74, 173, 0.3); transition: 0.3s;
        }
        .btn-primary:active { transform: scale(0.97); }

        .google-btn {
            width: 100%; padding: 14px; border-radius: 16px; border: 1.5px solid var(--srp-border);
            background: white; margin-top: 15px; display: flex; align-items: center; justify-content: center;
            gap: 12px; font-weight: 600; font-size: 0.9rem; color: #5f6368;
        }

        /* --- HEADER ENGINE --- */
        header {
            position: fixed; top: 0; width: 100%; background: var(--glass);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            z-index: 5000; padding: 15px 20px; border-bottom: 1px solid var(--srp-border);
        }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .logo-text { font-weight: 800; font-size: 1.3rem; color: var(--srp-primary); display: flex; align-items: center; gap: 8px; }
        
        .wallet-card {
            background: var(--srp-primary); color: white; padding: 8px 15px;
            border-radius: 12px; font-weight: 700; font-size: 0.85rem;
            display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow-sm);
        }

        .search-container { position: relative; width: 100%; }
        .search-bar {
            width: 100%; padding: 14px 45px; border-radius: 14px; border: none;
            background: #f1f3f6; font-size: 0.9rem; font-weight: 500; outline: none;
        }
        .search-container i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--srp-text-muted); }

        /* --- CATEGORIES (HORIZON SCROLL) --- */
        .scroller-view { padding-top: 135px; }
        .category-tray { display: flex; overflow-x: auto; padding: 20px; gap: 20px; scrollbar-width: none; }
        .category-item { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .cat-icon { 
            width: 65px; height: 65px; border-radius: 22px; background: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; color: var(--srp-primary); box-shadow: var(--shadow-sm);
            border: 2px solid transparent; transition: 0.3s;
        }
        .category-item.active .cat-icon { background: var(--srp-primary); color: white; border-color: #f0f7ff; transform: translateY(-5px); }
        .cat-label { font-size: 0.7rem; font-weight: 700; color: var(--srp-text-muted); }

        /* --- HERO & PROMOS --- */
        .promo-slider { width: 92%; margin: 10px auto; height: 180px; border-radius: 25px; overflow: hidden; position: relative; box-shadow: var(--shadow-lg); }
        .promo-slide { 
            width: 100%; height: 100%; background: linear-gradient(45deg, #004aad, #00d4ff);
            padding: 30px; color: white; display: flex; flex-direction: column; justify-content: center;
        }

        /* --- PRODUCT GRID SYSTEM --- */
        .main-content { padding: 0 15px 100px; }
        .grid-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5px; }
        .grid-header h3 { font-weight: 800; font-size: 1.1rem; }

        .product-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .p-card { 
            background: var(--srp-card); border-radius: 20px; overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03); position: relative;
            border: 1.5px solid var(--srp-border); transition: 0.3s;
        }
        .p-card:active { transform: scale(0.95); }
        .p-img { width: 100%; aspect-ratio: 1; padding: 15px; background: #fff; object-fit: contain; }
        
        .p-info { padding: 12px; }
        .p-name { font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: #333; height: 38px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .p-price-row { display: flex; align-items: baseline; gap: 6px; }
        .price { font-weight: 800; font-size: 1.1rem; color: var(--srp-primary); }
        .mrp { font-size: 0.75rem; text-decoration: line-through; color: var(--srp-text-muted); }
        .badge { background: var(--srp-success); color: white; font-size: 9px; padding: 2px 8px; border-radius: 6px; font-weight: 800; }

        /* --- BOTTOM NAVIGATION (FLOATING STYLE) --- */
        .nav-dock {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            width: 90%; height: 65px; background: rgba(26, 29, 35, 0.95);
            backdrop-filter: blur(10px); border-radius: 25px; display: flex;
            justify-content: space-around; align-items: center; z-index: 6000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .nav-item { color: #888; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; }
        .nav-item i { font-size: 1.3rem; }
        .nav-item span { font-size: 0.6rem; font-weight: 600; }
        .nav-item.active { color: white; }

        /* --- DETAIL OVERLAY --- */
        #p-detail {
            position: fixed; inset: 0; background: white; z-index: 15000;
            display: none; flex-direction: column; overflow-y: auto;
        }
    </style>
</head>
<body>

    <div id="srp-auth-layer">
        <div class="auth-brand">
            <i class="fas fa-shopping-bag animate__animated animate__bounceIn"></i>
            <h1>SRP SHOPPING</h1>
            <p style="color: var(--srp-text-muted); font-size: 0.9rem;">The Marketplace of the Future</p>
        </div>

        <div class="auth-card" id="auth-login">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" id="email-in" class="input-field" placeholder="Email Address">
            </div>
            <div class="input-group">
                <i class="fas fa-lock"></i>
                <input type="password" id="pass-in" class="input-field" placeholder="Password">
            </div>
            <button class="btn-primary" onclick="Auth.handle('login')">LOGIN TO SHOP</button>
            <div style="text-align: center; margin: 20px 0; color: #ccc;">OR</div>
            <button class="google-btn">
                <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" width="20"> Sign in with Google
            </button>
            <p style="text-align: center; margin-top: 30px; font-size: 0.9rem; font-weight: 500;">
                New to SRP? <span style="color: var(--srp-primary); font-weight: 700;" onclick="Auth.toggle()">Create Account</span>
            </p>
        </div>

        <div class="auth-card" id="auth-signup" style="display: none;">
            <div class="input-group"><i class="fas fa-user"></i><input type="text" id="reg-name" class="input-field" placeholder="Full Name"></div>
            <div class="input-group"><i class="fas fa-envelope"></i><input type="email" id="reg-email" class="input-field" placeholder="Email Address"></div>
            <div class="input-group"><i class="fas fa-lock"></i><input type="password" id="reg-pass" class="input-field" placeholder="Create Password"></div>
            <button class="btn-primary" onclick="Auth.handle('signup')">GET STARTED</button>
            <p style="text-align: center; margin-top: 30px; font-size: 0.9rem; font-weight: 500;" onclick="Auth.toggle()">
                Already have an account? <span style="color: var(--srp-primary); font-weight: 700;">Login</span>
            </p>
        </div>
    </div>

    <header>
        <div class="header-top">
            <div class="logo-text"><i class="fas fa-shopping-bag"></i> SRP SHOPPING</div>
            <div class="wallet-card"><i class="fas fa-wallet"></i> ₹<span id="bal">1,250</span></div>
        </div>
        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" class="search-bar" id="app-search" placeholder="Search brands and items..." oninput="Store.render()">
        </div>
    </header>

    <div class="scroller-view">
        <div class="category-tray" id="cat-dock"></div>
        
        <div class="promo-slider">
            <div class="promo-slide">
                <span style="font-size: 0.7rem; font-weight: 800; background: rgba(0,0,0,0.2); padding: 4px 10px; border-radius: 50px; width: fit-content;">EXCLUSIVE OFFER</span>
                <h2 style="font-size: 1.8rem; margin: 10px 0;">50% OFF</h2>
                <p style="font-size: 0.9rem; font-weight: 500; opacity: 0.9;">On all SRP branded electronics</p>
            </div>
        </div>

        <main class="main-content">
            <div class="grid-header">
                <h3>Trending Now</h3>
                <span style="color: var(--srp-primary); font-weight: 700; font-size: 0.8rem;">View All</span>
            </div>
            <div class="product-grid" id="product-dock"></div>
        </main>
    </div>

    <nav class="nav-dock">
        <a href="#" class="nav-item active"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="#" class="nav-item"><i class="fas fa-grid-2"></i><span>Category</span></a>
        <a href="#" class="nav-item"><i class="fas fa-robot" style="font-size: 1.8rem; color: var(--srp-secondary);"></i></a>
        <a href="#" class="nav-item"><i class="fas fa-shopping-cart"></i><span>Cart</span></a>
        <a href="#" class="nav-item"><i class="fas fa-user"></i><span>Profile</span></a>
    </nav>

    <script>
        /*
        ==================================================================
        SRP SHOPPING CORE SYSTEM - PRODUCTION GRADE v5.0
        ==================================================================
        */
        
        const DB = [
            { id: 1, name: "SRP Pro Bass Wireless Headphones", price: 2499, mrp: 4999, img: "https://m.media-amazon.com/images/I/61f496A7LcL._SL1500_.jpg", cat: "elec" },
            { id: 2, name: "SRP Ultra 4K Smart Android TV", price: 22500, mrp: 35000, img: "https://m.media-amazon.com/images/I/71fV9H2u8FL._SL1500_.jpg", cat: "elec" },
            { id: 3, name: "SRP Mechanical RGB Keyboard", price: 3800, mrp: 7500, img: "https://m.media-amazon.com/images/I/71Miv62KdtL._SL1500_.jpg", cat: "gadg" },
            { id: 4, name: "SRP Premium Cotton Hoodie", price: 1299, mrp: 2999, img: "https://m.media-amazon.com/images/I/71YyP9fDqAL._UX679_.jpg", cat: "fash" },
            { id: 5, name: "SRP Smart Watch Pro Gen-2", price: 2999, mrp: 5999, img: "https://m.media-amazon.com/images/I/61ZjlBOp+rL._SL1500_.jpg", cat: "gadg" },
            { id: 6, name: "SRP Portable High Speed Blender", price: 1800, mrp: 3500, img: "https://m.media-amazon.com/images/I/71Lh56eM7FL._SL1500_.jpg", cat: "home" }
        ];

        const Auth = {
            toggle() {
                const login = document.getElementById('auth-login');
                const signup = document.getElementById('auth-signup');
                if(login.style.display === 'none') {
                    login.style.display = 'block'; signup.style.display = 'none';
                } else {
                    login.style.display = 'none'; signup.style.display = 'block';
                }
            },
            handle(type) {
                const email = type === 'login' ? document.getElementById('email-in').value : document.getElementById('reg-email').value;
                if(email.includes('@')) {
                    localStorage.setItem('srp_token', 'AUTH_VALID_786');
                    document.getElementById('srp-auth-layer').style.transform = 'translateY(-100%)';
                    Store.init();
                } else {
                    alert("Please enter valid credentials");
                }
            }
        };

        const Store = {
            activeCat: 'all',
            init() {
                this.renderCats();
                this.render();
            },
            renderCats() {
                const cats = [
                    { id: 'all', n: 'All', i: 'fa-box' },
                    { id: 'elec', n: 'Electronics', i: 'fa-bolt' },
                    { id: 'fash', n: 'Fashion', i: 'fa-shirt' },
                    { id: 'gadg', n: 'Gadgets', i: 'fa-microchip' },
                    { id: 'home', n: 'Home', i: 'fa-couch' }
                ];
                document.getElementById('cat-dock').innerHTML = cats.map(c => `
                    <div class="category-item ${this.activeCat === c.id ? 'active' : ''}" onclick="Store.setCat('${c.id}')">
                        <div class="cat-icon"><i class="fas ${c.i}"></i></div>
                        <span class="cat-label">${c.n}</span>
                    </div>
                `).join('');
            },
            setCat(id) { this.activeCat = id; this.renderCats(); this.render(); },
            render() {
                const query = document.getElementById('app-search').value.toLowerCase();
                const filtered = DB.filter(p => (this.activeCat === 'all' || p.cat === this.activeCat) && p.name.toLowerCase().includes(query));
                
                document.getElementById('product-dock').innerHTML = filtered.map(p => `
                    <div class="p-card animate__animated animate__fadeInUp">
                        <img src="${p.img}" class="p-img">
                        <div class="p-info">
                            <span class="badge">${Math.round((p.mrp-p.price)/p.mrp*100)}% OFF</span>
                            <div class="p-name">${p.name}</div>
                            <div class="p-price-row">
                                <span class="price">₹${p.price.toLocaleString()}</span>
                                <span class="mrp">₹${p.mrp.toLocaleString()}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        };

        window.onload = () => {
            if(localStorage.getItem('srp_token')) {
                document.getElementById('srp-auth-layer').style.display = 'none';
                Store.init();
            }
        }
    </script>
</body>
</html>
