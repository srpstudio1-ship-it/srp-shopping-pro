<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2874f0">
    <meta name="description" content="SRP Shopping original multi-vendor marketplace storefront">
    <title>SRP Shopping — Ultimate Marketplace</title>
    <style>
:root {
    --blue: #2874f0;
    --blue-2: #1458c9;
    --yellow: #ffd814;
    --yellow-2: #f5bd00;
    --orange: #ff8f00;
    --green: #07895a;
    --red: #d92d20;
    --ink: #172033;
    --muted: #667085;
    --surface: #f5f7fb;
    --paper: #ffffff;
    --line: #e3e7ef;
    --soft-blue: #eef4ff;
    --soft-yellow: #fff8df;
    --soft-green: #eaf8f2;
    --soft-red: #feeceb;
    --shadow: 0 14px 36px rgba(15, 23, 42, .09);
    --radius: 14px;
    --container: 1440px;
    --header: 128px;
}
* {
    box-sizing: border-box;
}
html {
    scroll-behavior: smooth;
}
body {
    margin: 0;
    min-width: 320px;
    background: var(--surface);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.45;
}
body.dark {
    --ink: #edf2f7;
    --muted: #9da8ba;
    --surface: #0d1420;
    --paper: #182131;
    --line: #2c3546;
    --soft-blue: #1b2b46;
    --soft-yellow: #302915;
    --soft-green: #173329;
    --soft-red: #372321;
}
body.no-scroll {
    overflow: hidden;
}
a {
    color: inherit;
    text-decoration: none;
}
button,
input,
select,
textarea {
    font: inherit;
}
button {
    cursor: pointer;
}
img {
    max-width: 100%;
}
.hidden {
    display: none !important;
}
.container {
    width: min(var(--container), calc(100% - 40px));
    margin-inline: auto;
}
.topline {
    min-height: 33px;
    padding: 6px 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(90deg, #174ea6, #2874f0, #3c83f5);
    color: #fff;
    font-size: 11px;
    font-weight: 800;
}
.header {
    position: sticky;
    top: 0;
    z-index: 80;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 5px 22px rgba(15, 23, 42, .07);
}
.header-main {
    min-height: 74px;
    display: grid;
    grid-template-columns: auto minmax(300px, 1fr) auto;
    align-items: center;
    gap: 16px;
}
.brand {
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
    white-space: nowrap;
}
.brand-mark {
    color: var(--blue);
    font-size: 30px;
    line-height: 1;
    font-style: italic;
    font-weight: 950;
    letter-spacing: -2px;
}
.brand-sub {
    color: var(--muted);
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 2px;
}
.search {
    position: relative;
    min-width: 0;
}
.search-box {
    width: 100%;
    height: 45px;
    padding: 0 48px 0 43px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--ink);
    outline: 0;
}
.search-box:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(40, 116, 240, .1);
}
.search-icon {
    position: absolute;
    left: 14px;
    top: 11px;
    color: var(--muted);
    font-size: 20px;
    pointer-events: none;
}
.search-button {
    position: absolute;
    right: 5px;
    top: 5px;
    width: 35px;
    height: 35px;
    border: 0;
    border-radius: 8px;
    background: var(--blue);
    color: #fff;
}
.suggestions {
    position: absolute;
    top: 51px;
    left: 0;
    right: 0;
    z-index: 120;
    overflow: hidden;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: var(--shadow);
}
.suggestion {
    width: 100%;
    display: grid;
    grid-template-columns: 32px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 11px 13px;
    border: 0;
    border-bottom: 1px solid #edf0f5;
    background: var(--paper);
    color: var(--ink);
    text-align: left;
}
.suggestion:hover {
    background: var(--soft-blue);
}
.suggestion-icon {
    width: 32px;
    height: 32px;
    display: grid;
    place-items: center;
    border-radius: 8px;
    background: var(--soft-blue);
}
.suggestion-name {
    font-size: 12px;
    font-weight: 850;
}
.suggestion-meta {
    color: var(--muted);
    font-size: 10px;
}
.header-actions {
    display: flex;
    align-items: center;
    gap: 5px;
}
.header-action {
    position: relative;
    min-width: 42px;
    height: 42px;
    padding: 0 9px;
    border: 1px solid transparent;
    border-radius: 9px;
    display: grid;
    place-items: center;
    background: transparent;
    color: var(--ink);
}
.header-action:hover {
    background: var(--surface);
    border-color: var(--line);
}
.badge {
    position: absolute;
    top: 0;
    right: 0;
    min-width: 18px;
    height: 18px;
    padding: 0 4px;
    display: grid;
    place-items: center;
    border-radius: 999px;
    background: var(--yellow);
    color: #111;
    font-size: 9px;
    font-weight: 950;
}
.account-button {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink);
    border-radius: 9px;
}
.account-button:hover {
    border-color: var(--line);
    background: var(--surface);
}
.account-title {
    display: block;
    max-width: 110px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 11px;
    font-weight: 900;
    text-align: left;
}
.account-subtitle {
    display: block;
    margin-top: 1px;
    color: var(--muted);
    font-size: 9px;
    text-align: left;
}
.category-strip {
    min-height: 48px;
    display: flex;
    align-items: center;
    gap: 5px;
    overflow-x: auto;
    border-top: 1px solid #f0f1f5;
}
.category-strip::-webkit-scrollbar {
    display: none;
}
.category-button {
    min-width: max-content;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 10px 13px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--ink);
    font-size: 11px;
    font-weight: 850;
}
.category-button:hover,
.category-button.active {
    background: var(--soft-blue);
    color: var(--blue);
}
.page {
    min-height: 60vh;
}
.page-shell {
    padding-block: 20px 44px;
}
.hero {
    position: relative;
    min-height: 435px;
    overflow: hidden;
    display: grid;
    grid-template-columns: 1.1fr .9fr;
    align-items: center;
    border-radius: 20px;
    background: linear-gradient(130deg, #eef5ff 0%, #fff 55%, #fff7d8 100%);
    border: 1px solid var(--line);
}
.hero::after {
    content: "";
    position: absolute;
    width: 450px;
    height: 450px;
    right: -170px;
    bottom: -180px;
    border-radius: 50%;
    background: rgba(40, 116, 240, .08);
}
.hero-copy {
    position: relative;
    z-index: 2;
    padding: 52px 54px;
}
.eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: var(--blue);
    font-size: 10px;
    font-weight: 950;
    letter-spacing: 1.7px;
    text-transform: uppercase;
}
.hero h1 {
    margin: 12px 0 15px;
    max-width: 700px;
    font-size: clamp(40px, 5vw, 68px);
    line-height: 1.02;
    letter-spacing: -3px;
}
.hero h1 strong {
    color: var(--blue);
}
.hero p {
    max-width: 600px;
    margin: 0;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.7;
}
.hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 24px;
}
.hero-visual {
    position: relative;
    min-height: 435px;
    background:
        radial-gradient(circle at 35% 32%, #fff 0 11%, transparent 11.5%),
        radial-gradient(circle at 65% 66%, rgba(40,116,240,.22), transparent 30%),
        radial-gradient(circle at 75% 28%, rgba(255,216,20,.55), transparent 24%),
        linear-gradient(145deg, #dce9ff, #fff2b7);
}
.hero-card {
    position: absolute;
    width: 300px;
    min-height: 320px;
    left: 50%;
    top: 50%;
    transform: translate(-50%,-50%) rotate(3deg);
    padding: 22px;
    border-radius: 23px;
    background: rgba(255,255,255,.93);
    box-shadow: 0 27px 60px rgba(15,23,42,.17);
    border: 1px solid rgba(255,255,255,.9);
}
.hero-card-product {
    height: 185px;
    display: grid;
    place-items: center;
    overflow: hidden;
    border-radius: 16px;
    background: #f2f5fa;
}
.hero-card-product img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
.hero-card-label {
    margin-top: 14px;
    color: var(--orange);
    font-size: 9px;
    font-weight: 950;
    letter-spacing: 1.2px;
}
.hero-card h3 {
    margin: 6px 0 4px;
    font-size: 19px;
}
.hero-card small {
    color: var(--muted);
    font-size: 10px;
}
.btn {
    min-height: 40px;
    padding: 0 15px;
    border: 0;
    border-radius: 8px;
    font-size: 11px;
    font-weight: 900;
}
.btn-primary {
    background: var(--blue);
    color: #fff;
}
.btn-primary:hover {
    background: var(--blue-2);
}
.btn-accent {
    background: var(--yellow);
    color: #111;
}
.btn-accent:hover {
    background: #f5ca18;
}
.btn-outline {
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--line);
}
.btn-outline:hover {
    border-color: #bbcbe7;
    background: var(--soft-blue);
}
.btn-ghost {
    background: var(--soft-blue);
    color: var(--blue);
}
.btn-success {
    background: var(--soft-green);
    color: var(--green);
}
.btn-danger {
    background: var(--soft-red);
    color: var(--red);
}
.btn:disabled {
    cursor: not-allowed;
    opacity: .45;
}
.service-row {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    margin-top: 18px;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: var(--paper);
    box-shadow: var(--shadow);
}
.service {
    display: flex;
    gap: 10px;
    padding: 18px;
    border-right: 1px solid var(--line);
}
.service:last-child {
    border-right: 0;
}
.service-icon {
    width: 38px;
    height: 38px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 10px;
    background: var(--soft-blue);
}
.service-title {
    font-size: 11px;
    font-weight: 950;
}
.service-copy {
    margin-top: 2px;
    color: var(--muted);
    font-size: 9px;
}
.section {
    margin-top: 34px;
}
.section-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 15px;
}
.section-title {
    margin: 3px 0 0;
    font-size: 26px;
    letter-spacing: -.7px;
}
.section-copy {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 11px;
}
.category-grid {
    display: grid;
    grid-template-columns: repeat(8,1fr);
    gap: 10px;
}
.category-card {
    min-height: 118px;
    display: grid;
    place-items: center;
    align-content: center;
    gap: 8px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
    color: var(--ink);
    transition: .18s ease;
}
.category-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
}
.category-icon {
    width: 50px;
    height: 50px;
    display: grid;
    place-items: center;
    border-radius: 14px;
    background: var(--soft-blue);
    font-size: 25px;
}
.category-name {
    font-size: 10px;
    font-weight: 900;
}
.deal-grid {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 12px;
}
.deal-card {
    position: relative;
    overflow: hidden;
    min-height: 170px;
    padding: 20px;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: var(--paper);
}
.deal-card::after {
    content: "";
    position: absolute;
    width: 100px;
    height: 100px;
    right: -35px;
    bottom: -35px;
    border-radius: 50%;
    background: var(--soft-blue);
}
.deal-label {
    color: var(--orange);
    font-size: 9px;
    font-weight: 950;
    letter-spacing: 1.2px;
}
.deal-card h3 {
    margin: 8px 0 5px;
    font-size: 18px;
}
.deal-card p {
    margin: 0;
    max-width: 250px;
    color: var(--muted);
    font-size: 10px;
    line-height: 1.6;
}
.deal-card .btn {
    margin-top: 15px;
    position: relative;
    z-index: 2;
}
.products-bar {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
}
.product-count {
    color: var(--muted);
    font-size: 11px;
}
.toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    justify-content: flex-end;
}
.select {
    height: 39px;
    padding: 0 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    outline: 0;
    background: var(--paper);
    color: var(--ink);
    font-size: 11px;
}
.filters-layout {
    display: grid;
    grid-template-columns: 235px 1fr;
    gap: 15px;
}
.filter-panel {
    align-self: start;
    position: sticky;
    top: 143px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
}
.filter-block {
    padding: 13px 0;
    border-bottom: 1px solid var(--line);
}
.filter-block:last-child {
    border-bottom: 0;
}
.filter-label {
    font-size: 11px;
    font-weight: 950;
}
.filter-options {
    display: grid;
    gap: 8px;
    margin-top: 9px;
}
.filter-row {
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--muted);
    font-size: 10px;
}
.price-inputs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 9px;
}
.input {
    width: 100%;
    min-height: 40px;
    padding: 0 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    outline: 0;
    background: var(--paper);
    color: var(--ink);
    font-size: 11px;
}
textarea.input {
    min-height: 100px;
    padding-block: 10px;
    resize: vertical;
}
.input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px rgba(40,116,240,.09);
}
.product-grid {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 13px;
}
.product-grid.list {
    grid-template-columns: 1fr;
}
.product-card {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
    transition: .18s ease;
}
.product-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
}
.product-grid.list .product-card {
    display: grid;
    grid-template-columns: 190px 1fr;
}
.product-media {
    position: relative;
    height: 230px;
    padding: 16px;
    display: grid;
    place-items: center;
    background: #f6f8fc;
}
.product-media img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
.product-wish,
.product-compare {
    position: absolute;
    top: 9px;
    z-index: 5;
    width: 33px;
    height: 33px;
    display: grid;
    place-items: center;
    border: 1px solid #e1e5ed;
    border-radius: 50%;
    background: #fff;
    color: #667085;
}
.product-wish {
    right: 9px;
}
.product-compare {
    left: 9px;
}
.product-wish.active {
    color: #e11d48;
}
.product-compare.active {
    color: var(--blue);
}
.product-body {
    padding: 13px;
}
.product-brand {
    color: var(--blue);
    font-size: 9px;
    font-weight: 950;
    letter-spacing: 1px;
    text-transform: uppercase;
}
.product-name {
    min-height: 43px;
    margin-top: 5px;
    font-size: 13px;
    font-weight: 850;
    line-height: 1.45;
}
.rating-pill {
    display: inline-flex;
    padding: 3px 6px;
    border-radius: 4px;
    background: var(--green);
    color: #fff;
    font-size: 9px;
    font-weight: 950;
}
.price {
    margin-top: 8px;
    font-size: 19px;
    font-weight: 950;
}
.mrp {
    margin-left: 5px;
    color: #939cad;
    font-size: 10px;
    text-decoration: line-through;
    font-weight: 500;
}
.discount {
    margin-left: 5px;
    color: var(--green);
    font-size: 10px;
    font-weight: 950;
}
.product-seller {
    min-height: 15px;
    margin-top: 5px;
    color: var(--muted);
    font-size: 9px;
}
.product-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 10px;
}
.product-buttons .btn {
    min-height: 36px;
    padding-inline: 8px;
    font-size: 10px;
}
.pagination {
    display: flex;
    justify-content: center;
    gap: 5px;
    margin-top: 18px;
}
.page-btn {
    width: 36px;
    height: 36px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
    color: var(--ink);
    font-size: 10px;
    font-weight: 900;
}
.page-btn.active {
    background: var(--blue);
    color: #fff;
    border-color: var(--blue);
}
.seller-grid {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 12px;
}
.seller-card {
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: var(--paper);
}
.seller-avatar {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: var(--soft-blue);
    color: var(--blue);
    font-size: 18px;
    font-weight: 950;
}
.seller-name {
    margin-top: 11px;
    font-size: 13px;
    font-weight: 950;
}
.seller-meta {
    margin-top: 4px;
    color: var(--muted);
    font-size: 10px;
}
.seller-buttons {
    display: flex;
    gap: 6px;
    margin-top: 13px;
}
.seller-buttons .btn {
    flex: 1;
    padding-inline: 7px;
    font-size: 9px;
}
.recent-card {
    display: grid;
    grid-template-columns: repeat(6,1fr);
    gap: 10px;
}
.panel {
    padding: 18px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--paper);
}
.empty {
    display: grid;
    place-items: center;
    min-height: 250px;
    text-align: center;
}
.empty-icon {
    width: 64px;
    height: 64px;
    display: grid;
    place-items: center;
    border-radius: 18px;
    background: var(--soft-blue);
    font-size: 28px;
}
.empty-title {
    margin-top: 13px;
    font-size: 16px;
    font-weight: 950;
}
.empty-copy {
    max-width: 500px;
    margin: 5px auto 0;
    color: var(--muted);
    font-size: 10px;
}
.footer {
    margin-top: 45px;
    background: #111827;
    color: #dbe4f1;
}
.footer-main {
    padding: 48px 0;
}
.footer-grid {
    display: grid;
    grid-template-columns: 1.7fr repeat(4,1fr);
    gap: 28px;
}
.footer-col {
    display: grid;
    gap: 9px;
    align-content: start;
}
.footer-col h3 {
    margin: 0 0 2px;
    color: #fff;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
}
.footer-col a {
    color: #aeb8c8;
    font-size: 10px;
}
.footer-col a:hover {
    color: #fff;
}
.footer-bottom {
    padding: 17px 0;
    border-top: 1px solid rgba(255,255,255,.1);
    color: #8f9caf;
    font-size: 9px;
}
.drawer-wrap,
.modal-wrap {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(2,6,23,.61);
    backdrop-filter: blur(5px);
}
.drawer {
    position: absolute;
    top: 0;
    right: 0;
    width: min(520px,100%);
    height: 100%;
    display: grid;
    grid-template-rows: auto 1fr auto;
    background: var(--paper);
    box-shadow: -18px 0 45px rgba(0,0,0,.2);
}
.drawer-head,
.modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 17px 19px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
}
.drawer-title,
.modal-title {
    margin: 0;
    font-size: 17px;
}
.close {
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 8px;
    background: var(--surface);
    color: var(--ink);
}
.drawer-body {
    overflow: auto;
    padding: 17px 19px;
}
.drawer-foot {
    padding: 16px 19px;
    border-top: 1px solid var(--line);
    background: var(--paper);
}
.cart-line {
    display: grid;
    grid-template-columns: 68px 1fr auto;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
}
.cart-line img {
    width: 68px;
    height: 68px;
    padding: 5px;
    border-radius: 9px;
    object-fit: contain;
    background: #f4f6fa;
}
.cart-name {
    font-size: 11px;
    font-weight: 900;
}
.cart-meta {
    margin-top: 4px;
    color: var(--muted);
    font-size: 9px;
}
.qty {
    display: inline-flex;
    align-items: center;
    margin-top: 8px;
    border: 1px solid var(--line);
    border-radius: 7px;
    overflow: hidden;
}
.qty button {
    width: 27px;
    height: 27px;
    border: 0;
    background: var(--surface);
    color: var(--ink);
}
.qty span {
    min-width: 30px;
    text-align: center;
    font-size: 10px;
    font-weight: 900;
}
.cart-totals {
    display: grid;
    gap: 5px;
}
.total-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 11px;
}
.total-row.grand {
    margin-top: 5px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    font-size: 17px;
    font-weight: 950;
}
.modal-wrap {
    display: grid;
    place-items: center;
    padding: 18px;
}
.modal {
    width: min(780px,100%);
    max-height: 94vh;
    overflow: auto;
    border-radius: 15px;
    background: var(--paper);
    box-shadow: 0 30px 80px rgba(0,0,0,.3);
}
.modal.wide {
    width: min(1160px,100%);
}
.modal-body {
    padding: 20px;
}
.product-detail {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
}
.gallery {
    display: grid;
    grid-template-columns: 72px 1fr;
    gap: 10px;
}
.thumb-list {
    display: grid;
    align-content: start;
    gap: 7px;
}
.thumb {
    width: 72px;
    height: 72px;
    padding: 5px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #f7f9fc;
}
.thumb.active {
    border-color: var(--blue);
    box-shadow: 0 0 0 2px rgba(40,116,240,.1);
}
.thumb img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}
.main-image {
    min-height: 450px;
    padding: 22px;
    display: grid;
    place-items: center;
    border-radius: 13px;
    background: #f6f8fc;
}
.main-image img {
    width: 100%;
    height: 100%;
    max-height: 420px;
    object-fit: contain;
}
.detail-brand {
    color: var(--blue);
    font-size: 9px;
    font-weight: 950;
    letter-spacing: 1.3px;
    text-transform: uppercase;
}
.detail-title {
    margin: 7px 0 9px;
    font-size: 29px;
    line-height: 1.1;
}
.detail-copy {
    color: var(--muted);
    font-size: 12px;
    line-height: 1.7;
}
.detail-price {
    margin-top: 17px;
    font-size: 30px;
    font-weight: 950;
}
.detail-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 7px;
    margin-top: 16px;
}
.source-box {
    margin-top: 16px;
    padding: 12px;
    border-radius: 9px;
    background: var(--soft-yellow);
    color: #6a591c;
    font-size: 9px;
}
body.dark .source-box {
    color: #eadb96;
}
.info-tabs {
    display: flex;
    gap: 4px;
    margin-top: 25px;
    border-bottom: 1px solid var(--line);
}
.tab {
    padding: 10px 12px;
    border: 0;
    border-bottom: 2px solid transparent;
    background: transparent;
    color: var(--muted);
    font-size: 10px;
    font-weight: 900;
}
.tab.active {
    border-color: var(--blue);
    color: var(--blue);
}
.info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 9px;
    margin-top: 14px;
}
.info-box {
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 9px;
}
.info-box span {
    display: block;
    color: var(--muted);
    font-size: 9px;
}
.info-box strong {
    display: block;
    margin-top: 4px;
    font-size: 11px;
}
.review-list {
    margin-top: 13px;
}
.review {
    padding: 13px 0;
    border-bottom: 1px solid var(--line);
}
.review:last-child {
    border-bottom: 0;
}
.review-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 11px;
}
.review-stars {
    color: #f59e0b;
}
.review-title {
    margin-top: 4px;
    font-size: 11px;
    font-weight: 900;
}
.review-text {
    margin-top: 4px;
    color: var(--muted);
    font-size: 10px;
}
.checkout-grid {
    display: grid;
    grid-template-columns: 1.2fr .8fr;
    gap: 17px;
}
.checkout-summary {
    align-self: start;
    position: sticky;
    top: 88px;
    padding: 15px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--surface);
}
.address-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}
.form {
    display: grid;
    gap: 11px;
}
.form label {
    display: grid;
    gap: 5px;
    font-size: 10px;
    font-weight: 900;
}
.stepper {
    display: flex;
    gap: 5px;
    margin-bottom: 17px;
}
.step {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    color: #9ba4b4;
    font-size: 10px;
    font-weight: 900;
}
.step-dot {
    width: 27px;
    height: 27px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: #eef1f5;
}
.step.active {
    color: var(--blue);
}
.step.active .step-dot {
    background: var(--blue);
    color: #fff;
}
.payment-card {
    display: grid;
    gap: 7px;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
}
.payment-card label {
    display: grid;
    grid-template-columns: 20px 1fr;
    grid-template-areas: "radio title" "radio copy";
    column-gap: 8px;
    padding: 11px;
    border: 1px solid var(--line);
    border-radius: 9px;
}
.payment-card input {
    grid-area: radio;
    margin-top: 2px;
}
.payment-title {
    grid-area: title;
    font-size: 11px;
    font-weight: 950;
}
.payment-copy {
    grid-area: copy;
    color: var(--muted);
    font-size: 9px;
}
.account-layout {
    display: grid;
    grid-template-columns: 230px 1fr;
    gap: 15px;
}
.account-nav {
    align-self: start;
    position: sticky;
    top: 142px;
    padding: 10px;
    display: grid;
    gap: 3px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--paper);
}
.account-nav button {
    padding: 11px 12px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--ink);
    text-align: left;
    font-size: 10px;
    font-weight: 850;
}
.account-nav button:hover,
.account-nav button.active {
    background: var(--soft-blue);
    color: var(--blue);
}
.account-content {
    min-width: 0;
}
.account-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
}
.kpi-grid {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 10px;
}
.kpi {
    padding: 15px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--paper);
}
.kpi span {
    color: var(--muted);
    font-size: 9px;
}
.kpi strong {
    display: block;
    margin-top: 5px;
    font-size: 23px;
}
.table-wrap {
    overflow: auto;
    border: 1px solid var(--line);
    border-radius: 10px;
}
.table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}
.table th,
.table td {
    padding: 11px;
    border-bottom: 1px solid var(--line);
    text-align: left;
    vertical-align: top;
    font-size: 10px;
}
.table th {
    color: var(--muted);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: .6px;
}
.table tr:last-child td {
    border-bottom: 0;
}
.tag {
    display: inline-flex;
    align-items: center;
    padding: 4px 7px;
    border-radius: 999px;
    background: var(--soft-blue);
    color: var(--blue);
    font-size: 9px;
    font-weight: 950;
}
.tag.green {
    background: var(--soft-green);
    color: var(--green);
}
.tag.red {
    background: var(--soft-red);
    color: var(--red);
}
.tag.yellow {
    background: var(--soft-yellow);
    color: #785f00;
}
.data-list {
    display: grid;
    gap: 8px;
}
.data-item {
    padding: 11px;
    border: 1px solid var(--line);
    border-radius: 9px;
}
.data-item strong {
    display: block;
    font-size: 11px;
}
.data-item small {
    display: block;
    margin-top: 3px;
    color: var(--muted);
    font-size: 9px;
}
.admin-shell {
    display: grid;
    grid-template-columns: 245px 1fr;
    min-height: 70vh;
}
.admin-side {
    position: sticky;
    top: var(--header);
    height: calc(100vh - var(--header));
    padding: 16px 12px;
    overflow: auto;
    background: #101827;
    color: #c7d2e1;
}
.admin-side-head {
    padding: 10px 10px 16px;
    color: #fff;
}
.admin-side-head b {
    font-size: 22px;
    font-style: italic;
}
.admin-side-head small {
    display: block;
    margin-top: 2px;
    color: #8492a8;
    font-size: 8px;
}
.admin-nav {
    display: grid;
    gap: 3px;
}
.admin-nav button {
    width: 100%;
    padding: 9px 10px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: #aebbd0;
    text-align: left;
    font-size: 9px;
    font-weight: 800;
}
.admin-nav button:hover,
.admin-nav button.active {
    background: #1d2b41;
    color: #fff;
}
.admin-main {
    min-width: 0;
    padding: 20px;
}
.admin-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
}
.admin-title {
    margin: 0;
    font-size: 26px;
}
.admin-copy {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 10px;
}
.chart {
    height: 220px;
    display: flex;
    align-items: flex-end;
    gap: 8px;
    padding: 16px 8px 24px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
}
.chart-bar {
    flex: 1;
    min-width: 16px;
    border-radius: 5px 5px 0 0;
    background: var(--blue);
    position: relative;
}
.chart-bar span {
    position: absolute;
    bottom: -18px;
    left: 50%;
    transform: translateX(-50%);
    color: var(--muted);
    font-size: 7px;
}
.editor-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 11px;
}
.editor-grid .full {
    grid-column: 1 / -1;
}
.feature-manifest {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 7px;
}
.feature-item {
    display: flex;
    gap: 7px;
    align-items: flex-start;
    padding: 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
}
.feature-number {
    width: 21px;
    height: 21px;
    flex: none;
    display: grid;
    place-items: center;
    border-radius: 6px;
    background: var(--soft-blue);
    color: var(--blue);
    font-size: 8px;
    font-weight: 950;
}
.feature-text {
    color: var(--ink);
    font-size: 8px;
    font-weight: 750;
}
.notification {
    padding: 12px;
    margin-bottom: 8px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--paper);
}
.notification.unread {
    border-left: 3px solid var(--blue);
}
.notification strong {
    font-size: 11px;
}
.notification p {
    margin: 4px 0;
    color: var(--muted);
    font-size: 9px;
}
.notification small {
    color: var(--muted);
    font-size: 8px;
}
.toasts {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 500;
    display: grid;
    gap: 8px;
}
.toast {
    min-width: 240px;
    max-width: 360px;
    padding: 11px 13px;
    border-radius: 8px;
    background: #172033;
    color: #fff;
    box-shadow: var(--shadow);
    font-size: 10px;
}
.toast.success {
    background: #087f5b;
}
.toast.error {
    background: #c72c20;
}
.toast.warning {
    background: #7b6205;
}
.mobile-bottom {
    display: none;
}
.mobile-only {
    display: none;
}
@media (max-width: 1180px) {
    .product-grid {
        grid-template-columns: repeat(3,1fr);
    }
    .category-grid {
        grid-template-columns: repeat(4,1fr);
    }
    .seller-grid {
        grid-template-columns: repeat(2,1fr);
    }
    .deal-grid {
        grid-template-columns: repeat(2,1fr);
    }
    .footer-grid {
        grid-template-columns: 1.4fr repeat(2,1fr);
    }
}
@media (max-width: 920px) {
    .header-main {
        grid-template-columns: auto 1fr auto;
    }
    .account-subtitle {
        display: none;
    }
    .hero {
        grid-template-columns: 1fr;
    }
    .hero-visual {
        min-height: 260px;
    }
    .filters-layout {
        grid-template-columns: 1fr;
    }
    .filter-panel {
        display: none;
    }
    .mobile-only {
        display: inline-flex;
    }
    .checkout-grid {
        grid-template-columns: 1fr;
    }
    .checkout-summary {
        position: static;
    }
    .account-layout {
        grid-template-columns: 1fr;
    }
    .account-nav {
        position: static;
        display: flex;
        overflow: auto;
    }
    .account-nav button {
        min-width: max-content;
    }
    .admin-shell {
        grid-template-columns: 1fr;
    }
    .admin-side {
        position: static;
        height: auto;
    }
    .admin-nav {
        display: flex;
        overflow: auto;
    }
    .admin-nav button {
        min-width: max-content;
    }
}
@media (max-width: 680px) {
    .container {
        width: min(var(--container), calc(100% - 24px));
    }
    .header-main {
        grid-template-columns: auto 1fr auto;
        gap: 5px;
        padding-block: 8px;
    }
    .brand-sub {
        display: none;
    }
    .header-main .search {
        grid-column: 1 / -1;
        grid-row: 2;
    }
    .header-actions {
        justify-content: flex-end;
    }
    .header-action {
        min-width: 36px;
        padding-inline: 5px;
    }
    .account-button {
        padding-inline: 3px;
    }
    .account-title {
        display: none;
    }
    .hero-copy {
        padding: 34px 22px;
    }
    .hero h1 {
        letter-spacing: -2px;
    }
    .hero-visual {
        min-height: 235px;
    }
    .hero-card {
        width: 250px;
        min-height: 250px;
    }
    .hero-card-product {
        height: 130px;
    }
    .service-row {
        grid-template-columns: 1fr 1fr;
    }
    .service {
        border-bottom: 1px solid var(--line);
    }
    .service:nth-child(2) {
        border-right: 0;
    }
    .service:nth-child(3) {
        border-bottom: 0;
    }
    .service:nth-child(4) {
        border-right: 0;
        border-bottom: 0;
    }
    .category-grid {
        grid-template-columns: repeat(4,1fr);
    }
    .category-card {
        min-height: 100px;
    }
    .products-bar {
        grid-template-columns: 1fr auto;
    }
    .toolbar {
        grid-column: 1 / -1;
        justify-content: stretch;
    }
    .toolbar .select {
        flex: 1;
    }
    .product-grid {
        grid-template-columns: repeat(2,1fr);
        gap: 9px;
    }
    .product-grid.list .product-card {
        grid-template-columns: 112px 1fr;
    }
    .product-media {
        height: 165px;
    }
    .product-grid.list .product-media {
        height: 180px;
    }
    .product-buttons {
        grid-template-columns: 1fr;
    }
    .seller-grid {
        grid-template-columns: 1fr;
    }
    .deal-grid {
        grid-template-columns: 1fr 1fr;
    }
    .product-detail {
        grid-template-columns: 1fr;
    }
    .main-image {
        min-height: 310px;
    }
    .gallery {
        grid-template-columns: 1fr;
    }
    .thumb-list {
        grid-template-columns: repeat(5,72px);
        overflow: auto;
    }
    .detail-title {
        font-size: 24px;
    }
    .address-grid,
    .editor-grid,
    .info-grid {
        grid-template-columns: 1fr;
    }
    .editor-grid .full {
        grid-column: auto;
    }
    .kpi-grid {
        grid-template-columns: 1fr 1fr;
    }
    .feature-manifest {
        grid-template-columns: 1fr 1fr;
    }
    .footer-grid {
        grid-template-columns: 1fr 1fr;
    }
    .mobile-bottom {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 90;
        min-height: 59px;
        display: grid;
        grid-template-columns: repeat(5,1fr);
        background: var(--paper);
        border-top: 1px solid var(--line);
        box-shadow: 0 -6px 18px rgba(15,23,42,.08);
    }
    .mobile-bottom button {
        border: 0;
        background: var(--paper);
        color: var(--muted);
        font-size: 9px;
        font-weight: 900;
    }
    .mobile-bottom button:hover,
    .mobile-bottom button.active {
        color: var(--blue);
    }
    body {
        padding-bottom: 59px;
    }
}
@media (max-width: 430px) {
    .category-grid {
        grid-template-columns: 1fr 1fr;
    }
    .deal-grid {
        grid-template-columns: 1fr;
    }
    .service-row {
        grid-template-columns: 1fr;
    }
    .service {
        border-right: 0 !important;
        border-bottom: 1px solid var(--line) !important;
    }
    .service:last-child {
        border-bottom: 0 !important;
    }
    .product-grid {
        grid-template-columns: repeat(2,1fr);
    }
    .product-media {
        height: 145px;
    }
    .feature-manifest {
        grid-template-columns: 1fr;
    }
}

.seller-dashboard {
    display: grid;
    grid-template-columns: 230px 1fr;
    min-height: 70vh;
}
.seller-side {
    position: sticky;
    top: var(--header);
    height: calc(100vh - var(--header));
    padding: 15px 12px;
    overflow: auto;
    background: #15223a;
    color: #d5e1f2;
}
.seller-side-head {
    padding: 10px 10px 16px;
    color: #fff;
}
.seller-side-head b {
    font-size: 21px;
}
.seller-side-head small {
    display: block;
    color: #90a1bb;
    font-size: 8px;
    margin-top: 2px;
}
.seller-nav {
    display: grid;
    gap: 3px;
}
.seller-nav button {
    padding: 9px 10px;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: #aebbd0;
    text-align: left;
    font-size: 9px;
    font-weight: 800;
}
.seller-nav button:hover,
.seller-nav button.active {
    background: #243754;
    color: #fff;
}
.seller-main {
    min-width: 0;
    padding: 20px;
}
.seller-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 15px;
}
.seller-page-title {
    margin: 0;
    font-size: 25px;
}
.seller-status {
    color: var(--muted);
    font-size: 9px;
}
.store-preview {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 14px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: var(--surface);
}
.store-logo {
    width: 90px;
    height: 90px;
    display: grid;
    place-items: center;
    border-radius: 20px;
    background: var(--soft-blue);
    color: var(--blue);
    font-size: 26px;
    font-weight: 950;
}
.seller-card-list {
    display: grid;
    gap: 9px;
}

    display: grid;
    grid-template-columns: 72px 1fr auto;
    gap: 10px;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: var(--paper);
}

    width: 72px;
    height: 72px;
    border-radius: 8px;
    object-fit: contain;
    background: #f5f7fa;
}

    font-size: 10px;
}
.seller-product-mini small {
    display: block;
    color: var(--muted);
    margin-top: 3px;
    font-size: 8px;
}
.notice-box {
    padding: 12px;
    border: 1px solid #d6e4ff;
    border-radius: 9px;
    background: var(--soft-blue);
    color: var(--ink);
    font-size: 9px;
}
.two-col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}
@media (max-width: 920px) {
    .seller-dashboard {
        grid-template-columns: 1fr;
    }
    .seller-side {
        position: static;
        height: auto;
    }
    .seller-nav {
        display: flex;
        overflow: auto;
    }
    .seller-nav button {
        min-width: max-content;
    }
}
@media (max-width: 680px) {
    .two-col {
        grid-template-columns: 1fr;
    }
    .store-preview {
        grid-template-columns: 1fr;
    }
}

    products: [...REAL_PRODUCTS],
    sellers: [
        { id: "SRP Store", name: "SRP Official Store", email: "store@srpshopping.local", status: "Approved", rating: 4.8 },
        { id: "TechHub", name: "TechHub India", email: "techhub@srpshopping.local", status: "Approved", rating: 4.6 }
    ],
    users: [
        { email: ADMIN_EMAIL, name: "SRP Administrator", role: "admin", password: "admin" }
    ],
    orders: [],
    notifications: [],
    reviews: []
};

let user = null;
let state = {
    view: "home",
    search: "",
    category: "",
    sellerFilter: "",
    sort: "popular",
    viewMode: "grid",
    page: 1,
    perPage: 12,
    cart: [],
    wishlist: [],
    compare: [],
    recentlyViewed: [],
    pincode: "110001",
    theme: "light"
};

const store = {
    init() {
        const savedDb = localStorage.getItem(DB_KEY);
        if (savedDb) {
            try { db = JSON.parse(savedDb); } catch(e) {}
        }
        const savedSession = localStorage.getItem(SESSION_KEY);
        if (savedSession) {
            try { user = JSON.parse(savedSession); } catch(e) {}
        }
        const savedTheme = localStorage.getItem(THEME_KEY);
        if (savedTheme) {
            state.theme = savedTheme;
            if (state.theme === 'dark') document.body.classList.add('dark');
        }
        const savedPin = localStorage.getItem(PIN_KEY);
        if (savedPin) state.pincode = savedPin;
        const savedRecent = localStorage.getItem(RECENT_KEY);
        if (savedRecent) {
            try { state.recentlyViewed = JSON.parse(savedRecent); } catch(e) {}
        }

        document.getElementById("themeButton").onclick = () => store.toggleTheme();
        document.getElementById("accountButton").onclick = () => {
            if (user) router.go('account');
            else account.login();
        };
        document.getElementById("cartButton").onclick = () => router.go('cart');
        document.getElementById("wishlistButton").onclick = () => {
            if (user) account.wishlist();
            else account.login();
        };
        document.getElementById("compareButton").onclick = () => account.openCompare();
        document.getElementById("notificationButton").onclick = () => account.openNotifications();
        document.getElementById("locationButton").onclick = () => account.location();

        const searchInput = document.getElementById("globalSearch");
        searchInput.oninput = (e) => {
            state.search = e.target.value;
            store.renderSuggestions();
        };
        searchInput.onkeydown = (e) => {
            if (e.key === 'Enter') {
                store.search();
            }
        };

        store.renderCategories();
        store.renderVendors();
        store.updateBadges();
        router.init();
    },

    save() {
        localStorage.setItem(DB_KEY, JSON.stringify(db));
    },

    toggleTheme() {
        state.theme = state.theme === 'light' ? 'dark' : 'light';
        localStorage.setItem(THEME_KEY, state.theme);
        if (state.theme === 'dark') {
            document.body.classList.add('dark');
        } else {
            document.body.classList.remove('dark');
        }
        store.toast("Theme updated", "success");
    },

    toast(msg, type = "success") {
        const stack = document.getElementById("toastStack");
        if (!stack) return;
        const t = document.createElement("div");
        t.className = `toast ${type}`;
        t.textContent = msg;
        stack.appendChild(t);
        setTimeout(() => {
            t.style.opacity = '0';
            setTimeout(() => t.remove(), 300);
        }, 3000);
    },

    updateBadges() {
        const cartCount = state.cart.reduce((sum, item) => sum + item.qty, 0);
        document.getElementById("cartBadge").textContent = cartCount;
        document.getElementById("wishlistBadge").textContent = state.wishlist.length;
        document.getElementById("compareBadge").textContent = state.compare.length;
        const unread = db.notifications.filter(n => !n.read).length;
        document.getElementById("notificationBadge").textContent = unread;
        document.getElementById("pinHeader").textContent = state.pincode;
        if (user) {
            document.getElementById("accountTitle").textContent = user.name.split(' ')[0];
            document.getElementById("accountSubtitle").textContent = user.role === 'admin' ? 'Admin Portal' : 'My Account';
        } else {
            document.getElementById("accountTitle").textContent = "Hello, Sign in";
            document.getElementById("accountSubtitle").textContent = "Account & Lists";
        }
    },

    renderCategories() {
        const categories = [...new Set(db.products.map(p => p.category))];
        const strip = document.getElementById("categoryStrip");
        if (!strip) return;
        strip.innerHTML = categories.map(cat => `
            <button class="category-button ${state.category === cat ? 'active' : ''}" onclick="store.filterCategory('${cat}')">
                <span>📁</span> ${cat}
            </button>
        `).join('');

        const grid = document.getElementById("categoryGrid");
        if (grid) {
            grid.innerHTML = categories.map(cat => `
                <button class="category-card" onclick="store.filterCategory('${cat}');router.scrollTo('productsSection')">
                    <span class="category-icon">🏷️</span>
                    <span class="category-name">${cat}</span>
                </button>
            `).join('');
        }

        const filterSelect = document.getElementById("sellerFilter");
        if (filterSelect) {
            filterSelect.innerHTML = `<option value="">All sellers</option>` + db.sellers.map(s => `
                <option value="${s.id}" ${state.sellerFilter === s.id ? 'selected' : ''}>${s.name}</option>
            `).join('');
        }
    },

    renderVendors() {
        const grid = document.getElementById("vendorGrid");
        if (!grid) return;
        grid.innerHTML = db.sellers.map(s => `
            <div class="seller-card">
                <div class="seller-avatar">${s.name[0]}</div>
                <div class="seller-name">${s.name}</div>
                <div class="seller-meta">★ ${s.rating} · ${s.status}</div>
                <div class="seller-buttons">
                    <button class="btn btn-outline" onclick="store.filterSeller('${s.id}')">View Store</button>
                </div>
            </div>
        `).join('');
    },

    filterCategory(cat) {
        state.category = state.category === cat ? "" : cat;
        state.page = 1;
        store.renderCategories();
        store.applyQuery();
        router.scrollTo('productsSection');
    },

    filterSeller(sellerId) {
        state.sellerFilter = sellerId;
        state.page = 1;
        store.renderCategories();
        store.applyQuery();
        router.go('home');
        router.scrollTo('productsSection');
    },

    search() {
        const q = document.getElementById("globalSearch").value;
        state.search = q;
        state.page = 1;
        router.go('home');
        router.scrollTo('productsSection');
        store.applyQuery();
    },

    renderSuggestions() {
        const box = document.getElementById("suggestions");
        if (!box) return;
        const q = state.search.trim().toLowerCase();
        if (!q) {
            box.classList.add("hidden");
            return;
        }
        const matches = db.products.filter(p => p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q) || p.category.toLowerCase().includes(q)).slice(0, 5);
        if (matches.length === 0) {
            box.classList.add("hidden");
            return;
        }
        box.innerHTML = matches.map(p => `
            <button class="suggestion" onclick="store.selectSuggestion('${p.id}')">
                <span class="suggestion-icon">🔍</span>
                <div>
                    <div class="suggestion-name">${p.name}</div>
                    <div class="suggestion-meta">${p.brand} · ₹${p.price}</div>
                </div>
                <span>→</span>
            </button>
        `).join('');
        box.classList.remove("hidden");
    },

    selectSuggestion(id) {
        document.getElementById("suggestions").classList.add("hidden");
        store.openProduct(id);
    },

    loadDeals() {
        state.sort = "discount";
        const sortSelect = document.getElementById("sortSelect");
        if (sortSelect) sortSelect.value = "discount";
        store.applyQuery();
    },

    applyQuery() {
        let list = [...db.products];
        if (state.search.trim()) {
            const q = state.search.toLowerCase();
            list = list.filter(p => p.name.toLowerCase().includes(q) || p.brand.toLowerCase().includes(q) || p.category.toLowerCase().includes(q) || (p.description && p.description.toLowerCase().includes(q)));
        }
        if (state.category) {
            list = list.filter(p => p.category === state.category);
        }
        if (state.sellerFilter) {
            list = list.filter(p => p.seller === state.sellerFilter);
        }

        if (state.sort === 'discount') {
            list.sort((a, b) => ((b.mrp - b.price) / b.mrp) - ((a.mrp - a.price) / a.mrp));
        } else if (state.sort === 'price-low') {
            list.sort((a, b) => a.price - b.price);
        } else if (state.sort === 'price-high') {
            list.sort((a, b) => b.price - a.price);
        } else if (state.sort === 'rating') {
            list.sort((a, b) => (b.rating || 0) - (a.rating || 0));
        }

        const countEl = document.getElementById("productCount");
        const gridEl = document.getElementById("productGrid");
        const pagEl = document.getElementById("pagination");
        const summaryEl = document.getElementById("resultSummary");
        const tagEl = document.getElementById("queryFilterTag");

        if (!gridEl) return;

        if (summaryEl) summaryEl.textContent = state.search ? `Results for "${state.search}"` : (state.category ? state.category : "Current SRP catalog");
        if (tagEl) tagEl.textContent = state.search ? `Search: ${state.search}` : (state.category ? `Category: ${state.category}` : "All products");

        const totalPages = Math.ceil(list.length / state.perPage) || 1;
        if (state.page > totalPages) state.page = totalPages;
        const start = (state.page - 1) * state.perPage;
        const pageItems = list.slice(start, start + state.perPage);

        if (countEl) countEl.textContent = `${list.length} products available`;

        if (pageItems.length === 0) {
            gridEl.innerHTML = `
                <div class="empty" style="grid-column: 1/-1">
                    <div class="empty-icon">📦</div>
                    <div class="empty-title">No products found</div>
                    <div class="empty-copy">Try searching for another brand, category or keyword.</div>
                </div>
            `;
            if (pagEl) pagEl.innerHTML = "";
            return;
        }

        gridEl.className = `product-grid ${state.viewMode}`;
        gridEl.innerHTML = pageItems.map(p => {
            const discount = Math.round(((p.mrp - p.price) / p.mrp) * 100);
            const isWish = state.wishlist.includes(p.id);
            const isCompare = state.compare.includes(p.id);
            return `
                <div class="product-card">
                    <button class="product-wish ${isWish ? 'active' : ''}" onclick="store.toggleWishlist('${p.id}')" title="Wishlist">♡</button>
                    <button class="product-compare ${isCompare ? 'active' : ''}" onclick="store.toggleCompare('${p.id}')" title="Compare">⇄</button>
                    <div class="product-media" onclick="store.openProduct('${p.id}')">
                        <img src="${p.images[0]}" alt="${p.name}">
                    </div>
                    <div class="product-body">
                        <div class="product-brand">${p.brand}</div>
                        <div class="product-name" onclick="store.openProduct('${p.id}')" style="cursor:pointer">${p.name}</div>
                        <div style="margin-top:6px"><span class="rating-pill">★ ${p.rating || 4.2}</span></div>
                        <div class="price">₹${p.price.toLocaleString('en-IN')}<span class="mrp">₹${p.mrp.toLocaleString('en-IN')}</span><span class="discount">${discount}% off</span></div>
                        <div class="product-seller">Sold by ${p.seller || 'SRP Official Store'}</div>
                        <div class="product-buttons">
                            <button class="btn btn-outline" onclick="store.openProduct('${p.id}')">View</button>
                            <button class="btn btn-primary" onclick="store.addToCart('${p.id}')">Add to Cart</button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');

        if (pagEl) {
            let pagHtml = "";
            for (let i = 1; i <= totalPages; i++) {
                pagHtml += `<button class="page-btn ${state.page === i ? 'active' : ''}" onclick="state.page=${i};store.applyQuery();router.scrollTo('productsSection')">${i}</button>`;
            }
            pagEl.innerHTML = pagHtml;
        }
    },

    toggleWishlist(id) {
        const idx = state.wishlist.indexOf(id);
        if (idx > -1) {
            state.wishlist.splice(idx, 1);
            store.toast("Removed from wishlist", "warning");
        } else {
            state.wishlist.push(id);
            store.toast("Added to wishlist", "success");
        }
        store.updateBadges();
        store.applyQuery();
    },

    toggleCompare(id) {
        const idx = state.compare.indexOf(id);
        if (idx > -1) {
            state.compare.splice(idx, 1);
            store.toast("Removed from comparison", "warning");
        } else {
            if (state.compare.length >= 4) {
                store.toast("You can compare up to 4 products", "error");
                return;
            }
            state.compare.push(id);
            store.toast("Added to comparison", "success");
        }
        store.updateBadges();
        store.applyQuery();
    },

    addToCart(id) {
        const product = db.products.find(p => p.id === id);
        if (!product) return;
        const existing = state.cart.find(item => item.id === id);
        if (existing) {
            existing.qty += 1;
        } else {
            state.cart.push({ ...product, qty: 1 });
        }
        store.updateBadges();
        store.toast(`Added "${product.name.slice(0, 25)}..." to cart`, "success");
    },

    openProduct(id) {
        const p = db.products.find(item => item.id === id);
        if (!p) return;
        
        if (!state.recentlyViewed.includes(id)) {
            state.recentlyViewed.unshift(id);
            if (state.recentlyViewed.length > 12) state.recentlyViewed.pop();
            localStorage.setItem(RECENT_KEY, JSON.stringify(state.recentlyViewed));
        }

        const modal = document.createElement("div");
        modal.className = "modal-wrap";
        modal.innerHTML = `
            <div class="modal wide" role="dialog" aria-modal="true" aria-label="Product Details">
                <div class="modal-head">
                    <h3 class="modal-title">Product Overview</h3>
                    <button class="close" onclick="this.closest('.modal-wrap').remove()">×</button>
                </div>
                <div class="modal-body">
                    <div class="product-detail">
                        <div class="gallery">
                            <div class="thumb-list">
                                ${p.images.map((img, idx) => `
                                    <button class="thumb ${idx === 0 ? 'active' : ''}" onclick="document.getElementById('modalMainImage').src='${img}';this.parentElement.querySelectorAll('.thumb').forEach(t=>t.classList.remove('active'));this.classList.add('active')">
                                        <img src="${img}" alt="Thumb">
                                    </button>
                                `).join('')}
                            </div>
                            <div class="main-image">
                                <img id="modalMainImage" src="${p.images[0]}" alt="${p.name}">
                            </div>
                        </div>
                        <div>
                            <div class="detail-brand">${p.brand} · SKU: ${p.sku || 'SRP-SKU'}</div>
                            <h2 class="detail-title">${p.name}</h2>
                            <div style="margin-top:6px"><span class="rating-pill">★ ${p.rating || 4.3}</span> <span style="font-size:10px;color:var(--muted);margin-left:8px">Sold by ${p.seller || 'SRP Official Store'}</span></div>
                            <div class="detail-price">₹${p.price.toLocaleString('en-IN')}<span class="mrp">₹${p.mrp.toLocaleString('en-IN')}</span></div>
                            <p class="detail-copy">${p.description}</p>
                            
                            <div style="margin-top:14px">
                                <strong>Key Highlights:</strong>
                                <ul style="margin:5px 0 0 16px;font-size:11px;color:var(--muted)">
                                    ${(p.highlights || ['Verified quality', 'Warranty included', 'Fast delivery']).map(h => `<li>${h}</li>`).join('')}
                                </ul>
                            </div>

                            <div class="detail-actions">
                                <button class="btn btn-outline" onclick="store.addToCart('${p.id}');this.closest('.modal-wrap').remove();router.go('cart')">Buy Now</button>
                                <button class="btn btn-primary" onclick="store.addToCart('${p.id}');this.closest('.modal-wrap').remove()">Add to Cart</button>
                            </div>

                            <div class="source-box">
                                <strong>Source Trace & Manufacturer Link:</strong><br>
                                <a href="${p.source || '#'}" target="_blank" rel="noopener" style="text-decoration:underline">${p.source || 'SRP Marketplace Verified'}</a><br>
                                <small>${FEATURE_SOURCE_NOTE}</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
    }
};

const router = {
    init() {
        const gridBtn = document.getElementById("gridButton");
        const listBtn = document.getElementById("listButton");
        if (gridBtn && listBtn) {
            gridBtn.onclick = () => {
                state.viewMode = "grid";
                gridBtn.className = "view-button btn-primary";
                listBtn.className = "view-button";
                store.applyQuery();
            };
            listBtn.onclick = () => {
                state.viewMode = "list";
                listBtn.className = "view-button btn-primary";
                gridBtn.className = "view-button";
                store.applyQuery();
            };
        }

        const sortSelect = document.getElementById("sortSelect");
        if (sortSelect) {
            sortSelect.onchange = (e) => {
                state.sort = e.target.value;
                store.applyQuery();
            };
        }

        router.go('home');
    },

    go(view) {
        state.view = view;
        const main = document.getElementById("app");
        if (!main) return;
        window.scrollTo(0, 0);

        if (view === 'home') {
            const template = document.getElementById("homeTemplate");
            main.innerHTML = "";
            main.appendChild(template.content.cloneNode(true));
            store.renderCategories();
            store.renderVendors();
            store.applyQuery();

            if (db.products.length > 0) {
                const feat = db.products[0];
                const imgEl = document.getElementById("heroProductImage");
                const nameEl = document.getElementById("heroProductName");
                const metaEl = document.getElementById("heroProductMeta");
                if (imgEl) imgEl.src = feat.images[0];
                if (nameEl) nameEl.textContent = feat.name;
                if (metaEl) metaEl.textContent = `${feat.brand} · ₹${feat.price.toLocaleString('en-IN')}`;
            }
        } else if (view === 'cart') {
            cartPage.render(main);
        } else if (view === 'checkout') {
            checkoutPage.render(main);
        } else if (view === 'account') {
            if (!user) { account.login(); return; }
            accountPage.render(main);
        } else if (view === 'seller') {
            sellerPage.render(main);
        } else if (view === 'admin') {
            adminPage.render(main);
        }
    },

    scrollTo(id) {
        const el = document.getElementById(id);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
    }
};

                            <div class="total-row"><span>Items Subtotal</span> <strong>₹${subtotal.toLocaleString('en-IN')}</strong></div>

                            <div class="total-row"><span>Estimated Shipping</span> <strong>${shipping === 0 ? 'FREE' : '₹' + shipping}</strong></div>

    updateQty(id, qty) {
        if (qty <= 0) {
            cartPage.removeItem(id);
            return;
        }

        if (item) item.qty = qty;
        store.updateBadges();
        cartPage.render(document.getElementById("app"));
    },

    removeItem(id) {
        state.cart = state.cart.filter(i => i.id !== id);
        store.updateBadges();
        store.toast("Item removed from cart", "warning");
        cartPage.render(document.getElementById("app"));

    handleLogin(e, form) {
        e.preventDefault();
        const fd = new FormData(form);
        const email = fd.get('email');
        const pass = fd.get('password');
        
        const found = db.users.find(u => u.email === email && u.password === pass);
        if (found) {
            user = found;
            localStorage.setItem(SESSION_KEY, JSON.stringify(user));
            form.closest('.modal-wrap').remove();
            store.updateBadges();
            store.toast("Signed in successfully", "success");
            router.go('account');
        } else {
            store.toast("Invalid email or password", "error");
        }
    },

    handleRegister(e, form) {
        e.preventDefault();
        const fd = new FormData(form);
        const newUser = {
            name: fd.get('name'),
            email: fd.get('email'),
            password: fd.get('password'),
            role: 'customer'
        };
        db.users.push(newUser);
        store.save();
        form.closest('.modal-wrap').remove();
        user = newUser;
        localStorage.setItem(SESSION_KEY, JSON.stringify(user));
        store.updateBadges();
        store.toast("Account registered successfully", "success");
        router.go('account');
    },

    logout() {
        user = null;
        localStorage.removeItem(SESSION_KEY);
        store.updateBadges();
        router.go('home');

            category: fd.get('category'),

            mrp: Number(fd.get('mrp')),
            stock: Number(fd.get('stock')),
            sku: 'SRP-' + Math.floor(1000 + Math.random() * 9000),
            rating: 4.5,
            images: [fd.get('image')],
            description: fd.get('description'),
            highlights: ["Verified seller listing", "Quality tested", "Fast delivery"],
            source: "SRP Marketplace Seller Center"
        };
        db.products.unshift(newProduct);
        store.save();
        store.toast("Product published successfully!", "success");
        sellerPage.tab('products');

        db.products = db.products.filter(p => p.id !== id);

};

                            </table>
                        </div>
                    `}
                </div>
            `;
        } else if (name === 'logs') {
            main.innerHTML = `
                <div class="admin-topbar">
                    <div>
                        <h2 class="admin-title">Audit & System Logs</h2>
                        <div class="admin-copy">Security audits and notification logs.</div>
                    </div>
                </div>
                <div class="panel">
                    <div class="data-list">
                        ${db.notifications.map(n => `
                            <div class="data-item">
                                <strong>${n.title}</strong>
                                <small>${n.text} —${n.date}</small>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }
    },

    deleteProduct(id) {
        db.products = db.products.filter(p => p.id !== id);
        store.save();
        store.toast("Product removed by admin", "warning");
        adminPage.tab('products');
    }
};

window.onload = () => {
    store.init();
};
</script>
</body>
</html>
