<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>SRP SHOPPING | Home</title>
    <style>
        :root {
            --srp-blue: #0047AB;
            --srp-white: #ffffff;
            --srp-light-bg: #f4f7f6;
        }
        body { background-color: var(--srp-light-bg); font-family: 'Inter', sans-serif; }
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: var(--srp-white); border-top: 1px solid #e2e8f0; z-index: 1000; }
        .admin-glow { box-shadow: 0 0 15px rgba(0, 71, 171, 0.2); }
        .banner-gradient { background: linear-gradient(90deg, #0047AB 0%, #007FFF 100%); }
    </style>
</head>
<body class="pb-20">

    <header class="sticky top-0 bg-[#0047AB] text-white p-3 z-50 shadow-md">
        <div class="container mx-auto flex flex-col gap-3">
            <div class="flex justify-between items-center">
                <button onclick="handleLogoTap()" class="text-xl font-bold tracking-tighter">
                    SRP SHOPPING
                </button>
                
                <div class="flex items-center gap-4 text-sm">
                    <button onclick="location.href='/privacy'" class="hover:underline">Privacy Policy</button>
                    <div class="bg-white/20 px-3 py-1 rounded-full flex items-center gap-2">
                        <i class="fas fa-wallet text-yellow-400"></i>
                        <span id="wallet-balance">₹0.00</span>
                    </div>
                </div>
            </div>

            <div class="relative">
                <input type="text" placeholder="Search products, brands and more..." 
                       class="w-full py-2 px-4 pr-10 rounded text-black focus:outline-none">
                <i class="fas fa-search absolute right-3 top-3 text-gray-400"></i>
            </div>
        </div>
    </header>

    <main class="container mx-auto p-4">
        
        <section id="promo-banner" class="mb-6">
            <div class="banner-gradient rounded-xl p-6 text-white flex justify-between items-center shadow-lg">
                <div>
                    <h2 class="text-2xl font-black italic">SRP EXCLUSIVE</h2>
                    <p class="text-sm opacity-90 font-medium">Get up to 60% OFF on all Tech Accessories</p>
                    <button class="mt-3 bg-white text-[#0047AB] px-5 py-2 rounded-lg font-bold text-xs uppercase shadow-sm">
                        Shop Now
                    </button>
                </div>
                <div class="hidden sm:block">
                    <i class="fas fa-shopping-bag text-6xl opacity-20"></i>
                </div>
            </div>
        </section>

        <h3 class="font-bold text-gray-800 mb-4 px-1">Top Offers for You</h3>
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-3 rounded-lg shadow-sm border border-gray-100">
                <div class="h-40 bg-gray-100 rounded mb-2 flex items-center justify-center">
                    <i class="fas fa-image text-gray-300 text-3xl"></i>
                </div>
                <p class="text-xs text-gray-500">Brand Name</p>
                <h4 class="text-sm font-semibold truncate">Premium Wireless Headphones</h4>
                <div class="flex items-center gap-2 mt-1">
                    <span class="text-blue-700 font-bold">₹1,299</span>
                    <span class="text-[10px] line-through text-gray-400">₹2,499</span>
                </div>
            </div>
            </div>
    </main>

    <nav class="bottom-nav h-16 flex items-center justify-around px-2">
        <button onclick="navTo('home')" class="flex flex-col items-center gap-1 text-[#0047AB]">
            <i class="fas fa-home text-xl"></i>
            <span class="text-[10px] font-bold">Home</span>
        </button>
        <button onclick="navTo('profile')" class="flex flex-col items-center gap-1 text-gray-500">
            <i class="fas fa-user text-xl"></i>
            <span class="text-[10px] font-medium">Account</span>
        </button>
        <button onclick="navTo('wallet')" class="flex flex-col items-center gap-1 text-gray-500">
            <i class="fas fa-wallet text-xl"></i>
            <span class="text-[10px] font-medium">Wallet</span>
        </button>
        <button onclick="navTo('seller')" class="flex flex-col items-center gap-1 text-gray-500">
            <i class="fas fa-store text-xl"></i>
            <span class="text-[10px] font-medium">Seller</span>
        </button>
        <button onclick="navTo('cart')" class="flex flex-col items-center gap-1 text-gray-500 relative">
            <i class="fas fa-shopping-cart text-xl"></i>
            <span class="text-[10px] font-medium">Cart</span>
            <span class="absolute -top-1 right-0 bg-red-500 text-white text-[8px] rounded-full w-4 h-4 flex items-center justify-center">0</span>
        </button>
        <button onclick="navTo('ai')" class="flex flex-col items-center gap-1 text-gray-500">
            <i class="fas fa-robot text-xl text-blue-400"></i>
            <span class="text-[10px] font-medium">AI Support</span>
        </button>
    </nav>

    <script>
        // ADMIN CONFIGURATION
        const ADMIN_EMAILS = ['Srpstudio1@gmail.com', 'subhashrajpurohit10@gmail.com'];
        let currentUserEmail = "subhashrajpurohit10@gmail.com"; // Replace with your Firebase Auth logic

        function handleLogoTap() {
            if (ADMIN_EMAILS.includes(currentUserEmail)) {
                const pass = prompt("Enter Admin Security PIN:");
                if (pass === "1234") { // Replace with your real logic
                    alert("Welcome Admin. Opening Control Panel...");
                    window.location.href = "/admin-dashboard";
                } else {
                    alert("Access Denied.");
                    window.location.reload();
                }
            } else {
                // Ordinary user behavior
                window.location.reload();
            }
        }

        function navTo(page) {
            console.log("Navigating to: " + page);
            // Link your routing logic here
        }

        // Mock Wallet Update
        document.getElementById('wallet-balance').innerText = "₹450.00";
    </script>
</body>
</html>
