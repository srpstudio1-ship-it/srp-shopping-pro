/* Production checkout: payment must be verified before order creation becomes final. */
const originalCheckoutOpen=checkout.open.bind(checkout);
checkout.open=function(){originalCheckoutOpen(); if(user && state.route==='payment') setTimeout(()=>checkout.render(),0);};
checkout.render=function(){
 if(!user){account.login();return;}
 const t=checkout.totals(); const a=state.checkoutAddress||{}; state.route='payment'; renderHeaderCategories();
 el("app").innerHTML=`<section class="page-shell"><div class="container"><div class="workspace-topbar"><div><div class="section-kicker">SECURE CHECKOUT</div><h1 class="workspace-title">Checkout & payment</h1><p class="workspace-copy">Your order is finalized only after the payment gateway confirms the transaction on the server.</p></div><button class="btn btn-outline" onclick="router.go('cart')">Back to cart</button></div><div class="checkout-grid"><div class="workspace-panel">${checkout.stepMarkup()}</div><aside class="checkout-summary workspace-panel"><h3 style="margin-top:0">Order summary</h3>${t.lines.map(line=>`<div class="total-row"><span>${escapeHtml(line.product.name)} × ${line.quantity}</span><strong>${money(line.lineTotal)}</strong></div>`).join("")}<div class="total-row"><span>Subtotal</span><strong>${money(t.subtotal)}</strong></div><div class="total-row"><span>Discount</span><strong>−${money(t.discount)}</strong></div><div class="total-row"><span>Shipping</span><strong>${t.shipping?money(t.shipping):'FREE'}</strong></div><div class="total-row"><span>Tax</span><strong>${money(t.tax)}</strong></div><div class="total-row grand"><span>Total</span><strong>${money(t.total)}</strong></div></aside></div></div></section>`;
};
checkout.addressStep=function(){const a=state.checkoutAddress||{};return `<div class="form"><div class="section-kicker">STEP 1</div><h2>Delivery address</h2><div class="address-grid"><label>Full name<input id="coName" class="input" value="${escapeHtml(a.name||user.name||"")}"></label><label>Phone<input id="coPhone" class="input" inputmode="numeric" value="${escapeHtml(a.phone||"")}"></label></div><label>Address line 1<input id="coLine1" class="input" value="${escapeHtml(a.line1||"")}"></label><label>Address line 2<input id="coLine2" class="input" value="${escapeHtml(a.line2||"")}"></label><div class="address-grid"><label>City<input id="coCity" class="input" value="${escapeHtml(a.city||"")}"></label><label>State<input id="coState" class="input" value="${escapeHtml(a.state||"")}"></label></div><label>Pincode<input id="coPin" class="input" maxlength="6" inputmode="numeric" value="${escapeHtml(a.pincode||localStorage.getItem(PIN_KEY)||"")}"></label><button class="btn btn-primary" onclick="checkout.nextAddress()">Continue to payment</button></div>`;};
checkout.nextAddress=function(){const address={id:state.checkoutAddress?.id||uid('address'),name:el('coName').value.trim(),phone:el('coPhone').value.trim(),line1:el('coLine1').value.trim(),line2:el('coLine2').value.trim(),city:el('coCity').value.trim(),state:el('coState').value.trim(),pincode:el('coPin').value.trim(),default:false};if(!address.name||!address.phone||!address.line1||!address.city||!address.state||!/^[0-9]{6}$/.test(address.pincode)){toast('Complete the address with a valid 6-digit pincode.','error');return;}state.checkoutAddress=address;localStorage.setItem(PIN_KEY,address.pincode);const addresses=state.db.addresses[user.id]||(state.db.addresses[user.id]=[]);const old=addresses.findIndex(x=>x.id===address.id);if(old>=0)addresses[old]=address;else addresses.push(address);persist();state.checkoutStep=2;checkout.render();};
checkout.paymentStep=function(){return `<div class="form"><div class="section-kicker">STEP 2</div><h2>Choose a verified payment route</h2><div class="payment-card"><label><input type="radio" name="pay" value="Razorpay" ${state.checkoutPayment==='Razorpay'?'checked':''}> <span class="payment-title">Razorpay + UPI</span><span class="payment-copy">Production gateway. UPI, card, net banking and supported methods are handled by Razorpay Checkout.</span></label><label><input type="radio" name="pay" value="Stripe" ${state.checkoutPayment==='Stripe'?'checked':''}> <span class="payment-title">Stripe</span><span class="payment-copy">Use Stripe as a supported card/online payment fallback when configured.</span></label></div><div class="notice-box"><strong>UPI:</strong> ${escapeHtml(srpProductionConfig.upiId)}<br><strong>Merchant payment link:</strong> <a href="${escapeHtml(srpProductionConfig.razorpayPaymentLink)}" target="_blank" rel="noopener">${escapeHtml(srpProductionConfig.razorpayPaymentLink)}</a><br><small>Opening the static link does not place an order. Only server-verified payments unlock order finalization.</small></div><label>Coupon code<div style="display:flex;gap:8px"><input id="couponInput" class="input" value="${escapeHtml(state.checkoutCoupon||"")}" placeholder="WELCOME10"><button class="btn btn-outline" onclick="checkout.applyCoupon()">Apply</button></div></label><div style="display:flex;gap:8px"><button class="btn btn-outline" onclick="state.checkoutStep=1;checkout.render()">Back</button><button class="btn btn-primary" onclick="checkout.nextPayment()">Review secure payment</button></div></div>`;};
checkout.nextPayment=function(){state.checkoutPayment=document.querySelector('input[name="pay"]:checked')?.value||'Razorpay';state.checkoutStep=3;checkout.render();};
checkout.reviewStep=function(){const t=checkout.totals();return `<div class="form"><div class="section-kicker">STEP 3</div><h2>Final review</h2><div class="ws-kpis"><div class="ws-kpi"><span>Payment</span><b>${escapeHtml(state.checkoutPayment)}</b></div><div class="ws-kpi"><span>Total</span><b>${money(t.total)}</b></div><div class="ws-kpi"><span>Delivery</span><b>${escapeHtml(state.checkoutAddress.pincode||'')}</b></div><div class="ws-kpi"><span>Order state</span><b>PAYMENT REQUIRED</b></div></div><div class="notice-box"><strong>No payment = no order.</strong> SRP Shopping will not reduce stock, create a final order, or start delivery until the production server verifies the gateway transaction.</div><button id="securePayButton" class="btn btn-primary btn-large" onclick="checkout.placeOrder()">Pay securely & place order</button></div>`;};
checkout.placeOrder=async function(){
 const items=getCart(); if(!items.length){toast('Your cart is empty.','error');return;} if(!srpServerAvailable||!srpToken()){toast('Production checkout needs the deployed SRP backend and a signed-in server session.','error');return;}
 try{
  srpAsyncButton('securePayButton',true,'Preparing secure payment...');
  const payload={items:items.map(x=>({productId:x.productId,quantity:x.quantity})),address:state.checkoutAddress,coupon:state.checkoutCoupon||"",paymentMethod:state.checkoutPayment};
  if(state.checkoutPayment==='Stripe'){
    const data=await srpApi('/api/payments/stripe/create-session',{method:'POST',body:JSON.stringify(payload)});
    window.location.href=data.checkout_url; return;
  }
  const data=await srpApi('/api/payments/razorpay/create',{method:'POST',body:JSON.stringify(payload)});
  await loadScript('https://checkout.razorpay.com/v1/checkout.js');
  const rzp=new Razorpay({key:data.key,amount:data.amount,currency:data.currency,name:'SRP Shopping',description:`Order ${data.order_number}`,order_id:data.razorpay_order_id,prefill:{name:user.name,email:user.email,contact:state.checkoutAddress.phone},notes:{order_number:data.order_number},theme:{color:'#111827'},handler:async function(resp){try{await srpApi('/api/payments/razorpay/verify',{method:'POST',body:JSON.stringify({...resp,order_id:data.order_id})});await checkout.waitForVerifiedOrder(data.order_id);}catch(err){toast(err.message,'error');}},modal:{ondismiss:function(){toast('Payment window closed. The order remains unplaced until payment succeeds.','info');}}});
  rzp.open();
 }catch(err){toast(err.message,'error');}finally{srpAsyncButton('securePayButton',false,'Pay securely & place order');}
};
checkout.waitForVerifiedOrder=async function(orderId){
 for(let i=0;i<30;i++){const order=await srpApi(`/api/orders/${encodeURIComponent(orderId)}`);if(order.status==='paid'||order.payment_status==='captured'){srpSyncOrder(order);state.db.carts[user.id]=[];persist();updateHeader();toast('Payment verified. Order placed successfully.','success');openOrderSuccess({...order,paymentStatus:'captured',status:'confirmed'});return;}if(order.status==='failed'||order.payment_status==='failed'){throw new Error('Payment was not captured. The order was not placed.');}await new Promise(r=>setTimeout(r,1000));}
 throw new Error('Payment verification is still pending. No final order was created. Refresh order status after the webhook arrives.');
};

/* Backend-backed login/register when available; local fallback remains for browsing/testing but production payment blocks without the server session. */
const localSubmitLogin=account.submitLogin.bind(account); const localSubmitRegister=account.submitRegister.bind(account);
account.submitLogin=async function(){
 const email=el('loginEmail')?.value.trim().toLowerCase(); const password=el('loginPassword')?.value||'';
 if(srpServerAvailable){try{const data=await srpApi('/api/auth/login',{method:'POST',body:JSON.stringify({email,password})});localStorage.setItem(SRP_AUTH_KEY,data.token);srpLocalUserFromServer(data.user);closeModal();toast(`Welcome ${data.user.name}.`,'success');router.go('home');return;}catch(err){toast(err.message,'error');return;}}
 return localSubmitLogin();
};
account.submitRegister=async function(){
 const name=el('registerName')?.value.trim(); const email=el('registerEmail')?.value.trim().toLowerCase(); const password=el('registerPassword')?.value||''; const confirm=el('registerConfirm')?.value||'';
 if(srpServerAvailable){if(!name||!email||password.length<8||password!==confirm){toast('Enter a valid name, email and matching 8+ character password.','error');return;}try{const data=await srpApi('/api/auth/register',{method:'POST',body:JSON.stringify({name,email,password})});localStorage.setItem(SRP_AUTH_KEY,data.token);srpLocalUserFromServer(data.user);closeModal();toast('Account created successfully.','success');router.go('home');return;}catch(err){toast(err.message,'error');return;}}
 return localSubmitRegister();
};
const originalLogout=account.logout.bind(account);account.logout=function(){localStorage.removeItem(SRP_AUTH_KEY);try{srpApi('/api/auth/logout',{method:'POST'}).catch(()=>{});}catch(e){} originalLogout();};

/* Keep the new home controls compatible with the original product store. */
const originalRenderHome=renderHome; renderHome=function(){document.body.classList.remove('srp-admin');originalRenderHome();const sf=el('sellerFilter');if(sf){const sellers=state.db.sellers.filter(s=>s.status==='approved');sf.innerHTML='<option value="">All sellers</option>'+sellers.map(s=>`<option value="${escapeHtml(s.id)}">${escapeHtml(s.store)}</option>`).join('');sf.value=state.sellerFilter||'';}const tag=el('queryFilterTag');if(tag)tag.textContent=state.query?`Search: ${state.query}`:state.category?`Category: ${state.category}`:'All products';};

/* Account and seller feature totals are visible in dashboards and easy to verify. */
window.addEventListener('DOMContentLoaded',async()=>{
 await srpLoadConfig();
 try{
   const token=srpToken(); if(token){const data=await srpApi('/api/auth/me');srpLocalUserFromServer(data.user);} 
 }catch(e){localStorage.removeItem(SRP_AUTH_KEY);}
 if(user) await srpRefreshWallet();
 const qs=new URLSearchParams(location.search); const returnOrder=qs.get('srp_order'); if(returnOrder && srpToken()){try{await checkout.waitForVerifiedOrder(returnOrder);}catch(e){toast(e.message,'error');}}
});
</script>


<script id="srp-ultimate-ui-runtime-v4">
(() => {
    const UI4 = {
        version: "2026.09.21.4",
        featureCounts: {
            home: 10,
            account: 40,
            seller: 30,
            admin: 50
        },
        labels: {
            home: "Marketplace",
            account: "Manage Account",
            seller: "Seller Center",
            admin: "Admin Console"
        },
        groups: {
            account: [
                ["ACCOUNT", ["overview", "profile", "security", "password", "twofactor", "addresses"]],
                ["ORDERS & SHOPPING", ["orders", "tracking", "returns", "refunds", "invoices", "buyagain", "wishlist", "saved", "recent", "compare", "reviews", "notifications"]],
                ["PREFERENCES", ["communications", "language", "appearance", "privacy", "export", "sessions", "delete"]],
                ["SELLER", ["seller", "sellerStatus", "giftcards"]],
                ["WALLET & PAYMENTS", ["wallet", "walletAdd", "walletTx", "walletRefunds", "walletCashback", "walletCoupons", "payments", "autotopup", "walletSecurity", "walletStatement"]],
                ["SUPPORT", ["support", "feedback"]]
            ],
            seller: [
                ["OVERVIEW", ["dashboard", "profile", "kyc", "approval"]],
                ["CATALOG", ["products", "editProduct", "status", "inventory", "lowstock", "sku", "category", "pricing", "media", "specifications"]],
                ["FULFILLMENT", ["orders", "orderStatus", "tracking", "shipping", "returns"]],
                ["GROWTH", ["coupons", "earnings", "commission", "reviews", "notifications", "preview", "export", "bulk", "pricingRules", "customers", "payouts"]]
            ],
            admin: [
                ["SECURITY", ["security", "password", "roles", "permissions"]],
                ["CUSTOMERS & SELLERS", ["customers", "customerBlock", "sellers", "sellerApproval", "verification", "support"]],
                ["CATALOG", ["products", "addProduct", "editProduct", "categories", "inventory", "lowstock", "content"]],
                ["ORDERS & MONEY", ["orders", "orderStatus", "cancellations", "refunds", "payments", "tax", "coupons", "payouts", "disputes", "returns", "fraud"]],
                ["MARKETPLACE CONTENT", ["banners", "hero", "featured", "reviews", "moderation", "notifications"]],
                ["ANALYTICS & DATA", ["analytics", "sales", "export", "backup", "restore", "retention", "import", "seo"]],
                ["PLATFORM OPERATIONS", ["shipping", "audit", "appearance", "maintenance", "health", "webhooks", "database"]]
            ]
        }
    };

    window.SRP_UI_V4 = UI4;

    const qs = (selector, root = document) => root.querySelector(selector);
    const qsa = (selector, root = document) => Array.from(root.querySelectorAll(selector));

    function currentUserLabel() {
        if (typeof user === "undefined" || !user) {
            return "Guest shopper";
        }
        return String(user.name || "Shopper");
    }

    function escapeAttr(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
    }

    function menuByKey(menu) {
        return new Map(menu.map(item => [item[0], item]));
    }

    function groupedMenuHtml(menu, scope) {
        const lookup = menuByKey(menu);
        const groups = UI4.groups[scope] || [];
        const emitted = new Set();
        const sections = [];

        groups.forEach(([title, keys]) => {
            const rows = [];
            keys.forEach(key => {
                const item = lookup.get(key);
                if (!item) {
                    return;
                }
                if (emitted.has(key)) {
                    return;
                }
                emitted.add(key);
                rows.push(item);
            });
            if (!rows.length) {
                return;
            }
            sections.push(`
                <div class="workspace-nav-group">
                    <div class="workspace-nav-group-title">${escapeHtml(title)}</div>
                    ${rows.map(([key, label, icon]) => {
                        const selected = state[scope + "Section"] === key;
                        const handler = scope === "account"
                            ? "accountNavKey"
                            : scope === "seller"
                                ? "sellerNavKey"
                                : "adminNavKey";
                        return `
                            <button
                                type="button"
                                data-ws-label="${escapeAttr(String(label).toLowerCase())}"
                                class="${selected ? "active" : ""}"
                                onclick="${handler}('${escapeAttr(key)}')"
                                aria-current="${selected ? "page" : "false"}"
                                title="${escapeAttr(label)}"
                            >
                                <span class="ws-icon">${icon}</span>
                                <span>${escapeHtml(label)}</span>
                            </button>
                        `;
                    }).join("")}
                </div>
            `);
        });

        menu.forEach(([key, label, icon]) => {
            if (emitted.has(key)) {
                return;
            }
            const selected = state[scope + "Section"] === key;
            const handler = scope === "account"
                ? "accountNavKey"
                : scope === "seller"
                    ? "sellerNavKey"
                    : "adminNavKey";
            sections.push(`
                <div class="workspace-nav-group">
                    <div class="workspace-nav-group-title">MORE</div>
                    <button
                        type="button"
                        data-ws-label="${escapeAttr(String(label).toLowerCase())}"
                        class="${selected ? "active" : ""}"
                        onclick="${handler}('${escapeAttr(key)}')"
                        aria-current="${selected ? "page" : "false"}"
                        title="${escapeAttr(label)}"
                    >
                        <span class="ws-icon">${icon}</span>
                        <span>${escapeHtml(label)}</span>
                    </button>
                </div>
            `);
            emitted.add(key);
        });

        return sections.join("");
    }

    function scopeStatus(scope) {
        if (scope === "admin") {
            return {
                primary: "Protected",
                secondary: admin && admin.allowed && admin.allowed() ? "Session unlocked" : "Locked",
                good: Boolean(admin && admin.allowed && admin.allowed())
            };
        }
        if (scope === "seller") {
            const record = seller && seller.current ? seller.current() : null;
            return {
                primary: record ? String(record.status || "unknown") : "Not signed in",
                secondary: srpServerAvailable ? "Backend connected" : "Local workspace",
                good: Boolean(record && record.status === "approved")
            };
        }
        return {
            primary: user ? "Signed in" : "Guest",
            secondary: srpServerAvailable ? "Backend connected" : "Browser mode",
            good: Boolean(user)
        };
    }

    function statusGrid(scope) {
        const status = scopeStatus(scope);
        const payment = srpProductionConfig || {};
        const paymentRzp = Boolean(payment.razorpayConfigured);
        const paymentStripe = Boolean(payment.stripeConfigured);
        const shipping = String(payment.shippingProvider || "shiprocket");
        const items = [
            ["Account", status.primary, status.good],
            ["Backend", srpServerAvailable ? "ONLINE" : "OFFLINE", srpServerAvailable],
            ["Razorpay", paymentRzp ? "READY" : "CONFIGURE", paymentRzp],
            [shipping, paymentStripe ? "Stripe + gateway" : "Server shipping", Boolean(shipping)]
        ];
        return `
            <div class="srp-v4-status-grid">
                ${items.map(([label, value, ok]) => `
                    <div class="srp-v4-status ${ok ? "is-ok" : "is-warn"}">
                        <span class="srp-v4-status-dot"></span>
                        <strong>${escapeHtml(label)}</strong>
                        <span>${escapeHtml(value)}</span>
                    </div>
                `).join("")}
            </div>
        `;
    }

    function workspaceToolbar(scope) {
        return `
            <div class="workspace-toolbar">
                <button class="btn btn-outline workspace-mobile-menu" type="button" onclick="srpUiMobileMenu('${scope}')">☰ Menu</button>
                <button class="btn btn-outline" type="button" onclick="srpUiToggleSidebar()">◫ Sidebar</button>
                <button class="btn btn-outline" type="button" onclick="srpUiToggleFocus()">⛶ Focus</button>
                <button class="btn btn-outline" type="button" onclick="srpUiFeatureManifest('${scope}')">▤ Features</button>
                <button class="btn btn-outline" type="button" onclick="srpUiScrollTop()">↑ Top</button>
            </div>
        `;
    }

    function workspaceFeatureHead(title, kicker, subtitle, scope) {
        const menus = scope === "account" ? ACCOUNT_MENU : scope === "seller" ? SELLER_MENU : ADMIN_MENU;
        const current = menus.find(item => state[scope + "Section"] === item[0]) || menus[0];
        const icon = current ? current[2] : "•";
        return `
            <div class="workspace-feature-head">
                <div>
                    <div class="section-kicker">${escapeHtml(kicker)}</div>
                    <h2>${escapeHtml(icon)} ${escapeHtml(title)}</h2>
                    <p>${escapeHtml(subtitle)}</p>
                </div>
                <div class="srp-v4-actions">
                    <button type="button" class="btn btn-outline" onclick="srpUiRefreshFeature('${scope}')">Refresh</button>
                </div>
            </div>
        `;
    }

    function featureMeta(scope, title) {
        const count = UI4.featureCounts[scope] || 0;
        return `
            <div class="workspace-feature-meta">
                <span class="workspace-meta-chip">${escapeHtml(UI4.labels[scope])}</span>
                <span class="workspace-meta-chip">${count} managed features</span>
                <span class="workspace-meta-chip">${escapeHtml(title)}</span>
                <span class="workspace-meta-chip">Responsive workspace</span>
            </div>
        `;
    }

    function ultimateWorkspaceLayout({scope, title, kicker, subtitle, menu, content, footButtons = []}) {
        const sec = state[scope + "Section"];
        const current = menu.find(item => item[0] === sec) || menu[0];
        const featureTitle = current ? current[1] : title;
        const featureLabel = current ? current[1] : title;
        const status = scopeStatus(scope);
        const profileLetter = currentUserLabel().slice(0, 1).toUpperCase();
        const sideTools = footButtons.map(button => button).join("");

        return `
            <section class="page-shell srp-v4-shell" data-srp-scope="${escapeAttr(scope)}">
                <div class="container">
                    <div class="workspace-back-row">
                        <div class="srp-v4-crumbs">
                            <span>SRP Shopping</span>
                            <span>›</span>
                            <strong>${escapeHtml(title)}</strong>
                            <span>›</span>
                            <strong>${escapeHtml(featureLabel)}</strong>
                        </div>
                        <button class="btn btn-outline" type="button" onclick="router.go('home')">Marketplace</button>
                    </div>
                    <div class="workspace-shell">
                        <aside class="workspace-side" data-workspace-sidebar="${escapeAttr(scope)}">
                            <div class="workspace-brand">
                                <strong>${escapeHtml(title)}</strong>
                                <span>${escapeHtml(kicker)}</span>
                            </div>
                            <div class="workspace-user-mini">
                                <div class="workspace-user-avatar">${escapeHtml(profileLetter)}</div>
                                <div>
                                    <strong>${escapeHtml(currentUserLabel())}</strong>
                                    <span>${escapeHtml(status.secondary)}</span>
                                </div>
                            </div>
                            <div class="workspace-search">
                                <div class="srp-v4-command">
                                    <input
                                        id="${escapeAttr(scope)}FeatureSearch"
                                        class="input"
                                        type="search"
                                        autocomplete="off"
                                        placeholder="Search features"
                                        oninput="filterWorkspaceNav('${escapeAttr(scope)}', this.value)"
                                        aria-label="Search ${escapeAttr(scope)} features"
                                    >
                                    <kbd>⌘K</kbd>
                                </div>
                            </div>
                            <nav id="${escapeAttr(scope)}WorkspaceNav" class="workspace-nav" aria-label="${escapeAttr(title)} navigation">
                                ${groupedMenuHtml(menu, scope)}
                            </nav>
                            <div class="workspace-foot">
                                ${sideTools}
                            </div>
                        </aside>
                        <main class="workspace-main">
                            <div class="workspace-topbar">
                                <div>
                                    <div class="section-kicker">${escapeHtml(kicker)}</div>
                                    <h1 class="workspace-title">${escapeHtml(title)}</h1>
                                    <p class="workspace-copy">${escapeHtml(subtitle)}</p>
                                </div>
                                <div class="workspace-health" title="Workspace status">
                                    <span class="workspace-health-dot"></span>
                                    <span class="workspace-copy">${escapeHtml(status.primary)} · ${escapeHtml(status.secondary)}</span>
                                </div>
                            </div>
                            ${statusGrid(scope)}
                            ${workspaceToolbar(scope)}
                            <section class="workspace-feature-shell" data-feature-key="${escapeAttr(sec)}">
                                ${workspaceFeatureHead(featureTitle, kicker, subtitle, scope)}
                                ${featureMeta(scope, featureLabel)}
                                <div class="workspace-feature-body">
                                    ${content}
                                </div>
                            </section>
                        </main>
                    </div>
                </div>
            </section>
        `;
    }

    function featureManifestData(scope) {
        if (scope === "account") {
            return ACCOUNT_MENU;
        }
        if (scope === "seller") {
            return SELLER_MENU;
        }
        return ADMIN_MENU;
    }

    function featureManifestMarkup(scope) {
        const list = featureManifestData(scope);
        const title = UI4.labels[scope];
        return `
            <div class="modal-head">
                <h2 class="modal-title">${escapeHtml(title)} feature map</h2>
                <button class="close" type="button" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="section-kicker">NO DUPLICATES</div>
                <h3 style="margin:4px 0 6px">${list.length} features</h3>
                <p class="section-copy">Every navigation item below maps to an existing SRP feature handler or an operational workspace view.</p>
                <div class="feature-manifest" style="margin-top:12px">
                    ${list.map(([key, label, icon], index) => `
                        <button type="button" class="feature-item" onclick="closeModal();${scope === "account" ? "accountNavKey" : scope === "seller" ? "sellerNavKey" : "adminNavKey"}('${escapeAttr(key)}')">
                            <span class="feature-number">${index + 1}</span>
                            <span class="feature-text">${escapeHtml(label)}</span>
                        </button>
                    `).join("")}
                </div>
            </div>
        `;
    }

    window.srpUiFeatureManifest = function(scope) {
        openModal(featureManifestMarkup(scope), true);
    };

    window.srpUiToggleSidebar = function() {
        document.body.classList.toggle("srp-workspace-collapsed");
    };

    window.srpUiToggleFocus = function() {
        document.body.classList.toggle("srp-focus-mode");
    };

    window.srpUiScrollTop = function() {
        window.scrollTo({top: 0, behavior: "smooth"});
    };

    window.srpUiMobileMenu = function(scope) {
        const side = qs(`[data-workspace-sidebar="${scope}"]`);
        if (!side) {
            return;
        }
        side.classList.toggle("srp-mobile-visible");
        document.body.classList.toggle("srp-drawer-open", side.classList.contains("srp-mobile-visible"));
    };

    window.srpUiCloseMobile = function() {
        qsa(".workspace-side.srp-mobile-visible").forEach(node => node.classList.remove("srp-mobile-visible"));
        document.body.classList.remove("srp-drawer-open");
    };

    window.srpUiRefreshFeature = function(scope) {
        if (scope === "account") {
            account.render();
            return;
        }
        if (scope === "seller") {
            router.renderSellerPage();
            return;
        }
        router.renderAdminPage();
    };

    function activeFeature(scope) {
        return state[scope + "Section"] || "overview";
    }

    function findMenuItem(scope, key) {
        const list = featureManifestData(scope);
        return list.find(item => item[0] === key) || list[0];
    }

    function featureHeaderButtons(scope) {
        const key = activeFeature(scope);
        const item = findMenuItem(scope, key);
        const previousIndex = Math.max(0, featureManifestData(scope).findIndex(v => v[0] === key) - 1);
        const nextIndex = Math.min(featureManifestData(scope).length - 1, featureManifestData(scope).findIndex(v => v[0] === key) + 1);
        const previous = featureManifestData(scope)[previousIndex];
        const next = featureManifestData(scope)[nextIndex];
        const fn = scope === "account" ? "accountNavKey" : scope === "seller" ? "sellerNavKey" : "adminNavKey";
        return `
            <button class="btn btn-outline" type="button" onclick="${fn}('${escapeAttr(previous[0])}')" ${previous[0] === item[0] ? "disabled" : ""}>←</button>
            <button class="btn btn-outline" type="button" onclick="${fn}('${escapeAttr(next[0])}')" ${next[0] === item[0] ? "disabled" : ""}>→</button>
        `;
    }

    function normalizeHomeHero() {
        const title = state.db.settings.heroTitle || "Shop smarter from a marketplace built for clear buying decisions.";
        const subtitle = state.db.settings.heroSubtitle || "Search, compare, save, pay securely and track eligible deliveries in one place.";
        return {title, subtitle};
    }

    function renderHomeV4() {
        state.route = "home";
        document.body.classList.remove("srp-admin", "srp-workspace-collapsed", "srp-focus-mode", "srp-drawer-open");
        renderHeaderCategories();
        const hero = normalizeHomeHero();
        const featured = state.db.settings.featuredIds.map(productById).filter(Boolean);
        const heroProduct = featured[0] || state.db.products.find(p => p.status === "active");
        const app = el("app");

        if (!app) {
            return;
        }

        app.innerHTML = `
            <section class="home-page srp-v4-shell">
                <div class="container">
                    <div class="home-breadcrumb">Home <span>›</span> SRP Shopping</div>
                    ${renderMaintenanceNotice()}
                    <section class="hero-split">
                        <div class="hero-copy hero-surface">
                            <span class="hero-badge">SRP SHOPPING · SMART MARKETPLACE</span>
                            <h1 id="heroTitle">${escapeHtml(hero.title).replace("marketplace", "<strong>marketplace</strong>")}</h1>
                            <p id="heroSubtitle">${escapeHtml(hero.subtitle)}</p>
                            <div class="hero-actions">
                                <button class="btn btn-primary btn-large" type="button" onclick="store.loadDeals();router.scrollTo('productsSection')">Shop best deals</button>
                                <button class="btn btn-outline btn-large" type="button" onclick="router.scrollTo('categoriesSection')">Explore categories</button>
                                <button class="btn btn-ghost btn-large" type="button" onclick="seller.startApplication()">Become a seller</button>
                            </div>
                            <div class="hero-trust-row">
                                <span>✓ Verified payment gate</span>
                                <span>✓ Seller marketplace</span>
                                <span>✓ Trackable shipping integration</span>
                            </div>
                        </div>
                        <div class="hero-product-visual">
                            <div class="hero-product-card">
                                <span class="hero-product-tag">FEATURED PRODUCT</span>
                                <div class="hero-image-wrap">
                                    ${heroProduct ? `<img id="heroProductImage" src="${escapeAttr(heroProduct.images[0])}" alt="${escapeAttr(heroProduct.name)}">` : ""}
                                </div>
                                <div class="hero-product-meta">
                                    <small>${heroProduct ? `${money(heroProduct.price)} · ${productDiscount(heroProduct)}% off` : "Catalog ready"}</small>
                                    <h3 id="heroProductName">${heroProduct ? escapeHtml(heroProduct.name) : "SRP Shopping"}</h3>
                                </div>
                            </div>
                        </div>
                    </section>

                    <section class="feature-band" aria-label="SRP Shopping core features">
                        <div class="section-kicker">10 HOME FEATURES</div>
                        <div class="home-feature-grid">
                            <button class="home-feature" type="button" onclick="el('globalSearch')?.focus()">
                                <span>⌕</span><b>Smart Search</b><small>Search products instantly</small>
                            </button>
                            <button class="home-feature" type="button" onclick="router.scrollTo('categoriesSection')">
                                <span>▦</span><b>Categories</b><small>Browse marketplace departments</small>
                            </button>
                            <button class="home-feature" type="button" onclick="store.loadDeals();router.scrollTo('productsSection')">
                                <span>⚡</span><b>Best Deals</b><small>Sort by current discount</small>
                            </button>
                            <button class="home-feature" type="button" onclick="filters.openMobile()">
                                <span>☷</span><b>Smart Filters</b><small>Price, seller and rating controls</small>
                            </button>
                            <button class="home-feature" type="button" onclick="user ? account.wishlist() : account.login()">
                                <span>♡</span><b>Wishlist</b><small>Keep products for later</small>
                            </button>
                            <button class="home-feature" type="button" onclick="account.openCompare()">
                                <span>⇄</span><b>Compare</b><small>Compare selected products</small>
                            </button>
                            <button class="home-feature" type="button" onclick="document.querySelector('.product-card img')?.click()">
                                <span>⌘</span><b>Product Details</b><small>Open complete product view</small>
                            </button>
                            <button class="home-feature" type="button" onclick="router.go('cart')">
                                <span>🛒</span><b>Cart & Checkout</b><small>Review before verified payment</small>
                            </button>
                            <button class="home-feature" type="button" onclick="router.go('seller')">
                                <span>🏪</span><b>Seller Marketplace</b><small>Open Seller Center</small>
                            </button>
                            <button class="home-feature" type="button" onclick="account.location()">
                                <span>⌖</span><b>Delivery Location</b><small>Set delivery pincode</small>
                            </button>
                        </div>
                    </section>

                    <section class="market-section">
                        <div class="srp-v4-home-grid">
                            <article class="srp-v4-info-card">
                                <div class="section-kicker">BUYING FLOW</div>
                                <h3>Find → compare → cart → pay → track</h3>
                                <p>Every customer action stays in one consistent navigation model. Verified payment is the order gate; shipping starts after the paid state.</p>
                                <div class="srp-v4-shortcuts">
                                    <button class="srp-v4-shortcut" type="button" onclick="router.go('cart')"><strong>Cart</strong><span>Open current items</span></button>
                                    <button class="srp-v4-shortcut" type="button" onclick="account.render()"><strong>Account</strong><span>Manage all 40 features</span></button>
                                    <button class="srp-v4-shortcut" type="button" onclick="router.go('seller')"><strong>Seller</strong><span>Manage 30 seller features</span></button>
                                    <button class="srp-v4-shortcut" type="button" onclick="router.go('admin')"><strong>Admin</strong><span>Protected 50-feature console</span></button>
                                </div>
                            </article>
                            <div class="srp-v4-home-side">
                                <article class="srp-v4-info-card">
                                    <div class="section-kicker">WALLET</div>
                                    <h3>Wallet stays inside Manage Account</h3>
                                    <p>Open the wallet to add money through the verified gateway when the production backend is configured, inspect transactions, refunds, cashback and statements.</p>
                                </article>
                                <article class="srp-v4-info-card">
                                    <div class="section-kicker">OPERATIONS</div>
                                    <h3>Seller and admin use the same design language</h3>
                                    <p>The left navigation becomes searchable, grouped and collapsible so large feature sets stay usable on desktop and mobile.</p>
                                </article>
                            </div>
                        </div>
                    </section>

                    <section id="categoriesSection" class="market-section">
                        <div class="section-heading-row">
                            <div>
                                <div class="section-kicker">SHOP BY DEPARTMENT</div>
                                <h2>Explore categories</h2>
                                <p>Open a category and the product list filters without leaving the marketplace.</p>
                            </div>
                            <button class="link-button" type="button" onclick="store.search()">Search all products →</button>
                        </div>
                        <div id="categoryGrid" class="category-mega-grid"></div>
                    </section>

                    <section class="market-section seller-discovery">
                        <div class="section-heading-row">
                            <div>
                                <div class="section-kicker">SELLER MARKETPLACE</div>
                                <h2>Discover approved stores</h2>
                                <p>Seller information and marketplace catalog stay one click away.</p>
                            </div>
                            <button class="link-button" type="button" onclick="router.go('seller')">Seller Center →</button>
                        </div>
                        <div id="vendorGrid" class="seller-row-grid"></div>
                    </section>

                    <section id="productsSection" class="market-section catalog-section">
                        <div class="catalog-toolbar">
                            <div>
                                <div class="section-kicker">SHOPPING RESULTS</div>
                                <h2 id="resultSummary">Current SRP catalog</h2>
                                <div id="productCount" class="catalog-count">0 catalog products</div>
                            </div>
                            <div class="catalog-controls">
                                <select id="sellerFilter" class="select" aria-label="Filter by seller"><option value="">All sellers</option></select>
                                <select id="sortSelect" class="select" aria-label="Sort products">
                                    <option value="popular">Popular</option>
                                    <option value="discount">Highest discount</option>
                                    <option value="price-low">Price: low to high</option>
                                    <option value="price-high">Price: high to low</option>
                                    <option value="newest">Newest</option>
                                </select>
                                <button id="gridButton" class="btn btn-primary" type="button">Grid</button>
                                <button id="listButton" class="btn btn-outline" type="button">List</button>
                                <button class="btn btn-outline" type="button" onclick="filters.openMobile()">Filters</button>
                            </div>
                        </div>
                        <div class="filter-strip">
                            <div class="filter-title">Price</div>
                            <input id="minPrice" class="input" placeholder="Min" inputmode="decimal" aria-label="Minimum price">
                            <input id="maxPrice" class="input" placeholder="Max" inputmode="decimal" aria-label="Maximum price">
                            <div class="filter-title">Rating</div>
                            <label class="rating-choice"><input type="radio" name="rating" value="0" checked onchange="filters.apply()"> Any</label>
                            <label class="rating-choice"><input type="radio" name="rating" value="4" onchange="filters.apply()"> 4★+</label>
                            <label class="rating-choice"><input type="radio" name="rating" value="4.5" onchange="filters.apply()"> 4.5★+</label>
                            <button class="btn btn-outline" type="button" onclick="filters.apply()">Apply</button>
                            <button class="btn btn-ghost" type="button" onclick="filters.clear()">Clear</button>
                            <span id="queryFilterTag" class="workspace-meta-chip">All products</span>
                        </div>
                        <div id="productGrid" class="product-grid"></div>
                        <div id="pagination" class="pagination"></div>
                    </section>
                </div>
            </section>
        `;

        renderCategoriesHome();
        renderVendorsHome();
        bindHomeControls();
        updateSellerFilterOptions();
        store.applyQuery();

        const queryTag = qs("#queryFilterTag");
        if (queryTag) {
            const text = state.query
                ? `Search: ${state.query}`
                : state.category
                    ? `Category: ${state.category}`
                    : state.sellerFilter
                        ? `Seller: ${sellerById(state.sellerFilter)?.store || "Seller"}`
                        : "All products";
            queryTag.textContent = text;
        }
    }

    function styleExistingFeatureContent() {
        qsa(".workspace-feature-body .workspace-actions").forEach(node => {
            node.style.marginTop = "14px";
        });
        qsa(".workspace-feature-body .data-list").forEach(node => {
            node.style.marginTop = node.style.marginTop || "10px";
        });
    }

    function installFeatureWrapper(scope) {
        const original = scope === "account"
            ? accountFeatureContent
            : scope === "seller"
                ? sellerFeatureContent
                : adminLocalContent;

        if (typeof original !== "function") {
            return;
        }

        if (scope === "account") {
            window.__srpOriginalAccountFeatureContentV4 = original;
            accountFeatureContent = function(key) {
                const rendered = window.__srpOriginalAccountFeatureContentV4(key);
                return rendered;
            };
        }

        if (scope === "seller") {
            window.__srpOriginalSellerFeatureContentV4 = original;
            sellerFeatureContent = function(key, record) {
                const rendered = window.__srpOriginalSellerFeatureContentV4(key, record);
                return rendered;
            };
        }

        if (scope === "admin") {
            window.__srpOriginalAdminFeatureContentV4 = original;
            adminLocalContent = function(key) {
                const rendered = window.__srpOriginalAdminFeatureContentV4(key);
                return rendered;
            };
        }
    }

    function installWorkspaceLayout() {
        window.__srpOriginalWorkspaceLayoutV4 = workspaceLayout;
        workspaceLayout = ultimateWorkspaceLayout;
    }

    function installHomeRenderer() {
        window.__srpOriginalRenderHomeV4 = renderHome;
        renderHome = renderHomeV4;
    }

    function installHeaderUX() {
        const header = qs("#mainHeader");
        if (!header) {
            return;
        }
        header.classList.add("srp-v4-header");
        const brand = qs(".brand", header);
        if (brand) {
            brand.setAttribute("aria-label", "Go to SRP Shopping home");
        }
        const cart = qs("#cartButton", header);
        if (cart) {
            cart.setAttribute("aria-label", "Open cart and checkout");
        }
    }

    function installGlobalShortcuts() {
        window.addEventListener("keydown", event => {
            const target = event.target;
            const typing = target && ["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName);

            if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
                event.preventDefault();
                qs("#globalSearch")?.focus();
                return;
            }

            if (event.key === "Escape") {
                srpUiCloseMobile();
            }

            if (!typing && event.key === "g") {
                event.preventDefault();
                renderHomeV4();
            }
        });

        document.addEventListener("click", event => {
            if (!event.target.closest(".workspace-side") && !event.target.closest(".workspace-mobile-menu")) {
                if (window.innerWidth <= 960) {
                    srpUiCloseMobile();
                }
            }
        });
    }

    function installWorkspaceEnhancements() {
        ["account", "seller", "admin"].forEach(installFeatureWrapper);
        installWorkspaceLayout();
        installHomeRenderer();
        installHeaderUX();
        installGlobalShortcuts();
    }

    function installDiagnostics() {
        window.SRP_UI_V4.diagnostics = () => ({
            featureCounts: {...UI4.featureCounts},
            actualCounts: {
                home: HOME_FEATURES.length,
                account: ACCOUNT_MENU.length,
                seller: SELLER_MENU.length,
                admin: ADMIN_MENU.length
            },
            route: state.route,
            backend: srpServerAvailable,
            user: Boolean(user),
            timestamp: new Date().toISOString()
        });
    }

    function boot() {
        installWorkspaceEnhancements();
        installDiagnostics();
        if (state.route === "home" || !state.route) {
            renderHomeV4();
        }
        styleExistingFeatureContent();
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", boot, {once: true});
    } else {
        boot();
    }
})();
</script>
</body>
</html>
