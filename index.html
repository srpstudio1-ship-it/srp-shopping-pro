<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRP Shopping - Professional E-Commerce | Premium Quality</title>
    <style>
        /* =========================================================
           1. CORE VARIABLE DEFINITIONS & RESET (LINES 1-100)
           =========================================================
        */
        :root {
            --sky-blue: #87CEEB;
            --white: #FFFFFF;
            --black: #000000;
            --gray-light: #f4f4f4;
            --border: #cccccc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--gray-light); }

        /* =========================================================
           2. HEADER & NAVIGATION SYSTEM (LINES 101-300)
           =========================================================
        */
        .header { background-color: var(--sky-blue); color: var(--white); padding: 20px 5%; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 999; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logo { font-size: 32px; font-weight: bold; letter-spacing: 1px; cursor: pointer; }
        .search-container { flex-grow: 1; margin: 0 40px; }
        .search-bar { width: 100%; padding: 12px; border-radius: 5px; border: none; outline: none; }
        .nav-links { display: flex; gap: 20px; }
        .nav-link { color: white; text-decoration: none; font-size: 15px; font-weight: 500; }

        /* =========================================================
           3. BANNER SLIDER (LINES 301-500)
           =========================================================
        */
        .banner-container { width: 100%; height: 400px; background: white; border-bottom: 5px solid var(--sky-blue); position: relative; overflow: hidden; }
        .banner-slide { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 50px; font-weight: bold; color: var(--sky-blue); background: #e0f7fa; }

        /* =========================================================
           4. CATEGORY GRID (LINES 501-750)
           =========================================================
        */
        .category-section { padding: 40px 5%; }
        .category-wrapper { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px; }
        .cat-item { background: white; padding: 20px; text-align: center; border: 1px solid var(--border); border-radius: 10px; transition: 0.3s; }
        .cat-item:hover { background: var(--sky-blue); color: white; }

        /* =========================================================
           5. PRODUCT GRID & CARDS (LINES 751-1000)
           =========================================================
        */
        .product-section { padding: 40px 5%; }
        .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px; }
        .product-card { background: white; padding: 20px; border-radius: 15px; border: 1px solid var(--border); }
        .product-img { width: 100%; height: 200px; background: #ddd; border-radius: 10px; margin-bottom: 15px; }
        .btn-action { width: 100%; padding: 10px; background: var(--sky-blue); color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }

        /* =========================================================
           6. MOBILE DOCK & ADMIN MODAL (LINES 1001-1250)
           =========================================================
        */
        .mobile-dock { position: fixed; bottom: 0; width: 100%; background: white; padding: 15px; display: flex; justify-content: space-around; border-top: 2px solid var(--sky-blue); }
        .admin-modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; place-items:center; z-index: 2000; }
        .admin-content { background: white; padding: 40px; border-radius: 10px; text-align: center; }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo" onclick="openAdmin()">SRP SHOPPING</div>
        <div class="search-container">
            <input type="text" class="search-bar" placeholder="Search products...">
        </div>
        <div class="nav-links">
            <a href="#" class="nav-link">Privacy Policy</a>
            <a href="#" class="nav-link">About</a>
            <a href="#" class="nav-link">Settings</a>
        </div>
    </header>

    <div class="admin-modal" id="admin">
        <div class="admin-content">
            <h3>Enter Admin Key</h3>
            <input type="password" id="pass" style="padding: 10px; margin: 15px 0;">
            <button onclick="check()">Login</button>
        </div>
    </div>

    <section class="banner-container">
        <div class="banner-slide">SRP SHOPPING SPECIAL DEALS</div>
    </section>

    <section class="category-section">
        <h1>Shop by Category</h1>
        <div class="category-wrapper" id="cats"></div>
    </section>

    <section class="product-section">
        <h1>Featured Products</h1>
        <div class="grid-container" id="products"></div>
    </section>

    <footer class="mobile-dock">
        <button>Home</button>
        <button>Account</button>
        <button>Cart</button>
        <button>Subh AI</button>
        <button>Seller</button>
    </footer>

    <script>
        // 15 Categories Logic
        const cats = ['Electronics', 'Fashion', 'Home', 'Beauty', 'Sports', 'Toys', 'Books', 'Auto', 'Health', 'Garden', 'Pets', 'Music', 'Movies', 'Grocery', 'Office'];
        const catContainer = document.getElementById('cats');
        cats.forEach(c => catContainer.innerHTML += `<div class="cat-item"><h3>${c}</h3></div>`);

        // 20 Products Logic
        const prodContainer = document.getElementById('products');
        for(let i=1; i<=20; i++) {
            prodContainer.innerHTML += `
                <div class="product-card">
                    <div class="product-img"></div>
                    <h3>Product ${i}</h3>
                    <p>Price: $${(Math.random()*500).toFixed(2)}</p>
                    <button class="btn-action">Buy Now</button>
                </div>`;
        }

        function openAdmin() { document.getElementById('admin').style.display = 'grid'; }
        function check() { if(document.getElementById('pass').value == '123') alert('Logged In'); }
    </script>
</body>
</html>
