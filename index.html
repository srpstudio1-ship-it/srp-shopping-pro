<html lang="en">

  <style>
    :root{

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:var(--text);font-size:14px}

    .container{max-width:1280px;margin:0 auto;padding:0 12px}

    .header-location{background:var(--blue);color:#fff;height:32px}
    .location-inner{height:32px;display:flex;align-items:center;gap:8px;font-size:12px}

    .ship{font-size:10px;color:#666;margin-top:4px}

    .deal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
    .deal-card{background:#fff;min-height:210px;box-shadow:var(--shadow);padding:14px;cursor:pointer}
    .deal-card img{width:100%;height:145px;object-fit:contain}.deal-card h3{margin:8px 0 4px;font-size:13px}.deal-card p{margin:0;color:var(--green);font-size:12px;font-weight:700}

    .detail-info h1{font-size:25px;line-height:1.3;margin:0 0 8px}.subline{color:#666;font-size:12px;margin-bottom:12px}.detail-price{font-size:28px;font-weight:800}.detail-old{color:#777;text-decoration:line-through;margin-left:8px}.detail-disc{color:var(--green);font-weight:800;margin-left:8px}.feature-box{margin-top:18px;border-top:1px solid var(--line);padding-top:15px}.feature-box h3{font-size:15px;margin:0 0 10px}.feature-box li{margin:7px 0;color:#444}.detail-actions{display:flex;gap:10px;margin-top:20px}.big-btn{border:0;padding:14px 18px;font-weight:800;border-radius:2px;min-width:165px}.big-btn.buy{background:#ff9f00}.big-btn.cart{background:var(--yellow)}
    .page-shell{background:#fff;box-shadow:var(--shadow);min-height:540px;padding:24px}.page-title{margin:0 0 5px;font-size:28px}.page-subtitle{color:#777;margin:0 0 20px}.page-tabs{display:flex;gap:8px;overflow:auto;margin-bottom:20px}.tab{border:1px solid #ddd;background:#fff;padding:9px 13px;border-radius:20px;font-weight:700;font-size:12px;white-space:nowrap}.tab.active{background:var(--blue);color:#fff;border-color:var(--blue)}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#fff;border:1px solid var(--line);padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.05)}.card h3{margin:0 0 10px}.card p{color:#666;line-height:1.6}.input,.select{width:100%;height:42px;border:1px solid #d5d5d5;border-radius:2px;padding:0 12px;outline:0;background:#fff}.input:focus,.select:focus{border-color:var(--blue)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid .full{grid-column:1/-1}.label{display:block;font-size:11px;font-weight:800;color:#666;margin:0 0 5px;text-transform:uppercase}
    .order{border:1px solid var(--line);padding:14px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;gap:12px}.order img{width:74px;height:74px;object-fit:contain}.order-main{flex:1}.order-status{font-size:11px;font-weight:800;color:var(--green)}
    .empty{padding:60px 20px;text-align:center;color:#777}.empty i{font-size:45px;color:#c7c7c7;margin-bottom:10px}
    .footer{margin-top:10px;background:#172337;color:#fff}.footer-top{display:grid;grid-template-columns:repeat(4,1fr) 1.4fr;gap:28px;padding:36px 0;border-bottom:1px solid #384252}.footer h4{color:#9ca3af;font-size:11px;margin:0 0 12px}.footer a,.footer span{display:block;color:#eee;font-size:12px;margin:9px 0}.footer-bottom{padding:18px 0;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#aeb4bd;font-size:11px}

    .toast{position:fixed;right:20px;bottom:20px;background:#222;color:#fff;padding:12px 16px;border-radius:2px;box-shadow:var(--shadow-lg);transform:translateY(90px);opacity:0;transition:.22s;z-index:500;font-size:12px}.toast.show{transform:translateY(0);opacity:1}
    .mobile-bottom{display:none}
    @media(max-width:1000px){.logo{min-width:110px}.header-actions{gap:0}.head-btn span{display:none}.login-btn span{display:inline}.category-scroll{gap:13px}.mini-banner{min-width:48%}.deal-grid{grid-template-columns:repeat(2,1fr)}.product-page{grid-template-columns:1fr}.detail-gallery{border-right:0;border-bottom:1px solid var(--line);padding-right:0;padding-bottom:20px}.footer-top{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:700px){.topbar{height:112px;position:sticky}.topbar-inner{height:68px;flex-wrap:wrap;gap:6px}.logo{min-width:auto;flex:0 0 auto}.search-wrap{order:4;flex-basis:100%}.search{height:38px}.header-location{height:30px}.location-inner{height:30px}.category-scroll{min-height:86px;gap:14px}.category-item{min-width:72px;font-size:10px}.category-item img{height:44px;width:62px}.hero{height:205px}.slide-overlay{padding:18px 30px;background:linear-gradient(90deg,rgba(0,0,0,.68),rgba(0,0,0,.1),rgba(0,0,0,0))}.slide-copy h1{font-size:23px}.slide-copy p{font-size:11px}.cta{font-size:11px;padding:8px 12px}.row-head h2{font-size:16px}.product-card{min-width:160px;width:160px}.product-img-wrap{height:130px}.product-img{height:125px}.mini-banner{min-width:80%;height:145px}.deal-grid{grid-template-columns:1fr 1fr}.page-shell{padding:15px}.two-col,.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.footer-top{grid-template-columns:1fr 1fr}.mobile-bottom{position:fixed;display:flex;left:0;right:0;bottom:0;height:58px;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.14);z-index:120;justify-content:space-around}.mobile-bottom button{border:0;background:#fff;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;font-size:10px}.mobile-bottom i{font-size:16px}.footer{padding-bottom:60px}}
  </style>
</head>

      if(path==='/'||path==='home'||path==='') homePage();

    }

    function notificationsPage(){
      document.getElementById('app').insertAdjacentHTML('beforeend',`<main><div class="container"><div class="page-shell"><h1 class="page-title">Notification Preferences</h1><p class="page-subtitle">Control order, shipping and promotional alerts.</p><div class="card"><label style="display:flex;justify-content:space-between;padding:14px 0;border-bottom:1px solid #eee"><span>Order updates & shipping</span><input id="notifyOrders" type="checkbox" checked></label><label style="display:flex;justify-content:space-between;padding:14px 0"><span>Promotions & offers</span><input id="notifyPromo" type="checkbox" checked></label><button class="view-all" style="margin-top:15px" onclick="saveNotifications()">SAVE PREFERENCES</button></div></div></div></main>`);
      document.getElementById('app').insertAdjacentHTML('beforeend',footerHtml());
    }

    function customerCarePage(){
      document.getElementById('app').insertAdjacentHTML('beforeend',`<main><div class="container"><div class="page-shell"><h1 class="page-title">24x7 Customer Care</h1><p class="page-subtitle">Help with orders, payments, returns and account access.</p><div class="two-col"><div class="card"><h3>Start support</h3><p>Choose an issue and continue to the support flow.</p><select id="careTopic" class="select"><option>Order issue</option><option>Payment issue</option><option>Return / refund</option><option>Account login</option><option>Other</option></select><button class="view-all" style="margin-top:12px" onclick="showToast('Support request started')">START LIVE CHAT</button></div><div class="card"><h3>Quick help</h3><p><a href="#/payments">Payments</a><br><a href="#/shipping">Shipping</a><br><a href="#/returns">Cancellation & Returns</a><br><a href="#/faq">FAQ</a></p></div></div></div></div></main>`);
      document.getElementById('app').insertAdjacentHTML('beforeend',footerHtml());
    }

    function advertisePage(){
      document.getElementById('app').insertAdjacentHTML('beforeend',`<main><div class="container"><div class="page-shell"><h1 class="page-title">Advertise</h1><p class="page-subtitle">Dedicated advertising workspace for sellers and brands.</p><div class="card"><div class="form-grid"><div><label class="label">Campaign name</label><input class="input" id="adName"></div><div><label class="label">Budget</label><input class="input" id="adBudget" type="number"></div><div><label class="label">Target category</label><select class="select" id="adCat">${CATEGORIES.filter(c=>c.id!=='all').map(c=>`<option>${esc(c.name)}</option>`).join('')}</select></div><div><label class="label">Duration</label><select class="select" id="adDays"><option>7 days</option><option>14 days</option><option>30 days</option></select></div></div><button class="view-all" style="margin-top:14px" onclick="createAd()">CREATE CAMPAIGN</button></div></div></div></main>`);
      document.getElementById('app').insertAdjacentHTML('beforeend',footerHtml());
    }

    function downloadAppPage(){
      document.getElementById('app').insertAdjacentHTML('beforeend',`<main><div class="container"><div class="page-shell" style="text-align:center"><div style="font-size:60px;color:var(--blue);margin-bottom:10px"><i class="fa-solid fa-mobile-screen-button"></i></div><h1 class="page-title">Download the App</h1><p class="page-subtitle">Mobile app links can be connected here when your store packages are published.</p><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="big-btn" style="background:#111;color:#fff" onclick="showToast('Google Play link placeholder')"><i class="fa-brands fa-google-play"></i> Google Play</button><button class="big-btn" style="background:#111;color:#fff" onclick="showToast('App Store link placeholder')"><i class="fa-brands fa-apple"></i> App Store</button></div></div></div></main>`);
      document.getElementById('app').insertAdjacentHTML('beforeend',footerHtml());
    }

    function giftCardPage(){
      document.getElementById('app').insertAdjacentHTML('beforeend',`<main><div class="container"><div class="page-shell"><h1 class="page-title">Gift Cards</h1><p class="page-subtitle">Create a gift card order from a dedicated page.</p><div class="two-col"><div class="card"><h3>Choose amount</h3><div style="display:flex;gap:8px;flex-wrap:wrap">${[500,1000,2000,5000].map(v=>`<button class="tab" onclick="setGift(${v})">${money(v)}</button>`).join('')}</div><input id="giftAmount" class="input" style="margin-top:12px" type="number" min="100" placeholder="Custom amount"><button class="view-all" style="margin-top:12px" onclick="buyGift()">CONTINUE</button></div><div class="card"><h3>Gift card details</h3><p>Send as a digital gift to an email or mobile number after payment.</p></div></div></div></div></main>`);
      document.getElementById('app').insertAdjacentHTML('beforeend',footerHtml());
    }

    function setGift(v){document.getElementById('giftAmount').value=v}
    function buyGift(){const v=Number(document.getElementById('giftAmount').value);if(!v||v<100)return showToast('Enter a valid gift card amount');showToast('Gift card checkout opened');go('/cart')}
    function infoPage(title,desc,icon){
      document.getElementById('app').insertAdjacentHTML('beforeend',`<main><div class="container"><div class="page-shell"><div style="font-size:42px;color:var(--blue);margin-bottom:10px"><i class="fa-solid ${icon}"></i></div><h1 class="page-title">${esc(title)}</h1><p class="page-subtitle">${esc(desc)}</p><div class="card"><p>This dedicated page keeps supporting information out of the customer homepage, so the main shopping experience stays compact and easy to scan.</p></div></div></div></main>`);
      document.getElementById('app').insertAdjacentHTML('beforeend',footerHtml());
    }
    function contactPage(){infoPage('Contact Us','Customer support and business contact routes.','fa-headset')}
    function faqPage(){
      const qs=[['How do I place an order?','Open a product, add it to cart or tap Buy Now, then complete checkout.'],['How do I change delivery location?','Use Change next to the delivery location in the header.'],['Where can I see orders?','Open Login > Orders or the mobile Orders tab.'],['How do returns work?','Open Cancellation & Returns for the policy page.']];
      document.getElementById('app').insertAdjacentHTML('beforeend',`<main><div class="container"><div class="page-shell"><h1 class="page-title">FAQ</h1><p class="page-subtitle">Common shopping questions.</p>${qs.map(q=>`<details class="card" style="margin-bottom:9px"><summary style="font-weight:800;cursor:pointer">${esc(q[0])}</summary><p>${esc(q[1])}</p></details>`).join('')}</div></div></main>`);document.getElementById('app').insertAdjacentHTML('beforeend',footerHtml());
    }
    function sitemapPage(){
      const links=['/','/category/all','/account','/orders','/wishlist','/cart','/seller','/notifications','/customer-care','/advertise','/download-app','/gift-cards','/payments','/shipping','/returns','/faq','/terms','/security','/privacy'];
      document.getElementById('app').insertAdjacentHTML('beforeend',`<main><div class="container"><div class="page-shell"><h1 class="page-title">Sitemap</h1><p class="page-subtitle">All major storefront pages.</p><div class="product-scroller" style="flex-wrap:wrap;overflow:visible">${links.map(x=>`<a class="tab" href="#${x}">${x==='/'?'Home':x.slice(1).replaceAll('-',' ')}</a>`).join('')}</div></div></div></main>`);document.getElementById('app').insertAdjacentHTML('beforeend',footerHtml());
    }

    function editProfile(){
      showSimple('Edit Profile',`<div class="form-grid"><div><label class="label">Name</label><input id="editName" class="input" value="${esc(user.name||'')}"></div><div><label class="label">Mobile</label><input id="editPhone" class="input" value="${esc(user.phone||'')}"></div><div class="full"><label class="label">Email</label><input id="editEmail" class="input" value="${esc(user.email||'')}"></div></div><div class="modal-actions"><button class="small-action" onclick="closeSimpleModal()">Cancel</button><button class="big-btn cart" onclick="saveProfile()">Save</button></div>`)
    }
    function saveProfile(){user.name=document.getElementById('editName').value.trim()||user.name;user.phone=document.getElementById('editPhone').value.trim();user.email=document.getElementById('editEmail').value.trim();save('srp_user',user);closeSimpleModal();render();showToast('Profile updated')}
    function registerSeller(){const n=document.getElementById('sellerName').value.trim();if(!n)return showToast('Enter seller name first');save('srp_seller',{name:n,phone:document.getElementById('sellerPhone').value.trim(),store:document.getElementById('sellerStore').value.trim(),email:document.getElementById('sellerEmail').value.trim(),createdAt:new Date().toISOString()});showToast('Seller registration saved');}
    function saveNotifications(){save('srp_notifications',{orders:document.getElementById('notifyOrders').checked,promo:document.getElementById('notifyPromo').checked});showToast('Preferences updated')}
    function createAd(){const n=document.getElementById('adName').value.trim();if(!n)return showToast('Enter a campaign name');showToast('Campaign draft created')}

    function attachGlobal(){
      const loginBtn=document.getElementById('loginHeadBtn'),moreBtn=document.getElementById('moreHeadBtn');
      loginBtn?.addEventListener('click',e=>{e.stopPropagation();document.getElementById('loginDropdown').classList.toggle('hidden');document.getElementById('moreDropdown').classList.add('hidden')});
      moreBtn?.addEventListener('click',e=>{e.stopPropagation();document.getElementById('moreDropdown').classList.toggle('hidden');document.getElementById('loginDropdown').classList.add('hidden')});
      document.addEventListener('click',globalClick,{once:true});
      setupSearch();
    }
    function globalClick(){document.getElementById('loginDropdown')?.classList.add('hidden');document.getElementById('moreDropdown')?.classList.add('hidden')}
    function setupSearch(){
      const input=document.getElementById('searchInput'); const box=document.getElementById('searchSuggestions'); if(!input)return;
      input.value='';
      input.addEventListener('input',()=>{
        const q=input.value.trim().toLowerCase(); if(!q){box.classList.add('hidden');return}
        const matches=products.filter(p=>(p.title+' '+p.category).toLowerCase().includes(q)).slice(0,7);
        box.innerHTML=matches.length?matches.map(p=>`<div class="suggestion" onclick="go('/product/${p.id}')"><span><i class="fa-solid fa-magnifying-glass" style="color:#999;margin-right:8px"></i>${esc(p.title)}</span><small>${esc(p.category)}</small></div>`).join(''):`<div class="suggestion"><span>No matching products found</span></div>`;
        box.classList.remove('hidden');
      });
      input.addEventListener('keydown',e=>{if(e.key==='Enter'&&input.value.trim()){const p=products.find(p=>(p.title+' '+p.category).toLowerCase().includes(input.value.trim().toLowerCase()));if(p)go('/product/'+p.id)}})
    }

    function go(path){location.hash='#'+(path.startsWith('/')?path:'/'.concat(path));}
    function startHero(){clearInterval(slideTimer);slideTimer=setInterval(nextSlide,4500);updateSlide()}
    function updateSlide(){const el=document.getElementById('slides');if(!el)return;el.style.transform=`translateX(-${slideIndex*100}%)`;document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===slideIndex))}
    function nextSlide(){slideIndex=(slideIndex+1)%banners.length;updateSlide()}
    function prevSlide(){slideIndex=(slideIndex-1+banners.length)%banners.length;updateSlide()}
    function setSlide(i){slideIndex=i;updateSlide()}
    function homeAction(i){go(i===0?'/category/electronics':i===1?'/category/fashion':'/category/home')}

    function cartCount(){return cart.reduce((s,x)=>s+x.qty,0)}
    function cartTotal(){return cart.reduce((s,x)=>s+findProduct(x.id).price*x.qty,0)}
    function addToCart(id){const item=cart.find(x=>x.id===id);item?item.qty++:cart.push({id,qty:1});save('srp_cart',cart);updateBadge();showToast('Added to cart')}
    function changeQty(id,d){const item=cart.find(x=>x.id===id);if(!item)return;item.qty+=d;if(item.qty<=0)cart=cart.filter(x=>x.id!==id);save('srp_cart',cart);render()}
    function removeCart(id){cart=cart.filter(x=>x.id!==id);save('srp_cart',cart);render();showToast('Item removed')}
    function updateBadge(){document.querySelectorAll('#cartBadge').forEach(b=>b.textContent=cartCount())}
    function toggleWishlist(id){wishlist.includes(id)?wishlist=wishlist.filter(x=>x!==id):wishlist.push(id);save('srp_wishlist',wishlist);render()}
    function buyNow(id){addToCart(id);checkout()}
    function checkout(){if(!cart.length)return showToast('Your cart is empty');if(!user)return openAuth('login','checkout');go('/payment')}
    function paymentPage(){
      const total=cartTotal()+(cartTotal()>999?0:40);
      document.getElementById('app').insertAdjacentHTML('beforeend',`<main><div class="container"><div class="page-shell"><h1 class="page-title">Payment</h1><p class="page-subtitle">Complete the order only after payment confirmation.</p><div class="two-col"><div><div class="card"><h3>Delivery Address</h3><p>${esc(user?.name||'Customer')}<br>${esc(user?.phone||'')}<br>Demo address — replace this form with your saved address system.</p></div><div class="card" style="margin-top:10px"><h3>Choose Payment Method</h3><label class="card" style="display:block;margin:8px 0"><input type="radio" name="pay" value="UPI" checked> UPI</label><label class="card" style="display:block;margin:8px 0"><input type="radio" name="pay" value="Card"> Card</label><label class="card" style="display:block;margin:8px 0"><input type="radio" name="pay" value="Net Banking"> Net Banking</label><label class="card" style="display:block;margin:8px 0"><input type="radio" name="pay" value="Cash on Delivery"> Cash on Delivery</label></div></div><div class="card" style="height:max-content"><h3>Order Summary</h3>${cart.map(x=>{const p=findProduct(x.id);return `<div style="display:flex;justify-content:space-between;margin:9px 0"><span>${esc(p.title)} × ${x.qty}</span><span>${money(p.price*x.qty)}</span></div>`}).join('')}<hr style="border:0;border-top:1px solid #eee"><div style="display:flex;justify-content:space-between;font-weight:800;margin:12px 0"><span>Total</span><span>${money(total)}</span></div><button class="view-all" style="width:100%;padding:13px" onclick="confirmPayment()">PAY ${money(total)}</button><p class="muted" style="margin-top:9px">Demo front-end payment confirmation. Connect Razorpay/Stripe server-side webhooks for live payment verification.</p></div></div></div></div></main>`);
      document.getElementById('app').insertAdjacentHTML('beforeend',footerHtml());
    }
    function confirmPayment(){
      if(!user)return openLogin();
      const method=[...document.querySelectorAll('input[name="pay"]')].find(x=>x.checked)?.value||'UPI';
      const total=cartTotal()+(cartTotal()>999?0:40); const first=cart[0];
      orders.unshift({orderId:'SRP'+Date.now().toString().slice(-10),productId:first.id,total,status:'Paid · '+method,createdAt:new Date().toISOString()});
      save('srp_orders',orders);cart=[];save('srp_cart',cart);showToast('Payment confirmed and order placed');setTimeout(()=>go('/orders'),450)
    }
    function checkPincode(){const p=document.getElementById('productPincode').value.trim();document.getElementById('deliveryMsg').textContent=/^\d{6}$/.test(p)?`Delivery is available for pincode ${p}.`:'Enter a valid 6-digit pincode.'}
    function setDetailImage(src,btn){document.getElementById('detailMainImg').src=src;document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}

    function openLogin(){openAuth(user?'login':'login')}
    function openAuth(mode='login',after){
      const box=document.getElementById('authContent');document.getElementById('authOverlay').dataset.after=after||'';document.getElementById('authOverlay').classList.remove('hidden');
      if(mode==='signup') box.innerHTML=`<h2>Looks like you're new here!</h2><p class="muted">Create your SRP Shopping account once and use it across orders and checkout.</p><div class="form-grid" style="margin-top:15px"><div class="full"><label class="label">Full Name</label><input id="signupName" class="input"></div><div><label class="label">Mobile</label><input id="signupPhone" class="input" maxlength="10"></div><div><label class="label">Email</label><input id="signupEmail" class="input"></div><div class="full"><label class="label">Password</label><input id="signupPass" class="input" type="password"></div></div><div class="modal-actions"><button class="small-action" onclick="openAuth('login')">Already have an account?</button><button class="big-btn cart" onclick="signup()">CREATE ACCOUNT</button></div>`;
      else box.innerHTML=`<h2>${user?'Account Login':'Login'}</h2><p class="muted">Get access to orders, wishlist and checkout.</p><div style="margin-top:15px"><label class="label">Mobile or Email</label><input id="loginId" class="input"></div><div style="margin-top:10px"><label class="label">Password</label><input id="loginPass" class="input" type="password"></div><div class="modal-actions"><button class="small-action" onclick="openAuth('signup')">New here? Sign Up</button><button class="big-btn cart" onclick="login()">LOGIN</button></div><p class="muted" style="margin-top:12px">For this standalone demo, credentials are stored locally in your browser.</p>`;
    }
    function signup(){const name=document.getElementById('signupName').value.trim();const phone=document.getElementById('signupPhone').value.trim();const email=document.getElementById('signupEmail').value.trim();const pass=document.getElementById('signupPass').value;if(name.length<2||!/^\d{10}$/.test(phone)||pass.length<4)return showToast('Enter valid signup details');const u={name,phone,email,password:pass};save('srp_user',u);user=u;closeAuth();showToast('Account created successfully');const after=document.getElementById('authOverlay').dataset.after;if(after==='checkout')go('/payment');else render()}
    function login(){const id=document.getElementById('loginId').value.trim();const pass=document.getElementById('loginPass').value;const stored=load('srp_user',null);if(!stored||stored.password!==pass||(stored.phone!==id&&stored.email!==id))return showToast('Invalid login details');user=stored;closeAuth();showToast('Logged in successfully');const after=document.getElementById('authOverlay').dataset.after;if(after==='checkout')go('/payment');else render()}
    function logout(){user=null;localStorage.removeItem('srp_user');showToast('Logged out');render()}
    function closeAuth(){document.getElementById('authOverlay').classList.add('hidden')}
    function showSimple(title,html){document.getElementById('simpleContent').innerHTML=`<h2>${esc(title)}</h2>${html}`;document.getElementById('simpleOverlay').classList.remove('hidden')}
    function closeSimpleModal(){document.getElementById('simpleOverlay').classList.add('hidden')}
    function updateLocation(){const pin=prompt('Enter your delivery pincode (6 digits):',localStorage.getItem('srp_location')||'');if(pin===null)return;if(/^\d{6}$/.test(pin.trim())){localStorage.setItem('srp_location',pin.trim());render();showToast('Delivery location updated')}else showToast('Please enter a valid 6-digit pincode')}
    function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.classList.remove('show'),2600)}

    window.addEventListener('hashchange',render);
    document.addEventListener('DOMContentLoaded',render);
  </script>
</body>
</html>
