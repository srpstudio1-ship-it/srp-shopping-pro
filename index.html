<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRP SHOPPING PRO</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins}
body{background:#eef2f7}

/* HEADER */
.header{
position:fixed;top:0;width:100%;background:white;
display:flex;align-items:center;gap:10px;
padding:10px;z-index:1000;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}
.logo{font-weight:800;color:#004aad;cursor:pointer}
.search input{padding:8px;border-radius:10px;border:1px solid #ccc;width:100%}
.wallet{font-size:13px;color:#004aad;font-weight:600}

/* NAV */
.nav{
position:fixed;bottom:0;width:100%;background:white;
display:flex;justify-content:space-around;padding:10px;
border-top:1px solid #ddd;
}

/* LOGIN */
#loginPage{
height:100vh;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#004aad,#00d4ff);
}
.box{
background:rgba(255,255,255,0.1);
padding:20px;border-radius:20px;
backdrop-filter:blur(10px);
width:300px;color:white;
}
input,button{
width:100%;padding:10px;margin-top:8px;border-radius:10px;border:none;
}
button{background:#004aad;color:white;font-weight:600}

/* HOME */
#homePage{display:none;padding-top:70px;padding-bottom:70px}

.banner{
margin:10px;padding:20px;border-radius:15px;color:white;
background:linear-gradient(135deg,#004aad,#00d4ff);
}

/* CATEGORY */
.cats{display:flex;gap:8px;padding:10px;overflow:auto}
.cat{background:white;padding:6px 10px;border-radius:10px;cursor:pointer}
.cat.active{background:#004aad;color:white}

/* GRID */
.grid{
display:grid;grid-template-columns:repeat(2,1fr);
gap:10px;padding:10px;
}

.card{
background:white;padding:10px;border-radius:12px;
transition:0.3s;cursor:pointer;
}
.card:hover{transform:scale(1.05)}
.card img{width:100%;height:120px;object-fit:contain}
.price{color:#004aad;font-weight:700}

/* DETAIL */
#detail{
position:fixed;top:0;left:0;width:100%;height:100%;
background:white;display:none;overflow:auto;z-index:2000;
padding:15px;
}

/* CART BADGE */
.badge{
background:red;color:white;border-radius:50%;
padding:2px 6px;font-size:10px;margin-left:3px;
}

/* TOAST */
.toast{
position:fixed;bottom:80px;left:50%;
transform:translateX(-50%);
background:black;color:white;padding:10px 20px;border-radius:20px;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage">
<div class="box">
<h2>SRP SHOPPING</h2>
<input id="name" placeholder="Full Name">
<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Password">
<button onclick="signup()">Signup</button>
<button onclick="login()">Login</button>
<button onclick="googleLogin()">Google Login</button>
</div>
</div>

<!-- HOME -->
<div id="homePage">

<div class="header">
<div class="logo" onclick="reload()">SRP</div>
<div class="search"><input id="search" placeholder="Search"></div>
<div class="wallet">₹<span id="wallet">500</span></div>
</div>

<div class="banner">🔥 Big Sale</div>
<div class="banner">⚡ Trending Deals</div>
<div class="banner">🎯 Top Picks</div>

<div class="cats" id="cats"></div>
<div class="grid" id="grid"></div>

</div>

<!-- DETAIL -->
<div id="detail"></div>

<!-- NAV -->
<div class="nav">
<div onclick="showHome()">Home</div>
<div>Profile</div>
<div>Wallet</div>
<div>Seller</div>
<div onclick="showCart()">Cart <span id="cartCount" class="badge">0</span></div>
<div>AI</div>
</div>

<script>

/* SUPABASE */
const supabase = window.supabase.createClient(
"https://cmxlfxqtrguuzpqdgcxv.supabase.co",
"YOUR_SUPABASE_ANON_KEY"
);

/* PRODUCTS */
const products=[
{id:1,name:"iPhone",price:50000,cat:"elec",img:"https://m.media-amazon.com/images/I/61-r9zOKBCL._SX679_.jpg"},
{id:2,name:"Shoes",price:2000,cat:"fash",img:"https://m.media-amazon.com/images/I/61utX8kBDlL._UX695_.jpg"},
{id:3,name:"Laptop",price:70000,cat:"elec",img:"https://m.media-amazon.com/images/I/71jG+e7roXL._SX679_.jpg"},
{id:4,name:"Watch",price:3000,cat:"gadg",img:"https://m.media-amazon.com/images/I/61ZjlBOp+rL._SX679_.jpg"}
];

/* CATEGORY */
const categories=["all","elec","fash","gadg"];
let currentCat="all";

/* AUTH */
async function signup(){
await supabase.auth.signUp({
email:email.value,password:pass.value,
options:{data:{full_name:name.value}}
});
toast("Signup done");
}

async function login(){
let {error}=await supabase.auth.signInWithPassword({
email:email.value,password:pass.value
});
if(error) toast(error.message);
}

async function googleLogin(){
await supabase.auth.signInWithOAuth({
provider:"google",
options:{redirectTo:location.href}
});
}

supabase.auth.onAuthStateChange((e,s)=>{
if(s) showHome();
});

/* UI */
function showHome(){
loginPage.style.display="none";
homePage.style.display="block";
renderCats();
render();
updateCart();
}

/* RENDER */
function render(){
let data=products.filter(p=>
(currentCat==="all"||p.cat===currentCat) &&
p.name.toLowerCase().includes(search.value.toLowerCase())
);

grid.innerHTML=data.map(p=>`
<div class="card" onclick="openDetail(${p.id})">
<img src="${p.img}">
<div>${p.name}</div>
<div class="price">₹${p.price}</div>
</div>`).join("");
}

/* CATEGORY */
function renderCats(){
cats.innerHTML=categories.map(c=>
`<div class="cat" onclick="setCat('${c}',this)">${c}</div>`
).join("");
}

function setCat(c,el){
currentCat=c;
document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));
el.classList.add('active');
render();
}

/* DETAIL */
function openDetail(id){
let p=products.find(x=>x.id==id);
detail.style.display="block";

detail.innerHTML=`
<button onclick="detail.style.display='none'">Back</button>
<h2>${p.name}</h2>
<img src="${p.img}" style="width:100%">
<p>₹${p.price}</p>

<div>
<button onclick="dec()">-</button>
<span id="qty">1</span>
<button onclick="inc()">+</button>
</div>

<button onclick="addCart(${p.id})">Add to Cart</button>
<p>⭐⭐⭐⭐☆</p>
`;
}

let qty=1;
function inc(){qty++;qtyEl.innerText=qty}
function dec(){if(qty>1)qty--;qtyEl.innerText=qty}
const qtyEl={set innerText(v){document.getElementById("qty").innerText=v}};

/* CART */
function addCart(id){
let cart=JSON.parse(localStorage.getItem("cart"))||[];
cart.push({id,qty});
localStorage.setItem("cart",JSON.stringify(cart));
updateCart();
toast("Added");
}

function updateCart(){
let cart=JSON.parse(localStorage.getItem("cart"))||[];
cartCount.innerText=cart.length;
}

function showCart(){
alert("Cart items: "+cartCount.innerText);
}

/* EVENTS */
search.addEventListener("input",render);

/* TOAST */
function toast(t){
let d=document.createElement("div");
d.className="toast";
d.innerText=t;
document.body.appendChild(d);
setTimeout(()=>d.remove(),2000);
}

</script>

</body>
</html>
