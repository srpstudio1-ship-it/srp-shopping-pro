    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
        
        :root {
            --primary: #1A237E;
            --secondary: #FFFFFF;
            --accent: #FFD700;
            --bg-light: #F0F4F8;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-light);
            scroll-behavior: smooth;
            -webkit-tap-highlight-color: transparent;
        }

        /* Glassmorphism Effect */
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Custom Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: var(--secondary);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.1);
            z-index: 1000;
            border-radius: 25px 25px 0 0;
        }

        .nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #718096;
            transition: all 0.3s ease;
        }

        .nav-btn.active { color: var(--primary); transform: translateY(-5px); }
        .nav-btn i { font-size: 1.4rem; }
        .nav-btn span { font-size: 0.65rem; font-weight: 600; margin-top: 4px; }

        /* Product Slider */
        .slider-container {
            display: flex;
            overflow-x: auto;
            scroll-snap-type: x mandatory;
            gap: 10px;
            scrollbar-width: none;
        }
        .slider-container::-webkit-scrollbar { display: none; }
        .slider-item {
            flex: 0 0 100%;
            scroll-snap-align: start;
            height: 300px;
        }

        /* Category Chips */
        .category-scroll {
            display: flex;
            overflow-x: auto;
            white-space: nowrap;
            gap: 12px;
            padding: 10px 0;
        }

        /* Admin UI */
        #adminDashboard { display: none; }

        /* Animations */
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up { animation: slideUp 0.4s ease-out; }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>

        function addToCart(id) {
            cart.push(id);
            document.getElementById('cartBadge').innerText = cart.length;
            Swal.fire({ toast: true, position: 'top-end', icon: 'success', title: 'Added to Cart', showConfirmButton: false, timer: 1500 });
        }

        document.getElementById('toggleSignup').onclick = () => {
            document.getElementById('loginFormContainer').classList.add('hidden');
            document.getElementById('signupFormContainer').classList.remove('hidden');
            document.getElementById('toggleSignup').className = "flex-1 py-3 rounded-xl font-bold bg-white text-blue-900 shadow-sm transition-all";
            document.getElementById('toggleLogin').className = "flex-1 py-3 rounded-xl font-bold text-gray-500 transition-all";
        };

        document.getElementById('toggleLogin').onclick = () => {
            document.getElementById('signupFormContainer').classList.add('hidden');
            document.getElementById('loginFormContainer').classList.remove('hidden');
            document.getElementById('toggleLogin').className = "flex-1 py-3 rounded-xl font-bold bg-white text-blue-900 shadow-sm transition-all";
            document.getElementById('toggleSignup').className = "flex-1 py-3 rounded-xl font-bold text-gray-500 transition-all";
        };

        window.onload = checkSession;
    </script>
</body>
</html>
