<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SRP SHOPPING | Premium Marketplace</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/animate.css@4.1.1/animate.min.css">

    <style>
        :root {
            --primary: #0052cc;
            --primary-light: #4c8bf5;
            --accent: #ff4757;
            --bg-light: #f8faff;
            --card-bg: #ffffff;
            --text-main: #1a1d23;
            --text-muted: #64748b;
            --glass: rgba(255, 255, 255, 0.8);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 25px rgba(0, 82, 204, 0.1);
            --gradient: linear-gradient(135deg, #0052cc 0%, #00a3ff 100%);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-main);
            overflow-x: hidden;
            padding-bottom: 80px; /* Space for Bottom Nav */
        }

        /* --- MODERN LOGIN ENGINE --- */
        #auth-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--gradient); z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            padding: 25px; transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .auth-card {
            background: var(--glass);
            backdrop-filter: blur(20px);
            width: 100%; max-width: 400px;
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            text-align: center;
        }

        .auth-logo-circle {
            width: 80px; height: 80px; background: white;
            border-radius: 22px; margin: 0 auto 20px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--shadow-lg);
        }

        .auth-logo-circle i { font-size: 2.5rem; color: var(--primary); }

        .auth-input-wrapper {
            position: relative; margin-bottom: 15px;
        }

        .auth-input-wrapper i {
            position: absolute; left: 18px; top: 50%;
            transform: translateY(-50%); color: var(--text-muted);
        }

        .auth-field {
            width: 100%; padding: 16px 16px 16px 50px;
            border-radius: 15px; border: 1px solid rgba(0,0,0,0.05);
            background: white; font-size: 1rem; outline: none;
            transition: 0.3s;
        }

        .auth-field:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0,82,204,0.1); }

        .btn-primary {
            width: 100%; padding: 16px; border: none;
            border-radius: 15px; background: var(--primary);
            color: white; font-weight: 700; font-size: 1.1rem;
            box-shadow: 0 8px 20px rgba(0,82,204,0.3);
            cursor: pointer; transition: 0.3s;
        }

        .btn-google {
            width: 100%; padding: 14px; margin-top: 15px;
            background: white; border: 1px solid #ddd;
            border-radius: 15px; display: flex; align-items: center;
            justify-content: center; gap: 10px; font-weight: 600;
            color: #444; cursor: pointer;
        }

        /* --- HOME APP INTERFACE --- */
        .app-header {
            position: sticky; top: 0; background: var(--glass);
            backdrop-filter: blur(15px); padding: 15px 20px;
            z-index: 1000; border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .header-top {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px;
        }

        .brand { font-size: 1.4rem; font-weight: 800; color: var(--primary); letter-spacing: -1px; }

        .wallet-chip {
            background: var(--primary-light); color: white;
            padding: 8px 16px; border-radius: 50px; font-weight: 700;
            font-size: 0.85rem; display: flex; align-items: center; gap: 8px;
        }

        .search-container {
            position: relative;
        }

        .search-container input {
            width: 100%; padding: 14px 15px 14px 45px;
            border-radius: 16px; border: none; background: #edf2f7;
            font-size: 0.95rem; outline: none;
        }

        .search-container i { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        /* --- CATEGORIES & GRID --- */
        .cat-row {
            display: flex; overflow-x: auto; padding: 20px; gap: 15px;
            scrollbar-width: none;
        }

        .cat-btn {
            flex: 0 0 auto; padding: 10px 20px; background: white;
            border-radius: 12px; font-weight: 600; font-size: 0.85rem;
            box-shadow: var(--shadow-sm); transition: 0.3s;
        }

        .cat-btn.active { background: var(--primary); color: white; }

        .product-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 15px; padding: 0 15px;
        }

        .p-card {
            background: white; border-radius: 24px; padding: 12px;
            box-shadow: var(--shadow-sm); position: relative;
            animation: fadeInUp 0.5s ease backwards;
        }

        .p-img-box {
            width: 100%; aspect-ratio: 1/1; background: #f1f5f9;
            border-radius: 18px; margin-bottom: 10px; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .p-img-box img { width: 85%; object-fit: contain; }

        .p-name { font-size: 0.9rem; font-weight: 700; color: var(--text-main); margin-bottom: 5px; height: 38px; overflow: hidden; }
        .p-price { font-size: 1.1rem; font-weight: 800; color: var(--primary); }
        .p-mrp { font-size: 0.75rem; text-decoration: line-through; color: var(--text-muted); margin-left: 5px; }

        /* --- NAVIGATION --- */
        .bottom-nav {
            position: fixed; bottom: 0; width: 100%; height: 75px;
            background: white; display: flex; justify-content: space-around;
            align-items: center; border-top: 1px solid #eee; z-index: 5000;
        }

        .nav-item { color: #cbd5e1; text-align: center; flex: 1; transition: 0.3s; }
        .nav-item i { font-size: 1.4rem; display: block; margin-bottom: 4px; }
        .nav-item span { font-size: 0.65rem; font-weight: 700; }
        .nav-item.active { color: var(--primary); }

        .nav-ai-btn {
            width: 60px; height: 60px; background: var(--gradient);
            border-radius: 50%; color: white; display: flex;
            align-items: center; justify-content: center;
            margin-top: -45px; border: 6px solid var(--bg-light);
            box-shadow: 0 10px 20px rgba(0,82,204,0.3);
        }

        /* Notifications */
        .toast {
            position: fixed; top: 20px; right: 20px; padding: 15px 25px;
            background: #1e293b; color: white; border-radius: 12px;
            font-size: 0.9rem; z-index: 20000; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none;
        }

    </style>
</head>
<body>

    <section id="auth-screen">
        <div class="auth-card animate__animated animate__zoomIn">
            <div class="auth-logo-circle"><i class="fas fa-shopping-bag"></i></div>
            <h2 style="font-weight: 800; margin-bottom: 5px;">SRP SHOPPING</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 30px;">Premium Marketplace by Srpstudio1</p>

            <div id="login-form">
                <div class="auth-input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="login-email" class="auth-field" placeholder="Email Address">
                </div>
                <div class="auth-input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="login-pass" class="auth-field" placeholder="Password">
                </div>
                <button class="btn-primary" onclick="handleAuth()">SIGN IN</button>
                <button class="btn-google" onclick="notify('Connecting to Google...')">
                    <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" width="20"> Sign in with Google
                </button>
                <p style="margin-top: 20px; font-size: 0.85rem;" onclick="toggleAuth()">New here? <b style="color: var(--primary)">Create Account</b></p>
            </div>
        </div>
    </section>

    <header class="app-header">
        <div class="header-top">
            <div class="brand">SRP SHOPPING</div>
            <div class="wallet-chip"><i class="fas fa-wallet"></i> ₹<span id="bal">1,250.00</span></div>
        </div>
        <div class="search-container">
            <i class="fas fa-search"></i>
            <input type="text" id="liveSearch" placeholder="Search brands, items, electronics..." onkeyup="app.search()">
        </div>
    </header>

    <div class="cat-row" id="categories">
        <div class="cat-btn active" onclick="app.filter('all', this)">All</div>
        <div class="cat-btn" onclick="app.filter('electronics', this)">Electronics</div>
        <div class="cat-btn" onclick="app.filter('fashion', this)">Fashion</div>
        <div class="cat-btn" onclick="app.filter('home', this)">Home Decor</div>
    </div>

    <main class="product-grid" id="productGrid"></main>

    <nav class="bottom-nav">
        <div class="nav-item active"><i class="fas fa-house"></i><span>Home</span></div>
        <div class="nav-item"><i class="fas fa-heart"></i><span>Saved</span></div>
        <div class="nav-ai-btn"><i class="fas fa-robot"></i></div>
        <div class="nav-item"><i class="fas fa-shopping-cart"></i><span>Cart</span></div>
        <div class="nav-item"><i class="fas fa-user"></i><span>Profile</span></div>
    </nav>

    <div id="toast" class="toast"></div>

    <script>
        // CORE DATABASE
        const DB = [
            { id: 1, name: "SRP BassPro Headphones", price: 2999, mrp: 5999, cat: "electronics", img: "https://m.media-amazon.com/images/I/61f496A7LcL._SL1500_.jpg" },
            { id: 2, name: "SRP 4K Smart OLED TV", price: 45000, mrp: 65000, cat: "electronics", img: "https://m.media-amazon.com/images/I/71fV9H2u8FL._SL1500_.jpg" },
            { id: 3, name: "Premium Cotton Oversized Hoodie", price: 1499, mrp: 2999, cat: "fashion", img: "https://m.media-amazon.com/images/I/71YyP9fDqAL._UX679_.jpg" },
            { id: 4, name: "SRP Mechanical Gaming KB", price: 3499, mrp: 6999, cat: "electronics", img: "https://m.media-amazon.com/images/I/71Miv62KdtL._SL1500_.jpg" },
            { id: 5, name: "Modern Minimalist Vase", price: 899, mrp: 1899, cat: "home", img: "https://m.media-amazon.com/images/I/61y8B68u6DL._SL1500_.jpg" }
        ];

        const app = {
            currentFilter: 'all',
            init() {
                // Check local session
                if(localStorage.getItem('srp_session')) {
                    document.getElementById('auth-screen').style.transform = 'translateY(-100%)';
                }
                this.render();
            },
            render() {
                const container = document.getElementById('productGrid');
                const query = document.getElementById('liveSearch').value.toLowerCase();
                
                const filtered = DB.filter(p => {
                    const matchesCat = this.currentFilter === 'all' || p.cat === this.currentFilter;
                    const matchesSearch = p.name.toLowerCase().includes(query);
                    return matchesCat && matchesSearch;
                });

                container.innerHTML = filtered.map((p, index) => `
                    <div class="p-card" style="animation-delay: ${index * 0.1}s">
                        <div class="p-img-box"><img src="${p.img}"></div>
                        <div class="p-name">${p.name}</div>
                        <div class="p-price">₹${p.price.toLocaleString()} <span class="p-mrp">₹${p.mrp.toLocaleString()}</span></div>
                        <button style="width:100%; border:none; background:var(--bg-light); padding:10px; border-radius:12px; margin-top:10px; font-weight:700; color:var(--primary); font-size:0.8rem;">Add to Cart</button>
                    </div>
                `).join('');
            },
            filter(cat, el) {
                this.currentFilter = cat;
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                el.classList.add('active');
                this.render();
            },
            search() { this.render(); }
        };

        function handleAuth() {
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-pass').value;

            if(email && pass.length >= 4) {
                localStorage.setItem('srp_session', email);
                document.getElementById('auth-screen').style.transform = 'translateY(-100%)';
                notify("Welcome to SRP Studio Dashboard");
            } else {
                notify("Please check your credentials");
            }
        }

        function notify(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        window.onload = () => app.init();
    </script>
</body>
</html>
