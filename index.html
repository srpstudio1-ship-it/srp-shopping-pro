<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRP SHOPPING</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
body{
    margin:0;
    font-family:Arial;
    background:#f0f8ff;
}

/* NAVBAR */
.topbar{
    background:#0b5ed7;
    color:white;
    padding:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.topbar button{
    margin-right:8px;
    padding:6px 10px;
    border:none;
    background:white;
    color:#0b5ed7;
    cursor:pointer;
}

/* BOTTOM NAV */
.bottom{
    position:fixed;
    bottom:0;
    width:100%;
    background:#0b5ed7;
    display:flex;
    justify-content:space-around;
    padding:10px;
}

.bottom button{
    background:white;
    border:none;
    padding:8px;
}

/* LOGIN */
.login{
    display:flex;
    flex-direction:column;
    max-width:300px;
    margin:50px auto;
}

.login input, .login button{
    margin:5px;
    padding:10px;
}

/* PRODUCTS */
.products{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    padding:10px;
}

.card{
    background:white;
    padding:10px;
    border-radius:10px;
}

.card img{
    width:100%;
    height:150px;
    object-fit:cover;
}

/* BANNER */
.banner{
    width:100%;
    height:150px;
    background:url('https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da') center/cover;
    margin:10px 0;
}

</style></head><body><!-- TOP BAR --><div class="topbar">
    <div>
        <button onclick="reload()">SRP SHOPPING</button>
    </div><div>
    <input type="text" id="search" placeholder="Search">
    <button onclick="searchProduct()">Search</button>
    <button onclick="privacy()">Privacy</button>
    <span id="wallet">₹0</span>
</div>

</div><!-- LOGIN --><div id="loginPage" class="login">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password"><button onclick="signup()">Create Account</button>
<button onclick="login()">Login</button>
<button onclick="google()">Login with Google</button>

</div><!-- HOME --><div id="home" style="display:none"><div class="banner"></div>

<div class="products" id="products"></div>

</div><!-- BOTTOM --><div class="bottom">
    <button onclick="showHome()">Home</button>
    <button onclick="profile()">Account</button>
    <button onclick="wallet()">Wallet</button>
    <button onclick="seller()">Seller</button>
    <button onclick="cart()">Cart</button>
    <button onclick="ai()">AI</button>
</div><script>

// 🔐 SUPABASE
const supabase = window.supabase.createClient(
"YOUR_URL",
"YOUR_KEY"
);

// ADMIN EMAILS
const admins = [
"Srpstudio1@gmail.com",
"subhashrajpurohit10@gmail.com"
];

// AUTH
async function signup(){
    let email = document.getElementById("email").value;
    let pass = document.getElementById("password").value;

    await supabase.auth.signUp({email:email,password:pass});
    alert("Account created");
}

async function login(){
    let email = document.getElementById("email").value;
    let pass = document.getElementById("password").value;

    let {data,error} = await supabase.auth.signInWithPassword({
        email:email,
        password:pass
    });

    if(error) return alert(error.message);

    afterLogin(data.user);
}

async function google(){
    await supabase.auth.signInWithOAuth({
        provider:'google'
    });
}

// AFTER LOGIN
function afterLogin(user){
    document.getElementById("loginPage").style.display="none";
    document.getElementById("home").style.display="block";

    loadProducts();

    if(admins.includes(user.email)){
        alert("Admin detected");
    }
}

// PRODUCTS (20)
const productList = [
{name:"iPhone 14",price:70000,img:"https://m.media-amazon.com/images/I/61cwywLZR-L._SX679_.jpg"},
{name:"Shoes",price:999,img:"https://m.media-amazon.com/images/I/71li-ujtlUL._UY500_.jpg"},
{name:"Watch",price:1999,img:"https://m.media-amazon.com/images/I/61y2VVWcGBL._UY500_.jpg"},
{name:"Headphones",price:1499,img:"https://m.media-amazon.com/images/I/61CGHv6kmWL._SX679_.jpg"},
{name:"Tshirt",price:499,img:"https://m.media-amazon.com/images/I/71-3HjGNDUL._UY741_.jpg"},
{name:"Laptop",price:50000,img:"https://m.media-amazon.com/images/I/71jG+e7roXL._SX679_.jpg"},
{name:"Bag",price:899,img:"https://m.media-amazon.com/images/I/81fPKd-2AYL._UY500_.jpg"},
{name:"Bluetooth",price:799,img:"https://m.media-amazon.com/images/I/61v1+eZ1X1L._SX679_.jpg"},
{name:"Camera",price:30000,img:"https://m.media-amazon.com/images/I/81aV7VZ1s-L._SX679_.jpg"},
{name:"Keyboard",price:699,img:"https://m.media-amazon.com/images/I/61a+v9pC6OL._SX679_.jpg"},
{name:"Mouse",price:399,img:"https://m.media-amazon.com/images/I/61LtuGzXeaL._SX679_.jpg"},
{name:"TV",price:25000,img:"https://m.media-amazon.com/images/I/71F4jU7MRUS._SX679_.jpg"},
{name:"Fan",price:1999,img:"https://m.media-amazon.com/images/I/61bR3R9X6kL._SX679_.jpg"},
{name:"Bottle",price:299,img:"https://m.media-amazon.com/images/I/61R7QxWvBKL._SX679_.jpg"},
{name:"Book",price:199,img:"https://m.media-amazon.com/images/I/81iqZ2HHD-L.jpg"},
{name:"Table",price:5000,img:"https://m.media-amazon.com/images/I/71X0is1oZ-L._SX679_.jpg"},
{name:"Chair",price:2500,img:"https://m.media-amazon.com/images/I/71v8hJvGZJL._SX679_.jpg"},
{name:"Mixer",price:3000,img:"https://m.media-amazon.com/images/I/61kR9H0H8EL._SX679_.jpg"},
{name:"AC",price:40000,img:"https://m.media-amazon.com/images/I/71q7J1Y7v-L._SX679_.jpg"},
{name:"Fridge",price:35000,img:"https://m.media-amazon.com/images/I/71v6R4cX2PL._SX679_.jpg"}
];

function loadProducts(){
    let box = document.getElementById("products");
    box.innerHTML="";

    productList.forEach((p,i)=>{
        box.innerHTML += `
        <div class="card" onclick="openProduct(${i})">
            <img src="${p.img}">
            <h4>${p.name}</h4>
            <p>₹${p.price}</p>
        </div>
        `;
    });
}

function openProduct(i){
    alert(productList[i].name);
}

// NAV BUTTONS
function showHome(){document.getElementById("home").style.display="block";}
function profile(){alert("Profile page coming");}
function wallet(){window.open("https://rzp.io/rzp/juTBnc4Q");}
function seller(){alert("Seller dashboard coming");}
function cart(){alert("Cart coming");}
function ai(){alert("AI coming");}

function reload(){location.reload();}
function privacy(){alert("Privacy policy");}
function searchProduct(){alert("Search feature coming");}

</script>
</body>
</html>
