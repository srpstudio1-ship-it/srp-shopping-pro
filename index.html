<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRP Auth System</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
    font-family: Arial;
    background:#0f172a;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:#1e293b;
    padding:30px;
    border-radius:12px;
    width:320px;
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:none;
    border-radius:6px;
}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.login{background:#22c55e;}
.signup{background:#3b82f6;}
.google{background:#ef4444;}
.logout{background:#f59e0b;}

#user{
    margin-top:15px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="box">
    <h2>SRP LOGIN</h2>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button class="login" onclick="login()">Login</button>
    <button class="signup" onclick="signup()">Create Account</button>

    <button class="google" onclick="googleLogin()">Login with Google</button>

    <button class="logout" onclick="logout()">Logout</button>

    <div id="user"></div>
</div>

<script>
// 🔥 PUT YOUR CORRECT VALUES HERE
const SUPABASE_URL = "https://cmxlfxqtrguuzpqdgcxv.supabase.co";
const SUPABASE_KEY = "PASTE_YOUR_ANON_KEY_HERE";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// SIGNUP
async function signup(){
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { error } = await client.auth.signUp({
        email,
        password
    });

    if(error){
        alert(error.message);
    } else {
        alert("Account created! Check email if confirmation enabled.");
    }
}

// LOGIN
async function login(){
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    const { error } = await client.auth.signInWithPassword({
        email,
        password
    });

    if(error){
        alert(error.message);
    } else {
        alert("Login successful!");
        getUser();
    }
}

// GOOGLE LOGIN
async function googleLogin(){
    await client.auth.signInWithOAuth({
        provider: "google"
    });
}

// LOGOUT
async function logout(){
    await client.auth.signOut();
    document.getElementById("user").innerText = "Logged out";
}

// GET USER
async function getUser(){
    const { data } = await client.auth.getUser();

    if(data.user){
        document.getElementById("user").innerText =
            "Logged in as: " + data.user.email;
    }
}

// AUTO LOGIN CHECK
getUser();

</script>

</body>
</html>
