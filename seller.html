<head>

    <style>
        :root {
            --primary-gold: #D4AF37;
            --dark-gold: #AA7C11;
            --premium-black: #0A0A0C;
            --surface-black: #121216;
            --glass-bg: rgba(18, 18, 22, 0.92);
            --glass-border: rgba(212, 175, 55, 0.15);
            --slate-blue: #1E293B;
            --emerald-accent: #10B981;
            --crimson-accent: #EF4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--premium-black);
            color: #E2E8F0;
            overflow-x: hidden;
        }

        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }

        /* High-Fidelity Glassmorphism Engineering Panels */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.6);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.25);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.06);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-card:hover {
            border-color: var(--primary-gold);
            transform: translateY(-2px);
            box-shadow: 0 16px 24px rgba(212, 175, 55, 0.08);
        }

        .active-sub-tab {
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.15) 0%, transparent 100%);
            border-left: 3px solid var(--primary-gold);
            color: #FFF !important;
        }

        /* Custom Scrollbar Engines */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--premium-black);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--dark-gold);
            border-radius: 3px;
        }

        .text-gold-gradient {
            background: linear-gradient(135deg, #FFFFFF 20%, #D4AF37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bg-gold-gradient {
            background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%);
        }

        .premium-input {
            background: rgba(8, 8, 10, 0.95);
            border: 1px solid rgba(212, 175, 55, 0.18);
            color: #FFF;
            transition: all 0.25s ease;
        }
        .premium-input:focus {
            border-color: var(--primary-gold);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.25);
            outline: none;
        }

        /* Modal & Banner Animations */
        @keyframes slideIn {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-in {
            animation: slideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>

        /**

        class SRPSellerDataBridge {
            constructor() {
                this.db = this.fetchGlobalDatabase();
            }

            fetchGlobalDatabase() {
                try {
                    const payload = localStorage.getItem(STORAGE_KEY);
                    if (!payload) {
                        // Fallback bootstrap structure if parent catalog is unallocated
                        const baseConfig = {
                            products: [
                                { id: "PROD-001", title: "Premium Quantum Pro Phone v26", price: 89999, category: "electronics", rating: 4.8, reviews: 1240, image: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500&auto=format&fit=crop&q=60", sellerGst: "27AAAAA0000A1Z1", description: "Flagship mobile processor equipped architecture." },

                            ],

                                "27AAAAA0000A1Z1": { gst: "27AAAAA0000A1Z1", name: "SRP Premium Systems Hardware", email: "hardware-partner@srpstudio.com", balance: 450000, accountNo: "919902341254", activeStatus: "Verified", platformTier: "Enterprise" }
                            },
                            cart: [],
                            orders: [],
                            currentUser: { isLoggedIn: true, name: "Premium Client Node", email: "guest@srp.com", currentWalletBalance: 25000, deliveryAddress: "Main Development Block, Tech Campus Alpha, Rajasthan, Jalore" },
                            adminAuthenticated: false,
                            activeSellerSessionGst: null,
                            systemLogs: []
                        };
                        localStorage.setItem(STORAGE_KEY, JSON.stringify(baseConfig));
                        return baseConfig;
                    }
                    return JSON.parse(payload);
                } catch(e) {
                    console.error("Critical Storage Extraction Interdiction Fault:", e);
                    return {};
                }
            }

            persist() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(this.db));
            }

            log(level, msg) {
                if (!this.db.systemLogs) this.db.systemLogs = [];
                this.db.systemLogs.unshift({
                    timestamp: new Date().toISOString(),
                    alertLevel: level,
                    payload: `[SELLER_MODULE] ${msg}`
                });
                this.persist();
            }
        }

        const TerminalBridge = new SRPSellerDataBridge();

            executeSecureLogin() {
                const targetGst = document.getElementById('auth-input-gst').value.trim().toUpperCase();
                if (!targetGst) {
                    this.triggerToast("Validation Break", "GSTIN index parameters require valid characters.", "error");
                    return;
                }

                if (TerminalBridge.db.sellers[targetGst]) {
                    TerminalBridge.db.activeSellerSessionGst = targetGst;
                    TerminalBridge.log("SUCCESS", `Merchant session mounted safely under token key match: ${targetGst}`);
                    this.initMockSystemState();
                    this.renderDashboardFramework();
                    this.triggerToast("Authentication Granted", "Isolated channel mounted successfully.", "success");
                } else {
                    TerminalBridge.log("ERROR", `Failed login vector targeted unmatched entry index block: ${targetGst}`);
                    this.triggerToast("Node Match Void", "GSTIN index target is completely absent from the marketplace core registry.", "error");
                }
            }

                const name = document.getElementById('reg-input-name').value.trim();
                const gst = document.getElementById('reg-input-gst').value.trim().toUpperCase();
                const email = document.getElementById('reg-input-email').value.trim();
                const acct = document.getElementById('reg-input-acct').value.trim();

                if (!name || !gst || !email || !acct) {
                    this.triggerToast("Validation Block", "All registration input vectors require structural parameters.", "error");
                    return;
                }

                if (gst.length !== 15) {
                    this.triggerToast("GSTIN Fault", "Regulatory identification index requires an explicit 15-digit code depth structure.", "error");
                    return;
                }

                if (TerminalBridge.db.sellers[gst]) {
                    this.triggerToast("Registration Collision", "An enterprise tracking node mapping to this exact GSTIN index already exists.", "error");

                this.initMockSystemState();
                this.renderDashboardFramework();
                this.triggerToast("Node Deployed Live", "Isolated enterprise parameters configured cleanly.", "success");
            }

                TerminalBridge.log("INFO", `Active merchant context session closed explicitly for target node: ${TerminalBridge.db.activeSellerSessionGst}`);

                TerminalBridge.persist();

                                        </table>
                                    </div>
                                </div>
                            </div>
                        `;
                        break;

                    /* =========================================================================
                     * SUBSECTION 2.8: LOGISTICS FORWARDING LINK ROUTER
                     * ========================================================================= */
                    case "2.8":
                        const logi = TerminalBridge.db.sellerLogisticsNodes[gst];
                        stage.innerHTML = `
                            <div class="space-y-6 animate-slide-in">
                                <div class="border-b border-zinc-800 pb-3">
                                    <h2 class="text-base font-bold text-white tracking-wide font-mono">2.8 Logistics Dispatch Forward Routing Panel</h2>
                                    <p class="text-xs text-zinc-400 mt-0.5">Configure spatial dispatch warehouses and select preferred cargo networks for automated product collection schedules.</p>
                                </div>

                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 font-mono text-xs">
                                    <div class="p-4 bg-zinc-950 rounded border border-zinc-800 sm:col-span-2 space-y-1.5">
                                        <span class="text-zinc-500 text-[10px] uppercase block tracking-wider">Origin Inventory Fulfillment Warehouse Address Coordinates</span>
                                        <input type="text" id="logistics-warehouse-input" class="w-full p-2 rounded premium-input text-xs text-zinc-200 font-sans" value="${logi.originHubAddress}">
                                    </div>
                                    <div class="p-4 bg-zinc-950 rounded border border-zinc-800 space-y-1">
                                        <span class="text-zinc-500 text-[10px] uppercase block">Assigned Logistics Hub Gateway Token</span>
                                        <span class="text-white text-sm font-bold block">${logi.preferredPartnerId}</span>
                                    </div>
                                    <div class="p-4 bg-zinc-950 rounded border border-zinc-800 space-y-1">
                                        <span class="text-zinc-500 text-[10px] uppercase block">Carrier Pickup Latency Core</span>
                                        <span class="text-yellow-500 text-sm font-bold block">${logi.averagePickupDelayMins} Minutes Average</span>
                                    </div>
                                </div>

                                <div class="pt-2">
                                    <button onclick="MerchantApp.executeUpdateLogisticsAddress()" class="px-5 py-2.5 bg-gold-gradient text-zinc-950 font-black font-mono text-xs uppercase rounded hover:opacity-90 transition tracking-wide">
                                        Commit Spatial Routing Footprint Parameters
                                    </button>
                                </div>
                            </div>
                        `;
                        break;

                    /* =========================================================================
                     * SUBSECTION 2.9: MULTI-USER PARTNER DELEGATION MATRIX
                     * ========================================================================= */
                    case "2.9":
                        const staff = TerminalBridge.db.sellerDelegations[gst] || [];
                        let staffRowsHtml = "";

                        staff.forEach(s => {
                            staffRowsHtml += `
                                <tr class="border-b border-zinc-800/60 font-mono text-xs text-zinc-300">
                                    <td class="p-3 text-white font-bold">${s.operatorId}</td>
                                    <td class="p-3 text-zinc-400">${s.rank}</td>
                                    <td class="p-3 text-center">
                                        <span class="px-2 py-0.5 rounded text-[10px] font-bold ${s.clearance === 'Read-Write' ? 'bg-red-500/10 text-red-400 border border-red-500/20' : 'bg-zinc-800 text-zinc-400'}">
                                            ${s.clearance}
                                        </span>
                                    </td>
                                    <td class="p-3 text-right text-zinc-500 text-[11px] tracking-wider">${s.nodeIp}</td>
                                </tr>
                            `;
                        });

                        stage.innerHTML = `
                            <div class="space-y-6 animate-slide-in">
                                <div class="border-b border-zinc-800 pb-3">
                                    <h2 class="text-base font-bold text-white tracking-wide font-mono">2.9 Multi-User Operations Permission Delegation Matrix</h2>
                                    <p class="text-xs text-zinc-400 mt-0.5">Delegate specific read/write access hierarchies to internal store managers without exposing your parent banking or GST tokens.</p>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div class="md:col-span-1 p-4 bg-zinc-950/60 rounded-lg border border-zinc-800 space-y-3 font-mono text-xs">
                                        <h4 class="text-xs font-bold text-zinc-300 border-b border-zinc-900 pb-1 uppercase tracking-wide">Provision Sub-Operator</h4>
                                        <div>
                                            <label class="block text-[9px] uppercase font-mono text-zinc-500 mb-1">Operator System Handle ID</label>
                                            <input type="text" id="staff-grant-id" class="w-full p-2 rounded premium-input text-xs font-mono" placeholder="OP-901">
                                        </div>
                                        <div>
                                            <label class="block text-[9px] uppercase font-mono text-zinc-500 mb-1">Operational Rank Label</label>
                                            <input type="text" id="staff-grant-rank" class="w-full p-2 rounded premium-input text-xs" placeholder="Inventory Supervisor">
                                        </div>
                                        <div>
                                            <label class="block text-[9px] uppercase font-mono text-zinc-500 mb-1">Clearance Tier Level</label>
                                            <select id="staff-grant-clearance" class="w-full p-2 rounded premium-input text-xs bg-zinc-950">
                                                <option value="Read-Only">Read-Only Analytics Node</option>
                                                <option value="Read-Write">Read-Write Transact Node</option>
                                            </select>
                                        </div>
                                        <button onclick="MerchantApp.executeOperatorProvisioning()" class="w-full py-2 bg-zinc-900 hover:bg-zinc-800 text-yellow-500 font-bold border border-yellow-500/20 tracking-wider uppercase text-[10px] rounded transition">
                                            Authorize Sub-Operator Core
                                        </button>
                                    </div>

                                    <div class="md:col-span-2 overflow-x-auto w-full glass-card rounded-lg border border-zinc-800 h-fit">
                                        <table class="w-full text-left border-collapse">
                                            <thead>
                                                <tr class="bg-zinc-950 font-mono text-[10px] text-zinc-500 uppercase tracking-wider border-b border-zinc-800">
                                                    <th class="p-3">Operator ID Handle</th>
                                                    <th class="p-3">Assigned Rank Frame</th>
                                                    <th class="p-3 text-center">Clearance Status Matrix</th>
                                                    <th class="p-3 text-right">Validated Local Network IP</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                ${staffRowsHtml ? staffRowsHtml : `<tr><td colspan="4" class="p-4 text-center text-zinc-600 font-mono text-xs">Zero operational staff sub-delegations assigned.</td></tr>`}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        `;
                        break;

                    /* =========================================================================
                     * SUBSECTION 2.10: ADVANCED API INTEGRATION WEBHOOKS
                     * ========================================================================= */
                    case "2.10":
                        const webh = TerminalBridge.db.webhookConfigs ? TerminalBridge.db.webhookConfigs[gst] : null;
                        const activeWebh = webh || { endpointUrl: "https://unallocated.internal/api", secretToken: "unassigned", triggerOnStockUpdate: false, triggerOnPayout: false, pingSuccessRatePercent: 0.0 };
                        
                        stage.innerHTML = `
                            <div class="space-y-6 animate-slide-in">
                                <div class="border-b border-zinc-800 pb-3">
                                    <h2 class="text-base font-bold text-white tracking-wide font-mono">2.10 Advanced API External Integration Webhooks Engine</h2>
                                    <p class="text-xs text-zinc-400 mt-0.5">Deploy transaction webhook vectors to push catalog changes directly to third-party ERP management software.</p>
                                </div>

                                <div class="p-5 bg-zinc-950 rounded-lg border border-zinc-800 space-y-4 font-mono text-xs">
                                    <div>
                                        <label class="block text-[10px] uppercase text-zinc-500 mb-1.5 tracking-wider">Target Destination External Listener Endpoint URL Endpoint</label>
                                        <input type="text" id="webhook-url-input" class="w-full p-2.5 rounded premium-input text-xs text-zinc-200" value="${activeWebh.endpointUrl}">
                                    </div>
                                    <div>
                                        <label class="block text-[10px] uppercase text-zinc-500 mb-1.5 tracking-wider">Cryptographic Signature Verification Secret Token String Key</label>
                                        <div class="p-2.5 bg-zinc-900 rounded border border-zinc-800 text-yellow-600 break-all select-all font-mono text-xs">
                                            ${activeWebh.secretToken}
                                        </div>
                                    </div>

                                    <div class="border-t border-zinc-900 pt-4 grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        <label class="flex items-center gap-3 cursor-pointer p-3 bg-zinc-900/40 rounded border border-zinc-900">
                                            <input type="checkbox" id="webhook-check-stock" ${activeWebh.triggerOnStockUpdate ? 'checked' : ''} class="w-4 h-4 accent-yellow-500 bg-zinc-950 border-zinc-800 rounded">
                                            <div>
                                                <span class="block text-zinc-200 text-xs font-bold">Trigger Event on Stock Updates</span>
                                                <span class="block text-zinc-500 text-[10px]">Pushes inventory shift arrays instantly</span>
                                            </div>
                                        </label>
                                        <label class="flex items-center gap-3 cursor-pointer p-3 bg-zinc-900/40 rounded border border-zinc-900">
                                            <input type="checkbox" id="webhook-check-payout" ${activeWebh.triggerOnPayout ? 'checked' : ''} class="w-4 h-4 accent-yellow-500 bg-zinc-950 border-zinc-800 rounded">
                                            <div>
                                                <span class="block text-zinc-200 text-xs font-bold">Trigger Event on Ledger Wire Outflows</span>
                                                <span class="block text-zinc-500 text-[10px]">Signals external billing registers</span>
                                            </div>
                                        </label>
                                    </div>
                                </div>

                                <div class="flex items-center justify-between font-mono text-xs bg-zinc-900/20 p-4 border border-zinc-800 rounded-lg">
                                    <div class="space-y-0.5">
                                        <span class="text-zinc-500 text-[10px] block uppercase">Network Listener Channel Sync Health</span>
                                        <span class="text-emerald-400 font-bold block">${activeWebh.pingSuccessRatePercent}% Automated Ping Echo Verification Success Rates</span>
                                    </div>
                                    <button onclick="MerchantApp.executeSaveWebhookConfiguration()" class="px-4 py-2 bg-gold-gradient text-zinc-950 font-black tracking-wider uppercase text-xs rounded hover:opacity-90 transition shadow-md">
                                        Commit Webhook Vectors
                                    </button>
                                </div>
                            </div>
                        `;
                        break;
                }
            }

            /* =========================================================================
             * SUBSECTION EXECUTION MUTATOR ALGORITHMS
             * ========================================================================= */

            // 2.1 Mutator
            executeDisbursementTransfer() {
                const inputVal = parseFloat(document.getElementById('disburse-amount-input').value);
                const gst = TerminalBridge.db.activeSellerSessionGst;
                const merchant = TerminalBridge.db.sellers[gst];

                if (isNaN(inputVal) || inputVal <= 0 || inputVal > merchant.balance) {
                    this.triggerToast("Disbursement Interdicted", "Invalid fund value. Ensure it maps within your current withdrawable limits.", "error");
                    return;
                }

                merchant.balance -= inputVal;
                TerminalBridge.log("SUCCESS", `Disbursed financial balance capital out-scale: -₹${inputVal} routed to account ${merchant.accountNo}`);
                this.renderActiveSubsectionToStage();
                this.triggerToast("Disbursement Settled", `₹${inputVal.toLocaleString('en-IN')} routed to registered banking node coordinates.`, "success");
            }

            // 2.2 Mutator
            executeStockSkuInjection() {
                const title = document.getElementById('prod-inject-title').value.trim();
                const price = parseFloat(document.getElementById('prod-inject-price').value);
                const category = document.getElementById('prod-inject-category').value;
                const image = document.getElementById('prod-inject-image').value.trim();
                const desc = document.getElementById('prod-inject-desc').value.trim();
                const gst = TerminalBridge.db.activeSellerSessionGst;

                if (!title || isNaN(price) || price <= 0 || !desc) {
                    this.triggerToast("Specification Block", "All inventory listing fields require matching specifications metrics.", "error");
                    return;
                }

                const generatedSkuId = "PROD-" + Math.floor(100000 + Math.random() * 900000);
                
                const itemPayload = {
                    id: generatedSkuId,
                    title: title,
                    price: price,
                    category: category,
                    rating: 5.0,
                    reviews: 0,
                    image: image ? image : "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500&auto=format&fit=crop&q=60",
                    sellerGst: gst,
                    description: desc
                };

                TerminalBridge.db.products.push(itemPayload);
                TerminalBridge.log("SUCCESS", `Minted custom market item catalog profile index handle reference: ${generatedSkuId}`);
                
                this.switchSubsection('2.3'); // Route directly to table view to display verification
                this.triggerToast("SKU Broadcasted Live", `Product unit ${generatedSkuId} uploaded successfully to active catalogues.`, "success");
            }

            // 2.3 Mutator
            executeSkuDeletion(skuId) {
                if (confirm(`CRITICAL DEPLOYMENT TARGET ACTION: Wipe product SKU index node ${skuId} from global storefront directories permanently?`)) {
                    const originIndex = TerminalBridge.db.products.findIndex(p => p.id === skuId);
                    if (originIndex > -1) {
                        TerminalBridge.db.products.splice(originIndex, 1);
                        TerminalBridge.log("WARNING", `Wiped product listing SKU index node entry item cleanly from memory storage registers: ${skuId}`);
                        this.renderActiveSubsectionToStage();
                        this.triggerToast("SKU Truncated", "Listing removed from marketplace directories.", "info");
                    }
                }
            }

            // 2.4 Mutator
            executeLogisticsFulfillmentStep(index) {
                const gst = TerminalBridge.db.activeSellerSessionGst;
                const activeTargetOrder = TerminalBridge.db.sellerFulfillmentQueues[gst][index];

                activeTargetOrder.stage = "Dispatched";
                TerminalBridge.log("SUCCESS", `Fulfillment tracking shift updated to DISPATCHED state for order handle index: ${activeTargetOrder.orderId}`);
                this.renderActiveSubsectionToStage();
                this.triggerToast("Parcel Outbound", `Order package ${activeTargetOrder.orderId} passed to carrier transit streams.`, "success");
            }

            // 2.5 Mutator
            executeTaxFilingSync() {
                const gst = TerminalBridge.db.activeSellerSessionGst;
                const ledger = TerminalBridge.db.sellerTaxLedgers[gst];

                if (ledger.pendingTaxLiability === 0) {
                    this.triggerToast("Audit Terminated", "Current cycle processing logs register zero balance liabilities.", "info");
                    return;
                }

                ledger.quarterlyGstPaid += ledger.pendingTaxLiability;
                ledger.pendingTaxLiability = 0;
                ledger.gstr3bStatus = "Filed and Sealed";
                
                TerminalBridge.log("SUCCESS", `Executed quarterly GSTR fiscal synchronization auditing sheets successfully for identifier token: ${gst}`);
                this.renderActiveSubsectionToStage();
                this.triggerToast("Tax Audit Locked", "Quarterly statements filed and sealed with corporate sign-off signatures.", "success");
            }

            // 2.6 Mutator
            executeClientMessageResponse(index) {
                const gst = TerminalBridge.db.activeSellerSessionGst;
                const textVal = document.getElementById(`reply-input-${index}`).value.trim();

                if (!textVal) {
                    this.triggerToast("Message Interdicted", "Cannot dispatch empty communication fields down channel links.", "error");
                    return;
                }

                TerminalBridge.db.sellerCommunications[gst][index].state = "Replied";
                TerminalBridge.log("SUCCESS", `Dispatched communication chat payload reply down client vector link for ID block: MSG-0${index+1}`);
                this.renderActiveSubsectionToStage();
                this.triggerToast("Reply Dispatched", "Technical assistance text payload dispatched to consumer profile dashboard.", "success");
            }

            // 2.7 Mutator
            executeCouponMinting() {
                const token = document.getElementById('coupon-mint-token').value.trim().toUpperCase();
                const scale = document.getElementById('coupon-mint-scale').value;
                const depth = parseFloat(document.getElementById('coupon-mint-depth').value);
                const gst = TerminalBridge.db.activeSellerSessionGst;

                if (!token || isNaN(depth) || depth <= 0) {
                    this.triggerToast("Minting Defect", "Ensure coupon tracking metrics contain valid formatting values.", "error");
                    return;
                }

                TerminalBridge.db.sellerCoupons[gst].unshift({
                    token: token,
                    scale: scale,
                    depth: depth,
                    targetSku: "ALL CATALOGUE",
                    status: "Active"
                });

                TerminalBridge.log("SUCCESS", `Minted new marketplace reduction coupon rule logic token down database tracks: ${token}`);
                this.renderActiveSubsectionToStage();
                this.triggerToast("Coupon Live", "Discount parameter node verified and deployed live.", "success");
            }

            // 2.8 Mutator
            executeUpdateLogisticsAddress() {
                const gst = TerminalBridge.db.activeSellerSessionGst;
                const text = document.getElementById('logistics-warehouse-input').value.trim();

                if (!text) {
                    this.triggerToast("Tracking Interdicted", "Warehouse coordinates cannot mirror blank strings.", "error");
                    return;
                }

                TerminalBridge.db.sellerLogisticsNodes[gst].originHubAddress = text;
                TerminalBridge.log("INFO", `Updated operational warehouse spatial pickup index targets to coordinates: ${text}`);
                this.renderActiveSubsectionToStage();
                this.triggerToast("Spatial Coordinates Updated", "Carrier collection routing map metrics updated safely.", "success");
            }

            // 2.9 Mutator
            executeOperatorProvisioning() {
                const id = document.getElementById('staff-grant-id').value.trim().toUpperCase();
                const rank = document.getElementById('staff-grant-rank').value.trim();
                const clearance = document.getElementById('staff-grant-clearance').value;
                const gst = TerminalBridge.db.activeSellerSessionGst;

                if (!id || !rank) {
                    this.triggerToast("Clearance Mapping Defect", "Valid identifier and structural ranking definitions required.", "error");
                    return;
                }

                TerminalBridge.db.sellerDelegations[gst].unshift({
                    operatorId: id,
                    rank: rank,
                    clearance: clearance,
                    nodeIp: "192.168.1." + Math.floor(100 + Math.random() * 150)
                });

                TerminalBridge.log("SUCCESS", `Provisioned multi-user permission node delegate token mapping to operator: ${id}`);
                this.renderActiveSubsectionToStage();
                this.triggerToast("Sub-Operator Authorized", "Clearance profile mapped to branch nodes safely.", "success");
            }

            // 2.10 Mutator
            executeSaveWebhookConfiguration() {
                const gst = TerminalBridge.db.activeSellerSessionGst;
                const url = document.getElementById('webhook-url-input').value.trim();
                const checkStock = document.getElementById('webhook-check-stock').checked;
                const checkPayout = document.getElementById('webhook-check-payout').checked;

                if (!url) {
                    this.triggerToast("API Route Interdicted", "Webhook destination endpoint must match valid server URI pathways.", "error");
                    return;
                }

                TerminalBridge.db.sellerWebhookConfigs[gst] = {
                    endpointUrl: url,
                    secretToken: "srp_sec_crypto_sig_" + Math.floor(1000000000 + Math.random() * 9000000000),
                    triggerOnStockUpdate: checkStock,
                    triggerOnPayout: checkPayout,
                    pingSuccessRatePercent: 100.0
                };

                TerminalBridge.log("SUCCESS", `Configured external API integration sync webhook destination: ${url}`);
                this.renderActiveSubsectionToStage();
                this.triggerToast("API Vectors Injected", "Webhook logic criteria successfully deployed to gateway layers.", "success");
            }


            /* =========================================================================
             * PREMIUM INTEGRATED VISUAL TOAST ALERT LAYOUT UTILITIES ENGINE
             * ========================================================================= */
            triggerToast(headline, detailedText, variant = "info") {
                const anchor = document.getElementById('seller-toast-container');
                if (!anchor) return;

                const wrapperNode = document.createElement('div');
                wrapperNode.className = "w-full p-4 glass-panel rounded-lg border-l-4 pointer-events-auto flex gap-3 animate-slide-in shadow-2xl transition-all duration-300";
                
                let markupIcon = '<i class="fa-solid fa-circle-info text-blue-400"></i>';
                if (variant === "success") {
                    wrapperNode.style.borderColor = "var(--emerald-accent)";
                    markupIcon = '<i class="fa-solid fa-circle-check text-emerald-400"></i>';
                } else if (variant === "error") {
                    wrapperNode.style.borderColor = "var(--crimson-accent)";
                    markupIcon = '<i class="fa-solid fa-triangle-exclamation text-red-400"></i>';
                } else {
                    wrapperNode.style.borderColor = "var(--primary-gold)";
                    markupIcon = '<i class="fa-solid fa-circle-info text-yellow-500"></i>';
                }

                wrapperNode.innerHTML = `
                    <div class="text-base mt-0.5">${markupIcon}</div>
                    <div class="flex-1">
                        <h4 class="font-bold text-xs text-white uppercase tracking-wider font-mono">${headline}</h4>
                        <p class="text-[11px] text-zinc-400 mt-0.5 leading-normal font-sans">${detailedText}</p>
                    </div>
                `;
                
                anchor.appendChild(wrapperNode);
                setTimeout(() => {
                    wrapperNode.style.opacity = "0";
                    wrapperNode.style.transform = "translateX(40px)";
                    setTimeout(() => wrapperNode.remove(), 350);
                }, 4500);
            }
        }

        // Initialize and Mount standalone Single-Portal Runtime execution system
        let MerchantApp;
        document.addEventListener("DOMContentLoaded", () => {
            MerchantApp = new SRPMerchantTerminalApp();
            MerchantApp.boot();
        });
    </script>
</body>
</html>
